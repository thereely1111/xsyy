version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xsyy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: xsyy
      MYSQL_USER: xsyy
      MYSQL_PASSWORD: xsyy_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xsyy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: xsyy_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma_data
    environment:
      IS_PERSISTENT: "TRUE"

volumes:
  mysql_data:
  redis_data:
  chroma_data:
