        .ink-fade-in {

        /* P1 文字纪律兜底（方案 §4.6.3）：scene_svg 中 foreignObject 内 HTML 文本
           自动换行 + 软裁切，防止模型给的矩形固定过窄导致文字溢出遮挡。 */
        #dynamicSceneRoot foreignObject div,
        #dynamicSceneRoot foreignObject p,
        #dynamicSceneRoot foreignObject span,
        #dynamicSceneRoot foreignObject .svg-text {
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: normal;
        }

        /* 气泡禁区兜底：气泡可拖拽但始终限制在 820×620 内（R4 辅助） */
        #dynamicSceneRoot * {

        }

        /* ===== P0（2026-09-04 回灌）：动态场景组切步淡入淡出，根治“硬跳变/没变化” ===== */
        .scene-fade-enter { transition: opacity 480ms ease-out; }
        .scene-fade-enter-start { opacity: 0; }
        .scene-fade-enter-end { opacity: 1; }
        .scene-fade-leave { transition: opacity 200ms ease-in; }
        .scene-fade-leave-start { opacity: 1; }
        .scene-fade-leave-end { opacity: 0; }

        /* ===== 对齐目标质量 demo 视觉语言（2026-09-04，参照 demo_complex_all.html）=====
           纸 #f4efe3 / 墨 #2b2b2b / 线 rgba(43,43,43,.10)
           --var 蓝 #2f5fde（当前步·按钮·进度） / --const 朱砂 #d6432f（强调·公式数字） / --gold 鎏金 #c8901a（老师说·提示条·已完成步） */

        /* 左：舞台卡 —— demo .stage：暖白渐变 + 1px 线描边 + 16px 圆角 + 投影 */
        .stage-card {
            background: linear-gradient(180deg, #fffdf8, #fbf6ea);
            border: 1px solid var(--line);
            border-radius: 16px;

        }

        /* 右：老师说 —— demo .teacher：鎏金标签 + 鎏金左边框提示条 */
        .teacher-panel {
            background: #fffdf8;

        .teacher-panel .bg-red-50\/70 { background-color: rgba(200, 144, 26, .10) !important; }

        .steps-panel {
            background: #fffdf8;

            background: linear-gradient(to bottom, transparent, var(--line-strong), transparent);
        }
        /* 当前步：蓝（demo .step-item.active） */
        .steps-panel .bg-red-800 { background-color: var(--var) !important; }
        .steps-panel .text-red-800 { color: var(--var) !important; }
        .steps-panel .border-red-200 { border-color: rgba(47, 95, 222, .35) !important; }

        .steps-panel .step-dot-done {
            background-color: rgba(46, 158, 107, .18) !important;
            border-color: rgba(46, 158, 107, .18) !important;
        }
        .steps-panel .step-done-text { color: #6b6256 !important; }

        /* 主按钮：蓝（demo .btn:hover → 蓝） */
        .btn-primary {
            background-color: var(--var) !important;
            border-color: var(--var) !important;
        }
        .btn-primary:hover:not(:disabled) { background-color: #2747b0 !important; }
        /* 次按钮：1px 线描边 + 墨色文字 */
        .btn-ghost {
            border-color: var(--line-strong) !important;
            color: var(--ink-2) !important;
        }

        /* ===== 对齐 demo 的补间手感：场景内元素 opacity / transform 走缓动 =====
           - 用 :where() 把特异性降为 0，保证 P0 注入的 x-transition 淡入淡出仍能覆盖；
           - 不设 transform-box / transform-origin，避免改写模型自带 transform 的渲染结果；
           - 排除 #dynamicSceneRoot 自身，防止首帧居中变成整体滑动。 */
        :where(#dynamicSceneRoot > *, #dynamicSceneRoot > * *) {
            transition: opacity .42s ease,
                        transform .62s cubic-bezier(.22, 1, .36, 1) .04s;
        }

        /* motion 运动主体采用"快速到位"过渡（0.12s linear，不缓动、不拖尾），
           切一步=跳一格，近似定格动画逐格推进的节奏。仅作用于带 id 的显式运动主体，
           其余元素仍走上面的平滑补间。 */
        #dynamicSceneRoot g[id="train"],
        #dynamicSceneRoot g[id="mover"] {
            transition: transform .12s linear, opacity .42s ease;
        }

    <script>
        // P0（2026-09-04 回灌）：给动态场景内的 x-show 组注入淡入淡出过渡，
        // 切步从硬跳变变为淡入淡出。仅作用于 #dynamicSceneRoot 内的组，不影响静态水印。
        // 仅用 opacity，避免与 SVG 元素自带的 transform 属性冲突。
        document.addEventListener('alpine:init', function () {
            document.querySelectorAll('#dynamicSceneRoot [x-show]').forEach(function (el) {
                if (el.hasAttribute('x-transition')) return;
                el.setAttribute('x-transition:enter', 'scene-fade-enter');
                el.setAttribute('x-transition:enter-start', 'scene-fade-enter-start');
                el.setAttribute('x-transition:enter-end', 'scene-fade-enter-end');
                el.setAttribute('x-transition:leave', 'scene-fade-leave');
                el.setAttribute('x-transition:leave-start', 'scene-fade-leave-start');
                el.setAttribute('x-transition:leave-end', 'scene-fade-leave-end');
            });

            // 前景遮罩层置顶（通道/容器类场景的"钻入感"）：把 id 以 -front 结尾的层
            // 移到父节点末尾（z 轴最上），运动主体进入时被遮罩盖住一部分，
            // 呈"钻进/穿过"而非"从前面滑过"。无 -front 层的题 no-op，不影响其他题。
            function promoteForeground() {
                document.querySelectorAll('#dynamicSceneRoot [id$="-front"]').forEach(function (el) {
                    if (el.parentNode) el.parentNode.appendChild(el);
                });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', promoteForeground);
            } else {
                requestAnimationFrame(promoteForeground);
            }
        });
    </script>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                teacherMode: 'plain',
                get sceneStep() {
                    return this.currentStep + 1;
                },
                get currentStepData() {
                    const s = (this.steps && this.steps[this.currentStep]) || {};
                    return {
                        title: s.title || '',
                        description: s.description || '',
                        bubbleText: s.bubbleText || '',
                    };
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                sceneScale: 1,
                bubbleX: 536,
                bubbleY: 476,
                forbiddenZone: { x: 500, y: 450, width: 304, height: 154 },
                bubbleBounds: {
                    expanded: { width: 248, height: 108 },
                    collapsed: { width: 92, height: 36 },
                },
                scenePadding: { left: 16, right: 16, top: 16, bottom: 16 },
                sceneContentPadding: { left: 40, right: 28, top: 24, bottom: 28 },
                // P1 纪律（方案 2026-09-03 §4.6）：切步默认不再整画布 getBBox 重居中。
                // 临时层元素（轨迹/高亮/辅助线）在切步瞬间的 bbox 波动曾导致画面整体
                // 平移跳动（R3）；现改为仅首帧居中一次 + 用户双击画布手动回中，
                // 画面位置保持稳定。autoCenterOnStep 可经 __SCENE_CONFIG__ 注入强制旧行为。
                autoCenterOnStep: false,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                currentArrowTarget: { x: 400, y: 300 },
                teacherArrowPath: '',
                get showTeacherArrow() {
                    return this.isBubbleExpanded && !this.isDraggingBubble && !!this.teacherArrowPath;
                },
                // 防御：即使 steps 数据异常也保证 Alpine 初始化成功（按钮/气泡拖拽始终可用）
                steps: (function () { try { return __STEPS_JSON__; } catch (e) { return []; } })(),
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene(true);
                        this.resetBubblePosition();
                        this.applyStepMotions();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getBubbleSize() {
                    return this.isBubbleExpanded ? this.bubbleBounds.expanded : this.bubbleBounds.collapsed;
                },
                clampToStage(x, y, width, height) {
                    const pad = this.scenePadding;
                    return {
                        x: Math.max(pad.left, Math.min(820 - width - pad.right, x)),
                        y: Math.max(pad.top, Math.min(620 - height - pad.bottom, y)),
                    };
                },
                rectsOverlap(a, b) {
                    return a.x < b.x + b.width
                        && a.x + a.width > b.x
                        && a.y < b.y + b.height
                        && a.y + a.height > b.y;
                },
                snapBubbleToCornerIfNeeded() {
                    const size = this.getBubbleSize();
                    const clamped = this.clampToStage(this.bubbleX, this.bubbleY, size.width, size.height);
                    this.bubbleX = clamped.x;
                    this.bubbleY = clamped.y;
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 536, y: 476 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    const size = this.getBubbleSize();
                    const clamped = this.clampToStage(pos.x, pos.y, size.width, size.height);
                    this.bubbleX = clamped.x;
                    this.bubbleY = clamped.y;
                    this.currentArrowTarget = this.getCurrentStepArrowTarget();
                    this.updateTeacherArrowPath();
                },
                getCurrentStepArrowTarget() {
                    const defaultTarget = { x: 400, y: 300 };
                    const step = this.steps?.[this.currentStep];
                    const target = step?.arrowTarget;
                    if (!target) {
                        return {
                            x: defaultTarget.x * this.sceneScale + this.sceneOffsetX,
                            y: defaultTarget.y * this.sceneScale + this.sceneOffsetY,
                        };
                    }
                    const x = Number(target.x);
                    const y = Number(target.y);
                    return {
                    x: Number.isFinite(x) ? Math.max(0, Math.min(820, x)) * this.sceneScale + this.sceneOffsetX : defaultTarget.x * this.sceneScale + this.sceneOffsetX,
                    y: Number.isFinite(y) ? Math.max(0, Math.min(620, y)) * this.sceneScale + this.sceneOffsetY : defaultTarget.y * this.sceneScale + this.sceneOffsetY,
                    };
                },
                updateTeacherArrowPath() {
                    const target = this.currentArrowTarget || { x: 400, y: 300 };
                    const bubbleSize = this.getBubbleSize();
                    const bubbleWidth = bubbleSize.width;
                    const bubbleHeight = bubbleSize.height;
                    const centerX = this.bubbleX + bubbleWidth / 2;
                    const centerY = this.bubbleY + bubbleHeight / 2;
                    const dx = target.x - centerX;
                    const dy = target.y - centerY;

                    let startX;
                    let startY;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        startX = this.bubbleX + (dx >= 0 ? bubbleWidth : 0);
                        startY = centerY;
                    } else {
                        startX = centerX;
                        startY = this.bubbleY + (dy >= 0 ? bubbleHeight : 0);
                    }

                    const arrowDx = target.x - startX;
                    const arrowDy = target.y - startY;
                    const length = Math.sqrt(arrowDx * arrowDx + arrowDy * arrowDy) || 1;
                    const endX = target.x - (arrowDx / length) * 12;
                    const endY = target.y - (arrowDy / length) * 12;
                    const curve = Math.max(18, Math.min(80, length * 0.18));
                    const controlX = startX + arrowDx * 0.5;
                    const controlY = startY + arrowDy * 0.5 - curve;
                    this.teacherArrowPath = `M ${startX} ${startY} Q ${controlX} ${controlY} ${endX} ${endY}`;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;
                    const bubbleSize = this.getBubbleSize();
                    const clamped = this.clampToStage(nextX, nextY, bubbleSize.width, bubbleSize.height);

                    this.bubbleX = clamped.x;
                    this.bubbleY = clamped.y;
                    this.updateTeacherArrowPath();
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                    this.snapBubbleToCornerIfNeeded();
                    this.updateTeacherArrowPath();
                },
                centerDynamicScene(forceFit) {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    const margin = 16;  // 画布内安全留白（px）：所有元素须落在 [margin, 820-margin]×[margin, 620-margin] 内
                    try {
                        // 关键修复：分步元素经 x-show 隐藏后，getBBox 只量到「当前步」，
                        // 首帧便按第1步子集居中，后续步元素向右下溢出 → 观感偏右下。
                        // 这里临时显示全部分步元素，量出整段动画真实包围盒，再整体居中
                        // （非全屏 / 全屏通用：居中落在 viewBox 坐标系，由 preserveAspectRatio 映射到面板）。
                        const _gated = Array.prototype.slice.call(sceneEl.querySelectorAll('[x-show]'));
                        const _savedDisplay = _gated.map(function (el) {
                            const d = el.style.display;
                            el.style.display = '';
                            return d;
                        });
                        let bbox;
                        try {
                            bbox = sceneEl.getBBox();
                        } finally {
                            _gated.forEach(function (el, i) {
                                el.style.display = _savedDisplay[i];
                            });
                        }
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            this.sceneScale = 1;
                            return;
                        }

                        // 内容已完整落在安全区内时，保持首帧取景不动（避免 R3 切步跳动）；
                        // 仅当内容溢出安全区（含运动主体越界）才重算适配，保证永不裁切。
                        const overflow = bbox.x < margin
                            || bbox.y < margin
                            || bbox.x + bbox.width > 820 - margin
                            || bbox.y + bbox.height > 620 - margin;
                        if (!forceFit && !overflow) {
                            return;
                        }

                        // 自适应缩放：内容超出安全区时整体缩小到可容纳（绝不放大，避免糊化）
                        const safeW = 820 - 2 * margin;
                        const safeH = 620 - 2 * margin;
                        let scale = 1;
                        if (bbox.width > safeW || bbox.height > safeH) {
                            scale = Math.min(safeW / bbox.width, safeH / bbox.height);
                        }
                        this.sceneScale = Math.round(scale * 1000) / 1000;

                        const cx = bbox.x + bbox.width / 2;
                        const cy = bbox.y + bbox.height / 2;
                        // 先把缩放后内容居中到画布中心
                        let offsetX = 410 - cx * scale;
                        let offsetY = 310 - cy * scale;
                        // 再夹回画布内：左侧 ≥ margin、右侧 ≤ 820-margin（缩放后内容不越界）。
                        // 当内容宽于安全区时 min>max，Math.max(min, Math.min(max, v)) 退化为保留边界，
                        // 不会再出现"反向推出画布"的旧 clamp 失效。
                        offsetX = Math.max(
                            margin - bbox.x * scale,
                            Math.min(offsetX, 820 - margin - (bbox.x + bbox.width) * scale)
                        );
                        offsetY = Math.max(
                            margin - bbox.y * scale,
                            Math.min(offsetY, 620 - margin - (bbox.y + bbox.height) * scale)
                        );

                        this.sceneOffsetX = Math.round(offsetX * 10) / 10;
                        this.sceneOffsetY = Math.round(offsetY * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                        this.sceneScale = 1;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                // ===== 运动主体引擎（2026-09-04 新增，对齐 demo 的跨步补间）=====
                // steps[i].motions 声明「第 i 步时，某个持久元素应该处在什么 transform」。
                // 切步时把 transform 写到元素 style 上，配合已有的 CSS transition 产生
                // 真实补间位移（火车行驶、点沿曲线移动、图形平移/旋转/缩放）。
                // 兼容两种写法：
                //   "motions": {"train": "translate(300,0)"}
                //   "motions": [{"id":"train","transform":"translate(300,0)"}]
                // 未声明 motions 的步骤不改动任何元素 —— 向后兼容，老数据包行为不变。
                applyStepMotions() {
                    const root = document.getElementById('dynamicSceneRoot');
                    if (!root) return;
                    const step = this.steps ? this.steps[this.currentStep] : null;
                    const motions = step ? step.motions : null;
                    if (!motions) return;

                    const entries = Array.isArray(motions)
                        ? motions
                        : Object.keys(motions).map(function (id) {
                            return { id: id, transform: motions[id] };
                        });

                    entries.forEach(function (m) {
                        if (!m || m.id == null) return;
                        const safeId = String(m.id).replace(/["\\]/g, '\\$&');
                        let el = null;
                        try {
                            el = root.querySelector('[id="' + safeId + '"]');
                        } catch (e) {
                            el = null;
                        }
                        if (!el) return;
                        if (m.transform != null) {
                            // CSS transform 的长度参数必须带单位（px）：
                            // motions 里常见写法是 SVG 属性语法 translate(280,0)（无单位），
                            // 直接赋给 el.style.transform 会被 CSS 解析为「无效声明」而静默忽略，
                            // 导致运动主体看起来完全不动。这里把 translate 的长度补上 px。
                            el.style.transform = String(m.transform).replace(
                                /translate\(([^)]*)\)/g,
                                function (_, args) {
                                    const parts = args.split(',').map(function (v) {
                                        v = v.trim();
                                        if (v === '0' || /[a-z%]$/i.test(v)) return v;
                                        return v + 'px';
                                    });
                                    return 'translate(' + parts.join(', ') + ')';
                                }
                            );
                        }
                        if (m.opacity != null) el.style.opacity = m.opacity;
                    });
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.currentArrowTarget = this.getCurrentStepArrowTarget();
                    this.$nextTick(() => {
                        // P1 纪律（方案 §4.6 R3）：切步默认不再整画布重居中——
                        // 临时元素切步消失前后 getBBox 波动会造成整体跳动。
                        // 仅在显式开启 autoCenterOnStep（__SCENE_CONFIG__）时保持旧行为。
                        // 每步切步后用 ensureInView 兜底：先应用本步 motions（让运动主体到位），
                        // 再测量最终几何；内容已落安全区则保持取景不动（不抖动），
                        // 仅当本步出现越界（如运动主体滑出右侧）才重算缩放/位移把它收回到画布内。
                        this.applyStepMotions();
                        this.centerDynamicScene(false);
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
