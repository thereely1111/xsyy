<style>
    .yi-wrapper {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .yi-logo {
        width: 140px;
        height: 140px;
        z-index: 10;
        transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); /* 有弹性的旋转 */
    }

    /* 外围的科技光环 */
    .tech-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px dashed #546e7a; /* 科技灰蓝 */
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.8) rotate(0deg);
        transition: all 0.5s ease;
    }

    /* 悬浮交互 */
    .yi-wrapper:hover .yi-logo {
        /* 顺时针旋转360度，象征周而复始 */
        transform: rotate(360deg); 
    }

    .yi-wrapper:hover .tech-ring {
        opacity: 0.6;
        transform: scale(1.1) rotate(-180deg); /* 反向旋转，形成差动感 */
    }
</style>

<div class="yi-wrapper">
    <div class="tech-ring"></div>
    <img src="/xsyy-logo.webp" class="yi-logo">
</div>
