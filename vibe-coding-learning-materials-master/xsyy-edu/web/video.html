        // 尝试从 storage 直接加载已保存的教学内容
        async function loadSavedTeaching(taskId) {
            try {
                // 先尝试从任务 API 获取（可能正在生成中）
                const res = await fetch(`${API_BASE}/api/tasks/${taskId}`);
                const data = await res.json();

                // 如果任务已完成，优先读取磁盘中的完整 teaching.html
                if (data.status === "completed") {
                    const html = await fetchTeachingHtml(taskId, data.metadata?.teaching_html || "");
                    if (html) {
                        console.log("加载教学 HTML（优先使用保存文件）");
                        hideLoading();
                        displayTeachingHtml(html);
                        // 教学内容已就绪，刷新推荐
                        loadRelatedTeachings(taskId);
                        return true;
                    }
                }

                // 如果任务已完成且有 teaching_html，直接显示（兼容回退）
                if (data.status === "completed" && data.metadata?.teaching_html) {
                    console.log("从任务 API 加载教学 HTML");
                    hideLoading();
                    displayTeachingHtml(data.metadata.teaching_html);
                    // 教学内容已就绪，刷新推荐
                    loadRelatedTeachings(taskId);
                    return true;
                }

                // 如果任务不存在或未完成，尝试从 storage 直接读取
                if (data.status === "not_found" || data.status === "pending" || data.status === "running") {
                    try {
                        const htmlRes = await fetch(`${API_BASE}/api/teachings/${taskId}/html`);
                        if (htmlRes.ok) {
                            const html = await htmlRes.text();
                            console.log("从 storage 直接加载教学 HTML");
                            hideLoading();
                            displayTeachingHtml(html);
                            // 成功读取存储内容后刷新推荐
                            loadRelatedTeachings(taskId);
                            return true;
                        }
                    } catch (e) {
                        // 如果 storage 中也没有，继续轮询
                        console.log("storage 中未找到，继续轮询:", e);
                    }
                }

                return false;
            } catch (err) {
                console.log("尝试加载已保存内容失败:", err);
                return false;
            }
        }

        // 自动开始轮询任务状态（优化版：动态轮询间隔 + 预加载）
        async function pollTask(taskId) {
            if (pollTimer) clearInterval(pollTimer);

            // 链路埋点：轮询开始（前端侧）
            if (window.reportWebsiteLog) {
                window.reportWebsiteLog('INFO', 'animation_generation', '开始轮询任务状态', {
                    event: 'task_poll_started',
                    stage: 'video_page_polling',
                    task_id: taskId
                });
            }

            // 先尝试加载已保存的内容
            const loaded = await loadSavedTeaching(taskId);
            if (loaded) {
                return; // 已成功加载，不需要继续轮询
            }

            // 显示加载动画
            showLoading();
            // 标记还未请求过推荐
            relatedRequested = false;

            // 动态轮询间隔优化
            let pollInterval = 3000; // 初始间隔 3 秒（早期阶段可以慢一点）
            let lastProgress = 0;
            let progressStableCount = 0; // 进度未变化的次数

            // 预加载 HTML 的标记
            let preloadAttempted = false;

            // not_found 重试控制：先尝试读取 HTML，若仍未命中则继续轮询几次
            let notFoundRetryCount = 0;
            const maxNotFoundRetries = 30;
            const notFoundRetryInterval = 2000;

            // 任务完成标记，防止任务完成后继续轮询
            let isTaskCompleted = false;

            // 存储 intervalUpdater 的引用，以便清理
            let intervalUpdater = null;

            const tryLoadHtmlOrContinue = async () => {
                try {
                    const htmlRes = await fetch(`${API_BASE}/api/teachings/${taskId}/html`);
                    if (htmlRes.ok) {
                        const html = await htmlRes.text();
                        if (html && html.trim()) {
                            isTaskCompleted = true;
                            if (pollTimer) {
                                clearInterval(pollTimer);
                                pollTimer = null;
                            }
                            if (intervalUpdater) {
                                clearInterval(intervalUpdater);
                                intervalUpdater = null;
                            }
                            hideLoading();
                            displayTeachingHtml(html);
                            loadRelatedTeachings(taskId);
                            loadTeachingDetails(taskId);
                            return true;
                        }
                    }
                } catch (e) {
                    console.log("not_found 后读取 HTML 失败，继续轮询:", e);
                }
                return false;
            };

            const handleNotFound = async (res) => {
                const htmlLoaded = await tryLoadHtmlOrContinue();
                if (htmlLoaded) {
                    return;
                }

                notFoundRetryCount += 1;
                if (notFoundRetryCount < maxNotFoundRetries) {
                    pollInterval = notFoundRetryInterval;
                    return;
                }

                isTaskCompleted = true;
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
                if (intervalUpdater) {
                    clearInterval(intervalUpdater);
                    intervalUpdater = null;
                }

                hideLoading();
                displayTeachingHtml(`<div style='text-align: center; padding: 50px;'>
                    <p style='color: #B83B43; font-size: 16px;'>任务不存在或已过期</p>
                    <p style='color: #5A6A76; font-size: 14px; margin-top: 10px;'>该任务可能因服务器重启而丢失，请重新创建任务</p>
                    <a href='index.html?v=3' target="_top" style='display: inline-block; margin-top: 20px; padding: 10px 24px; background: #991b1b; color: white; border-radius: 8px; text-decoration: none;'>返回首页重新创建</a>
                </div>`);
            };

            const poll = async () => {
                // 如果任务已完成，直接返回，不再执行轮询
                if (isTaskCompleted) {
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/api/tasks/${taskId}`);
                    // HTTP 404：先尝试读取 HTML，未命中则继续短暂轮询，避免多 worker 场景误判
                    if (res.status === 404) {
                        await handleNotFound(res);
                        return;
                    }

                    const data = await res.json();
                    console.log("任务状态:", data.status, "进度:", data.progress + "%", "轮询间隔:", pollInterval + "ms");

                    // 更新真实进度
                    if (data.progress !== undefined && data.progress !== null) {
                        const progress = data.progress;
                        updateProgressFromBackend(progress);

                        // 动态调整轮询间隔（根据进度）
                        if (progress > 85) {
                            pollInterval = 1000; // 接近完成时更频繁检查（1秒）
                        } else if (progress > 50) {
                            pollInterval = 2000; // 中等进度（2秒）
                        } else {
                            pollInterval = 3000; // 早期阶段（3秒）
                        }

                        // 如果进度没有变化，逐渐增加间隔（避免无效请求）
                        if (progress === lastProgress && progress < 100) {
                            progressStableCount++;
                            if (progressStableCount > 2) {
                                // 进度连续3次未变化，增加间隔
                                pollInterval = Math.min(pollInterval * 1.5, 5000); // 最大 5 秒
                            }
                        } else {
                            progressStableCount = 0; // 进度有变化，重置计数
                        }
                        lastProgress = progress;

                        // 预加载优化：当进度 > 85% 时，提前尝试加载 HTML
                        if (progress > 85 && data.status === "running" && !preloadAttempted) {
                            preloadAttempted = true;
                            // 异步预加载，不阻塞主流程
                            fetch(`${API_BASE}/api/teachings/${taskId}/html`)
                                .then(res => {
                                    if (res.ok) {
                                        return res.text();
                                    }
                                })
                                .then(html => {
                                    if (html) {
                                        // 预加载成功，缓存起来
                                        window._preloadedHtml = html;
                                        console.log("HTML 已预加载，等待任务完成即可立即显示");
                                    }
                                })
                                .catch(() => {
                                    // 预加载失败不影响主流程
                                });
                        }
                    }

                    // 当进度达到30%（向量计算完成）时，开始尝试加载推荐
                    if (!relatedRequested && data.progress >= 30) {
                        relatedRequested = true;
                        tryLoadRelatedTeachings(taskId);
                    }

                    if (data.status === "completed") {
                        // 链路埋点：任务完成（前端确认）
                        if (window.reportWebsiteLog) {
                            window.reportWebsiteLog('INFO', 'animation_generation', '任务完成', {
                                event: 'task_completed',
                                stage: 'video_page_polling',
                                task_id: taskId
                            });
                        }
                        // 标记任务已完成
                        isTaskCompleted = true;
                        // 跨页面提醒去重：用户在生成页已亲眼看到结果，离开后不再重复弹窗
                        try { localStorage.setItem('xsyy_gen_notified_' + taskId, '1'); } catch (e) {}

                        // 清理所有定时器
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                        if (intervalUpdater) {
                            clearInterval(intervalUpdater);
                            intervalUpdater = null;
                        }

                        updateProgressFromBackend(100); // 确保显示 100%
                        setTimeout(() => {
                            hideLoading(); // 延迟隐藏，让用户看到完成动画
                        }, 500);

                        // 优先使用预加载的 HTML（如果存在）
                        if (window._preloadedHtml) {
                            console.log("使用预加载的 HTML，立即显示");
                            displayTeachingHtml(window._preloadedHtml);
                            delete window._preloadedHtml; // 清理预加载缓存
                            loadRelatedTeachings(taskId);
                        }
                        // 在 main-container 中显示教学 HTML
                        else {
                            const html = await fetchTeachingHtml(taskId, data.metadata?.teaching_html || "");
                            if (html) {
                                console.log("准备显示教学 HTML，长度:", html.length);
                                displayTeachingHtml(html);
                            }
                            else if (data.metadata?.teaching_html) {
                                console.log("准备显示教学 HTML，长度:", data.metadata.teaching_html.length);
                                displayTeachingHtml(data.metadata.teaching_html);
                            } else {
                                // 如果 metadata 中没有，/html 接口也加载失败，显示兜底提示
                                console.warn("未找到 teaching_html");
                                displayTeachingHtml("<p style='text-align: center; padding: 50px; color: #5A6A76;'>未生成教学内容</p>");
                            }
                            // 任务完成后刷新推荐
                            loadRelatedTeachings(taskId);
                        }
                        // 任务完成后刷新标题和统计信息
                        loadTeachingDetails(taskId);
                        return; // 任务完成，退出轮询
                    }

                    if (data.status === "failed") {
                        // 标记任务已完成（失败也算完成）
                        isTaskCompleted = true;
                        // 跨页面提醒去重：用户在生成页已亲眼看到结果，离开后不再重复弹窗
                        try { localStorage.setItem('xsyy_gen_notified_' + taskId, '1'); } catch (e) {}

                        // 清理所有定时器
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                        if (intervalUpdater) {
                            clearInterval(intervalUpdater);
                            intervalUpdater = null;
                        }

                        hideLoading(); // 隐藏加载动画
                        // 链路埋点：任务失败（前端确认；详情仅记录到管理后台链路日志，用户端不展示）
                        if (window.reportWebsiteLog) {
                            window.reportWebsiteLog('ERROR', 'animation_generation', '任务失败: ' + (data.error || '未知错误'), {
                                event: 'task_failed',
                                stage: 'video_page_polling',
                                error_type: 'unknown',
                                task_id: taskId
                            });
                        }
                        // 失败分流（2026-09-11）：详情页自动补全触发的重生成失败 → 用户端静默（失败详情仅上报管理日志）；
                        // 用户主动提交题目生成的失败 → 保留报错弹窗（与原行为一致）
                        if (data.metadata && data.metadata.trigger === 'ensure_complete') {
                            handleEnsureFailure(taskId);
                        } else {
                            // 显示错误弹窗
                            showErrorModal(data.error || "未知错误");
                        }
                        return; // 任务失败，退出轮询
                    }

                    if (data.status === "not_found") {
                        await handleNotFound(res);
                        return;
                    }
                } catch (err) {
                    console.error("轮询任务失败:", err);
                    // 链路埋点：轮询异常（前端侧）
                    if (window.reportWebsiteLog) {
                        window.reportWebsiteLog('ERROR', 'animation_generation', '轮询任务状态失败: ' + (err && err.message), {
                            event: 'task_poll_failed',
                            stage: 'video_page_polling',
                            error_type: 'third_party_http_error',
                            task_id: taskId
                        });
                    }
                    // 发生错误时也清理定时器
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                    if (intervalUpdater) {
                        clearInterval(intervalUpdater);
                        intervalUpdater = null;
                    }
                    hideLoading();
                    displayTeachingHtml(`<div style='text-align: center; padding: 50px;'><p style='color: #B83B43; font-size: 16px;'>查询失败：${err.message}</p></div>`);
                }
            };

            // 立即执行一次
            await poll();

            // 如果任务已完成，不再创建定时器
            if (isTaskCompleted) {
                return;
            }

            // 使用动态间隔轮询
            pollTimer = setInterval(poll, pollInterval);

            // 定期更新轮询间隔（每 10 秒检查一次，根据最新进度调整）
            intervalUpdater = setInterval(() => {
                // 如果任务已完成，清理定时器
                if (isTaskCompleted) {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                    if (intervalUpdater) {
                        clearInterval(intervalUpdater);
                        intervalUpdater = null;
                    }
                    return;
                }

                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = setInterval(poll, pollInterval);
                }
            }, 10000); // 每 10 秒更新一次间隔

            // 清理函数：在页面卸载时清理定时器
            const originalClear = () => {
                if (intervalUpdater) {
                    clearInterval(intervalUpdater);
                    intervalUpdater = null;
                }
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            };

            // 监听页面卸载，清理定时器
            window.addEventListener('beforeunload', originalClear);
        }

        // 轮询方式尝试加载推荐（向量计算完成后立即开始）
        async function tryLoadRelatedTeachings(taskId, maxRetries = 15) {
            const relatedList = document.getElementById("relatedList");
            if (!relatedList) return;

            // 显示加载状态

                <div style="text-align: center; padding: 20px; color: var(--ink-grey);">
                    <p>正在加载推荐内容...</p>
                </div>
            `;

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const _tk = localStorage.getItem('auth_token');
                    const _hdrs = _tk ? { 'Authorization': `Bearer ${_tk}` } : undefined;
                    const res = await fetch(`${API_BASE}/api/teachings/${taskId}/similar${getSimilarMaxGradeParam()}`, _hdrs ? { headers: _hdrs } : undefined);

                    // 404 / 明确失败：教学内容不存在，停止重试

                    if (res.ok) {

                        if (!Array.isArray(teachings)) {
                            console.error("API 返回的不是数组", teachings);
                            throw new Error("API 返回格式错误");

                            return; // 成功加载，退出轮询
                        }
                    } else if (res.status === 404) {
                        // 404 表示向量数据库还没有准备好，继续重试
                        console.log(`向量数据库尚未准备好，重试中 (${i + 1}/${maxRetries})...`);
                    } else {

                        const errorText = await res.text();
                        console.warn(`相似推荐接口异常 (${i + 1}/${maxRetries}):`, res.status, errorText);
                    }
                } catch (err) {
                    console.log(`尝试加载推荐失败 (${i + 1}/${maxRetries}):`, err);
                }

                // 等待 1 秒后重试（最后一次不等待）
                if (i < maxRetries - 1) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

            relatedList.innerHTML = `
                <div style="text-align: center; padding: 20px; color: var(--ink-grey);">

                </div>

        }

                return `<svg class="svg-icon thumb-content" viewBox="0 0 100 50">
                    <text x="10" y="30" font-size="10" fill="#999">f(x)</text>

        // 格式化时间
        function formatTime(isoString) {
            if (!isoString) return "刚刚";
            try {
                const date = new Date(isoString);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return "刚刚";
                if (diffMins < 60) return `${diffMins}分钟前`;
                if (diffHours < 24) return `${diffHours}小时前`;
                if (diffDays < 30) return `${diffDays}天前`;
                return `${Math.floor(diffDays / 30)}个月前`;
            } catch (e) {
                return "刚刚";
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;

        // 检查登录状态
        function normalizeAuthPayload(payload) {
            if (!payload || typeof payload !== 'object') return null;
            const user = payload.user && typeof payload.user === 'object' ? payload.user : payload;
            if (!user || typeof user !== 'object') return null;
            return user;
        }

        function getStoredUserProfile() {
            try {
                const raw = localStorage.getItem('xsyy_user_v2');
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch {
                return null;
            }
        }

        // 取当前登录用户的年级（个人中心所在年级，1-9），用于“探寻更多相似推演”仅推荐不超过该年级的内容
        function getSimilarMaxGradeParam() {
            try {
                const raw = localStorage.getItem('xsyy_user_v2');
                if (!raw) return '';
                let user = null;
                try { user = JSON.parse(decodeURIComponent(raw)); }
                catch { try { user = JSON.parse(raw); } catch { user = null; } }
                if (user && user.grade) return '?maxGrade=' + encodeURIComponent(String(user.grade));
            } catch {}
            return '';
        }

        async function fetchCurrentUserByToken(token) {
            const endpoints = ['/api/auth/me', '/api/v2/auth/me'];
            let unauthorizedCount = 0;

            for (const path of endpoints) {
                try {
                    const res = await fetch(`${API_BASE}${path}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (res.ok) {
                        const payload = await res.json();
                        return { user: normalizeAuthPayload(payload), unauthorized: false, unknown: false };
                    }

                    if (res.status === 401 || res.status === 403) {
                        unauthorizedCount += 1;
                        continue;
                    }

                    return { user: null, unauthorized: false, unknown: true };
                } catch {
                    return { user: null, unauthorized: false, unknown: true };
                }
            }

            return { user: null, unauthorized: unauthorizedCount === endpoints.length, unknown: false };
        }

        async function checkAuthStatus(forceCheck = false) {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                const loginLink = document.getElementById('loginLink');
                const userAvatarContainer = document.getElementById('userAvatarContainer');
                if (loginLink) loginLink.style.display = 'flex';
                if (userAvatarContainer) userAvatarContainer.style.display = 'none';
                return;
            }

            const authState = await fetchCurrentUserByToken(token);

            if (authState.user) {
                updateUIForLoggedIn(authState.user);
                return;
            }

            const storedUser = getStoredUserProfile();
            if (storedUser && (authState.unknown || !authState.unauthorized)) {
                updateUIForLoggedIn(storedUser);
                return;
            }

            if (authState.unauthorized) {
                localStorage.removeItem('auth_token');
                updateUIForLoggedOut();
                return;
            }

            if (forceCheck) {
                console.warn('检查登录状态失败，保留当前界面状态');
            }
        }

        // 定期检查登录状态（每5分钟）
        let authCheckInterval = null;
        function startAuthStatusCheck() {
            // 清除之前的定时器
            if (authCheckInterval) {
                clearInterval(authCheckInterval);
            }
            // 每5分钟检查一次
            authCheckInterval = setInterval(() => {
                checkAuthStatus(false);
            }, 5 * 60 * 1000); // 5分钟
        }

        // 停止定期检查
        function stopAuthStatusCheck() {
            if (authCheckInterval) {
                clearInterval(authCheckInterval);
                authCheckInterval = null;
            }
        }

        // 监听存储事件，实现跨标签页登录状态同步
        window.addEventListener('storage', (e) => {

                checkAuthStatus(true);

        document.addEventListener('visibilitychange', () => {

        // 更新 UI 为已登录状态
        function updateUIForLoggedIn(user) {
            currentUser = user;
            // 注意：不再把已登录用户自己的邀请码写入 localStorage.user_invite_code。

            const userAvatarContainer = document.getElementById('userAvatarContainer');

            const userNickname = document.getElementById('userNickname');

            userAvatarContainer.style.display = 'inline-flex';

            // 设置头像：显示首字并设置新中式配色
            const username = user.username || '用户';
            const firstChar = username.charAt(0);
            // 支持中英文首字
            const displayChar = /[a-zA-Z0-9]/.test(firstChar) ? firstChar.toUpperCase() : firstChar;
            userAvatar.textContent = displayChar;
            if (userNickname) {
                userNickname.textContent = username;
            }

            // 根据首字的字符码分配颜色（确保同一用户总是相同颜色）
            const charCode = firstChar.charCodeAt(0);
            const colorIndex = charCode % 8; // 8种新中式配色
            userAvatar.className = 'user-avatar color-' + colorIndex;

            // 更新评论输入区域

        // 渲染评论列表
        function renderComments(comments) {
            const commentsList = document.getElementById('commentsList');
            const commentsCount = document.getElementById('comments-count');
            const roots = Array.isArray(comments) ? comments : [];
            const countReplies = comment => (comment.replies || []).reduce((count, reply) => count + 1 + countReplies(reply), 0);
            const totalCount = roots.reduce((count, comment) => count + 1 + countReplies(comment), 0);

            if (commentsCount) commentsCount.textContent = `${totalCount} 条论述`;
            if (!commentsList) return;
            if (roots.length === 0) {
                commentsList.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--ink-grey);">暂无评论，快来发表第一条吧</div>';
                return;
            }

            const renderOne = (comment, isReply = false) => {
                const commentId = String(comment.comment_id || '');
                const username = comment.username || '用户';
                const safeUsername = escapeHtml(username).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\\r\\n]/g, ' ');
                const replies = Array.isArray(comment.replies) ? comment.replies : [];
                return `<div class="comment-item${isReply ? ' comment-reply' : ''}">
                    <div class="user-avatar" style="background:${getUserAvatarColor(username)}">${getUserInitial(username)}</div>
                    <div class="comment-content">
                        <div class="comment-headline">
                            <div class="comment-meta-line">
                                <h4>${escapeHtml(username)}</h4>
                                <span class="comment-date">${formatTime(comment.created_at)}</span>
                            </div>
                            <div class="comment-ops">
                                <span class="comment-like-btn ${comment.is_liked ? 'active' : ''}" onclick="toggleCommentLike('${commentId}')">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.53L12 21.35z"></path></svg>
                                    <span class="comment-like-count">${comment.likes || 0}</span>
                                </span>
                                <button type="button" class="comment-more-btn" aria-label="评论操作" onclick="toggleCommentMenu(event, '${commentId}')">···</button>
                                <div class="comment-more-menu" id="comment-menu-${commentId}">
                                    <button type="button" class="comment-menu-item" onclick="startCommentReply('${commentId}', '${safeUsername}')">回复</button>
                                    ${comment.can_delete ? `<button type="button" class="comment-menu-item comment-menu-danger" onclick="deleteComment('${commentId}')">删除</button>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.content || '')}</div>
                        ${replies.map(reply => renderOne(reply, true)).join('')}
                    </div>
                </div>`;
            };

            commentsList.innerHTML = roots.map(comment => renderOne(comment)).join('');
        }

        // ==================== 教学内容完整性自动补全（2026-09-11） ====================
        // 详情页进入时调用 ensure-complete 接口：后端同步检测封面/动画/标签缺失并自动触发生成；
        // 有触发时显示提示条并轮询任务进度，完成后自动刷新页面（每个题目每个浏览器会话最多自动触发一次，防循环）。

        function showEnsureCompleteBanner(text, sticky) {
            let el = document.getElementById('ensureCompleteBanner');
            if (!el) {
                el = document.createElement('div');
                el.id = 'ensureCompleteBanner';
                el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;'
                    + 'max-width:86%;padding:10px 18px;border-radius:8px;background:#fdfbf7;color:#8a1c1c;'
                    + 'border:1px solid rgba(138,28,28,.35);box-shadow:0 4px 16px rgba(0,0,0,.18);'
                    + 'font-size:14px;line-height:1.6;text-align:center;';
                document.body.appendChild(el);
            }
            el.textContent = text;
            el.style.display = 'block';
            if (!sticky) {
                setTimeout(function () { if (el) el.style.display = 'none'; }, 6000);
            }
        }

        async function ensureTeachingComplete(taskId) {
            // 防循环保护：本会话内已为该题目自动触发过补全则不再触发（避免"重生成→刷新→再触发"死循环）
            try {
                if (sessionStorage.getItem('ensure_complete_done_' + taskId)) return;
            } catch (e) { /* sessionStorage 不可用时忽略 */ }
            try {
                const res = await fetch(`${API_BASE}/api/teachings/${taskId}/ensure-complete`, { method: 'POST' });
                if (!res.ok) return;
                const data = await res.json();
                if (!data || data.complete) return;
                const assetNames = { animation: '教学动画', cover: '封面图', tags: '知识点标签' };
                const missing = (data.defects || []).map(function (d) { return assetNames[d.asset] || d.asset; }).join('、');
                const triggered = data.triggered || [];
                if (triggered.length) {
                    try { sessionStorage.setItem('ensure_complete_done_' + taskId, '1'); } catch (e) {}
                    showEnsureCompleteBanner(`检测到内容缺失（${missing}），正在自动补全，完成后页面将自动刷新…`, true);
                } else if (data.task_running) {
                    showEnsureCompleteBanner(`检测到内容缺失（${missing}），补全任务进行中，完成后页面将自动刷新…`, true);
                } else {
                    showEnsureCompleteBanner(`检测到内容缺失（${missing}），已记录，可联系管理员处理`, false);
                    return;
                }
                if (triggered.indexOf('tags') !== -1 && !data.task_running) {
                    // 仅标签补全：不产生生成任务，轮询 metadata 直至标签出现
                    pollEnsureTagsCompletion(taskId);
                } else {
                    // 动画/封面补全或已有生成任务在跑：轮询任务进度接口（task_status 有跨进程兜底）
                    pollEnsureTaskCompletion(taskId);
                }
            } catch (err) {
                console.warn('教学内容完整性检测失败（忽略）:', err);
            }
        }

        // 用户端静默失败处理（2026-09-11）：自动补全/重新生成失败时不弹任何技术性报错，
        // 失败详情已由轮询分支经 reportWebsiteLog 上报管理日志（管理员可见），用户端仅 console 记录；
        // 静默重试一次（每会话每题最多一次），重试仍失败则保持静默（管理员在日志中处理）。
        function handleEnsureFailure(taskId) {
            console.warn('内容自动补全失败（用户端静默处理，已上报管理日志）:', taskId);
            try {
                if (sessionStorage.getItem('ensure_complete_retry_' + taskId)) return;
                sessionStorage.setItem('ensure_complete_retry_' + taskId, '1');
                sessionStorage.removeItem('ensure_complete_done_' + taskId);
            } catch (e) { return; /* sessionStorage 不可用时不重试，保持静默 */ }
            setTimeout(function () { ensureTeachingComplete(taskId); }, 60000);
        }

        function pollEnsureTaskCompletion(taskId) {
            let elapsed = 0;
            const timer = setInterval(async function () {
                elapsed += 5;
                if (elapsed > 600) {
                    clearInterval(timer);
                    showEnsureCompleteBanner('内容补全耗时较长，可稍后手动刷新页面查看', false);
                    return;
                }
                try {
                    const res = await fetch(`${API_BASE}/api/tasks/${taskId}`);
                    if (res.status === 404) { clearInterval(timer); location.reload(); return; }
                    if (!res.ok) return;
                    const t = await res.json();
                    if (t.status === 'completed') { clearInterval(timer); location.reload(); }
                    else if (t.status === 'failed') {
                        // 用户端不弹报错（2026-09-11）：静默处理，失败详情仅上报管理日志
                        clearInterval(timer);
                        handleEnsureFailure(taskId);
                    }
                } catch (e) { /* 网络抖动继续轮询 */ }
            }, 5000);
        }

        function pollEnsureTagsCompletion(taskId) {
            let elapsed = 0;
            const timer = setInterval(async function () {
                elapsed += 5;
                if (elapsed > 300) { clearInterval(timer); return; }
                try {
                    const res = await fetch(`${API_BASE}/api/teachings/${taskId}/metadata`);
                    if (res.status === 404) { clearInterval(timer); return; }
                    if (!res.ok) return;
                    const m = await res.json();
                    if (m && m.knowledge_tags && m.knowledge_tags.main_tag) {
                        clearInterval(timer);
                        location.reload();
                    }
                } catch (e) { /* 网络抖动继续轮询 */ }
            }, 5000);
        }

        // 加载教学详情（标题、标签和题目）—— 失败（含 404）只请求一次，不重试轮询
        async function loadTeachingDetails(taskId) {
            try {
                const res = await fetch(`${API_BASE}/api/teachings/${taskId}/metadata`);
                if (res.status === 404) {
                    console.warn('教学详情不存在（404），不再重试:', taskId);
                    const titleEl = document.getElementById('videoTitle');
                    if (titleEl) titleEl.textContent = '教学内容不存在';
                    const questionEl = document.getElementById('videoQuestion');
                    if (questionEl) questionEl.style.display = 'none';
                    return;
                }
                if (!res.ok) throw new Error('加载教学详情失败');
                const metadata = await res.json();

                // 若仍在生成中，仅更新进度相关展示，不按完整详情渲染
                if (metadata.status === 'running' || metadata.status === 'pending') {
                    const titleEl = document.getElementById('videoTitle');
                    if (titleEl) titleEl.textContent = '教学内容生成中...';
                    return;
                }

                // 更新标题
                const titleEl = document.getElementById('videoTitle');
                if (titleEl && metadata.title) {
                    titleEl.textContent = metadata.title;
                } else if (titleEl) {
                    titleEl.textContent = metadata.question || '数学问题讲解';
                }

                applyReuseBadge(metadata.reuse_info);

                // 更新作者
                const channelNameEl = document.getElementById('channelName');
                if (channelNameEl) {
                    channelNameEl.textContent = metadata.author_username || '象数演易';
                }

                // 更新标签（2026-09-02 v3：年级 pill 独立色 / 主标签墨 pill / 知识域色字 + 第二标签 +，与首页同套）
                const tagsContainer = document.getElementById('tagsContainer');
                if (tagsContainer) {
                    tagsContainer.innerHTML = videoRenderTagsHTML(metadata.knowledge_tags, metadata.second_knowledge_tag);
                }

                // 创建完成后始终弹出"确认知识点标签"弹窗（仅当未被用户确认过时）
                if (window.TagSelectionDialog && metadata.status === 'completed') {
                    if (window.TagSelectionDialog.needsConfirmation(metadata)) {
                        console.log('检测到知识点标签尚未确认，弹出确认弹窗');
                        // 延迟显示，避免与其他弹窗冲突
                        setTimeout(function () {
                            window.TagSelectionDialog.show(taskId, metadata.knowledge_tags || {});
                        }, 1000);
                    }
                }

                // 更新题目（支持数学公式渲染）
                const questionEl = document.getElementById('videoQuestion');
                if (questionEl && metadata.question) {
                    let questionText = metadata.question;

                    // 保护数学公式标记，避免被转义
                    // 临时替换数学公式标记
                    const mathPlaceholders = [];
                    let placeholderIndex = 0;

                    // 保护 $$...$$ (块级公式)
                    questionText = questionText.replace(/\$\$([^$]+)\$\$/g, (match, formula) => {
                        const placeholder = `__MATH_BLOCK_${placeholderIndex}__`;
                        mathPlaceholders[placeholderIndex] = `$$${formula}$$`;
                        placeholderIndex++;
                        return placeholder;
                    });

                    // 保护 $...$ (行内公式，但不包含 $$)
                    questionText = questionText.replace(/(?<!\$)\$(?!\$)([^$\n]+?)(?<!\$)\$(?!\$)/g, (match, formula) => {
                        const placeholder = `__MATH_INLINE_${placeholderIndex}__`;
                        mathPlaceholders[placeholderIndex] = `$${formula}$`;
                        placeholderIndex++;
                        return placeholder;
                    });

                    // 保护 \(...\) (行内公式)
                    questionText = questionText.replace(/\\\(([^)]+)\\\)/g, (match, formula) => {
                        const placeholder = `__MATH_INLINE_PAREN_${placeholderIndex}__`;
                        mathPlaceholders[placeholderIndex] = `\\(${formula}\\)`;
                        placeholderIndex++;
                        return placeholder;
                    });

                    // 保护 \[...\] (块级公式)
                    questionText = questionText.replace(/\\\[([^\]]+)\\\]/g, (match, formula) => {
                        const placeholder = `__MATH_BLOCK_BRACKET_${placeholderIndex}__`;
                        mathPlaceholders[placeholderIndex] = `\\[${formula}\\]`;
                        placeholderIndex++;
                        return placeholder;
                    });

                    // 转义 HTML（此时数学公式已被保护）
                    questionText = escapeHtml(questionText);

                    // 恢复数学公式标记
                    mathPlaceholders.forEach((math, index) => {
                        questionText = questionText.replace(`__MATH_BLOCK_${index}__`, math);
                        questionText = questionText.replace(`__MATH_INLINE_${index}__`, math);
                        questionText = questionText.replace(`__MATH_INLINE_PAREN_${index}__`, math);
                        questionText = questionText.replace(`__MATH_BLOCK_BRACKET_${index}__`, math);
                    });

                    // 纯 LaTeX 公式（无 $ 分隔符）：自动包裹 $$...$$ 以触发 MathJax 渲染
                    if (mathPlaceholders.length === 0 && /\\[a-zA-Z]/.test(questionText)) {
                        questionText = '$$' + questionText + '$$';
                    }

                    questionEl.innerHTML = questionText;
                    questionEl.style.display = 'block';

                    // 触发 MathJax 渲染数学公式
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        MathJax.typesetPromise([questionEl]).catch(function (err) {
                            console.warn('MathJax 渲染错误:', err);
                        });
                    } else if (window.MathJax && window.MathJax.typeset) {
                        // 兼容旧版 MathJax
                        MathJax.typeset([questionEl]);
                    }
                } else if (questionEl) {
                    questionEl.style.display = 'none';
                }

                // 更新日期和观看次数
                const videoStatsEl = document.querySelector('.video-stats');
                if (videoStatsEl) {
                    const timeStr = formatTime(metadata.generated_at);
                    const viewCount = metadata.view_count || 0;
                    videoStatsEl.textContent = `${timeStr} · ${viewCount} 次观看`;
                }
            } catch (err) {
                console.error('加载教学详情失败:', err);
                // 失败时显示默认标题
                const titleEl = document.getElementById('videoTitle');
                if (titleEl) {
                    titleEl.textContent = '数学问题讲解';
                }
                const questionEl = document.getElementById('videoQuestion');
                if (questionEl) {
                    questionEl.style.display = 'none';
                }
            }
        }

                const favorites = data.favorites || [];
                // 后端返回 [{task_id, created_at}]
                const favoriteIds = favorites.map(f => f.task_id || f);

                const favoriteBtn = document.getElementById('favoriteBtn');
                const favoriteText = document.getElementById('favoriteText');
                const isFavorite = favoriteIds.includes(taskId);
                if (favoriteBtn) {
                    if (isFavorite) {
                        favoriteBtn.classList.add('active');
                        if (favoriteText) favoriteText.textContent = '已收藏';
                    } else {
                        favoriteBtn.classList.remove('active');
                        if (favoriteText) favoriteText.textContent = '收藏';
                    }
                }
            } catch (err) {
                console.error('加载收藏状态失败', err);
            }
        }

        // 收藏/取消收藏
        async function toggleFavorite() {
            if (!currentUser || !currentTaskId) {
                alert('请先登录');
                return;
            }

            try {
                const favoriteBtn = document.getElementById('favoriteBtn');
                // 如果当前是“已收藏”，先确认是否取消
                if (favoriteBtn && favoriteBtn.classList.contains('active')) {
                    const ok = confirm('确定取消收藏吗？');
                    if (!ok) return;
                }

                const res = await fetch(`${API_BASE}/api/auth/favorite`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        task_id: currentTaskId
                    })
                });

                if (!res.ok) throw new Error('操作失败');

                const data = await res.json();

                    if (favoriteText) favoriteText.textContent = '收藏';

        /**
         * 获取设备信息（每次分享时重新读取 User-Agent，无缓存）
         * 判定原则：uaData.mobile 仅在布尔值时采信；否则按 UA 正则 -> 触控/视口辅助信号分层判定
         */
        function getDeviceDiagnoseInfo() {
            const ua = navigator.userAgent;
            const uaData = navigator.userAgentData || null; // iOS Safari 等无此 API
            // 关键修复：mobile 仅在布尔值时采信，undefined/非布尔视为"无结论"，避免手机被判成 PC
            const uaMobile = (uaData && typeof uaData.mobile === 'boolean') ? uaData.mobile : null;
            const uaPlatform = uaData ? (uaData.platform || '') : '';

            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const minDim = Math.min(vw, vh);
            const touchPoints = navigator.maxTouchPoints || 0;
            const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches; // 主指针为触控

            const isWechat = /MicroMessenger/i.test(ua);
            const wechatVer = (ua.match(/MicroMessenger\/([\d.]+)/) || [])[1] || '';

            // UA 正则信号
            const isAndroidUA = /Android/i.test(ua);
            const isIphoneUA = /iPhone/i.test(ua);
            const isIpodUA = /iPod/i.test(ua);
            const isHarmonyUA = /HarmonyOS|鸿蒙/i.test(ua); // 鸿蒙 UA 常同时含 Android，需单独捕获
            const isIpadUA = /iPad/i.test(ua);
            const isMacUA = /Macintosh|Mac OS X|MacIntel/i.test(ua);
            const isMobiUA = /Mobi|Mobile/i.test(ua);

            // 分层判定（优先级从高到低）
            // 第 1 层：UA 显式 iPad
            let isIPad = isIpadUA;

            // 第 2 层：iPadOS 桌面模式伪装 Mac：uaData.mobile===true，或多指触控+粗指针（iOS Safari 无 uaData）。
            // 桌面 Mac 主指针是鼠标（coarse=false），不会被误判
            if (!isIPad && isMacUA && !isIphoneUA && (uaMobile === true || (touchPoints > 1 && coarse))) {
                isIPad = true;
            }

            // 第 3 层：UA 显式手机（含鸿蒙、Windows Phone；Android 手机 UA 必含 Mobile）
            let isPhone = isIphoneUA || isIpodUA || isHarmonyUA
                || /Windows Phone/i.test(ua)
                || (isAndroidUA && isMobiUA);

            // 第 4 层：uaData.mobile===true（非 macOS 平台；macOS+true 已在第 2 层判为 iPad）
            if (!isIPad && !isPhone && uaMobile === true && !/macOS/i.test(uaPlatform)) {
                isPhone = true;
            }
            // uaData.mobile===false + Android UA：Android 平板（Chrome 对平板报 false）
            let isTabletOther = false;
            if (!isIPad && !isPhone && uaMobile === false && isAndroidUA) {
                isTabletOther = true;
            }

            // 第 5 层：辅助信号兜底（UA/uaData 均无结论）：多指触控+粗指针。触摸屏笔记本主指针是鼠标，不会落入此层
            if (!isIPad && !isPhone && !isTabletOther && touchPoints > 1 && coarse) {
                if (minDim <= 480) {
                    isPhone = true;    // 小屏触控 -> 手机
                } else {
                    isTabletOther = true; // 中/大屏触控 -> 平板
                }
            }

            // 第 6 层：UA 关键词最后兜底
            if (!isIPad && !isPhone && !isTabletOther && /Tablet|Pad|Touch/i.test(ua)) {
                isTabletOther = true;
            }

            const isTablet = isIPad || isTabletOther;
            const isMobile = isPhone || isTablet; // 手机/平板统一走移动分支
            const isPC = !isMobile;
            const supportWebShare = !!navigator.share && window.isSecureContext !== false;
            const supportClipboard = !!(navigator.clipboard && navigator.clipboard.writeText);

            const info = {
                isMobileDevice: isMobile,
                isMobile,
                isPC,
                isPhone,
                isTablet,
                isIPad,
                isAndroid: isAndroidUA,
                isIphone: isIphoneUA,
                isHarmony: isHarmonyUA,
                isWechat,
                wechatVer,
                supportWebShare,
                supportClipboard,
                isSecureContext: window.isSecureContext !== false,
                touchPoints,
                pointerCoarse: coarse,
                windowSize: { width: vw, height: vh },
                userAgent: ua,
                userAgentData: { mobile: uaMobile, platform: uaPlatform }
            };

            // 输出完整诊断日志
            console.group('【分享-设备诊断日志】');
            console.log('User-Agent:', ua);
            console.log('userAgentData:', uaData);
            console.log('uaData.mobile(布尔采信):', uaMobile);
            console.log('isMobile(最终):', isMobile, '| isPC:', isPC, '| isPhone:', isPhone, '| isTablet:', isTablet, '| isIPad:', isIPad);
            console.log('isWechat:', isWechat, wechatVer ? ('v' + wechatVer) : '');
            console.log('supportWebShare:', supportWebShare, '| supportClipboard:', supportClipboard, '| secureContext:', window.isSecureContext !== false);
            console.log('touchPoints:', touchPoints, '| pointerCoarse:', coarse, '| 视口:', vw + 'x' + vh);
            console.groupEnd();

            return info;
        }

        // 构造分享链接（同步；URL 参数 -> localStorage -> 用户资料兜底）
        function buildShareUrl(taskId) {
            const urlParams = new URLSearchParams(window.location.search);
            let inviteCode = urlParams.get('inviteCode');
            let src = 'URL参数';
            if (!inviteCode) {
                const stored = localStorage.getItem('user_invite_code');
                if (stored && stored !== 'null' && stored !== 'undefined') {
                    inviteCode = stored;
                    src = 'localStorage(user_invite_code)';
                }
            }
            if (!inviteCode) {
                try {
                    const profile = getStoredUserProfile();
                    if (profile && (profile.inviteCode || profile.invite_code)) {
                        inviteCode = profile.inviteCode || profile.invite_code;
                        src = 'xsyy_user_v2(用户资料)';
                    }
                } catch (e) { /* ignore */ }
            }
            const u = new URL(window.location.origin + window.location.pathname);
            u.searchParams.set('task_id', taskId);
            if (inviteCode) u.searchParams.set('inviteCode', inviteCode);
            const shareUrl = u.toString();
            console.log('[分享诊断] 邀请码来源:', src, '| 值:', inviteCode || '(无)', '| 链接:', shareUrl);
            return shareUrl;
        }

        // 复制文本：Clipboard API -> textarea+execCommand 兜底
        async function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    console.warn('Clipboard API 复制失败:', e);
                }
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length); // iOS 兼容
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (ok) return true;
            } catch (e) {
                console.warn('execCommand 复制失败:', e);
            }
            return false;
        }

        if (window.alert && !window._xsAlertPatched) {

        function buildShareCardData(shareUrl) {
            const titleEl = document.getElementById('videoTitle');
            const title = (titleEl && titleEl.textContent) ? titleEl.textContent.trim() : '象数演易 - 数学互动教学';
            return {
                title: title,
                desc: '象数演易 AI 生成的交互式数学讲解，点击卡片查看完整教学动画',
                link: shareUrl,
                imgUrl: `${API_BASE}/api/teachings/${currentTaskId}/preview?v=${Date.now()}`
            };
        }

        // 外部浏览器 + 支持 Web Share API：直接调起系统原生分享面板
        // 用户可在系统面板中自由选择微信好友、朋友圈或其它应用完成分享
        async function webShareInvoke(action, shareData) {
            const isMoments = action === 'moments';
            const sharePayload = {
                title: shareData.title,
                text: isMoments ? '分享到朋友圈：' + shareData.desc : shareData.desc,
                url: shareData.link
            };
            try {
                await navigator.share(sharePayload);
            } catch (e) {
                // 用户主动取消分享（AbortError）不属于失败
                if (e && e.name === 'AbortError') {
                    console.log('[分享诊断] 用户取消了系统分享');
                    return;
                }
                console.warn('[分享诊断] Web Share API 调用失败:', e);
                // 兜底：复制链接，保证分享不中断
                copyTextToClipboard(shareData.link).then((ok) => {
                    xsShowToast(ok ? '链接已复制' : '分享失败，链接：' + shareData.link);
                });
            }
        }

        // ===================== 微信 JS-SDK 分享卡片 =====================
        // 通过后端签名接口初始化 wx.config，配置右上角 ··· 分享卡片（发送给朋友 / 朋友圈）
        let wxJsSdkReady = null;        // Promise<boolean>：wx.config 是否成功
        let wxJsSdkAvailable = false;   // 是否已配置成功并可调用 wx 接口

        function initWechatJsSdk() {
            if (wxJsSdkReady) return wxJsSdkReady;
            wxJsSdkReady = new Promise((resolve) => {
                if (typeof wx === 'undefined') {
                    console.warn('[分享诊断] 未加载 jweixin，微信分享卡片不可用');
                    resolve(false);
                    return;
                }
                // 签名 url 必须与当前页面地址完全一致（含路径与查询参数，去掉 # 及之后）
                const currentUrl = window.location.href.split('#')[0];
                fetch(`${API_BASE}/api/wechat/jssdk?url=${encodeURIComponent(currentUrl)}`)
                    .then((res) => res.json())
                    .then((cfg) => {
                        wx.config({
                            debug: false,
                            appId: cfg.appId,
                            timestamp: cfg.timestamp,
                            nonceStr: cfg.nonceStr,
                            signature: cfg.signature,
                            jsApiList: ['updateAppMessageShareData', 'updateTimelineShareData']
                        });
                        wx.ready(() => {
                            wxJsSdkAvailable = true;
                            applyWechatShareCard();
                            resolve(true);
                        });
                        wx.error((err) => {
                            console.warn('[分享诊断] 微信 JS-SDK 配置失败:', err);
                            resolve(false);
                        });
                    })
                    .catch((e) => {
                        console.warn('[分享诊断] 获取微信签名失败:', e);
                        resolve(false);
                    });
            });
            return wxJsSdkReady;
        }

        // 设置右上角 ··· 分享卡片内容（wx.ready 后或标题更新后调用）
        function applyWechatShareCard() {
            if (!wxJsSdkAvailable || !currentTaskId) return;
            const shareData = buildShareCardData(buildShareUrl(currentTaskId));
            if (typeof wx.updateAppMessageShareData === 'function') {
                wx.updateAppMessageShareData({
                    title: shareData.title,
                    desc: shareData.desc,
                    link: shareData.link,
                    imgUrl: shareData.imgUrl,
                    success: function () { console.log('[分享诊断] 已设置「发送给朋友」分享卡片'); }
                });
            }
            if (typeof wx.updateTimelineShareData === 'function') {
                wx.updateTimelineShareData({
                    title: shareData.title,
                    link: shareData.link,
                    imgUrl: shareData.imgUrl,
                    success: function () { console.log('[分享诊断] 已设置「朋友圈」分享卡片'); }
                });
            }
        }

        // 微信内置浏览器：尝试拉起微信原生分享面板（wx.config 成功后 WeixinJSBridge 才可用）
        // 成功则直接进入好友选择 / 朋友圈编辑；失败、取消或静默拦截则回退到右上角 ··· 引导层
        function wxInvokeShareWithSdk(action, shareData, shareUrl) {
            const invokeName = (action === 'moments') ? 'shareTimeline' : 'sendAppMessage';
            const payload = (action === 'moments')
                ? { title: shareData.title, link: shareData.link, imgUrl: shareData.imgUrl }
                : { title: shareData.title, desc: shareData.desc, link: shareData.link, imgUrl: shareData.imgUrl, type: 'link', dataUrl: '' };

            if (!wxJsSdkAvailable || typeof WeixinJSBridge === 'undefined') {
                // JS-SDK 未就绪（如未配置 AppID/Secret）：引导用户点右上角 ··· 手动分享
                showWechatGuide(action, shareUrl);
                return;
            }

            let fallbackTimer = null;
            const showFallbackGuide = () => {
                if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
                showWechatGuide(action, shareUrl);
            };

            try {
                // 部分微信版本 invoke 会被静默拦截（无任何回调），1.5s 后仍未回调则引导手动分享
                fallbackTimer = setTimeout(showFallbackGuide, 1500);
                WeixinJSBridge.invoke(invokeName, payload, function (res) {
                    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
                    console.log('[分享诊断] 微信原生分享回调:', invokeName, res);
                    const errMsg = res && res.err_msg ? String(res.err_msg) : '';
                    if (errMsg.indexOf('fail') !== -1 || errMsg.indexOf('cancel') !== -1) {
                        showFallbackGuide();
                    }
                });
            } catch (e) {
                console.warn('[分享诊断] WeixinJSBridge.invoke 异常:', e);
                showFallbackGuide();
            }
        }

        // 分享入口：按设备类型分支（PC 复制气泡 / 移动端分享面板）

        // 下拉菜单显示/隐藏控制
        function initUserDropdown() {
            const userAvatarContainer = document.getElementById('userAvatarContainer');

            const userAccountTrigger = document.getElementById('userAccountTrigger');

            if (!userAvatarContainer || !userDropdown || !userAccountTrigger) return;

            function showDropdown() {
                userDropdown.classList.add('show');

            }

            function hideDropdown() {
                userDropdown.classList.remove('show');
                userAccountTrigger.setAttribute('aria-expanded', 'false');
            }

            userAccountTrigger.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                if (userDropdown.classList.contains('show')) {
                    hideDropdown();
                } else {
                    showDropdown();
                }
            });

            userDropdown.addEventListener('click', (event) => {

            document.addEventListener('click', (event) => {

                    hideDropdown();

        // AI 助教抽屉：注入醒目关闭钮 + 全屏遮罩实现"点面板外任意位置自动关闭"
        // （动画区是 iframe，其内部点击不会冒泡到父文档，document 监听收不到——必须用遮罩层接住）
        (function () {
            function doClose(e) {
                if (e) e.stopPropagation();
                if (window.aiChat && aiChat.closePanel) aiChat.closePanel();
            }
            function injectCloseBtn() {
                var actions = document.querySelector('#aiAssistantPanel .ai-header-actions');

                b.type = 'button';

            }
            injectCloseBtn();
            setInterval(injectCloseBtn, 1500); // 面板内容可能被重绘，兜底重试

            // 全屏透明遮罩：面板 active 时出现，点击即关闭（跟随面板显隐）
            var backdrop = document.createElement('div');
            backdrop.id = 'aiBackdrop';
            document.body.appendChild(backdrop);
            backdrop.addEventListener('click', doClose);
            backdrop.addEventListener('mousedown', function (e) { e.preventDefault(); }); // 防止拖选穿透

            var panel = document.getElementById('aiAssistantPanel');
            if (panel && 'MutationObserver' in window) {
                var sync = function () {
                    backdrop.classList.toggle('on', panel.classList.contains('active'));
                };
                new MutationObserver(sync).observe(panel, { attributes: true, attributeFilter: ['class'] });
                sync();
            }
        })();

        // AI 老师回复里的 LaTeX 公式渲染（KaTeX 自动排版）
        // ai-assistant.js 只走 marked.parse 不认数学，故在视频页统一后处理：
        // 盯住聊天区/历史区的 DOM 新增，把 \(..\) \[..$$..$$ $..$ 交给 KaTeX 渲染。
        (function () {
            var PROCESSED = new WeakSet();
            var DELIMS = [
                { start: '\\(', end: '\\)', display: false },
                { start: '\\[', end: '\\]', display: true },
                { start: '$$', end: '$$', display: true },
                { start: '$', end: '$', display: false }
            ];

            function findEnd(text, delim, from) {
                var idx = from;
                while ((idx = text.indexOf(delim.end, idx)) !== -1) {
                    if (delim.end === '$') { // $ 单符：跳过 $$ 与转义 \$
                        if (text[idx - 1] === '\\') { idx++; continue; }
                        if (text[idx + 1] === '$') { idx++; continue; }
                    }
                    return idx;
                }
                return -1;
            }

            function processTextNode(node) {
                var text = node.nodeValue;
                if (!text || text.length < 2) return;
                // 快速预筛：没有潜在起始符就不动
                if (text.indexOf('\\(') === -1 && text.indexOf('\\[') === -1 && text.indexOf('$') === -1) return;

                var frag = document.createDocumentFragment();
                var pos = 0, rendered = false, guard = 0;

                while (pos < text.length && guard++ < 200) {
                    // 找最早出现的起始符
                    var best = null;
                    for (var i = 0; i < DELIMS.length; i++) {
                        var at = text.indexOf(DELIMS[i].start, pos);
                        if (at !== -1 && (!best || at < best.at)) best = { at: at, d: DELIMS[i] };
                    }
                    if (!best) break;
                    var contentStart = best.at + best.d.start.length;
                    var endAt = findEnd(text, best.d, contentStart);
                    if (endAt === -1) { pos = contentStart; continue; }

                    var formula = text.slice(contentStart, endAt);
                    frag.appendChild(document.createTextNode(text.slice(pos, best.at)));
                    var span = document.createElement('span');
                    try {
                        window.katex.render(formula, span, { displayMode: best.d.display, throwOnError: false });
                        rendered = true;
                    } catch (e) {
                        span.textContent = text.slice(best.at, endAt + best.d.end.length); // 渲染失败保原文
                    }
                    frag.appendChild(span);
                    pos = endAt + best.d.end.length;
                }
                if (!rendered) return;
                frag.appendChild(document.createTextNode(text.slice(pos)));
                node.parentNode.replaceChild(frag, node);
            }

            function walk(root) {
                if (!root || PROCESSED.has(root) || !window.katex) return;
                PROCESSED.add(root);
                var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(processTextNode);
            }

            function hookContainer(id) {
                var el = document.getElementById(id);
                if (!el || el.__mathHooked) return;
                el.__mathHooked = true;
                new MutationObserver(function (muts) {
                    muts.forEach(function (m) {
                        Array.prototype.forEach.call(m.addedNodes, function (n) {
                            if (n.nodeType === 1) walk(n);
                            else if (n.nodeType === 3) processTextNode(n);
                        });
                        // innerHTML 整体替换时 addedNodes 可能只有容器本身
                        if (m.addedNodes.length) walk(el);
                    });
                }).observe(el, { childList: true, subtree: true });
                walk(el); // 补渲染已有消息（历史对话）
            }

            function boot() {
                hookContainer('aiChatHistory');
                hookContainer('aiHistoryContent');
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }
            setInterval(boot, 2000); // 面板节点可能被重建，兜底挂钩
        })();
    </script>

    <script src="/js/marked.min.js?v=20260902"></script>
    <script>
        window.APP_VERSION = window.APP_VERSION || new Date().getTime();
        window.addVersionToUrl = window.addVersionToUrl || function (url) {
            const version = window.APP_VERSION;
            if (url.includes('?')) {
                return url + '&v=' + version;
            }
            return url + '?v=' + version;
        };

        function loadScriptWithVersion(src, callback) {
            const script = document.createElement('script');
            script.src = window.addVersionToUrl(src);
            script.async = true;
            script.onload = () => callback && callback(true);
            script.onerror = () => callback && callback(false); // 失败不中断加载链
            document.body.appendChild(script);
        }

        // 按依赖顺序链式加载（与 index.html / user_interface.html 一致）
