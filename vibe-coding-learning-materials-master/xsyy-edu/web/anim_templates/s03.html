    /* 字体栈与 xsyy 站点 index.html 逐字一致；算式另用站点同款 KaTeX 字体 */
    --font-serif: "Songti SC", "Noto Serif SC", "SimSun", "STSong", serif;
    --font-sans: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    --font-math: KaTeX_Main, KaTeX_Math, "Songti SC", "Noto Serif SC", "SimSun", "STSong", serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(1200px 600px at 20% -10%, #fbf7ec 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 120%, #efe7d4 0%, transparent 55%);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100%}

  /* ---------- 左：舞台 ---------- */
  .stage-col{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px;gap:10px}
  .stage{
    position:relative;flex:1;min-height:0;overflow:hidden;
    background:linear-gradient(180deg,var(--paper-lift),#fbf6ea);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 18px 40px -24px rgba(43,43,43,.45);
    display:flex;align-items:center;justify-content:center;
  }
  .stage svg{width:100%;height:100%;display:block}

  /* 手：滑块区（参数由场景声明，模板自动生成，不用改这里） */
  .knobs{
    display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;
    padding:10px 16px;border-radius:14px;
    background:rgba(255,253,248,.8);border:1px solid var(--line);
  }
  .knobs:empty{display:none}
  .knob{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
  .knob b{font-family:var(--font-serif);font-size:16px;color:var(--var);min-width:44px}
  .knob input[type=range]{
    -webkit-appearance:none;appearance:none;width:190px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--var),rgba(47,95,222,.25));outline:none;
  }
  .knob input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--var);cursor:grab;
    box-shadow:0 1px 4px rgba(43,43,43,.25);
  }
  .knob .hint{font-size:12px;color:var(--ink-3)}

  /* ---------- 控制条：回看 / AI助教 / 下一步 ---------- */
  .controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
  .bar{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.92);border:1px solid var(--line-2);
    border-radius:999px;padding:7px 14px;
    box-shadow:0 6px 18px -8px rgba(43,43,43,.35);
  }
  .btn{
    font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;
    border-radius:999px;padding:7px 18px;border:1px solid var(--line-2);
    background:#fff;color:var(--ink-2);transition:background .18s,color .18s;
  }

<script>
(function(){
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════
     ① 内 核 —— 固定，任何题型都不用改
     只管三件事：数学坐标 → 像素坐标、元素登记与显示、步骤机。
     ═══════════════════════════════════════════════════════════════════ */
  var NS = 'http://www.w3.org/2000/svg';
  var COLORS = { ink:'#2b2b2b', blue:'#2f5fde', red:'#d6432f', gold:'#c8901a' };
  var FILLS  = { ink:'rgba(43,43,43,.06)', blue:'rgba(47,95,222,.08)',
                 red:'rgba(214,67,47,.10)', gold:'rgba(200,144,26,.12)' };
  var HILITE = '#d6432f';
  /* 算式/标注字体：站点同款 KaTeX */
  var SERIF  = "KaTeX_Main, KaTeX_Math, 'Songti SC', 'Noto Serif SC', 'SimSun', 'STSong', serif";
  var TICKCLR = '#8a8071';

  var svgEl, fitEl, els = {}, K = 40, frame = null;
  var BASE_W = 820, BASE_H = 620;

  function mk(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs){ if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); }
    return e;
  }
  function reg(name, node, base){
    node.setAttribute('data-base', base || 'ink');
    els[name] = node;
    fitEl.appendChild(node);
    return node;
  }
  function unit(dx, dy){ var L = Math.sqrt(dx*dx + dy*dy) || 1; return { x:dx/L, y:dy/L }; }
  function fx(n){ return Math.round(n * 10) / 10; }

  /* 把一条线段裁到坐标框里（切线、渐近线都会跑出框，裁完才不会把取景撑爆）。
     完全在框外返回 null。 */
  function clipSeg(P, Q){
    var f = frame; if (!f) return { P:P, Q:Q };
    var x0 = f.x0, x1 = f.x1, y0 = f.y0, y1 = f.y1;
    var dx = Q.x - P.x, dy = Q.y - P.y, t0 = 0, t1 = 1;
    var p = [-dx, dx, -dy, dy], q = [P.x - x0, x1 - P.x, P.y - y0, y1 - P.y];
    for (var i = 0; i < 4; i++){
      if (Math.abs(p[i]) < 1e-12){ if (q[i] < 0) return null; continue; }
      var r = q[i] / p[i];
      if (p[i] < 0){ if (r > t1) return null; if (r > t0) t0 = r; }
      else         { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return { P:{ x:P.x + t0 * dx, y:P.y + t0 * dy },
             Q:{ x:P.x + t1 * dx, y:P.y + t1 * dy } };
  }

  /* ---------- 坐标映射：两种模式 ----------
     frame 声明了 → 绝对定标（函数、统计题：刻度必须每次一样）
     frame 没声明 → 相对定标（几何题：图形就是全部内容，靠取景凑近） */
  var FRAME_PAD = { l:60, r:46, t:44, b:58 };
  function buildFrame(f){
    var bw = BASE_W - FRAME_PAD.l - FRAME_PAD.r;
    var bh = BASE_H - FRAME_PAD.t - FRAME_PAD.b;
    var sx = bw / (f.x[1] - f.x[0]);
    var sy = bh / (f.y[1] - f.y[0]);
    var ox = FRAME_PAD.l, oy = BASE_H - FRAME_PAD.b;
    if (f.iso === true){            // 需要"形状不变形"时打开（圆得是圆、双曲线得对称）
      var k = Math.min(sx, sy);
      sx = sy = k;
      /* 等比之后坐标框往往比画布窄，必须重新居中，
         否则整张图会贴左边——这是 iso 模式最容易出、又最难一眼看出的问题 */
      ox = (BASE_W - (f.x[1] - f.x[0]) * k) / 2;
      oy = (BASE_H + (f.y[1] - f.y[0]) * k) / 2;
    }
    /* 固定取景框：函数题用了绝对坐标 frame，镜头必须锁死，不能随动点/标签漂移。
       view 比 frame 像素区多留 34px 余量，刚好罩住坐标轴箭头、刻度与端点标签。 */
    var VB_M = 34;
    var view = { x: FRAME_PAD.l - VB_M, y: FRAME_PAD.t - VB_M,
                 w: (BASE_W - FRAME_PAD.l - FRAME_PAD.r) + 2 * VB_M,
                 h: (BASE_H - FRAME_PAD.t - FRAME_PAD.b) + 2 * VB_M };
    return { x0:f.x[0], x1:f.x[1], y0:f.y[0], y1:f.y[1],
             sx:sx, sy:sy, ox:ox, oy:oy, view:view };
  }
  function PX(x){ return frame ? frame.ox + (x - frame.x0) * frame.sx : x * K; }
  function PY(y){ return frame ? frame.oy - (y - frame.y0) * frame.sy : -y * K; }

  /* 刻度步长自动挑：让刻度落在 1 / 2 / 2.5 / 5 × 10ⁿ 这类"好看"的数上 */
  function niceStep(range, target){
    var raw = range / (target || 9);
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var n = raw / mag;
    var s = (n <= 1) ? 1 : (n <= 2) ? 2 : (n <= 2.5) ? 2.5 : (n <= 5) ? 5 : 10;
    return s * mag;
  }
  function fmtNum(v){
    var r = Math.round(v * 100) / 100;
    return (r === 0) ? '0' : String(r);
  }

  /* ═══════════════════════════════════════════════════════════════════
     ② 基础画笔 —— 所有题型共用
     ═══════════════════════════════════════════════════════════════════ */
  var g = {
    /* 顶点：画一个小圆，返回一个带数学坐标的点，后面的画笔都能复用 */
    point: function(name, x, y){
      reg(name, mk('circle', { cx:fx(PX(x)), cy:fx(PY(y)), r:4, fill:COLORS.ink }), 'ink');
      return { x:x, y:y };
    },
    seg: function(name, P, Q, o){
      o = o || {};
      var col = o.color || 'ink';
      return reg(name, mk('line', {
        x1:fx(PX(P.x)), y1:fx(PY(P.y)), x2:fx(PX(Q.x)), y2:fx(PY(Q.y)),
        stroke:COLORS[col], 'stroke-width':o.width || 2.6, 'stroke-linecap':'round',
        'stroke-dasharray': o.dashed ? '7 6' : null
      }), col);
    },
    poly: function(name, pts, o){
      o = o || {};
      var col = o.color || 'ink';
      var d = pts.map(function(p){ return fx(PX(p.x)) + ',' + fx(PY(p.y)); }).join(' ');
      return reg(name, mk('polygon', {
        points:d, fill: o.fill ? FILLS[col] : 'none',
        stroke: (o.stroke === false) ? 'none' : COLORS[col],
        'stroke-width': o.width || 2.2
      }), col);
    },
    /* 以 PQ 为边的正方形，画在"远离 away 点"的那一侧 —— 不用自己判断方向 */
    square: function(name, P, Q, away, o){
      o = o || {};
      var dx = Q.x - P.x, dy = Q.y - P.y;
      var cross = dx * (away.y - P.y) - dy * (away.x - P.x);
      var s = (cross > 0) ? -1 : 1;
      var nx = -dy * s, ny = dx * s;
      var R = { x:Q.x + nx, y:Q.y + ny };
      var S = { x:P.x + nx, y:P.y + ny };
      g.poly(name, [P, Q, R, S], o);
      if (o.text !== undefined && o.text !== null){
        g.label(name + '-t', String(o.text),
                { x:(P.x+Q.x+R.x+S.x)/4, y:(P.y+Q.y+R.y+S.y)/4 }, 'center',
                { color:o.color, size:20 });
      }
      return els[name];
    },
    /* 直角标记：V 是直角顶点 */
    rightAngle: function(name, V, P, R){
      var u1 = unit(P.x - V.x, P.y - V.y), u2 = unit(R.x - V.x, R.y - V.y);
      var r = 16;
      var pts = [
        [PX(V.x) + u1.x * r,       PY(V.y) - u1.y * r],
        [PX(V.x) + (u1.x+u2.x) * r, PY(V.y) - (u1.y+u2.y) * r],
        [PX(V.x) + u2.x * r,       PY(V.y) - u2.y * r]
      ].map(function(p){ return fx(p[0]) + ',' + fx(p[1]); }).join(' ');
      return reg(name, mk('polyline', {
        points:pts, fill:'none', stroke:COLORS.ink, 'stroke-width':1.4, opacity:.55
      }), 'ink');
    },
    /* 文字。at 传数学坐标（可以传 g.mid(P,Q)），dir 决定往哪边让开。
       plate:true → 给文字加一圈纸色描边，压在曲线/虚线上也看得清。
       （用 paint-order 描边，不额外加元素，不会打乱图层次序） */
    label: function(name, text, at, dir, o){
      o = o || {};
      var D = { below:[0, 28,'middle'], above:[0, -14,'middle'],
                left:[-14, 6,'end'],   right:[14, 6,'start'],
                center:[0, 7,'middle'] }[dir] || [0, 7, 'middle'];
      var node = mk('text', {
        x:fx(PX(at.x) + D[0]), y:fx(PY(at.y) + D[1]),
        'text-anchor':D[2], fill:COLORS[o.color || 'ink'],
        'font-size':o.size || 18, 'font-family':SERIF
      });
      if (o.plate){
        node.setAttribute('stroke', '#fffdf8');
        node.setAttribute('stroke-width', '4');
        node.setAttribute('stroke-linejoin', 'round');
        node.setAttribute('paint-order', 'stroke');
      }
      node.textContent = text;
      return reg(name, node, o.color || 'ink');
    },
    mid: function(P, Q){ return { x:(P.x + Q.x) / 2, y:(P.y + Q.y) / 2 }; },

    /* ═════════════════════════════════════════════════════════════════
       ③ 函数包画笔 —— 只有函数题用（统计题可以直接复用 axes）
       ═════════════════════════════════════════════════════════════════ */

    /* 坐标轴：轴线 + 箭头 + 刻度 + 刻度数 + 轴名，全部自动，AI 不用管 */
    axes: function(name, o){
      o = o || {};
      var f = frame;
      if (!f) throw new Error('g.axes() 需要先在 SCENE 里声明 frame');
      var gn = mk('g', {});
      reg(name, gn, 'ink');
      function add(tag, attrs, text){
        var e = mk(tag, attrs);
        if (text !== undefined) e.textContent = text;
        gn.appendChild(e);
        return e;
      }
      var xs = o.xStep || niceStep(f.x1 - f.x0, 9);
      var ys = o.yStep || niceStep(f.y1 - f.y0, 8);
      var axY = (f.y0 <= 0 && 0 <= f.y1) ? 0 : f.y0;   // x 轴画在 y=0；不含 0 就贴底
      var axX = (f.x0 <= 0 && 0 <= f.x1) ? 0 : f.x0;   // y 轴画在 x=0；不含 0 就贴左
      var AX = PX(axX), AY = PY(axY), v;

      add('line', { x1:fx(PX(f.x0)), y1:fx(AY), x2:fx(PX(f.x1)), y2:fx(AY),
                    stroke:COLORS.ink, 'stroke-width':1.6 });
      add('line', { x1:fx(AX), y1:fx(PY(f.y0)), x2:fx(AX), y2:fx(PY(f.y1)),
                    stroke:COLORS.ink, 'stroke-width':1.6 });
      add('polygon', { points:[ fx(PX(f.x1)+11)+','+fx(AY), fx(PX(f.x1))+','+fx(AY-5),
                                fx(PX(f.x1))+','+fx(AY+5) ].join(' '), fill:COLORS.ink });
      add('polygon', { points:[ fx(AX)+','+fx(PY(f.y1)-11), fx(AX-5)+','+fx(PY(f.y1)),
                                fx(AX+5)+','+fx(PY(f.y1)) ].join(' '), fill:COLORS.ink });

      for (v = Math.ceil(f.x0 / xs) * xs; v <= f.x1 + 1e-9; v += xs){
        var cx = PX(v);
        add('line', { x1:fx(cx), y1:fx(AY), x2:fx(cx), y2:fx(AY + 5),
                      stroke:COLORS.ink, 'stroke-width':1.2 });
        add('text', { x:fx(cx), y:fx(AY + 19), 'text-anchor':'middle',
                      'font-size':17, fill:TICKCLR, 'font-family':SERIF }, fmtNum(v));
      }
      for (v = Math.ceil(f.y0 / ys) * ys; v <= f.y1 + 1e-9; v += ys){
        var cy = PY(v);
        add('line', { x1:fx(AX), y1:fx(cy), x2:fx(AX - 5), y2:fx(cy),
                      stroke:COLORS.ink, 'stroke-width':1.2 });
        if (Math.abs(v) > 1e-9){    // 原点只由 x 轴标一次
          add('text', { x:fx(AX - 9), y:fx(cy + 4), 'text-anchor':'end',
                        'font-size':17, fill:TICKCLR, 'font-family':SERIF }, fmtNum(v));
        }
      }
      add('text', { x:fx(PX(f.x1) + 8), y:fx(AY - 10), 'text-anchor':'start',
                    'font-size':18, fill:'#5b5247', 'font-family':SERIF }, o.xLabel || 'x');
      add('text', { x:fx(AX + 9), y:fx(PY(f.y1) - 6), 'text-anchor':'start',
                    'font-size':18, fill:'#5b5247', 'font-family':SERIF }, o.yLabel || 'y');
      return gn;
    },

    /* 函数图象。fn 就是题目里的那个式子，剩下全交给引擎：
       · 自适应加密 —— 折线中点偏离真实曲线超过 tol 像素就再细分（最多 4 轮）
       · 自动断开   —— 遇到无定义点（如 y = 6/x 在 x = 0）断成两支，绝不连出一条竖线
       · 自动截断   —— 跑出坐标框的部分在框边定点截齐，曲线正好画到框边
       返回：画了几段（反比例函数返回 2，抛物线被框住可能是 1）。 */
    curve: function(name, fn, o){
      o = o || {};
      var f = frame;
      if (!f) throw new Error('g.curve() 需要先在 SCENE 里声明 frame');
      var from = (o.from !== undefined) ? o.from : f.x0;
      var to   = (o.to   !== undefined) ? o.to   : f.x1;
      var n    = o.samples || 200;
      var tol  = (o.tol !== undefined) ? o.tol : 1.2;
      var col  = o.color || 'blue';
      var i, x, m;

      var val = function(x){
        var y = fn(x);
        return (typeof y === 'number' && isFinite(y)) ? y : null;
      };
      var inBox = function(y){ return y !== null && y >= f.y0 - 1e-9 && y <= f.y1 + 1e-9; };

      /* 1. 等距粗采样 */
      var list = [];
      for (i = 0; i <= n; i++){
        x = from + (to - from) * i / n;
        list.push({ x:x, y:val(x) });
      }

      /* 2. 自适应加密：折线在像素上偏离真曲线太多的地方补点 */
      for (var round = 0; round < 4; round++){
        var out = [list[0]], added = false;
        for (i = 1; i < list.length; i++){
          var a = list[i - 1], b = list[i];
          if (a.y !== null && b.y !== null){
            var mx = (a.x + b.x) / 2, ty = val(mx);
            if (ty !== null && Math.abs(PY(ty) - PY((a.y + b.y) / 2)) > tol){
              out.push({ x:mx, y:ty }); added = true;
            }
          }
          out.push(b);
        }
        list = out;
        if (!added) break;
      }

      /* 3. 在框边二分求"曲线正好碰到框"的那一点 */
      var edge = function(xa, xb, ya, bound){
        if (bound === null) return null;
        var lo = xa, hi = xb, ym;
        for (var k = 0; k < 32; k++){
          m = (lo + hi) / 2;
          ym = val(m);
          if (ym === null) return null;
          if ((ym - bound) * (ya - bound) > 0) lo = m; else hi = m;
        }
        m = (lo + hi) / 2; ym = val(m);
        return inBox(ym) ? { x:m, y:ym } : null;
      };

      /* 4. 沿途切段：无定义 / 出框都断开，跨越框边时补上边界点 */
      var segs = [], cur = [], prev = null;
      var addPt = function(p){ cur.push(fx(PX(p.x)) + ',' + fx(PY(p.y))); };
      var flush = function(){ if (cur.length > 1) segs.push(cur); cur = []; };

      for (i = 0; i < list.length; i++){
        var p = list[i], pin = inBox(p.y);
        if (!pin){
          if (prev){
            var eb = edge(prev.x, p.x, prev.y, (p.y === null) ? null : (p.y > f.y1 ? f.y1 : f.y0));
            if (eb) addPt(eb);
            flush(); prev = null;
          } else if (cur.length){ flush(); }
          continue;
        }
        if (!prev && i > 0){
          var q0 = list[i - 1];
          if (q0.y !== null){
            var eb2 = edge(q0.x, p.x, q0.y, (q0.y > f.y1 ? f.y1 : f.y0));
            if (eb2) addPt(eb2);
          }
        }
        addPt(p); prev = p;
      }
      flush();

      /* 多段合成一个 <g>，这样步骤里 show/hi 只写一个名字就能一次点亮全部 */
      var gn = reg(name, mk('g', {}), col);
      for (i = 0; i < segs.length; i++){
        gn.appendChild(mk('polyline', {
          points: segs[i].join(' '), fill:'none', stroke:COLORS[col],
          'stroke-width': o.width || 2.8, 'stroke-linejoin':'round', 'stroke-linecap':'round'
        }));
      }
      return segs.length;
    },

    /* 图上标一个点（可带文字） */
    markPoint: function(name, x, y, o){
      o = o || {};
      var col = o.color || 'red';
      var c = reg(name, mk('circle', {
        cx:fx(PX(x)), cy:fx(PY(y)), r:o.r || 5.5,
        fill:COLORS[col], stroke:'#fffdf8', 'stroke-width':2
      }), col);
      if (o.label){
        g.label(name + '-lb', o.label, { x:x, y:y }, o.dir || 'above',
                { color:col, size:18, plate:true });
      }
      return c;
    },

    /* 竖/横辅助虚线：from、to 是另一方向的取值范围 */
    vline: function(name, x, o){
      o = o || {};
      var f = frame, col = o.color || 'gold';
      var a = (o.from !== undefined) ? o.from : f.y0;
      var b = (o.to   !== undefined) ? o.to   : f.y1;
      return reg(name, mk('line', {
        x1:fx(PX(x)), y1:fx(PY(a)), x2:fx(PX(x)), y2:fx(PY(b)),
        stroke:COLORS[col], 'stroke-width':1.6, 'stroke-dasharray':'6 5'
      }), col);
    },
    hline: function(name, y, o){
      o = o || {};
      var f = frame, col = o.color || 'gold';
      var a = (o.from !== undefined) ? o.from : f.x0;
      var b = (o.to   !== undefined) ? o.to   : f.x1;
      return reg(name, mk('line', {
        x1:fx(PX(a)), y1:fx(PY(y)), x2:fx(PX(b)), y2:fx(PY(y)),
        stroke:COLORS[col], 'stroke-width':1.6, 'stroke-dasharray':'6 5'
      }), col);
    },

    /* ═════════════════════════════════════════════════════════════════
       ④ 曲线家族 —— 函数题的另一半（讲面积、交点、增减、切线用）
       ═════════════════════════════════════════════════════════════════ */

    /* 曲线与一条水平线之间的填色。base 默认 0（贴着 x 轴填）。
       讲"曲边梯形面积""y > 0 的那一段"用它。 */
    region: function(name, fn, o){
      o = o || {};
      var f = frame;
      if (!f) throw new Error('g.region() 需要先在 SCENE 里声明 frame');
      var from = o.from, to = o.to, n = o.samples || 160;
      var base = (o.base !== undefined) ? o.base : 0, col = o.color || 'blue';
      var pts = [], i, x, y;
      for (i = 0; i <= n; i++){
        x = from + (to - from) * i / n; y = fn(x);
        if (typeof y !== 'number' || !isFinite(y)) continue;
        if (y < f.y0 || y > f.y1) continue;                 // 出框的点不要，免得填色溢出去
        pts.push({ x:x, y:y });
      }
      if (pts.length < 2) return null;
      var d = pts.map(function(p){ return fx(PX(p.x)) + ',' + fx(PY(p.y)); });
      var last = pts[pts.length - 1], first = pts[0];
      d.push(fx(PX(last.x)) + ',' + fx(PY(base)));
      d.push(fx(PX(first.x)) + ',' + fx(PY(base)));
      return reg(name, mk('polygon', { points:d.join(' '), fill:FILLS[col], stroke:'none' }), col);
    },

    /* 两条图象的交点：扫描找符号变化 + 二分精化。
       返回 [{x,y},…]（数学坐标），默认顺便把交点标在图上 —— 方程的解就在这儿。 */
    intersect: function(name, f1, f2, o){
      o = o || {};
      var f = frame;
      if (!f) throw new Error('g.intersect() 需要先在 SCENE 里声明 frame');
      var from = (o.from !== undefined) ? o.from : f.x0;
      var to   = (o.to   !== undefined) ? o.to   : f.x1;
      var n = o.samples || 400, d = function(x){ return f1(x) - f2(x); };
      var hits = [], px = from, pd = d(from), i, k;
      for (i = 1; i <= n; i++){
        var x = from + (to - from) * i / n, cd = d(x);
        if (isFinite(pd) && isFinite(cd) && pd * cd <= 0){
          var lo = px, hi = x, m, dm;
          for (k = 0; k < 60; k++){
            m = (lo + hi) / 2; dm = d(m);
            if (cd * dm <= 0) lo = m; else hi = m;
          }
          m = (lo + hi) / 2;
          var my = f1(m);
          if (isFinite(my)) hits.push({ x:m, y:my });
        }
        px = x; pd = cd;
      }
      /* 所有交点打包成一个 <g>：步骤里 show/hi 只写 name 一个名字就够了 */
      if (o.mark !== false && hits.length){
        var col = o.color || 'red';
        var gn = reg(name, mk('g', {}), col);
        for (i = 0; i < hits.length; i++){
          var hx = PX(hits[i].x), hy = PY(hits[i].y);
          gn.appendChild(mk('circle', { cx:fx(hx), cy:fx(hy), r:5,
            fill:COLORS[col], stroke:'#fffdf8', 'stroke-width':2 }));
          var label = '(' + fx(hits[i].x) + ', ' + fx(hits[i].y) + ')';
          var tw = label.length * 8.6;
          var tx = hx + 12, anchor = 'start';
          if (tx + tw > BASE_W - 10){ tx = hx - 12; anchor = 'end'; }   // 快出画布就翻到左边
          var ty = hy + ((o.dir === 'below') ? 22 : -12);
          var t = mk('text', { x:fx(tx), y:fx(ty), 'text-anchor':anchor, fill:COLORS[col],
            'font-size':18, 'font-family':SERIF, stroke:'#fffdf8', 'stroke-width':4,
            'stroke-linejoin':'round', 'paint-order':'stroke' });
          t.textContent = label;
          gn.appendChild(t);
        }
      }
      return hits;
    },

    /* 切线：中心差分求斜率，画完自动裁到坐标框里（不会把取景撑爆） */
    tangent: function(name, fn, x0, o){
      o = o || {};
      var f = frame, h = 1e-4;
      var k = (fn(x0 + h) - fn(x0 - h)) / (2 * h), y0 = fn(x0);
      if (!isFinite(k) || !isFinite(y0)) return null;
      var L = (o.len !== undefined) ? o.len : (f.x1 - f.x0);
      var seg = clipSeg({ x:x0 - L, y:y0 - k * L }, { x:x0 + L, y:y0 + k * L });
      if (!seg) return null;
      var col = o.color || 'gold';
      return reg(name, mk('line', {
        x1:fx(PX(seg.P.x)), y1:fx(PY(seg.P.y)), x2:fx(PX(seg.Q.x)), y2:fx(PY(seg.Q.y)),
        stroke:COLORS[col], 'stroke-width':1.8, 'stroke-dasharray': o.dashed ? '7 6' : null
      }), col);
    },

    /* 增减性箭头：在 x0 处顺着曲线走势放一个小箭头（上坡 / 下坡）。
       它不写"上升"两个字，学生自己看得出来 —— 这就是课标要的"图象直观"。 */
    trend: function(name, fn, x0, o){
      o = o || {};
      var f = frame, h = 1e-4;
      var k = (fn(x0 + h) - fn(x0 - h)) / (2 * h), y0 = fn(x0);
      if (!isFinite(k) || !isFinite(y0)) return null;
      var ux = f.sx, uy = -k * f.sy;                       // 在像素空间里顺着曲线
      var L2 = Math.sqrt(ux * ux + uy * uy) || 1; ux /= L2; uy /= L2;
      var L = o.len || 48, col = o.color || 'gold';
      var cx = PX(x0), cy = PY(y0);
      var hx = cx + ux * L, hy = cy + uy * L, tx = cx - ux * L, ty = cy - uy * L;
      var a = Math.atan2(hy - ty, hx - tx), w = 9;
      var gn = reg(name, mk('g', {}), col);
      gn.appendChild(mk('line', { x1:fx(tx), y1:fx(ty), x2:fx(hx), y2:fx(hy),
        stroke:COLORS[col], 'stroke-width':2.4, 'stroke-linecap':'round' }));
      gn.appendChild(mk('polygon', {
        points: [[hx, hy],
                 [hx - w * Math.cos(a - 0.42), hy - w * Math.sin(a - 0.42)],
                 [hx - w * Math.cos(a + 0.42), hy - w * Math.sin(a + 0.42)]]
                .map(function(p){ return fx(p[0]) + ',' + fx(p[1]); }).join(' '),
        fill:COLORS[col]
      }));
      return gn;
    },

    /* 图例：两条曲线画在同一个坐标系里时用。位置、底色、色条长度都是自动的 */
    legend: function(name, items, o){
      o = o || {};
      var f = frame, gn = reg(name, mk('g', {}), 'ink'), i;
      var pad = 9, lh = 24, wMax = 0;
      for (i = 0; i < items.length; i++){
        var w = 34 + String(items[i].text).length * 9.5;
        if (w > wMax) wMax = w;
      }
      var rx = PX(f.x1) - 14, ry = PY(f.y1) + (o.dy || 10);
      gn.appendChild(mk('rect', { x:fx(rx - wMax - pad), y:fx(ry),
        width:fx(wMax + pad * 2), height:fx(items.length * lh + pad * 2), rx:6,
        fill:'#fffdf8', stroke:'#e2dbcc', 'stroke-width':1 }));
      for (i = 0; i < items.length; i++){
        var ly = ry + pad + lh * i + lh / 2;
        gn.appendChild(mk('line', { x1:fx(rx - wMax - pad + 6), y1:fx(ly),
          x2:fx(rx - wMax + 20), y2:fx(ly),
          stroke:COLORS[items[i].color || 'ink'], 'stroke-width':3, 'stroke-linecap':'round' }));
        var t = mk('text', { x:fx(rx - wMax + 28), y:fx(ly + 5),
          'font-size':18, fill:COLORS.ink, 'font-family':SERIF });
        t.textContent = items[i].text;
        gn.appendChild(t);
      }
      return gn;
    }
  };

  /* ═══════════════════════════════════════════════════════════════════
     SCENE —— AI 要写的全部内容（就这一块）

  /* ---------- 2. 安全闸：只放行「纯算术 + 已定义的量 + Math 白名单」 ---------- */
  var SAFE_CHARS = /^[0-9A-Za-z_$+\-*/%().,<>=!?:&| \t]*$/;
  var BANNED = /\b(window|document|globalThis|self|top|parent|eval|Function|new|this|constructor|__proto__|prototype|import|require|fetch|XMLHttpRequest|WebSocket|Worker|localStorage|sessionStorage|indexedDB|cookie|location|navigator|alert|console|setTimeout|setInterval|debugger)\b/;
  var MATH_CALL = /Math\.(abs|cbrt|ceil|cos|exp|floor|hypot|log|log10|log2|max|min|pow|round|sign|sin|sqrt|tan|PI|E)\b/g;
  var IDENT = /[A-Za-z_$][\w$]*/g;

  function guard(src, allowed, where){
    if (typeof src !== 'string') throw new Error(where + ' 必须是字符串');
    if (!src.trim())             throw new Error(where + ' 是空的');
    if (src.length > 200)        throw new Error(where + ' 太长（' + src.length + ' 字符，上限 200）');
    if (!SAFE_CHARS.test(src))   throw new Error(where + ' 含有不允许的字符 → ' + src);
    var b = src.match(BANNED);
    if (b) throw new Error(where + ' 含有禁用词「' + b[0] + '」→ ' + src);
    var rest = src.replace(MATH_CALL, ' ');
    (rest.match(IDENT) || []).forEach(function(id){
      if (id === 'Math') return;
      if (allowed.indexOf(id) < 0) throw new Error(where + ' 用了没定义的量「' + id + '」→ ' + src);
    });
    return src;
  }

  /* ---------- 3. 数字怎么显示 ---------- */
  var FORMATTERS = {
    trim2:  function(v){ return (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 100) / 100); },
    trim3:  function(v){ return (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 1000) / 1000); },
    trim4:  function(v){ return (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 10000) / 10000); },
    fixed1: function(v){ return v.toFixed(1); },
    fixed2: function(v){ return v.toFixed(2); },
    int:    function(v){ return String(Math.round(v)); },
    pct:    function(v){ return (Math.round(v * 1000) / 10) + '%'; }
  };
  function show(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'number'){
      if (!isFinite(v)) return String(v);
      return (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 100) / 100);
    }
    return String(v);
  }

  /* ---------- 4. 把 expr 列表编成一个函数 ---------- */
  function buildMath(FILL, TEMPLATE){
    var params = FILL.params || [];
    var list   = FILL.expr || [];
    var allowed = ['Math'], paramDecl = [], lines = [], keys = [];

    params.forEach(function(c, i){
      if (!/^[A-Za-z_$][\w$]*$/.test(String(c.id || '')))
        throw new Error('params[' + i + '].id 不是合法变量名 → ' + c.id);
      if (typeof c.min !== 'number' || typeof c.max !== 'number')
        throw new Error('params[' + i + '] 的 min / max 必须是数字');
      if (!(c.min < c.max))
        throw new Error('params[' + i + '] 的 min 必须小于 max');
      if (typeof c.value !== 'number' || c.value < c.min || c.value > c.max)
        throw new Error('params[' + i + '] 的 value 要在 min ~ max 之间');
      if (allowed.indexOf(c.id) >= 0) throw new Error('参数名重复：' + c.id);
      allowed.push(c.id);
      keys.push(c.id);
      paramDecl.push('var ' + c.id + ' = p[' + JSON.stringify(c.id) + '];');
    });

    list.forEach(function(it, i){
      var where = 'expr[' + i + ']';
      if (!/^[A-Za-z_$][\w$]*$/.test(String(it.n || '')))
        throw new Error(where + '.n 不是合法变量名 → ' + it.n);
      if (allowed.indexOf(it.n) >= 0) throw new Error(where + ' 变量名重复 → ' + it.n);
      guard(it.e, allowed, where + '(' + it.n + ')');
      if (it.fmt !== undefined && !FORMATTERS[it.fmt])
        throw new Error(where + '(' + it.n + ') 的 fmt 不认识 → ' + it.fmt);
      var rhs = it.fmt ? ('__FMT[' + JSON.stringify(it.fmt) + '](' + it.e + ')') : ('(' + it.e + ')');
      lines.push('var ' + it.n + ' = ' + rhs + ';');
      allowed.push(it.n);
      keys.push(it.n);
    });

    TEMPLATE.needs.forEach(function(n){
      if (allowed.indexOf(n) < 0)
        throw new Error('模板需要的量「' + n + '」没有算出来，请在 expr 里补一条');
    });
    TEMPLATE.params.forEach(function(n){
      if (keys.indexOf(n) < 0)
        throw new Error('模板要求有一个叫「' + n + '」的可拖参数，请写在 params 里');
    });

    var body = paramDecl.join('\n') + '\n' + lines.join('\n') + '\nreturn {' +
               keys.map(function(k){ return JSON.stringify(k) + ':' + k; }).join(',') + '};';
    var fn = new Function('p', '__FMT', body);
    var out = function(p){ return fn(p, FORMATTERS); };
    out.__keys = keys;
    return out;
  }

  /* ---------- 5. 文案里的 {{ }} 占位 ---------- */
  function buildText(tpl, keys, where){
    if (tpl === null || tpl === undefined) return function(){ return ''; };
    if (typeof tpl !== 'string') throw new Error(where + ' 必须是字符串');
    var parts = [], re = /\{\{([\s\S]*?)\}\}/g, last = 0, m, n = 0;
    while ((m = re.exec(tpl))){
      if (m.index > last) parts.push({ lit: tpl.slice(last, m.index) });
      var src = m[1].trim();
      guard(src, keys, where + ' 里的 {{' + src + '}}');
      parts.push({ fn: new Function(keys.join(','), 'return (' + src + ');') });
      last = re.lastIndex; n++;
    }
    if (last < tpl.length) parts.push({ lit: tpl.slice(last) });
    return function(M){
      var args = keys.map(function(k){ return M[k]; });
      var s = '';
      for (var i = 0; i < parts.length; i++){
        s += (parts[i].lit !== undefined) ? parts[i].lit : show(parts[i].fn.apply(null, args));
      }
      return s;
    };
  }

  /* ---------- 6. 组装场景 ---------- */
  function buildScene(FILL, CFG, DRAW){
    /* 先把坐标框装上：函数类画笔（axes / curve）要靠它才知道往哪画。
       这一步不做，探测时会以"没声明 frame"报错。 */
    if (FILL.frame){ frame = buildFrame(FILL.frame); }
    else { K = FILL.scale || 40; }

    var meta   = FILL.meta || {};
    var params = FILL.params || [];
    var steps  = FILL.steps || [];
    var math   = buildMath(FILL, TEMPLATE);
    var keys   = math.__keys;

    if (!steps.length) throw new Error('steps 是空的，至少要写一步');

    var known = {};
    TEMPLATE.slots.forEach(function(id){ known[id] = 1; });

    /* 实时数据条：一句带 {{量}} 的话，拖滑块时重算（没有就整条不显示） */
    var readout = FILL.readout ? buildText(FILL.readout, keys, 'readout') : null;
    var built = steps.map(function(s, i){
      var where = 'steps[' + i + ']';
      var show = s.show || [], hi = s.hi || [];
      if (!Array.isArray(show) || !Array.isArray(hi)) throw new Error(where + ' 的 show / hi 必须是数组');
      show.concat(hi).forEach(function(id){
        if (!known[id]) throw new Error(where + ' 引用了模板里不存在的元素「' + id + '」；可用的是：' + TEMPLATE.slots.join(', '));
      });
      return {
        title:  buildText(s.t || ('第 ' + (i + 1) + ' 步'), keys, where + '.t'),
        plain:  buildText(s.p, keys, where + '.p'),
        detail: buildText(s.d || s.p, keys, where + '.d'),
        tip:    buildText(s.tip, keys, where + '.tip'),
        show:   show,
        hi:     hi
      };
    });

    var shown = {};
    built.forEach(function(s){ (s.show || []).forEach(function(id){ shown[id] = 1; }); });
    TEMPLATE.mustShow.forEach(function(id){
      if (!shown[id]) throw new Error('元素「' + id + '」是答案，必须出现在某一步的 show 里（否则一开始就被看见）');
    });

    /* 题目条 */
    if (meta.question){
      var bar = document.createElement('div');
      bar.className = 'q-bar';
      var tag = document.createElement('i'); tag.className = 'q-tag';
      tag.textContent = meta.tag || '题目';
      var txt = document.createElement('div'); txt.className = 'q-txt';
      txt.innerHTML = meta.question;
      bar.appendChild(tag); bar.appendChild(txt);
      var col = document.querySelector('.stage-col');
      if (col) col.insertBefore(bar, col.firstChild);
    }
    if (meta.title) document.title = meta.title + ' · 教学动画';

    return {
      scale:  FILL.scale || 40,
      params: params,
      hint:   FILL.hint || '',
      readout: readout,
      math:   math,
      draw:   function(g, M, step){ return DRAW(g, M, step, CFG); },
      steps:  built,
      meta:   meta
    };
  }

  /* ---------- 7. 模板固定的画法（冻结） ---------- */
  var CFG = (function(FILL){
    try {
      var PAL = ['ink', 'blue', 'red', 'gold'];
      /* 标注文字白名单：字母数字汉字 + ℃ + 撇号、根号、度、常用标点 */
      var OK_LBL = /^[0-9A-Za-z\u4e00-\u9fff\u2032\u2033\u221a\u00b0\u2103 +\-*\/=().,∶（）%]+$/;
      function num(v, name, lo, hi){
        if (typeof v !== 'number' || !isFinite(v))
          throw new Error(name + ' 必须是数字 → ' + v);
        if (v < lo || v > hi)
          throw new Error(name + ' 超出范围 ' + lo + ' ~ ' + hi + ' → ' + v);
        return v;
      }
      function txt(v, name, max){
        if (typeof v !== 'string' || !v.trim())
          throw new Error(name + ' 必须是非空字符串');
        if (v.length > max)
          throw new Error(name + ' 太长（' + v.length + ' 字符，上限 ' + max + '）');
        if (!OK_LBL.test(v))
          throw new Error(name + ' 含有不允许的字符 → ' + v);
        return v;
      }

      var T = FILL.texts || {};
      function need(k, max){
        var v = T[k];
        if (typeof v !== 'string' || !v.trim())
          throw new Error('texts 里缺「' + k + '」');
        if (v.length > max)
          throw new Error('texts.' + k + ' 太长（' + v.length + ' 字符，上限 ' + max + '）');
        if (/[<>&"']/.test(v))
          throw new Error('texts.' + k + ' 含非法字符（标签 / 引号 / 实体）');
        return v;
      }
      var title = need('title', 30);
      var unit  = (T.unit === undefined) ? '' : txt(T.unit, 'texts.unit', 4);

      var mode = FILL.mode;
      if (['bar', 'line', 'pie'].indexOf(mode) < 0)
        throw new Error('mode 必须是 bar/line/pie → ' + mode);

      var cats = FILL.cats;
      if (!Array.isArray(cats) || cats.length < 2)
        throw new Error('cats 至少要有 2 个类别');
      if (cats.length > 8)
        throw new Error('cats 最多 8 个');
      cats.forEach(function(c, i){
        if (!c || typeof c.t !== 'string' || !c.t.trim())
          throw new Error('cats[' + i + '].t 必须是非空字符串');
        if (c.t.length > 6)
          throw new Error('cats[' + i + '].t 太长（上限 6 字符）');
        if (!OK_LBL.test(c.t))
          throw new Error('cats[' + i + '].t 含有不允许的字符 → ' + c.t);
      });
      var n = cats.length;

      var series = FILL.series;
      if (!Array.isArray(series) || !series.length)
        throw new Error('series 至少要有 1 组数据');
      if (series.length > 2)
        throw new Error('series 最多 2 组（画布只留了两支笔）');
      if (mode === 'pie' && series.length > 1)
        throw new Error('饼图只画一组占比，series 写 1 项');

      /* frame：条形/折线 = 类别轴 × 数量轴；饼图版面固定 */
      var fr = FILL.frame;
      if (!fr || !Array.isArray(fr.x) || !Array.isArray(fr.y))
        throw new Error('frame 必须写成 { x:[0, a], y:[b, c] }');
      var y0 = num(fr.y[0], 'frame.y[0]', -100000, 100000);
      var y1 = num(fr.y[1], 'frame.y[1]', -100000, 100000);
      if (!(y0 < y1)) throw new Error('frame.y 必须是 [小, 大]');
      var lo, hi;
      if (mode === 'pie'){
        if (fr.x[0] !== 0 || fr.x[1] !== 16 || y0 !== 0 || y1 !== 12)
          throw new Error('饼图 frame 固定写 { x:[0,16], y:[0,12] }');
        lo = 0; hi = 1e9;
      } else {
        if (fr.x[0] !== 0 || fr.x[1] !== n + 1)
          throw new Error('frame.x 要写成 [0, ' + (n + 1) + ']（类别数 + 1）');
        if (mode === 'bar'){
          if (y0 !== 0) throw new Error('条形图 frame.y 必须从 0 起');
          lo = 0; hi = y1 / 1.14;                 /* 条顶留数值标签的余量 */
        } else {
          var pad = (y1 - y0) * 0.08;
          lo = y0 + pad * 0.25; hi = y1 - pad;    /* 点不贴框边，标签才放得下 */
        }
      }

      series.forEach(function(s, i){
        if (!s || !Array.isArray(s.v) || s.v.length !== n)
          throw new Error('series[' + i + '].v 长度必须和 cats 一样（' + n + ' 项）');
        s.v.forEach(function(v, j){ num(v, 'series[' + i + '].v[' + j + ']', lo, hi); });
        if (s.color !== undefined && PAL.indexOf(s.color) < 0)
          throw new Error('series[' + i + '].color 必须是 ink/blue/red/gold → ' + s.color);
      });

      return {
        title: title, unit: unit, mode: mode, n: n,
        cats: cats.map(function(c){ return c.t; }),
        series: series.map(function(s, i){
          return { v: s.v, color: s.color || (i === 0 ? 'blue' : 'red') };
        })
      };
    } catch (e){
      fatal(e.message);
      throw e;
    }
  })(FILL);
  var DRAW = function(g, M, step, CFG){
    var i, n = CFG.n;
    var two = CFG.series.length > 1;

    if (CFG.mode === 'pie'){
      /* 扇形图：整个圆 = 总量，每块扇形 = 一个类别的占比。
         不画坐标轴；半径按 frame 纵横像素比修正，保证画出来是正圆。 */
      var total = (typeof M.total === 'number' && M.total > 0) ? M.total : 1;
      var cx = 8, cy = 5.9, ry = 4.4;   /* 圆心下移、半径收窄，顶弧不压标题（标题在 y=11.3） */
      var rx = ry * frame.sy / frame.sx;
      var SLICE = ['blue', 'red', 'gold', 'ink'];
      g.label('ttl', CFG.title, { x: cx, y: 11.3 }, 'center', { size: 19, color: 'ink' });
      var a0 = Math.PI / 2;
      CFG.series[0].v.forEach(function(v, ci){
        var col = SLICE[ci % SLICE.length];
        var sweep = v / total * Math.PI * 2;
        var pts = [{ x: cx, y: cy }];
        var k, st = Math.max(6, Math.round(v / total * 36));
        for (k = 0; k <= st; k++){
          var a = a0 - sweep * k / st;
          pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
        }
        g.poly('sl-' + ci, pts, { color: col, fill: true });
        var am = a0 - sweep / 2;
        var pct = Math.round(v / total * 1000) / 10;
        var dir = Math.cos(am) > 0.3 ? 'right' : Math.cos(am) < -0.3 ? 'left'
                : (Math.sin(am) > 0 ? 'above' : 'below');
        g.label('sl-' + ci + '-lb', CFG.cats[ci] + ' ' + pct + '%',
                { x: cx + (rx + 0.35) * Math.cos(am), y: cy + (ry + 0.3) * Math.sin(am) }, dir,
                { size: 18, color: col, plate: true });
        a0 -= sweep;
      });
      return;
    }

    /* 条形 / 折线：坐标系 + 标题 + 轴下类别名（frame 由填空声明，刻度引擎自动挑） */
    g.axes('ax', {});
    g.label('ttl', CFG.title, { x: (n + 1) / 2, y: frame.y1 * 1.045 }, 'center',
            { size: 19, color: 'ink' });
    CFG.cats.forEach(function(ct, ci){
      g.label('ct-' + ci, ct, { x: ci + 1, y: frame.y0 - 38 / frame.sy }, 'center',
              { size: 17, color: 'ink', plate: true });
    });

    if (CFG.mode === 'bar'){
      var bw = two ? 0.34 : 0.56;
      CFG.series.forEach(function(s, si){
        var off = two ? (si === 0 ? -0.19 : 0.19) : 0;
        s.v.forEach(function(v, ci){
          var bx = ci + 1 + off;
          g.poly('bar-' + si + '-' + ci, [
            { x: bx - bw / 2, y: 0 }, { x: bx + bw / 2, y: 0 },
            { x: bx + bw / 2, y: v }, { x: bx - bw / 2, y: v }
          ], { color: s.color, fill: true });
          g.label('bl-' + si + '-' + ci, v + CFG.unit, { x: bx, y: v }, 'above',
                  { size: 18, color: s.color, plate: true });
        });
      });
    } else {
      CFG.series.forEach(function(s, si){
        for (i = 0; i < n; i++){
          if (i > 0) g.seg('ln-' + si + '-' + (i - 1),
                  { x: i, y: s.v[i - 1] }, { x: i + 1, y: s.v[i] },
                  { color: s.color, width: 2.6 });
          g.markPoint('mp-' + si + '-' + i, i + 1, s.v[i],
                  { color: s.color, r: 5, label: s.v[i] + CFG.unit, dir: 'above' });
        }
      });
      /* 平均线：金虚线 + 读数，「在平均线上方/下方」一眼可辨（填空没算 avg 就不画） */
      if (typeof M.avg === 'number' && isFinite(M.avg)){
        var avgT = Math.round(M.avg * 100) / 100;
        g.hline('avg', M.avg, { color: 'gold' });
        g.label('avg-lb', '平均 ' + avgT + CFG.unit, { x: n + 1, y: M.avg }, 'left',
                { size: 18, color: 'gold', plate: true });
      }
    }
  };

  /* ---------- 8. 开工 ---------- */
  var SCENE = (function(){
    if (!FILL) return null;
    try { return buildScene(FILL, CFG, DRAW); }
    catch (e){ fatal(e.message); return null; }
  })();

  if (!SCENE){
    /* 撑一个空壳，让下面的外壳代码照常跑完，页面上留着红色提示 */
    SCENE = {
      scale: 40, params: [], hint: '', meta: {},
      readout: null,
      math: function(){ return {}; },
      draw: function(){},
      steps: [{ title: function(){ return '模板没能生成'; }, plain: function(){ return ''; },
                detail: function(){ return ''; }, tip: function(){ return ''; }, show: [], hi: [] }]
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     下面全是外壳，不用改
     ═══════════════════════════════════════════════════════════════════ */
  var state = { i:0, p:{}, mode:'detail' };
  var STEPS = SCENE.steps;

  function $(id){ return document.getElementById(id); }
  function setText(id, v){ var e = $(id); if (e) e.textContent = v; }

  function initParams(){ (SCENE.params || []).forEach(function(c){ state.p[c.id] = c.value; }); }
  function metrics(){ return SCENE.math(state.p); }

  /* 每个元素"从第几步开始出现"：第一次被 show 提到的那一步；没被提到的 = 从头就在 */
  function bornMap(){
    var m = {};
    STEPS.forEach(function(st, i){
      (st.show || []).forEach(function(id){ if (!(id in m)) m[id] = i; });
    });
    return m;
  }

  /* 分组元素内部若含焦点元素，则整组不压暗（否则父级 opacity 连带压暗焦点） */
  function holdsHi(node, isGroup, hi){
    if (!isGroup) return false;
    for (var k = 0; k < hi.length; k++){
      if (node.querySelector('[id="' + hi[k] + '"]')) return true;
    }
    return false;
  }

  function build(animate){
    while (fitEl.firstChild) fitEl.removeChild(fitEl.firstChild);
    els = {};
    SCENE.draw(g, metrics(), state.i);

    var born = bornMap();
    /* 高亮聚焦：本步 hi 是焦点（提亮 + 红色光晕），其余"已显示"元素压暗到 45%，
       让"翻步"在画面上看得见地移动焦点；hi 为空的步骤沿用上一次焦点，
       避免整屏忽明忽暗。 */
    var hiRaw = STEPS[state.i].hi || [];
    if (hiRaw.length) state.lastHi = hiRaw;
    var hi = hiRaw.length ? hiRaw : (state.lastHi || []);
    var focus = hi.length > 0;
    var fresh = [];
    for (var id in els){
      var node = els[id];
      if (!node) continue;
      var isGroup = (node.tagName.toLowerCase() === 'g');
      var b = (id in born) ? born[id] : 0;
      var visible = state.i >= b;
      var on = hi.indexOf(id) >= 0;
      var keep = '1';
      if (focus && visible && !on && !holdsHi(node, isGroup, hi)) keep = '0.45';
      node.__op = visible ? keep : '0';
      node.style.opacity = node.__op;
      if (visible && b === state.i && state.i > 0) fresh.push(node);
      if (on){
        /* 柔聚焦（2026-09-23）：大面积填充图形与整行文字不再涂朱砂——
           前者糊成一片红、后者像错字；只有细线 / 轮廓保留涂色聚焦（不加粗）。
           文字连光晕也不挂，靠"其余压暗 0.45"突出；光晕统一柔化。 */
        var fTag = node.tagName.toLowerCase();
        var fFill = fTag !== 'text' && fTag !== 'line' && node.getAttribute &&
          node.getAttribute('fill') && node.getAttribute('fill') !== 'none';
        if (!isGroup && fTag !== 'text' && !fFill){
          node.setAttribute('stroke', HILITE);   // 细线 / 轮廓：保留朱砂聚焦
        }
        if (fTag === 'text'){
          node.style.filter = 'none';
        } else {
          node.style.filter = 'drop-shadow(0 0 2.5px rgba(214,67,47,.45))';
        }
      }
    }
    if (animate && fresh.length){
      fresh.forEach(function(n){ n.style.transition = 'none'; n.style.opacity = '0'; });
      requestAnimationFrame(function(){
        fresh.forEach(function(n){
          n.style.transition = 'opacity .38s ease-out';
          n.style.opacity = n.__op || '1';
        });
      });
    }
    fitStage();
  }

  /* ---------- 自适应取景：内容少就把镜头凑近 ---------- */
  var PAD = { l:28, r:28, t:28, b:28 };
  var MAX_ZOOM = 1.9;
  var fitBusy = false;

  function fitStage(){
    /* 函数题（声明了 frame）镜头锁死：viewBox 固定为 frame 推导的取景框，
       拖动变量 / 切步都不会再重新取景，彻底消除抖动。 */
    if (frame && frame.view){
      svgEl.setAttribute('viewBox',
        [frame.view.x, frame.view.y, frame.view.w, frame.view.h]
          .map(function(n){ return Math.round(n * 10) / 10; }).join(' '));
      return;
    }
    var bb = null;
    try { bb = fitEl.getBBox(); } catch (e){ bb = null; }
    if (!bb || !bb.width || !bb.height){ return; }
    var x = bb.x - PAD.l, y = bb.y - PAD.t;
    var w = bb.width  + PAD.l + PAD.r;
    var h = bb.height + PAD.t + PAD.b;
    var zoom = Math.sqrt((BASE_W * BASE_H) / (w * h));
    if (zoom > MAX_ZOOM){
      var k = zoom / MAX_ZOOM, cx = x + w / 2, cy = y + h / 2;
      w *= k; h *= k; x = cx - w / 2; y = cy - h / 2;
    }
    svgEl.setAttribute('viewBox',
      [x, y, w, h].map(function(n){ return Math.round(n * 10) / 10; }).join(' '));
  }
  function fitSoon(){
    if (fitBusy) return;
    fitBusy = true;
    requestAnimationFrame(function(){ fitBusy = false; fitStage(); });
  }

  function drawTeacher(){
    var M = metrics(), st = STEPS[state.i];
    setText('chip', '第 ' + (state.i + 1) + ' / ' + STEPS.length + ' 步');
    setText('tTitle', st.title(M));
    $('tText').innerHTML = st[state.mode](M);
    setText('tTip', st.tip(M));
    var ro = $('tReadout');
    if (ro){
      if (SCENE.readout){ ro.innerHTML = SCENE.readout(M); ro.className = 'readout on'; }
      else { ro.className = 'readout'; ro.innerHTML = ''; }
    }
  }
  function drawControls(){
    $('prev').disabled = (state.i === 0);
    $('next').disabled = (state.i === STEPS.length - 1);
    var dots = $('dots');
    if (dots.children.length !== STEPS.length){
      dots.innerHTML = '';
      for (var k = 0; k < STEPS.length; k++){ dots.appendChild(document.createElement('span')); }
    }
    for (var j = 0; j < dots.children.length; j++){
      dots.children[j].className = (j <= state.i) ? 'on' : '';
    }
  }
  function render(animate){
    build(animate);
    drawTeacher();
    drawControls();
  }
  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if (n === state.i) return;
    state.i = n;
    render(true);
  }

  /* 滑块由场景里声明的 params 自动生成 */
  function buildKnobs(){
    var box = $('knobs');
    box.innerHTML = '';
    (SCENE.params || []).forEach(function(c){
      var lab = document.createElement('label');
      lab.className = 'knob';
      lab.appendChild(document.createTextNode(c.label));
      var inp = document.createElement('input');
      inp.type = 'range';
      inp.min = c.min; inp.max = c.max; inp.step = c.step || 1; inp.value = c.value;
      var b = document.createElement('b');
      b.textContent = c.value;
      inp.addEventListener('input', function(){
        state.p[c.id] = parseFloat(this.value);
        b.textContent = this.value;
        render(false);
      });
      lab.appendChild(inp);
      lab.appendChild(b);
      box.appendChild(lab);
    });
    if ((SCENE.params || []).length && SCENE.hint){
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = SCENE.hint;
      box.appendChild(hint);
    }
  }

  function boot(){
    svgEl = $('svg');
    fitEl = $('fit');
    if (SCENE.frame){ frame = buildFrame(SCENE.frame); }
    else { K = SCENE.scale || 40; }
    initParams();
    buildKnobs();

    $('prev').addEventListener('click', function(){ go(state.i - 1); });
    $('next').addEventListener('click', function(){ go(state.i + 1); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft')  go(state.i - 1);
      if (e.key === 'ArrowRight') go(state.i + 1);
    });

    $('ai').addEventListener('click', function(){
      try {
        var host = window.parent || window;
        if (host && typeof host.handleAiAssistClick === 'function'){ host.handleAiAssistClick(); return; }
      } catch (e){ /* 跨域时走兜底 */ }
      alert('AI助教请在完整详情页中使用');
    });

    if (document.fonts && document.fonts.ready){ document.fonts.ready.then(fitStage); }

    render(false);
    fitStage();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();
</script>
</body>
</html>
