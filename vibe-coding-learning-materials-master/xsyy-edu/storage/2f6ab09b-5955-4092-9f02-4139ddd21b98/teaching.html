<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小数乘法简算 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">小数乘法简算</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('利用积不变规律对小数乘加混合算式进行简便运算')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs>\n  <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">\n    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#444444" flood-opacity="0.15"/>\n  </filter>\n  <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">\n    <feGaussianBlur stdDeviation="5" result="blur"/>\n    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>\n  </filter>\n  <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">\n    <stop offset="0" stop-color="#fbf7ed"/>\n    <stop offset="0.5" stop-color="#f5efe0"/>\n    <stop offset="1" stop-color="#ebe0c8"/>\n  </linearGradient>\n  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">\n    <stop offset="0" stop-color="#d07070"/>\n    <stop offset="1" stop-color="#a03030"/>\n  </linearGradient>\n  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">\n    <path d="M0,0 L0,6 L9,3 z" fill="#b83b3b"/>\n  </marker>\n</defs>\n<style>\n  .svg-elem{transition:all .9s cubic-bezier(.22,1,.36,1)}\n  .ink{fill:#424242}\n  .ink-stroke{stroke:#424242;fill:none}\n  .vermilion{fill:#b83b3b}\n  .vermilion-stroke{stroke:#b83b3b;fill:none}\n  .formula{font-family:KaiTi,STKaiti,SimSun,serif;font-size:25px;color:#3d3d3d;line-height:1.6}\n  .note{font-family:KaiTi,STKaiti,SimSun,serif;font-size:15px;color:#666}\n  .dashed-line{stroke:#b83b3b;stroke-width:2.5;stroke-dasharray:8,6;fill:none;stroke-linecap:round}\n  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n  @keyframes pulseScale{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}\n  @keyframes dashMove{to{stroke-dashoffset:-44}}\n  .float{animation:floatY 4.5s ease-in-out infinite}\n  .pulse{animation:pulseScale 1.5s ease-in-out infinite}\n  .flow{animation:dashMove 1.4s linear infinite}\n</style>\n<g class="float svg-elem" x-show="sceneStep>=0">\n  <path d="M30,45 Q65,22 100,45 T170,45" class="ink-stroke" stroke-width="1.2" opacity=".2"/>\n  <path d="M630,45 Q665,22 700,45 T770,45" class="ink-stroke" stroke-width="1.2" opacity=".2"/>\n</g>\n<g x-show="sceneStep>=0" class="svg-elem">\n  <rect x="50" y="70" width="700" height="460" rx="10" fill="url(#paperGrad)" filter="url(#paperShadow)" opacity=".95"/>\n  <rect x="75" y="95" width="650" height="410" rx="4" fill="none" stroke="#d8ccaf" stroke-width="1" stroke-dasharray="5,5" opacity=".55"/>\n</g>\n<g x-show="sceneStep==0" class="svg-elem" x-transition:enter="transition ease-out duration-1000" x-transition:enter-start="opacity-0 transform -translate-y-6" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-700" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform -translate-y-5">\n  <foreignObject x="250" y="120" width="300" height="55">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;font-size:27px;font-weight:bold;color:#3a3a3a;">小数乘法简算</div>\n  </foreignObject>\n  <foreignObject x="110" y="230" width="580" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">0.47 × 1.2 + 8.6 × 0.12 − 1.33 × 0.2</div>\n  </foreignObject>\n  <g transform="translate(710,120)">\n    <circle cx="0" cy="0" r="18" fill="none" class="vermilion-stroke" stroke-width="1.5" opacity=".6"/>\n    <text x="0" y="5" text-anchor="middle" class="vermilion" font-size="16" font-family="KaiTi">算</text>\n  </g>\n</g>\n<g x-show="sceneStep>=1 &amp;&amp; sceneStep<=2" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform translate-y-5" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform translate-y-4">\n  <foreignObject x="180" y="125" width="440" height="50">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;color:#7a5a3a;">发现 1.2 和 0.12 长得很像，只差一位小数</div>\n  </foreignObject>\n  <circle cx="270" cy="255" r="30" class="vermilion-stroke pulse" stroke-width="2" fill="none" opacity=".7"/>\n  <text x="270" y="263" text-anchor="middle" class="vermilion" font-size="17" font-family="KaiTi">1.2</text>\n  <circle cx="530" cy="255" r="30" class="vermilion-stroke pulse" stroke-width="2" fill="none" opacity=".7"/>\n  <text x="530" y="263" text-anchor="middle" class="vermilion" font-size="17" font-family="KaiTi">0.12</text>\n  <path d="M300,255 Q400,200 500,255" class="dashed-line flow" opacity=".8"/>\n  <foreignObject x="320" y="185" width="160" height="40">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;color:#b83b3b;">10 倍关系</div>\n  </foreignObject>\n</g>\n<g x-show="sceneStep==2" class="svg-elem" x-transition:enter="transition ease-out duration-1000" x-transition:enter-start="opacity-0 transform scale-90" x-transition:enter-end="opacity-100 transform scale-100" x-transition:leave="transition ease-in duration-700" x-transition:leave-start="opacity-100 transform scale-100" x-transition:leave-end="opacity-0 transform scale-90">\n  <foreignObject x="100" y="340" width="600" height="90">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">0.47 × 1.2 = 0.47 × 10 × 0.12 = <span style="color:#b83b3b;font-weight:bold;">4.7 × 0.12</span></div>\n  </foreignObject>\n  <path d="M160,330 L160,310" class="vermilion-stroke" stroke-width="2" marker-end="url(#arrowRed)"/>\n  <text x="175" y="305" class="note vermilion" font-size="14">×10</text>\n  <path d="M360,330 L360,310" class="vermilion-stroke" stroke-width="2" marker-end="url(#arrowRed)"/>\n  <text x="375" y="305" class="note vermilion" font-size="14">÷10</text>\n</g>\n<g x-show="sceneStep>=3 &amp;&amp; sceneStep<=4" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform translate-x-4" x-transition:enter-end="opacity-100 transform translate-x-0" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform translate-x-0" x-transition:leave-end="opacity-0 transform -translate-x-4">\n  <foreignObject x="90" y="145" width="620" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;"><span style="color:#b83b3b;font-weight:bold;">4.7</span> × 0.12 + <span style="color:#b83b3b;font-weight:bold;">8.6</span> × 0.12</div>\n  </foreignObject>\n  <path d="M170,180 Q220,135 270,180" class="vermilion-stroke pulse" stroke-width="2" fill="none" opacity=".7"/>\n  <path d="M430,180 Q480,135 530,180" class="vermilion-stroke pulse" stroke-width="2" fill="none" opacity=".7"/>\n  <path d="M310,180 L310,230" class="dashed-line flow" opacity=".8"/>\n  <foreignObject x="250" y="235" width="300" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">= (4.7 + 8.6) × 0.12</div>\n  </foreignObject>\n  <foreignObject x="250" y="315" width="300" height="40">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;color:#7a5a3a;">相同因数 0.12 可以提取出来</div>\n  </foreignObject>\n</g>\n<g x-show="sceneStep>=4 &amp;&amp; sceneStep<=6" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform translate-y-5" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform translate-y-4">\n  <foreignObject x="150" y="385" width="500" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">13.3 × 0.12 = <span style="color:#b83b3b;font-weight:bold;">1.596</span></div>\n  </foreignObject>\n  <foreignObject x="220" y="450" width="360" height="40">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;">4.7 + 8.6 = 13.3，再乘 0.12</div>\n  </foreignObject>\n</g>\n<g x-show="sceneStep==5" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform scale-100" x-transition:leave-end="opacity-0 transform scale-95">\n  <foreignObject x="130" y="145" width="540" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">1.596 − 1.33 × 0.2</div>\n  </foreignObject>\n  <path d="M360,195 L360,245" class="dashed-line flow" opacity=".8"/>\n  <foreignObject x="220" y="250" width="360" height="40">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;color:#7a5a3a;">先算乘法，再算减法</div>\n  </foreignObject>\n</g>\n<g x-show="sceneStep==6" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform translate-x-6" x-transition:enter-end="opacity-100 transform translate-x-0" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform translate-x-0" x-transition:leave-end="opacity-0 transform translate-x-6">\n  <foreignObject x="180" y="325" width="440" height="70">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;">1.33 × 0.2 = <span style="color:#b83b3b;font-weight:bold;">0.266</span></div>\n  </foreignObject>\n  <foreignObject x="220" y="390" width="360" height="40">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="note" style="text-align:center;">小数点向左移动一位</div>\n  </foreignObject>\n</g>\n<g x-show="sceneStep>=7" class="svg-elem" x-transition:enter="transition ease-out duration-1000" x-transition:enter-start="opacity-0 transform scale-90" x-transition:enter-end="opacity-100 transform scale-100" x-transition:leave="transition ease-in duration-700" x-transition:leave-start="opacity-100 transform scale-100" x-transition:leave-end="opacity-0 transform scale-90">\n  <foreignObject x="140" y="150" width="520" height="80">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula" style="text-align:center;font-size:28px;">1.596 − 0.266 = <span style="color:#b83b3b;font-weight:bold;border-bottom:2px solid #b83b3b;">1.33</span></div>\n  </foreignObject>\n  <g transform="translate(690,155)">\n    <rect x="-25" y="-25" width="50" height="50" rx="4" fill="url(#accentGrad)" filter="url(#redGlow)" opacity=".9"/>\n    <text x="0" y="6" text-anchor="middle" fill="#fbf7ed" font-size="20" font-family="KaiTi">答</text>\n  </g>\n</g>\n<g x-show="sceneStep>=8" class="svg-elem" x-transition:enter="transition ease-out duration-900" x-transition:enter-start="opacity-0 transform translate-y-6" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-600" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform translate-y-6">\n  <foreignObject x="100" y="245" width="600" height="230">\n    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:KaiTi,STKaiti,SimSun,serif;font-size:17px;color:#3d3d3d;line-height:1.9;text-align:center;">\n      <div style="margin-bottom:10px;color:#7a5a3a;font-size:18px;">验算核对</div>\n      <div>0.47 × 1.2 = 0.564 ✓</div>\n      <div>8.6 × 0.12 = 1.032 ✓</div>\n      <div>0.564 + 1.032 = 1.596 ✓</div>\n      <div>1.33 × 0.2 = 0.266 ✓</div>\n      <div>1.596 − 0.266 = <span style="color:#b83b3b;font-weight:bold;">1.33</span> ✓</div>\n    </div>\n  </foreignObject>\n</g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "观察算式",
        "description": "先整体观察这道小数混合运算题，注意加号连接的两项都含有相近的小数因数。",
        "bubbleText": "先看全局，再局部找规律",
        "bubblePos": {
            "x": 400,
            "y": 100
        }
    },
    {
        "title": "寻找公因数",
        "description": "注意到 1.2 是 0.12 的 10 倍，两者只相差一位小数，具备统一成相同因数的条件。",
        "bubbleText": "1.2 和 0.12 是十倍关系",
        "bubblePos": {
            "x": 400,
            "y": 210
        }
    },
    {
        "title": "统一因数",
        "description": "把 0.47 × 1.2 中的 1.2 拆成 10 × 0.12，0.47 乘 10 得到 4.7，于是第一项化为 4.7 × 0.12。",
        "bubbleText": "一个因数 ÷10，另一个因数 ×10，积不变",
        "bubblePos": {
            "x": 400,
            "y": 360
        }
    },
    {
        "title": "提取公因数",
        "description": "现在两项都含有 0.12，逆用乘法分配律，把 0.12 提取出来，写成 (4.7 + 8.6) × 0.12。",
        "bubbleText": "相同因数 0.12 可以提取",
        "bubblePos": {
            "x": 400,
            "y": 240
        }
    },
    {
        "title": "计算乘积项",
        "description": "先算括号内 4.7 + 8.6 = 13.3，再算 13.3 × 0.12，得到 1.596。",
        "bubbleText": "13.3 × 0.12 = 1.596",
        "bubblePos": {
            "x": 400,
            "y": 420
        }
    },
    {
        "title": "处理减法",
        "description": "原式简化为 1.596 − 1.33 × 0.2，按照运算顺序，先算后面的乘法。",
        "bubbleText": "先乘后减，注意顺序",
        "bubblePos": {
            "x": 400,
            "y": 230
        }
    },
    {
        "title": "计算减数",
        "description": "计算 1.33 × 0.2，相当于 1.33 除以 10，结果为 0.266。",
        "bubbleText": "1.33 × 0.2 = 0.266",
        "bubblePos": {
            "x": 400,
            "y": 360
        }
    },
    {
        "title": "得出结果",
        "description": "用 1.596 减去 0.266，得到最终答案 1.33。",
        "bubbleText": "1.596 − 0.266 = 1.33",
        "bubblePos": {
            "x": 400,
            "y": 180
        }
    },
    {
        "title": "验算核对",
        "description": "把原式按常规顺序重新计算一遍：0.564 + 1.032 − 0.266 = 1.33，与简算结果一致。",
        "bubbleText": "分步验算，答案正确",
        "bubblePos": {
            "x": 400,
            "y": 360
        }

],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
