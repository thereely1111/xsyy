<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽屉原理应用 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">抽屉原理应用</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('运用最不利原则，先考虑最倒霉情形「把同一花色的 $13$ 张牌全部抽完」，再多抽 $1$ 张必然出现不同花色，故至少要抽 $13+1=14$ 张。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs>
                                <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"></path>
                                </marker>
                            </defs>

                            <!-- 装饰水印（始终可见） -->
                            <g x-show="sceneStep >= 0">
                                <text x="400" y="585" text-anchor="middle" font-size="26" fill="#e7e5e4" font-family="'Noto Serif SC', serif" letter-spacing="14">抽 屉 原 理</text>
                            </g>

                            <!-- 四种花色抽屉（全程显示） -->
                            <g x-show="sceneStep >= 1"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <text x="400" y="32" text-anchor="middle" font-size="16" fill="#57534e" font-family="'Noto Serif SC', serif" font-weight="bold" letter-spacing="4">四种花色「抽屉」 · 每种 13 张</text>
                                <!-- 黑桃抽屉 -->
                                <rect x="40" y="50" width="150" height="96" rx="10" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"></rect>
                                <text x="115" y="96" text-anchor="middle" font-size="34" fill="#1c1917">♠</text>
                                <text x="115" y="121" text-anchor="middle" font-size="15" fill="#44403c" font-family="'Noto Serif SC', serif" font-weight="bold">黑桃</text>
                                <text x="115" y="139" text-anchor="middle" font-size="12" fill="#78716c" font-family="'Noto Serif SC', serif">共 13 张</text>
                                <!-- 红心抽屉 -->
                                <rect x="230" y="50" width="150" height="96" rx="10" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"></rect>
                                <text x="305" y="96" text-anchor="middle" font-size="34" fill="#dc2626">♥</text>
                                <text x="305" y="121" text-anchor="middle" font-size="15" fill="#b91c1c" font-family="'Noto Serif SC', serif" font-weight="bold">红心</text>
                                <text x="305" y="139" text-anchor="middle" font-size="12" fill="#78716c" font-family="'Noto Serif SC', serif">共 13 张</text>
                                <!-- 梅花抽屉 -->
                                <rect x="420" y="50" width="150" height="96" rx="10" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"></rect>
                                <text x="495" y="96" text-anchor="middle" font-size="34" fill="#1c1917">♣</text>
                                <text x="495" y="121" text-anchor="middle" font-size="15" fill="#44403c" font-family="'Noto Serif SC', serif" font-weight="bold">梅花</text>
                                <text x="495" y="139" text-anchor="middle" font-size="12" fill="#78716c" font-family="'Noto Serif SC', serif">共 13 张</text>
                                <!-- 方块抽屉 -->
                                <rect x="610" y="50" width="150" height="96" rx="10" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"></rect>
                                <text x="685" y="96" text-anchor="middle" font-size="34" fill="#dc2626">♦</text>
                                <text x="685" y="121" text-anchor="middle" font-size="15" fill="#b91c1c" font-family="'Noto Serif SC', serif" font-weight="bold">方块</text>
                                <text x="685" y="139" text-anchor="middle" font-size="12" fill="#78716c" font-family="'Noto Serif SC', serif">共 13 张</text>
                            </g>

                            <!-- 第1步：整理题目信息 -->
                            <g x-show="sceneStep >= 1 && sceneStep < 2"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <foreignObject x="170" y="225" width="460" height="175">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-stone-300 rounded-lg shadow px-4 py-3 text-base text-stone-800 leading-relaxed">
                                        <div class="font-bold text-red-800 mb-2">题目信息</div>
                                        <div x-html="renderMath('共 $52$ 张牌，$4$ 种花色：♠ ♥ ♣ ♦')"></div>
                                        <div x-html="renderMath('每种花色 $13$ 张（A、2~10、J、Q、K）')"></div>
                                        <div class="text-red-800 font-bold" x-html="renderMath('问：至少抽几张，保证有 $2$ 种不同花色？')"></div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- 第2步：理解「保证」，考虑最坏情况 -->
                            <g x-show="sceneStep >= 2 && sceneStep < 3"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <foreignObject x="170" y="235" width="460" height="155">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-stone-300 rounded-lg shadow px-4 py-3 text-base text-stone-800 leading-relaxed">
                                        <div class="font-bold text-red-800 mb-2">「保证」＝再倒霉也必须成功</div>
                                        <div>所以要从最倒霉的情形（最坏情况）想起：</div>
                                        <div class="text-red-800 font-bold">抽到的牌全都是同一种花色！</div>
                                    </div>
                                </foreignObject>
                                <text x="400" y="500" text-anchor="middle" font-size="72" fill="#e7e5e4" font-family="'Noto Serif SC', serif">？</text>
                            </g>

                            <!-- 抽出的 13 张黑桃（第3步起持续显示） -->
                            <g x-show="sceneStep >= 3"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <g>
                                    <rect x="60" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="79" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">A</text>
                                    <text x="79" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="106" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="125" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">2</text>
                                    <text x="125" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="152" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="171" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">3</text>
                                    <text x="171" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="198" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="217" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">4</text>
                                    <text x="217" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="244" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="263" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">5</text>
                                    <text x="263" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="290" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="309" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">6</text>
                                    <text x="309" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="336" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="355" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">7</text>
                                    <text x="355" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="382" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="401" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">8</text>
                                    <text x="401" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="428" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="447" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">9</text>
                                    <text x="447" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="474" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="493" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">10</text>
                                    <text x="493" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="520" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="539" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">J</text>
                                    <text x="539" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="566" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="585" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">Q</text>
                                    <text x="585" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                                <g>
                                    <rect x="612" y="280" width="38" height="56" rx="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"></rect>
                                    <text x="631" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">K</text>
                                    <text x="631" y="326" text-anchor="middle" font-size="13" fill="#1c1917">♠</text>
                                </g>
                            </g>

                            <!-- 计数标签A（第3~4步） -->
                            <g x-show="sceneStep >= 3 && sceneStep < 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <foreignObject x="185" y="228" width="340" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="text-center text-sm text-stone-700 bg-white/90 border border-stone-300 rounded px-2 py-1" x-html="renderMath('手中已抽：全是黑桃 ♠，共 $13$ 张')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第3步：最坏情况出现（轨迹＋说明） -->
                            <g x-show="sceneStep >= 3 && sceneStep < 4"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <rect x="35" y="45" width="160" height="106" rx="12" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5"></rect>
                                <path d="M115,154 C115,208 190,236 326,272" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"></path>
                                <foreignObject x="70" y="390" width="420" height="140">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-stone-300 rounded-lg shadow px-4 py-3 text-base text-stone-800 leading-relaxed">
                                        <div class="font-bold text-red-800 mb-2">最坏情况登场</div>
                                        <div>抽一张，是黑桃；再抽一张，还是黑桃……</div>
                                        <div class="text-red-800 font-bold">最倒霉：抽到的牌张张都是黑桃 ♠</div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- 第4步：同花色最多 13 张（括线＋说明） -->
                            <g x-show="sceneStep >= 4 && sceneStep < 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <line x1="60" y1="352" x2="650" y2="352" stroke="#b91c1c" stroke-width="2"></line>
                                <line x1="60" y1="345" x2="60" y2="359" stroke="#b91c1c" stroke-width="2"></line>
                                <line x1="650" y1="345" x2="650" y2="359" stroke="#b91c1c" stroke-width="2"></line>
                                <foreignObject x="70" y="390" width="420" height="140">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-stone-300 rounded-lg shadow px-4 py-3 text-base text-stone-800 leading-relaxed">
                                        <div class="font-bold text-red-800 mb-2">同花色最多只能抽 13 张</div>
                                        <div x-html="renderMath('黑桃一共只有 $13$ 张，抽完就没有了')"></div>
                                        <div class="text-red-800 font-bold" x-html="renderMath('最坏情况到此封顶：$13$ 张，仍只有 $1$ 种花色')"></div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- 计数标签B（第5步起） -->
                            <g x-show="sceneStep >= 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <foreignObject x="150" y="228" width="500" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="text-center text-sm text-red-800 font-bold bg-white/90 border border-red-300 rounded px-2 py-1" x-html="renderMath('$13$ 张黑桃 ♠ $+$ $1$ 张红心 ♥ $=$ 两种不同花色！')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第 14 张牌（第5步起持续显示） -->
                            <g x-show="sceneStep >= 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <text x="691" y="262" text-anchor="middle" font-size="13" fill="#b91c1c" font-family="'Noto Serif SC', serif" font-weight="bold">第 14 张</text>
                                <rect x="668" y="272" width="46" height="70" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="3"></rect>
                                <text x="691" y="304" text-anchor="middle" font-size="19" fill="#dc2626" font-weight="bold" font-family="'Noto Serif SC', serif">A</text>
                                <text x="691" y="328" text-anchor="middle" font-size="17" fill="#dc2626">♥</text>
                            </g>

                            <!-- 第5步：再抽一张必不同花色（轨迹＋说明） -->
                            <g x-show="sceneStep >= 5 && sceneStep < 6"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <rect x="225" y="45" width="160" height="106" rx="12" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"></rect>
                                <path d="M305,154 C400,218 580,218 681,266" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"></path>
                                <foreignObject x="70" y="395" width="360" height="140">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-stone-300 rounded-lg shadow px-4 py-3 text-base text-stone-800 leading-relaxed">
                                        <div class="font-bold text-red-800 mb-2">再抽 1 张必然不同花色</div>
                                        <div>黑桃已被抽光，牌堆里只剩另外三种花色</div>
                                        <div class="text-red-800 font-bold">第 14 张一定和黑桃不同花色！</div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- 第6步：列算式 -->
                            <g x-show="sceneStep >= 6 && sceneStep < 7"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100"
                               x-transition:leave="transition ease-in duration-300"
                               x-transition:leave-start="opacity-100"
                               x-transition:leave-end="opacity-0">
                                <foreignObject x="330" y="390" width="420" height="145">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="bg-white/95 border border-red-800 rounded-lg shadow px-4 py-3 text-center">
                                        <div class="font-bold text-red-800 mb-2 text-base">列算式</div>
                                        <div class="text-lg text-stone-800" x-html="renderMath('$13 + 1 = 14$（张）')"></div>
                                        <div class="text-xs text-stone-500 mt-1">最坏情况的最大值 ＋ 1 ＝ 保证数</div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- 第7步：作答 -->
                            <g x-show="sceneStep >= 7"
                               x-transition:enter="transition ease-out duration-700"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <rect x="330" y="385" width="420" height="150" rx="14" fill="#fef2f2" fill-opacity="0.95" stroke="#b91c1c" stroke-width="3"></rect>
                                <text x="540" y="425" text-anchor="middle" font-size="20" fill="#b91c1c" font-family="'Noto Serif SC', serif" font-weight="bold" letter-spacing="8">答</text>
                                <text x="540" y="465" text-anchor="middle" font-size="19" fill="#b91c1c" font-family="'Noto Serif SC', serif" font-weight="bold">至少抽出 14 张牌</text>
                                <text x="540" y="500" text-anchor="middle" font-size="15" fill="#b91c1c" font-family="'Noto Serif SC', serif">才能保证有两种不同花色的牌</text>
                            </g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
                    {
                        "title": "整理题目信息",
                        "description": "一副牌共 $52$ 张（去掉大小王），分为黑桃 ♠、红心 ♥、梅花 ♣、方块 ♦ 共 $4$ 种花色，每种花色 $13$ 张。要求：至少抽出多少张，才能保证抽到两种不同花色的牌。",
                        "bubbleText": "先看清这副牌：一共 4 种花色，每种花色不多不少正好 13 张。题目问的是「保证」——不管你运气多差，都一定能抽到两种不同花色。我们得想想，抽多少张才能十拿九稳。",
                        "bubblePos": { "x": 480, "y": 400 }
                    },
                    {
                        "title": "理解「保证」，考虑最坏情况",
                        "description": "「保证」说明任何情况下都要成功，必须从最倒霉的情形（最坏情况）出发思考，这就是「最不利原则」。",
                        "bubbleText": "什么叫「保证」？就是运气再差也得成功。所以我们要往最倒霉的方向想：抽到的牌全是同一种花色，迟迟抽不到第二种。只要这种最倒霉的情形都能成功，别的情况就更没问题了。",
                        "bubblePos": { "x": 480, "y": 400 }
                    },
                    {
                        "title": "最倒霉情形：全是同一花色",
                        "description": "最坏情况：抽出的牌全部是同一种花色。例如抽出的 $13$ 张全都是黑桃 ♠。",
                        "bubbleText": "最倒霉的情形就是：你抽了一张又一张，居然张张都是黑桃，手里越攒越多，却总见不到别的花色。我们来看看，这样最多能抽到多少张。",
                        "bubblePos": { "x": 500, "y": 380 }
                    },
                    {
                        "title": "同一花色最多只有 13 张",
                        "description": "每种花色只有 $13$ 张，所以最坏情况下最多抽出 $13$ 张同一花色的牌（黑桃被全部抽光），此时仍只有 $1$ 种花色。",
                        "bubbleText": "黑桃在整副牌里只有 13 张，运气再差，最多也就把这 13 张全抽到——因为第 14 张黑桃根本不存在！这时你手里全是黑桃，仍然只有一种花色。",
                        "bubblePos": { "x": 500, "y": 380 }
                    },
                    {
                        "title": "再多抽 1 张必然是另一种花色",
                        "description": "抽完 $13$ 张同一花色后，牌堆里只剩其余 $3$ 种花色的牌，因此再抽 $1$ 张必定与黑桃花色不同，出现两种不同花色。",
                        "bubbleText": "关键时刻到了！黑桃已经被抽光，剩下的牌全是红心、梅花和方块。所以第 14 张牌无论抽到哪一张，都一定和黑桃不同花色——手里终于出现了两种不同花色！",
                        "bubblePos": { "x": 445, "y": 405 }
                    },
                    {
                        "title": "列出算式",
                        "description": "最坏情况的最大值 $+$ 再多 $1$ 张：$13 + 1 = 14$（张）。",
                        "bubbleText": "把算式写出来：最倒霉的情形是抽满 13 张同一花色，再多抽 1 张就必然出现不同花色，所以是 13 加 1 等于 14 张。这种「再加 1 就突破」的做法，正是抽屉原理最经典的用法。",
                        "bubblePos": { "x": 40, "y": 400 }
                    },
                    {
                        "title": "写出答案",
                        "description": "答：至少抽出 $14$ 张牌，才能保证抽到两种不同花色的牌。",
                        "bubbleText": "写上最终答案：至少抽出 14 张牌，才能保证抽到两种不同花色的牌。记住这个思路——先找到「最坏情况的最大值」，再加 1，就得到了「保证」的数目。",
                        "bubblePos": { "x": 40, "y": 390 }
                    }
                ],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
