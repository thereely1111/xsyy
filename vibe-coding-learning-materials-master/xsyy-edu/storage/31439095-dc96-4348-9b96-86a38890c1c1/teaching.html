<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八进制转十进制 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">八进制转十进制</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('将八进制数按位权展开为各数字与8的幂相乘之和')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='riceGrad' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='#f7f4ed'/><stop offset='100%' stop-color='#e8e2d5'/></linearGradient><linearGradient id='redGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#c44a4a'/><stop offset='100%' stop-color='#9e3333'/></linearGradient><filter id='paperShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='3' dy='5' stdDeviation='4' flood-color='#3e3a36' flood-opacity='0.25'/></filter><filter id='softGlow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='5' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><style>.svg-elem { transition: all 0.8s cubic-bezier(0.22,1,0.36,1); } .digit-card { filter: url(#paperShadow); } .title-seal { animation: heartbeat 2.2s ease-in-out infinite; transform-origin: center; } .mascot { animation: float 3s ease-in-out infinite; filter: url(#softGlow); } .dashed-line { fill: none; stroke: #7a7570; stroke-width: 2; stroke-dasharray: 8,6; animation: flow 1.6s linear infinite; } .formula-box { font-family: Noto Serif SC, KaiTi, serif; font-size: 28px; color: #3e3a36; text-align: center; line-height: 1.4; } .formula-box .red { color: #b53a3a; font-weight: 700; } .formula-box .blank { display: inline-block; min-width: 2.2em; border-bottom: 2px solid #7a7570; text-align: center; color: #b53a3a; } @keyframes float { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-8px);} } @keyframes heartbeat { 0%,100%{transform: scale(1);} 50%{transform: scale(1.04);} } @keyframes flow { 0%{stroke-dashoffset: 28;} 100%{stroke-dashoffset: 0;} }</style><path class='svg-elem transition-all duration-1000' d='M0,540 C200,520 300,560 400,540 C500,520 600,560 800,540 L800,600 L0,600 Z' fill='#e8e2d5' opacity='0.6'/><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 0' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 scale-90 -translate-y-4' x-transition:enter-end='opacity-100 scale-100 translate-y-0' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90 translate-y-4'><rect x='290' y='35' width='220' height='60' rx='12' fill='url(#redGrad)' filter='url(#paperShadow)' class='title-seal'/><text x='400' y='75' text-anchor='middle' font-family='Noto Serif SC, KaiTi, serif' font-size='26' fill='#f7f4ed' font-weight='700'>八进制转十进制</text></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 0'><rect x='215' y='190' width='120' height='140' rx='16' fill='url(#riceGrad)' class='digit-card'/><rect x='340' y='190' width='120' height='140' rx='16' fill='url(#riceGrad)' class='digit-card'/><rect x='465' y='190' width='120' height='140' rx='16' fill='url(#riceGrad)' class='digit-card'/><text x='275' y='285' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='64' fill='#3e3a36' font-weight='700'>2</text><text x='400' y='285' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='64' fill='#3e3a36' font-weight='700'>5</text><text x='525' y='285' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='64' fill='#3e3a36' font-weight='700'>6</text><text x='275' y='350' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='18' fill='#7a7570'>第3位</text><text x='400' y='350' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='18' fill='#7a7570'>第2位</text><text x='525' y='350' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='18' fill='#7a7570'>第1位</text><text x='600' y='310' font-family='Noto Serif SC, serif' font-size='24' fill='#7a7570'>(256)</text><text x='600' y='330' font-family='Noto Serif SC, serif' font-size='16' fill='#b53a3a'>8</text></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 1' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4' x-transition:enter-end='opacity-100 translate-y-0'><rect x='455' y='80' width='140' height='70' rx='10' fill='#fffaf2' stroke='#b53a3a' stroke-width='2' filter='url(#paperShadow)'/><text x='525' y='125' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='22' fill='#3e3a36'>8⁰ = 1</text><text x='525' y='170' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='16' fill='#7a7570'>个位</text><line x1='525' y1='150' x2='525' y2='190' stroke='#b53a3a' stroke-width='2'/></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 2' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4' x-transition:enter-end='opacity-100 translate-y-0'><rect x='330' y='80' width='140' height='70' rx='10' fill='#fffaf2' stroke='#b53a3a' stroke-width='2' filter='url(#paperShadow)'/><text x='400' y='125' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='22' fill='#3e3a36'>8¹ = 8</text><text x='400' y='170' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='16' fill='#7a7570'>八位</text><line x1='400' y1='150' x2='400' y2='190' stroke='#b53a3a' stroke-width='2'/></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 3' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4' x-transition:enter-end='opacity-100 translate-y-0'><rect x='205' y='80' width='140' height='70' rx='10' fill='#fffaf2' stroke='#b53a3a' stroke-width='2' filter='url(#paperShadow)'/><text x='275' y='125' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='22' fill='#3e3a36'>8² = 64</text><text x='275' y='170' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='16' fill='#7a7570'>六十四位</text><line x1='275' y1='150' x2='275' y2='190' stroke='#b53a3a' stroke-width='2'/></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 4' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0' x-transition:enter-end='opacity-100'><path class='dashed-line' d='M275,150 L275,190'/><path class='dashed-line' d='M400,150 L400,190'/><path class='dashed-line' d='M525,150 L525,190'/></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 4 &amp;&amp; sceneStep &lt;= 6' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 scale-90' x-transition:enter-end='opacity-100 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'><foreignObject x='50' y='430' width='700' height='80'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box'>(256)<sub>8</sub> = 2 × <span class='blank'>64</span> + 5 × <span class='blank'>8</span> + 6 × <span class='blank'>1</span></div></foreignObject></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep == 5' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4' x-transition:enter-end='opacity-100 translate-y-0' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 translate-y-0' x-transition:leave-end='opacity-0 translate-y-4'><rect x='185' y='370' width='180' height='45' rx='8' fill='#fffaf2' stroke='#b53a3a' stroke-width='1.5' filter='url(#paperShadow)'/><text x='275' y='400' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='20' fill='#3e3a36'>2×64=128</text><rect x='310' y='370' width='180' height='45' rx='8' fill='#fffaf2' stroke='#b53a3a' stroke-width='1.5' filter='url(#paperShadow)'/><text x='400' y='400' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='20' fill='#3e3a36'>5×8=40</text><rect x='435' y='370' width='180' height='45' rx='8' fill='#fffaf2' stroke='#b53a3a' stroke-width='1.5' filter='url(#paperShadow)'/><text x='525' y='400' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='20' fill='#3e3a36'>6×1=6</text></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 6' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 scale-90 translate-y-4' x-transition:enter-end='opacity-100 scale-100 translate-y-0' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'><foreignObject x='50' y='480' width='700' height='80'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box'><span class='red'>(256)<sub>8</sub></span> = 128 + 40 + 6 = <span class='red'>(174)<sub>10</sub></span></div></foreignObject></g><g class='svg-elem transition-all duration-1000' x-show='sceneStep >= 7' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 scale-50' x-transition:enter-end='opacity-100 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-50'><circle cx='720' cy='120' r='36' fill='url(#redGrad)' filter='url(#paperShadow)'/><text x='720' y='130' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='32' fill='#f7f4ed' font-weight='700'>✓</text><text x='720' y='175' text-anchor='middle' font-family='Noto Serif SC, serif' font-size='16' fill='#b53a3a'>验证通过</text></g><g class='svg-elem mascot transition-all duration-1000' x-show='sceneStep >= 0'><text x='80' y='100' font-size='48'>🧮</text></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题目呈现",
        "description": "首先认识八进制数 (256)₈，明确每一位数字和右下角的进制标记“8”。",
        "bubbleText": "这是一个八进制数，右下角的小“8”表示它的进制。",
        "bubblePos": {
            "x": 120,
            "y": 100
        }
    },
    {
        "title": "从右起第一位",
        "description": "从右往左数第一位是个位，对应的位权是 8 的 0 次方，也就是 1。",
        "bubbleText": "最右边的 6 在个位，位权是 8⁰ = 1。",
        "bubblePos": {
            "x": 560,
            "y": 60
        }
    },
    {
        "title": "从右起第二位",
        "description": "从右往左数第二位是八位，对应的位权是 8 的 1 次方，也就是 8。",
        "bubbleText": "中间的 5 在八位，位权是 8¹ = 8。",
        "bubblePos": {
            "x": 400,
            "y": 60
        }
    },
    {
        "title": "从右起第三位",
        "description": "从右往左数第三位是六十四位，对应的位权是 8 的 2 次方，也就是 64。",
        "bubbleText": "最左边的 2 在六十四位，位权是 8² = 64。",
        "bubblePos": {
            "x": 240,
            "y": 60
        }
    },
    {
        "title": "按权展开",
        "description": "把每一位数字分别乘以对应的位权，得到展开式：2×64 + 5×8 + 6×1。",
        "bubbleText": "把数字和对应的位权相乘再相加。",
        "bubblePos": {
            "x": 400,
            "y": 440
        }
    },
    {
        "title": "逐项相乘",
        "description": "分别计算每一项的乘积：2×64 = 128，5×8 = 40，6×1 = 6。",
        "bubbleText": "看，三个乘积分别是 128、40、6。",
        "bubblePos": {
            "x": 400,
            "y": 360
        }
    },
    {
        "title": "求和得十进制",
        "description": "将三个乘积相加：128 + 40 + 6 = 174，所以 (256)₈ 等于 (174)₁₀。",
        "bubbleText": "把它们加起来，就得到十进制结果 174。",
        "bubblePos": {
            "x": 400,
            "y": 500
        }
    },
    {
        "title": "验证答案",
        "description": "再用十进制除以 8 反推：174 ÷ 8 = 21 余 6，21 ÷ 8 = 2 余 5，2 ÷ 8 = 0 余 2，倒序得到 256，确认答案正确。",
        "bubbleText": "用“除 8 取余”倒推回去，正好得到 256，答案没问题！",
        "bubblePos": {
            "x": 520,
            "y": 120
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
