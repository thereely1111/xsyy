<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往返平均速度计算 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">往返平均速度计算</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('已知两段等长路程的不同速度求平均速度')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='3' stdDeviation='3' flood-color='#2c2c2c' flood-opacity='0.25'/></filter><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='4' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><linearGradient id='groundGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#e8e0d1'/><stop offset='100%' stop-color='#d6cbb8'/></linearGradient><linearGradient id='barGrad' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='#b23a3a'/><stop offset='100%' stop-color='#c95454'/></linearGradient><marker id='bracket' markerWidth='10' markerHeight='10' refX='5' refY='5' orient='auto'><line x1='5' y1='0' x2='5' y2='10' stroke='#5a5a5a' stroke-width='2'/></marker></defs><style>.svg-elem { transition: all 0.7s cubic-bezier(0.4,0,0.2,1); } .dashed-line { fill:none; stroke:#5a5a5a; stroke-width:3; stroke-linecap:round; stroke-dasharray:10,8; animation:dashflow 1.2s linear infinite; } .ink-text { font-family:'KaiTi','STKaiti','SimSun',serif; fill:#3d3d3d; } .red-text { fill:#b23a3a; font-weight:bold; } .light-text { fill:#f7f3e9; } .place { font-size:28px; filter:url(#shadow); } .label { font-size:18px; } .big-num { font-size:32px; filter:url(#glow); } .ox { font-size:36px; animation:float 2s ease-in-out infinite; } .pulse-num { animation:heartbeat 1.5s ease-in-out infinite; } .bar { fill:url(#barGrad); } .ground { fill:url(#groundGrad); stroke:none; opacity:0.55; } .transition-all { transition-property:all; } .duration-700 { transition-duration:700ms; } .duration-1000 { transition-duration:1000ms; } .ease-out { transition-timing-function:cubic-bezier(0,0,0.2,1); } .ease-in { transition-timing-function:cubic-bezier(0.4,0,1,1); } .ease-in-out { transition-timing-function:cubic-bezier(0.4,0,0.2,1); } .fade-up-in { opacity:0; transform:translateY(24px) scale(0.95); } .fade-up-active { opacity:1; transform:translateY(0) scale(1); } .fade-leave { opacity:1; transform:scale(1); } .fade-leave-end { opacity:0; transform:scale(0.92) translateY(-12px); } @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} } @keyframes heartbeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} } @keyframes dashflow { from{stroke-dashoffset:36;} to{stroke-dashoffset:0;} }</style><path class='ground svg-elem' d='M0,560 Q200,530 400,550 T800,560 L800,600 L0,600 Z'/><path class='ground svg-elem' d='M0,130 L60,70 L140,130 L220,60 L300,130 L800,130 L800,180 L0,180 Z' opacity='0.35'/><g x-show='sceneStep >= 0' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><circle cx='120' cy='300' r='8' fill='#b23a3a' filter='url(#shadow)' class='svg-elem'/><text x='120' y='340' text-anchor='middle' class='ink-text place'>甲</text><circle cx='680' cy='300' r='8' fill='#b23a3a' filter='url(#shadow)' class='svg-elem'/><text x='680' y='340' text-anchor='middle' class='ink-text place'>乙</text><line x1='120' y1='360' x2='680' y2='360' stroke='#5a5a5a' stroke-width='2' marker-start='url(#bracket)' marker-end='url(#bracket)' class='svg-elem'/><text x='400' y='385' text-anchor='middle' class='ink-text label'>两地相距 200 千米</text></g><g x-show='sceneStep >= 1 && sceneStep <= 4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><path class='dashed-line svg-elem' d='M120,300 L680,300'/><g transform='translate(400,255)' class='svg-elem'><rect x='-70' y='-18' width='140' height='36' rx='18' fill='#f7f3e9' stroke='#b23a3a' stroke-width='2' filter='url(#shadow)'/><text x='0' y='6' text-anchor='middle' class='ink-text label red-text'>去时 10 千米/时</text></g></g><g x-show='sceneStep == 1 || sceneStep == 2' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end' transform='translate(400,292)'><text x='0' y='0' text-anchor='middle' class='ink-text ox'>🐂</text><text x='0' y='28' text-anchor='middle' class='ink-text label red-text'>慢走</text></g><g x-show='sceneStep >= 3 && sceneStep <= 5' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><path class='dashed-line svg-elem' d='M680,300 L120,300'/><g transform='translate(400,255)' class='svg-elem'><rect x='-70' y='-18' width='140' height='36' rx='18' fill='#f7f3e9' stroke='#b23a3a' stroke-width='2' filter='url(#shadow)'/><text x='0' y='6' text-anchor='middle' class='ink-text label red-text'>返回 40 千米/时</text></g></g><g x-show='sceneStep == 3 || sceneStep == 4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end' transform='translate(400,292)'><text x='0' y='0' text-anchor='middle' class='ink-text ox'>🐂</text><text x='0' y='28' text-anchor='middle' class='ink-text label red-text'>快跑</text></g><g x-show='sceneStep >= 2' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><text x='150' y='430' class='ink-text label'>去时用时</text><rect x='150' y='438' width='300' height='24' rx='6' class='bar svg-elem' filter='url(#shadow)'/><text x='160' y='456' class='ink-text label light-text'>20 时</text><foreignObject x='460' y='435' width='180' height='32' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:KaiTi,STKaiti,SimSun,serif;color:#b23a3a;font-size:17px;font-weight:bold;'>200 ÷ 10 = 20</div></foreignObject><g x-show='sceneStep >= 4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><text x='150' y='490' class='ink-text label'>返回用时</text><rect x='150' y='498' width='75' height='24' rx='6' class='bar svg-elem' opacity='0.85' filter='url(#shadow)'/><text x='160' y='516' class='ink-text label light-text'>5 时</text><foreignObject x='235' y='495' width='180' height='32' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:KaiTi,STKaiti,SimSun,serif;color:#b23a3a;font-size:17px;font-weight:bold;'>200 ÷ 40 = 5</div></foreignObject></g></g><g x-show='sceneStep >= 5' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><path d='M120,300 L680,300 L120,300' fill='none' stroke='#b23a3a' stroke-width='3' stroke-dasharray='6,4' opacity='0.5' class='svg-elem'/><foreignObject x='200' y='200' width='400' height='40' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:KaiTi,STKaiti,SimSun,serif;color:#b23a3a;font-size:21px;font-weight:bold;'>往返总路程 = 200 × 2 = 400 千米</div></foreignObject></g><g x-show='sceneStep >= 6' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><foreignObject x='150' y='545' width='400' height='36' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;font-family:KaiTi,STKaiti,SimSun,serif;color:#3d3d3d;font-size:20px;font-weight:bold;'>往返总时间 = 20 + 5 = 25 时</div></foreignObject></g><foreignObject x='420' y='80' width='340' height='110' x-show='sceneStep >= 7' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(247,243,233,0.92);border:2px solid #b23a3a;border-radius:16px;box-shadow:2px 4px 12px rgba(44,44,44,0.15);padding:12px;box-sizing:border-box;font-family:KaiTi,STKaiti,SimSun,serif;color:#3d3d3d;font-size:22px;text-align:center;'>平均速度 = 总路程 <span style='color:#b23a3a;font-weight:bold;'>÷</span> 总时间</div></foreignObject><g x-show='sceneStep >= 8' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><foreignObject x='260' y='155' width='280' height='80' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(247,243,233,0.95);border:2px solid #b23a3a;border-radius:14px;box-shadow:2px 4px 12px rgba(44,44,44,0.18);padding:10px;box-sizing:border-box;font-family:KaiTi,STKaiti,SimSun,serif;color:#b23a3a;font-size:25px;font-weight:bold;text-align:center;'>400 ÷ 25 = 16 千米/时</div></foreignObject></g><foreignObject x='80' y='75' width='640' height='130' x-show='sceneStep >= 9' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='fade-up-in' x-transition:enter-end='fade-up-active' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='fade-leave' x-transition:leave-end='fade-leave-end'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(247,243,233,0.95);border:2px solid #b23a3a;border-radius:18px;box-shadow:2px 4px 14px rgba(44,44,44,0.18);padding:14px;box-sizing:border-box;font-family:KaiTi,STKaiti,SimSun,serif;color:#3d3d3d;font-size:20px;text-align:center;'><div style='margin-bottom:6px;'>验证：平均速度 <span style='color:#b23a3a;font-weight:bold;'>不是</span> (10 + 40) ÷ 2 = 25</div><div>正确结果：总路程 ÷ 总时间 = <span style='color:#b23a3a;font-weight:bold;font-size:26px;'>16 千米/时</span> ✓</div></div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {

                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
