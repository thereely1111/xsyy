<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分数应用题-工程问题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">分数应用题-工程问题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('按甲乙单独完工天数，求甲先做后剩余合作所需天...')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='4' stdDeviation='4' flood-color='#4a4a4a' flood-opacity='0.25'/></filter><filter id='glow' x='-40%' y='-40%' width='180%' height='180%'><feGaussianBlur stdDeviation='5' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter><linearGradient id='barGrad' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='#e8e0d5'/><stop offset='100%' stop-color='#d6cfc2'/></linearGradient><linearGradient id='progressGrad' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='#b83e2f'/><stop offset='100%' stop-color='#d65a4a'/></linearGradient></defs><style>.svg-elem { transition: all 0.7s cubic-bezier(0.25,0.46,0.45,0.94); } .dashed-line { fill:none; stroke:#7a7a7a; stroke-width:2.5; stroke-linecap:round; stroke-dasharray:10 8; opacity:0.75; } .flow { animation: flowMove 1.2s linear infinite; } @keyframes flowMove { to { stroke-dashoffset: -18; } } @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} } @keyframes heartbeat { 0%,100%{transform:scale(1);} 25%,75%{transform:scale(1.05);} 50%{transform:scale(1.1);} } @keyframes shimmer { 0%,100%{opacity:0.55;} 50%{opacity:1;} } .float-anim { animation: float 3.2s ease-in-out infinite; transform-origin:center; } .beat-anim { animation: heartbeat 1.5s ease-in-out infinite; transform-origin:center; } .shimmer-anim { animation: shimmer 2s ease-in-out infinite; } .enter-fade { transition: all 1s cubic-bezier(0.25,0.46,0.45,0.94); } .enter-from { opacity:0; transform:translateY(20px) scale(0.92); } .enter-to { opacity:1; transform:translateY(0) scale(1); } .leave-fade { transition: all 0.7s cubic-bezier(0.55,0.085,0.68,0.53); } .leave-from { opacity:1; transform:scale(1); } .leave-to { opacity:0; transform:scale(0.88); } .ink-text { font-family: 'Noto Serif SC','KaiTi','STKaiti',serif; fill:#3d3d3d; } .red-text { fill:#b83e2f; }</style><path d='M0,0 C200,70 400,30 800,0 L800,0 L0,0 Z' fill='#f7f3eb' opacity='0.9'/><path d='M0,600 C180,540 300,560 420,600 C560,560 700,540 800,600 L800,600 L0,600 Z' fill='#ebe5db' opacity='0.85'/><g class='svg-elem float-anim' x-show='sceneStep == 0' x-transition:enter='enter-fade' x-transition:enter-start='enter-from' x-transition:enter-end='enter-to' x-transition:leave='leave-fade' x-transition:leave-start='leave-from' x-transition:leave-end='leave-to'><foreignObject x='200' y='80' width='400' height='100'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:18px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:1px solid #b83e2f; border-radius:8px; padding:12px 18px; text-align:center; box-shadow:0 4px 10px rgba(74,74,74,0.15);'>工程问题：甲独做10天，乙独做15天。甲先做3天，余下由甲乙合作，还需几天？</div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 0'><rect x='100' y='420' width='600' height='40' rx='8' fill='url(#barGrad)' stroke='#8b8b8b' stroke-width='2' filter='url(#shadow)'/><text x='400' y='410' text-anchor='middle' class='ink-text' font-size='18'>工程总量</text><text x='100' y='485' text-anchor='middle' class='ink-text' font-size='16'>0</text><text x='700' y='485' text-anchor='middle' class='ink-text' font-size='16'>1</text><g class='beat-anim'><circle cx='160' cy='220' r='45' fill='#fffaf0' stroke='#b83e2f' stroke-width='3' filter='url(#shadow)'/><text x='160' y='235' text-anchor='middle' font-size='48'>👷</text><text x='160' y='295' text-anchor='middle' class='red-text ink-text' font-size='24'>甲</text></g><g class='beat-anim' style='animation-delay:0.3s'><circle cx='640' cy='220' r='45' fill='#fffaf0' stroke='#7a7a7a' stroke-width='3' filter='url(#shadow)'/><text x='640' y='235' text-anchor='middle' font-size='48'>🧑‍🔧</text><text x='640' y='295' text-anchor='middle' class='ink-text' font-size='24'>乙</text></g></g><g class='svg-elem beat-anim' x-show='sceneStep == 1' x-transition:enter='enter-fade' x-transition:enter-start='enter-from' x-transition:enter-end='enter-to' x-transition:leave='leave-fade' x-transition:leave-start='leave-from' x-transition:leave-end='leave-to'><foreignObject x='70' y='120' width='180' height='70'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:18px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:1px solid #b83e2f; border-radius:8px; padding:8px 12px; text-align:center;'>甲工效 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 4px;'>1</span><span style='display:block;'>10</span></span></div></div></foreignObject><foreignObject x='550' y='120' width='180' height='70'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:18px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:1px solid #7a7a7a; border-radius:8px; padding:8px 12px; text-align:center;'>乙工效 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #7a7a7a;display:block;padding:0 4px;'>1</span><span style='display:block;'>15</span></span></div></div></foreignObject></g><path class='svg-elem dashed-line flow' d='M160,265 C160,320 160,380 160,420' x-show='sceneStep >= 1 && sceneStep <= 4'/><path class='svg-elem dashed-line flow' d='M640,265 C640,320 640,380 640,420' x-show='sceneStep >= 1 && sceneStep <= 4' style='animation-delay:0.4s'/><g class='svg-elem shimmer-anim' x-show='sceneStep >= 2'><rect x='100' y='420' width='180' height='40' rx='8' fill='url(#progressGrad)' filter='url(#glow)' opacity='0.9'/><text x='190' y='448' text-anchor='middle' fill='#fffaf0' font-family='Noto Serif SC, KaiTi, serif' font-size='18'>3/10</text><foreignObject x='80' y='360' width='200' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:16px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:1px solid #b83e2f; border-radius:6px; padding:6px 10px; text-align:center;'>甲先做3天，完成 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>3</span><span style='display:block;'>10</span></span></div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 3'><rect x='280' y='420' width='420' height='40' rx='8' fill='#b83e2f' fill-opacity='0.25' stroke='#b83e2f' stroke-width='2'/><text x='490' y='448' text-anchor='middle' class='red-text ink-text' font-size='18'>7/10</text><foreignObject x='430' y='360' width='240' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:16px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:1px solid #7a7a7a; border-radius:6px; padding:6px 10px; text-align:center;'>剩余 = 1 − <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #3d3d3d;display:block;padding:0 3px;'>3</span><span style='display:block;'>10</span></span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>7</span><span style='display:block;'>10</span></span></div></div></foreignObject></g><g class='svg-elem beat-anim' x-show='sceneStep >= 4'><path class='dashed-line flow' d='M180,150 C220,90 320,90 340,120'/><path class='dashed-line flow' d='M620,150 C580,90 480,90 460,120' style='animation-delay:0.4s'/><foreignObject x='280' y='80' width='240' height='70'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:16px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:2px solid #b83e2f; border-radius:8px; padding:8px 12px; text-align:center;'>合作工效 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>1</span><span style='display:block;'>10</span></span> + <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #7a7a7a;display:block;padding:0 3px;'>1</span><span style='display:block;'>15</span></span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>1</span><span style='display:block;'>6</span></span></div></div></foreignObject></g><g class='svg-elem shimmer-anim' x-show='sceneStep == 5' x-transition:enter='enter-fade' x-transition:enter-start='enter-from' x-transition:enter-end='enter-to' x-transition:leave='leave-fade' x-transition:leave-start='leave-from' x-transition:leave-end='leave-to'><foreignObject x='260' y='250' width='280' height='90'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:17px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:2px solid #b83e2f; border-radius:8px; padding:10px 14px; text-align:center;'>还需天数 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>7</span><span style='display:block;'>10</span></span> ÷ <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>1</span><span style='display:block;'>6</span></span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:1px solid #b83e2f;display:block;padding:0 3px;'>21</span><span style='display:block;'>5</span></span> = 4.2（天）</div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep == 6'><rect x='250' y='120' width='60' height='60' rx='6' fill='url(#progressGrad)' stroke='#8b8b8b' stroke-width='2'/><rect x='320' y='120' width='60' height='60' rx='6' fill='url(#progressGrad)' stroke='#8b8b8b' stroke-width='2'/><rect x='390' y='120' width='60' height='60' rx='6' fill='url(#progressGrad)' stroke='#8b8b8b' stroke-width='2'/><rect x='460' y='120' width='60' height='60' rx='6' fill='url(#progressGrad)' stroke='#8b8b8b' stroke-width='2'/><rect x='530' y='120' width='60' height='60' rx='6' fill='url(#barGrad)' stroke='#8b8b8b' stroke-width='2'/><rect x='530' y='120' width='12' height='60' rx='2' fill='url(#progressGrad)' opacity='0.9'/><text x='420' y='220' text-anchor='middle' class='red-text ink-text' font-size='22'>4.2 天</text></g><g class='svg-elem' x-show='sceneStep == 7'><foreignObject x='150' y='140' width='500' height='220'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:17px; color:#3d3d3d; background:rgba(255,250,240,0.95); border:2px solid #b83e2f; border-radius:10px; padding:14px 20px; box-shadow:0 4px 12px rgba(74,74,74,0.15);'><div style='margin-bottom:8px;'><strong>验算：</strong></div><div>甲一共做 3 + 4.2 = 7.2 天，完成 7.2 ÷ 10 = 0.72</div><div>乙做 4.2 天，完成 4.2 ÷ 15 = 0.28</div><div style='margin-top:8px;color:#b83e2f;font-weight:bold;'>合计 0.72 + 0.28 = 1 = 全部工程 ✓</div></div></div></foreignObject></g><g class='svg-elem beat-anim' x-show='sceneStep == 8' x-transition:enter='enter-fade' x-transition:enter-start='enter-from' x-transition:enter-end='enter-to' x-transition:leave='leave-fade' x-transition:leave-start='leave-from' x-transition:leave-end='leave-to'><foreignObject x='220' y='220' width='360' height='140'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;'><div style='font-family:Noto Serif SC, KaiTi, serif; font-size:26px; color:#b83e2f; background:rgba(255,250,240,0.98); border:3px solid #b83e2f; border-radius:12px; padding:16px 24px; text-align:center; box-shadow:0 6px 18px rgba(74,74,74,0.2);'>答：还需要 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1;'><span style='border-bottom:2px solid #b83e2f;display:block;padding:0 4px;'>21</span><span style='display:block;'>5</span></span> 天<br/><span style='font-size:20px;color:#3d3d3d;'>（即 4.2 天）</span></div></div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题识量",
        "description": "把这项工程的全部工作量看作单位“1”，甲、乙两位工人分别需要10天、15天完成。",
        "bubbleText": "全部工程看作单位一",
        "bubblePos": {
            "x": 400,
            "y": 130
        }
    },
    {
        "title": "求单人效率",
        "description": "甲每天完成1/10，乙每天完成1/15，这就是两人的工作效率。",
        "bubbleText": "甲每天做十分之一，乙做十五分之一",
        "bubblePos": {
            "x": 400,
            "y": 155
        }
    },
    {
        "title": "甲先做3天",
        "description": "甲先单独工作3天，完成的工作量是 1/10 × 3 = 3/10。",
        "bubbleText": "甲三天做了十分之三",
        "bubblePos": {
            "x": 180,
            "y": 390
        }
    },
    {
        "title": "计算剩余工程",
        "description": "用总量1减去甲已做的3/10，得到剩余工程为 7/10。",
        "bubbleText": "剩余工程为十分之七",
        "bubblePos": {
            "x": 550,
            "y": 390
        }
    },
    {
        "title": "求合作效率",
        "description": "甲乙合作一天能完成 1/10 + 1/15 = 1/6。",
        "bubbleText": "合作每天完成六分之一",
        "bubblePos": {
            "x": 400,
            "y": 115
        }
    },
    {
        "title": "列式求天数",
        "description": "剩余工作量除以合作效率，即 7/10 ÷ 1/6 = 21/5（天）。",
        "bubbleText": "还需二十一分之五天",
        "bubblePos": {
            "x": 400,
            "y": 295
        }
    },
    {
        "title": "换算小数",
        "description": "21/5 天等于 4.2 天，也就是说甲乙合作还要做4天多。",
        "bubbleText": "等于四点二天",
        "bubblePos": {
            "x": 420,
            "y": 245
        }
    },
    {
        "title": "验算答案",
        "description": "甲一共做 3 + 4.2 = 7.2 天，完成 7.2/10 = 0.72；乙做 4.2 天，完成 4.2/15 = 0.28；合计 1，正好完成全部工程。",
        "bubbleText": "合计正好等于全部工程",
        "bubblePos": {
            "x": 400,
            "y": 250
        }
    },
    {
        "title": "得出结论",
        "description": "因此，剩下的工程由甲乙合作完成，还需要 21/5 天，即 4.2 天。",
        "bubbleText": "还需四点二天",
        "bubblePos": {
            "x": 400,
            "y": 290
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
