<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整数加法应用题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">整数加法应用题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('已知一个数量，求比它多2的数与它的总和')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#4a4a4a" flood-opacity="0.25"/></filter><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="candyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7f3e8"/><stop offset="100%" stop-color="#e8dfd0"/></linearGradient><linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c94c4c"/><stop offset="100%" stop-color="#9e3a3a"/></linearGradient><symbol id="candy" viewBox="-15 -15 30 30"><circle r="12" fill="url(#candyGrad)" filter="url(#dropShadow)"/><path d="M-8,-2 Q-12,-6 -12,0 Q-12,6 -8,2 Z" fill="url(#redGrad)"/><path d="M8,-2 Q12,-6 12,0 Q12,6 8,2 Z" fill="url(#redGrad)"/><rect x="-3" y="-1" width="6" height="2" fill="#c94c4c" rx="1"/></symbol></defs><style>.svg-elem{transition:all .8s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center;}.dashed-line{fill:none;stroke:#c94c4c;stroke-width:2.5;stroke-dasharray:8,6;stroke-linecap:round;opacity:.85;}@keyframes floatUpDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes heartbeatScale{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes streamFlow{to{stroke-dashoffset:-28}}.float{animation:floatUpDown 3s ease-in-out infinite;}.heart{animation:heartbeatScale 1.5s ease-in-out infinite;}.flow{animation:streamFlow 1.2s linear infinite;}</style><g class="float svg-elem" x-show="sceneStep == 0" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><path fill="#f7f3e8" stroke="#4a4a4a" stroke-width="2" filter="url(#dropShadow)" d="M0,0 H360 A12,12 0 0 1 372,12 V58 A12,12 0 0 1 360,70 H90 L70,90 L75,70 H0 A12,12 0 0 1 -12,58 V12 A12,12 0 0 1 0,0 Z" transform="translate(220,90)"/><foreignObject x="220" y="90" width="360" height="70"><div xmlns='http://www.w3.org/1999/xhtml' style='color:#4a4a4a;font-size:18px;line-height:1.5;text-align:center;padding:8px;font-family:PingFang SC,Microsoft YaHei,sans-serif'>我有5颗糖，妹妹比我多2颗，我俩一共有多少颗糖？</div></foreignObject></g><g transform="translate(80,120)" class="svg-elem" x-show="sceneStep >= 1 && sceneStep <= 6" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><ellipse cx="0" cy="100" rx="30" ry="7" fill="#4a4a4a" opacity="0.12"/><circle cx="0" cy="0" r="24" fill="#f7f3e8" stroke="#4a4a4a" stroke-width="2.5"/><path d="M-10,8 Q0,16 10,8" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><circle cx="-9" cy="-4" r="2.5" fill="#4a4a4a"/><circle cx="9" cy="-4" r="2.5" fill="#4a4a4a"/><path d="M-26,24 Q-32,72 -28,108 H28 Q32,72 26,24 Z" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="2"/><text x="0" y="130" text-anchor="middle" font-size="18" fill="#4a4a4a" font-family="PingFang SC,Microsoft YaHei,sans-serif">我</text></g><g class="svg-elem" x-show="sceneStep >= 1 && sceneStep <= 4" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><text x="180" y="270" text-anchor="middle" font-size="16" fill="#4a4a4a" font-family="PingFang SC,Microsoft YaHei,sans-serif">我的5颗糖</text><use href="#candy" x="100" y="300" class="heart" style="animation-delay:0s"/><use href="#candy" x="140" y="300" class="heart" style="animation-delay:0.1s"/><use href="#candy" x="180" y="300" class="heart" style="animation-delay:0.2s"/><use href="#candy" x="220" y="300" class="heart" style="animation-delay:0.3s"/><use href="#candy" x="260" y="300" class="heart" style="animation-delay:0.4s"/></g><g transform="translate(620,120)" class="svg-elem" x-show="sceneStep >= 2 && sceneStep <= 6" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><ellipse cx="0" cy="100" rx="30" ry="7" fill="#4a4a4a" opacity="0.12"/><circle cx="0" cy="0" r="24" fill="#f7f3e8" stroke="#4a4a4a" stroke-width="2.5"/><path d="M-26,-8 Q-30,-22 -16,-24 Q0,-28 16,-24 Q30,-22 26,-8 Q32,-2 28,8 Q20,4 0,4 Q-20,4 -28,8 Q-32,-2 -26,-8 Z" fill="#4a4a4a"/><path d="M-10,8 Q0,16 10,8" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/><circle cx="-9" cy="-4" r="2.5" fill="#f7f3e8"/><circle cx="9" cy="-4" r="2.5" fill="#f7f3e8"/><path d="M-24,24 Q-30,72 -26,108 H26 Q30,72 24,24 Z" fill="#c94c4c" stroke="#4a4a4a" stroke-width="2"/><text x="0" y="130" text-anchor="middle" font-size="18" fill="#4a4a4a" font-family="PingFang SC,Microsoft YaHei,sans-serif">妹妹</text></g><g class="svg-elem" x-show="sceneStep >= 3 && sceneStep <= 4" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><text x="620" y="270" text-anchor="middle" font-size="16" fill="#4a4a4a" font-family="PingFang SC,Microsoft YaHei,sans-serif">妹妹的7颗糖</text><use href="#candy" x="500" y="300" class="heart" style="animation-delay:0s"/><use href="#candy" x="540" y="300" class="heart" style="animation-delay:0.08s"/><use href="#candy" x="580" y="300" class="heart" style="animation-delay:0.16s"/><use href="#candy" x="620" y="300" class="heart" style="animation-delay:0.24s"/><use href="#candy" x="660" y="300" class="heart" style="animation-delay:0.32s"/><use href="#candy" x="700" y="300" class="heart" style="animation-delay:0.40s"/><use href="#candy" x="740" y="300" class="heart" style="animation-delay:0.48s"/></g><g class="svg-elem" x-show="sceneStep == 2" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><path d="M0,0 Q100,-55 200,0" class="dashed-line flow" transform="translate(280,290)"/><text x="380" y="245" text-anchor="middle" font-size="20" fill="#c94c4c" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="bold">多2颗</text><foreignObject x="480" y="160" width="220" height="60"><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f7f3e8;border:2px solid #c94c4c;border-radius:10px;padding:8px;color:#4a4a4a;font-size:17px;text-align:center;font-family:PingFang SC,Microsoft YaHei,sans-serif'>妹妹比我多2颗</div></foreignObject></g><foreignObject x="300" y="55" width="200" height="50" class="svg-elem heart" x-show="sceneStep == 2" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(247,243,232,0.95);border:2px solid #c94c4c;border-radius:12px;padding:6px 12px;color:#4a4a4a;font-size:22px;font-weight:bold;text-align:center;font-family:PingFang SC,Microsoft YaHei,sans-serif'>5 + 2 = 7</div></foreignObject><g class="svg-elem" x-show="sceneStep == 4" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><path d="M180,340 Q260,400 360,460" class="dashed-line flow"/><path d="M620,340 Q540,400 440,460" class="dashed-line flow"/><text x="400" y="410" text-anchor="middle" font-size="18" fill="#c94c4c" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="bold">合起来</text></g><g class="svg-elem heart" x-show="sceneStep >= 5" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><text x="400" y="445" text-anchor="middle" font-size="16" fill="#4a4a4a" font-family="PingFang SC,Microsoft YaHei,sans-serif">两人一共有12颗糖</text><use href="#candy" x="360" y="470"/><use href="#candy" x="400" y="470"/><use href="#candy" x="440" y="470"/><use href="#candy" x="340" y="500"/><use href="#candy" x="380" y="500"/><use href="#candy" x="420" y="500"/><use href="#candy" x="460" y="500"/><use href="#candy" x="360" y="530"/><use href="#candy" x="400" y="530"/><use href="#candy" x="440" y="530"/><use href="#candy" x="380" y="560"/><use href="#candy" x="420" y="560"/></g><foreignObject x="300" y="55" width="200" height="50" class="svg-elem heart" x-show="sceneStep == 5" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(247,243,232,0.95);border:2px solid #c94c4c;border-radius:12px;padding:6px 12px;color:#4a4a4a;font-size:22px;font-weight:bold;text-align:center;font-family:PingFang SC,Microsoft YaHei,sans-serif'>5 + 7 = 12</div></foreignObject><foreignObject x="260" y="130" width="280" height="80" class="svg-elem heart" x-show="sceneStep == 6" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all ease-in duration-700" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-75"><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(247,243,232,0.95);border:2px solid #c94c4c;border-radius:12px;padding:10px;color:#4a4a4a;font-size:18px;text-align:center;line-height:1.6;font-family:PingFang SC,Microsoft YaHei,sans-serif'><div>12 − 5 = 7 ✓</div><div>7 − 5 = 2 ✓</div><div style='color:#c94c4c;font-weight:bold;'>答案：12颗糖</div></div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题理解",
        "description": "题目给出：我有5颗糖，妹妹比我多2颗，要求计算两人一共有多少颗糖。",
        "bubbleText": "先读题，找出已知条件和问题。",
        "bubblePos": {
            "x": 120,
            "y": 80
        }
    },

                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
