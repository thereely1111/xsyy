<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形旋转与组合拼图 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">图形旋转与组合拼图</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('判断四块仅可旋转的小图形能否拼成目标大图')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='inkShadow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur in='SourceAlpha' stdDeviation='3' result='blur'/><feOffset in='blur' dx='2' dy='3' result='offsetBlur'/><feFlood flood-color='#4a4a4a' flood-opacity='0.35' result='color'/><feComposite in='color' in2='offsetBlur' operator='in' result='shadow'/><feMerge><feMergeNode in='shadow'/><feMergeNode in='SourceGraphic'/></feMerge></filter><filter id='cinnabarGlow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='4' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter><linearGradient id='riceGradient' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#f7f3e8'/><stop offset='100%' stop-color='#e8e0d0'/></linearGradient><linearGradient id='redGradient' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#d85c52'/><stop offset='100%' stop-color='#c23a30'/></linearGradient></defs><style>.svg-elem{transition:all 0.8s cubic-bezier(0.4,0,0.2,1);}.piece{fill:url(#riceGradient);stroke:#c23a30;stroke-width:2.5;filter:url(#inkShadow);}.piece-focus{fill:#f7f3e8;stroke:#c23a30;stroke-width:4;filter:url(#cinnabarGlow);}.target-outline{fill:none;stroke:#4a4a4a;stroke-width:3;stroke-dasharray:8 4;filter:url(#inkShadow);}.dashed-line{fill:none;stroke:#4a4a4a;stroke-width:1.8;stroke-dasharray:10 6;opacity:0.75;animation:shimmer 2s linear infinite;}.label{font-family:sans-serif;font-size:16px;fill:#4a4a4a;font-weight:500;}.red-label{fill:#c23a30;font-weight:700;}.angle-mark{fill:none;stroke:#c23a30;stroke-width:2;}@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}@keyframes shimmer{0%{stroke-dashoffset:32;}100%{stroke-dashoffset:0;}}.float-anim{animation:float 4s ease-in-out infinite;}.breathe-anim{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite;}</style><g x-show='sceneStep >= 0' class='svg-elem float-anim' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='560,220 640,300 560,380 480,300' class='target-outline'/><text x='650' y='210' class='label red-label' text-anchor='start'>目标图形</text></g><g x-show='sceneStep <= 4' class='svg-elem breathe-anim' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-700 ease-in'><text x='220' y='120' class='label' text-anchor='middle'>四块待拼图形</text><g transform='translate(120,160)'><polygon points='0,0 80,0 0,80' class='piece'/></g><text x='160' y='210' class='label red-label' text-anchor='middle'>甲</text><g transform='translate(280,160) rotate(90)'><polygon points='0,0 80,0 0,80' class='piece'/></g><text x='240' y='210' class='label red-label' text-anchor='middle'>乙</text><g transform='translate(120,320) rotate(180)'><polygon points='0,0 80,0 0,80' class='piece'/></g><text x='160' y='370' class='label red-label' text-anchor='middle'>丙</text><g transform='translate(280,320) rotate(270)'><polygon points='0,0 80,0 0,80' class='piece'/></g><text x='240' y='370' class='label red-label' text-anchor='middle'>丁</text></g><g x-show='sceneStep == 1' class='svg-elem breathe-anim' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='120,160 200,160 120,240' fill='none' stroke='#c23a30' stroke-width='3' stroke-dasharray='4 2'/><polygon points='560,220 640,300 560,380 480,300' fill='none' stroke='#c23a30' stroke-width='4' stroke-dasharray='6 3'/><text x='400' y='500' class='label' text-anchor='middle'>左边四块与右边目标图形形状、角度都对应</text></g><foreignObject x='250' y='60' width='320' height='130' x-show='sceneStep == 2' class='svg-elem' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><div xmlns='http://www.w3.org/1999/xhtml' style='padding:14px 18px;background:#f7f3e8;border:2px solid #c23a30;border-radius:10px;color:#4a4a4a;font-family:sans-serif;font-size:18px;line-height:1.6;box-shadow:0 6px 16px rgba(74,74,74,0.2);'>单块面积 = ½ × 80 × 80 = 3 200<br/>四块总面积 = 4 × 3 200 = 12 800<br/>目标面积 = (80√2)² = 12 800</div></foreignObject><g x-show='sceneStep == 3' class='svg-elem' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-500 ease-in'><g transform='translate(120,160)'><polygon points='0,0 80,0 0,80' class='piece piece-focus'/><path d='M18,0 L18,18 L0,18' class='angle-mark'/><text x='24' y='24' class='label red-label'>90°</text><text x='52' y='14' class='label'>45°</text><text x='6' y='66' class='label'>45°</text></g><g transform='translate(640,300)'><path d='M0,0 L-12,-12 L-24,0 L-12,12 Z' class='angle-mark'/><text x='10' y='-10' class='label red-label'>90°</text></g><text x='400' y='500' class='label' text-anchor='middle'>小三角为等腰直角三角形；四个直角在中心拼成周角，外角也是直角</text></g><g x-show='sceneStep >= 4 && sceneStep <= 6' class='svg-elem' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-700 ease-in'><path d='M146,187 Q400,120 586,273' class='dashed-line'/><path d='M253,187 Q460,160 586,326' class='dashed-line'/><path d='M93,293 Q300,420 533,326' class='dashed-line'/><path d='M306,293 Q480,460 533,273' class='dashed-line'/></g><g x-show='sceneStep >= 4' class='svg-elem'><g x-show='sceneStep >= 4' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='560,300 640,300 560,220' class='piece'/><text x='600' y='270' class='label red-label' text-anchor='middle'>甲</text></g><g x-show='sceneStep >= 5' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='560,300 640,300 560,380' class='piece'/><text x='600' y='340' class='label red-label' text-anchor='middle'>乙</text></g><g x-show='sceneStep >= 6' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='560,300 560,380 480,300' class='piece'/><text x='520' y='340' class='label red-label' text-anchor='middle'>丙</text></g><g x-show='sceneStep >= 7' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><polygon points='560,300 480,300 560,220' class='piece'/><text x='520' y='270' class='label red-label' text-anchor='middle'>丁</text></g></g><g x-show='sceneStep >= 7' class='svg-elem' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-500 ease-in'><text x='608' y='255' class='label red-label' text-anchor='start'>80√2</text><text x='608' y='355' class='label red-label' text-anchor='start'>80√2</text><text x='512' y='355' class='label red-label' text-anchor='end'>80√2</text><text x='512' y='255' class='label red-label' text-anchor='end'>80√2</text><g transform='translate(560,220)'><path d='M0,0 L-12,12 L0,24 L12,12 Z' class='angle-mark'/></g><g transform='translate(640,300)'><path d='M0,0 L-12,-12 L-24,0 L-12,12 Z' class='angle-mark'/></g><g transform='translate(560,380)'><path d='M0,0 L12,-12 L0,-24 L-12,-12 Z' class='angle-mark'/></g><g transform='translate(480,300)'><path d='M0,0 L12,12 L0,24 L-12,12 Z' class='angle-mark'/></g><text x='560' y='440' class='label' text-anchor='middle'>四条外边长度相等，四个外角都是90°</text></g><foreignObject x='230' y='520' width='340' height='70' x-show='sceneStep >= 8' class='svg-elem' x-transition:enter='transition-all duration-700 ease-out' x-transition:leave='transition-all duration-500 ease-in'><div xmlns='http://www.w3.org/1999/xhtml' style='padding:10px 16px;background:#f7f3e8;border:2px solid #c23a30;border-radius:8px;color:#4a4a4a;font-family:sans-serif;font-size:16px;line-height:1.5;text-align:center;'>边长 = √(80² + 80²) = 80√2 ≈ 113.14</div></foreignObject><foreignObject x='480' y='60' width='260' height='90' x-show='sceneStep >= 9' class='svg-elem' x-transition:enter='transition-all duration-1000 ease-out' x-transition:leave='transition-all duration-500 ease-in'><div xmlns='http://www.w3.org/1999/xhtml' style='padding:14px 18px;background:linear-gradient(180deg,#d85c52,#c23a30);border-radius:10px;color:#f7f3e8;font-family:sans-serif;font-size:20px;font-weight:700;text-align:center;line-height:1.4;box-shadow:0 6px 16px rgba(74,74,74,0.25);'>✓ 可以拼成！<br/><span style='font-size:14px;font-weight:500;'>四块全用，仅旋转，未翻转</span></div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题目呈现",
        "description": "左侧是四块完全相同的等腰直角三角形，右侧是待拼的目标大图形。请判断：仅通过旋转（不能翻转），能否把四块全部拼进目标轮廓？",
        "bubbleText": "先看清楚左右两边的图形。",
        "bubblePos": {
            "x": 400,
            "y": 50
        }
    },
    {
        "title": "观察形状",
        "description": "四块小图形的直角边都是80，斜边为80√2；目标图形是一个旋转45°的正方形，边长也是80√2。形状尺寸完全匹配。",
        "bubbleText": "小三角和目标图形的边长对应上了。",
        "bubblePos": {
            "x": 400,
            "y": 50
        }
    },
    {
        "title": "面积核算",
        "description": "每块小三角形面积为½×80×80=3200，四块总面积为12800；目标正方形的面积为(80√2)²=12800。面积相等，说明拼接有希望。",
        "bubbleText": "总面积正好等于目标面积。",
        "bubblePos": {
            "x": 400,
            "y": 50
        }
    },
    {
        "title": "角度分析",
        "description": "每个小三角形有一个90°角和两个45°角。若把四个90°角都放到中心，正好拼成360°周角；外侧留下的四个角各是90°，正好构成正方形的四个角。",
        "bubbleText": "四个直角在中心拼成周角。",
        "bubblePos": {
            "x": 400,
            "y": 50
        }
    },
    {
        "title": "开始拼接",
        "description": "保持图形不翻转，只旋转。把第一块（甲）顺时针旋转90°，使直角边分别指向右和上方，嵌入目标图形的右上角。",
        "bubbleText": "第一块旋转后卡进右上角。",
        "bubblePos": {
            "x": 560,
            "y": 180
        }
    },
    {
        "title": "嵌入右下",
        "description": "第二块（乙）保持原方向，直角边分别指向右和下方，放到目标图形的右下角。两块共用中心的直角顶点。",
        "bubbleText": "第二块自然嵌入右下角。",
        "bubblePos": {
            "x": 560,
            "y": 380
        }
    },
    {
        "title": "补全左下",
        "description": "第三块（丙）顺时针旋转180°，直角边分别指向左和下方，补全左下角。此时只剩左上角一个缺口。",
        "bubbleText": "第三块补上左下角。",
        "bubblePos": {
            "x": 480,
            "y": 380
        }
    },
    {
        "title": "完成拼图",
        "description": "第四块（丁）顺时针旋转270°（或逆时针90°），直角边分别指向左和上方，填入最后一个角。四块无重叠、无缝隙地铺满目标图形。",
        "bubbleText": "最后一块填入左上角，拼合完成。",
        "bubblePos": {
            "x": 480,
            "y": 220
        }
    },
    {
        "title": "边长与角度验证",
        "description": "目标图形四条外边都是小三角形的斜边，长度为√(80²+80²)=80√2，四边相等；四个外角均为90°，满足正方形的判定条件。",
        "bubbleText": "四边相等，四角都是直角。",
        "bubblePos": {
            "x": 560,
            "y": 450
        }
    },
    {
        "title": "结论确认",
        "description": "四块等腰直角三角形全部使用，仅通过0°、90°、180°、270°的旋转（无翻转）即可拼成目标正方形。因此答案是：可以。",
        "bubbleText": "答案：可以拼成！",

],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
