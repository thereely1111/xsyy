<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小公倍数应用题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">最小公倍数应用题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('求两路车发车间隔的最小公倍数对应时刻')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='3' stdDeviation='2' flood-color='#4a4a4a' flood-opacity='0.25'/></filter><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><linearGradient id='roofGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#d8cfc0'/><stop offset='100%' stop-color='#a89b8c'/></linearGradient><linearGradient id='roadGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#e8e0d0'/><stop offset='100%' stop-color='#cfc5b5'/></linearGradient></defs><style>.svg-elem{transition:all 0.8s cubic-bezier(0.4,0,0.2,1);}.text-cn{font-family:KaiTi,STKaiti,Microsoft YaHei,serif;}.ink-fill{fill:#5a5a5a;}.ink-stroke{stroke:#5a5a5a;}.cinnabar-fill{fill:#c45c48;}.cinnabar-stroke{stroke:#c45c48;}.rice-fill{fill:#f7f3e9;}.route1{fill:#c45c48;}.route2{fill:#5a5a5a;}.timeline-tick{stroke:#8a8a8a;stroke-width:2;}.dashed-line{fill:none;stroke:#c45c48;stroke-width:2.5;stroke-dasharray:10 6;stroke-linecap:round;animation:stream 2s linear infinite;}.scale-start{opacity:0;transform:scale(0.85) translateY(20px);transform-box:fill-box;transform-origin:center;}.scale-end{opacity:1;transform:scale(1) translateY(0);transform-box:fill-box;transform-origin:center;}.pop-start{opacity:0;transform:scale(0.6);transform-box:fill-box;transform-origin:center;}.pop-end{opacity:1;transform:scale(1);transform-box:fill-box;transform-origin:center;}.fade-start{opacity:0;transform:translateY(15px);}.fade-end{opacity:1;transform:translateY(0);}.anim-float{animation:float 3s ease-in-out infinite;}.anim-heartbeat{animation:heartbeat 1.2s ease-in-out infinite;}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes stream{0%{stroke-dashoffset:32}100%{stroke-dashoffset:0}}</style><g x-show='sceneStep >= 0' class='svg-elem'><rect x='45' y='245' width='150' height='12' fill='url(#roofGrad)' filter='url(#shadow)'/><line x1='60' y1='257' x2='60' y2='380' class='ink-stroke' stroke-width='6' stroke-linecap='round'/><line x1='180' y1='257' x2='180' y2='380' class='ink-stroke' stroke-width='6' stroke-linecap='round'/><rect x='45' y='380' width='150' height='10' fill='#8a8a8a'/><text x='120' y='235' text-anchor='middle' class='text-cn ink-fill' font-size='22' font-weight='bold' filter='url(#shadow)'>汽车站</text></g><g x-show='sceneStep >= 0' class='svg-elem'><line x1='200' y1='470' x2='760' y2='470' class='ink-stroke' stroke-width='4' stroke-linecap='round'/><rect x='180' y='478' width='580' height='16' fill='url(#roadGrad)' opacity='0.6' rx='8'/><line x1='200' y1='460' x2='200' y2='480' class='timeline-tick'/><text x='200' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>6:00</text><line x1='280' y1='460' x2='280' y2='480' class='timeline-tick'/><text x='280' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>6:12</text><line x1='360' y1='460' x2='360' y2='480' class='timeline-tick'/><text x='360' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>6:24</text><line x1='440' y1='460' x2='440' y2='480' class='timeline-tick'/><text x='440' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>6:36</text><line x1='520' y1='460' x2='520' y2='480' class='timeline-tick'/><text x='520' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>6:48</text><line x1='600' y1='460' x2='600' y2='480' class='timeline-tick'/><text x='600' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>7:00</text><line x1='680' y1='460' x2='680' y2='480' class='timeline-tick'/><text x='680' y='500' text-anchor='middle' class='text-cn ink-fill' font-size='16'>7:12</text></g><g x-show='sceneStep >= 0' class='svg-elem'><text x='120' y='420' text-anchor='middle' class='text-cn route1 anim-float' font-size='18' font-weight='bold'>1路</text><circle cx='168' cy='445' r='22' fill='#f7f3e9' stroke='#c45c48' stroke-width='2'/><text x='168' y='455' text-anchor='middle' font-size='36' class='anim-float'>🚌</text></g><g x-show='sceneStep >= 0' class='svg-elem'><text x='120' y='355' text-anchor='middle' class='text-cn route2 anim-float' font-size='18' font-weight='bold'>2路</text><circle cx='168' cy='380' r='22' fill='#f7f3e9' stroke='#5a5a5a' stroke-width='2'/><text x='168' y='390' text-anchor='middle' font-size='36' class='anim-float'>🚌</text></g><path x-show='sceneStep >= 1' class='dashed-line svg-elem' d='M180,440 C260,380 280,240 330,180' x-transition:enter='transition-all ease-out duration-700' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'/><g x-show='sceneStep >= 1' class='svg-elem' x-transition:enter='transition-all ease-out duration-700' x-transition:enter-start='scale-start' x-transition:enter-end='scale-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='scale-end' x-transition:leave-end='scale-start'><rect x='270' y='110' width='140' height='210' rx='10' fill='#f7f3e9' filter='url(#shadow)' stroke='#c45c48' stroke-width='2'/><text x='340' y='140' text-anchor='middle' class='text-cn route1' font-size='20' font-weight='bold'>1路发车</text><text x='340' y='170' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:00</text><text x='340' y='200' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:12</text><text x='340' y='230' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:24</text><text x='340' y='260' text-anchor='middle' class='text-cn cinnabar-fill anim-heartbeat' font-size='18' font-weight='bold'>6:36</text><text x='340' y='290' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:48</text><text x='340' y='320' text-anchor='middle' class='text-cn ink-fill' font-size='18'>7:00</text></g><path x-show='sceneStep >= 2' class='dashed-line svg-elem' d='M180,375 C260,320 480,240 540,180' x-transition:enter='transition-all ease-out duration-700' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'/><g x-show='sceneStep >= 2' class='svg-elem' x-transition:enter='transition-all ease-out duration-700' x-transition:enter-start='scale-start' x-transition:enter-end='scale-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='scale-end' x-transition:leave-end='scale-start'><rect x='500' y='110' width='140' height='210' rx='10' fill='#f7f3e9' filter='url(#shadow)' stroke='#5a5a5a' stroke-width='2'/><text x='570' y='140' text-anchor='middle' class='text-cn route2' font-size='20' font-weight='bold'>2路发车</text><text x='570' y='170' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:00</text><text x='570' y='205' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:18</text><text x='570' y='240' text-anchor='middle' class='text-cn cinnabar-fill anim-heartbeat' font-size='18' font-weight='bold'>6:36</text><text x='570' y='275' text-anchor='middle' class='text-cn ink-fill' font-size='18'>6:54</text><text x='570' y='310' text-anchor='middle' class='text-cn ink-fill' font-size='18'>7:12</text></g><g x-show='sceneStep >= 3' class='svg-elem' x-transition:enter='transition-all ease-out duration-700' x-transition:enter-start='pop-start' x-transition:enter-end='pop-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='pop-end' x-transition:leave-end='pop-start'><line x1='440' y1='110' x2='440' y2='510' stroke='#c45c48' stroke-width='2' stroke-dasharray='6 4' opacity='0.5'/><circle cx='440' cy='470' r='12' fill='#c45c48' filter='url(#glow)' class='anim-heartbeat'/><text x='440' y='475' text-anchor='middle' class='text-cn' fill='#f7f3e9' font-size='14' font-weight='bold'>重</text><text x='470' y='130' text-anchor='start' class='text-cn cinnabar-fill' font-size='20' font-weight='bold'>最早重合 6:36</text></g><foreignObject x='240' y='60' width='320' height='80' x-show='sceneStep >= 4' class='svg-elem' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'><div xmlns='http://www.w3.org/1999/xhtml' style='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f7f3e9;border:2px solid #c45c48;border-radius:12px;padding:10px;box-sizing:border-box;box-shadow:2px 3px 8px rgba(90,90,90,0.2);'><p style='margin:0;font-family:KaiTi,STKaiti,Microsoft YaHei,serif;font-size:17px;color:#5a5a5a;line-height:1.6;text-align:center;'>12 = 2<sup>2</sup> × 3，18 = 2 × 3<sup>2</sup><br/>最小公倍数 = 2<sup>2</sup> × 3<sup>2</sup> = 36（分钟）</p></div></foreignObject><g x-show='sceneStep >= 5' class='svg-elem' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='pop-start' x-transition:enter-end='pop-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='pop-end' x-transition:leave-end='pop-start'><rect x='260' y='535' width='280' height='50' rx='25' fill='#c45c48' filter='url(#shadow)'/><text x='400' y='566' text-anchor='middle' class='text-cn' fill='#f7f3e9' font-size='20' font-weight='bold'>下次同时发车：上午 6:36</text></g><g x-show='sceneStep >= 6' class='svg-elem' x-transition:enter='transition-all ease-out duration-800' x-transition:enter-start='scale-start' x-transition:enter-end='scale-end' x-transition:leave='transition-all ease-in duration-500' x-transition:leave-start='scale-end' x-transition:leave-end='scale-start'><rect x='560' y='535' width='220' height='50' rx='10' fill='#f7f3e9' stroke='#5a5a5a' stroke-width='2'/><text x='670' y='555' text-anchor='middle' class='text-cn ink-fill' font-size='15'>36 ÷ 12 = 3（趟）</text><text x='670' y='575' text-anchor='middle' class='text-cn ink-fill' font-size='15'>36 ÷ 18 = 2（趟）</text><text x='585' y='565' text-anchor='middle' class='text-cn cinnabar-fill' font-size='24' font-weight='bold'>✓</text></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "同时发车",
        "description": "上午6时，1路和2路汽车同时驶出汽车站，开始各自的班次。",
        "bubbleText": "两路车同时出发了！",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "1路车时刻",
        "description": "1路车每隔12分钟发一班车，依次得到6:00、6:12、6:24、6:36……",
        "bubbleText": "把1路车的发车时间一一列出来。",
        "bubblePos": {
            "x": 340,
            "y": 90
        }
    },
    {
        "title": "2路车时刻",
        "description": "2路车每隔18分钟发一班车，依次得到6:00、6:18、6:36、6:54……",
        "bubbleText": "再把2路车的发车时间也列出来。",
        "bubblePos": {
            "x": 570,
            "y": 90
        }
    },
    {
        "title": "寻找重合",

],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
