<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形性质与全等证明 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">正方形性质与全等证明</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('正方形中利用平行与等长条件证明CE与CF相等')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs>\n  <linearGradient id="inkWash" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f7f1e3"/><stop offset="100%" stop-color="#e0d8c8"/></linearGradient>\n  <linearGradient id="cinnabarGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#a93226"/></linearGradient>\n  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#2d3436" flood-opacity="0.25"/></filter>\n  <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>\n</defs>\n<style>\n  .svg-elem { transition: all 0.7s cubic-bezier(0.4,0,0.2,1); transform-box: fill-box; transform-origin: center; }\n  .ink-stroke { stroke:#2d3436; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }\n  .ink-fill { fill:url(#inkWash); }\n  .red-stroke { stroke:url(#cinnabarGrad); stroke-width:3.5; fill:none; stroke-linecap:round; filter:url(#redGlow); }\n  .red-fill { fill:#c0392b; }\n  .label { font-family:"KaiTi","STKaiti",serif; font-size:22px; fill:#2d3436; font-weight:600; }\n  .formula-box { font-family:"KaiTi","STKaiti",serif; font-size:17px; color:#2d3436; background:rgba(247,241,227,0.92); padding:6px 10px; border-radius:6px; border-left:3px solid #c0392b; box-shadow:0 2px 6px rgba(45,52,54,0.15); display:inline-block; white-space:nowrap; }\n  .dashed-line { stroke-dasharray:10 8; animation:flowDash 1.8s linear infinite; }\n  .float-anim { animation:floatY 3s ease-in-out infinite; }\n  .beat-anim { animation:heartbeat 1.4s ease-in-out infinite; }\n  .shimmer-anim { animation:shimmer 2s ease-in-out infinite; }\n  @keyframes flowDash { to { stroke-dashoffset:-36; } }\n  @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }\n  @keyframes heartbeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }\n  @keyframes shimmer { 0%,100%{opacity:0.55;} 50%{opacity:1;} }\n</style>\n<g class="svg-elem" x-show="sceneStep >= 0">\n  <polygon points="200,500 560,500 560,140 200,140" class="ink-fill ink-stroke" filter="url(#softShadow)"/>\n  <text x="170" y="525" class="label float-anim">A</text>\n  <text x="585" y="525" class="label float-anim">B</text>\n  <text x="585" y="125" class="label float-anim">C</text>\n  <text x="170" y="130" class="label float-anim">D</text>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 1" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">\n  <line x1="200" y1="500" x2="560" y2="140" class="ink-stroke" style="stroke:#5d6d7e;stroke-dasharray:4 4"/>\n  <text x="390" y="310" class="label">AC</text>\n</g>\n<g class="svg-elem dashed-line" x-show="sceneStep >= 2 && sceneStep <= 5" x-transition:enter="transition-all duration-1000 ease-in-out" x-transition:enter-start="opacity-0 -translate-x-8" x-transition:enter-end="opacity-100 translate-x-0">\n  <line x1="200" y1="140" x2="340" y2="0" class="ink-stroke" style="stroke:#7f8c8d;stroke-width:2"/>\n  <text x="310" y="60" class="label">DE</text>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 3 && sceneStep <= 4" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100">\n  <path d="M 709.117 500 A 509.117 509.117 0 0 1 331.769 8.231" class="ink-stroke" style="stroke:#c0392b;stroke-dasharray:8 6;filter:url(#redGlow)"/>\n  <text x="380" y="400" class="label shimmer-anim" style="fill:#c0392b">AE = AC</text>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 4" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">\n  <line x1="200" y1="500" x2="331.769" y2="8.231" class="ink-stroke" style="stroke:#5d6d7e"/>\n  <circle cx="331.769" cy="8.231" r="5" class="red-fill"/>\n  <text x="345" y="12" class="label float-anim">E</text>\n  <circle cx="296.462" cy="140" r="5" class="red-fill"/>\n  <text x="300" y="128" class="label float-anim">F</text>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 5" x-transition:enter="transition-all duration-1000 ease-in-out" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100">\n  <line x1="560" y1="140" x2="296.462" y2="140" class="red-stroke beat-anim"/>\n  <line x1="560" y1="140" x2="331.769" y2="8.231" class="red-stroke beat-anim"/>\n  <text x="585" y="90" class="label" style="fill:#c0392b">CE、CF</text>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 5" x-transition:enter="transition-all duration-700 ease-in-out" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">\n  <polygon points="560,140 296.462,140 331.769,8.231" style="fill:#c0392b;fill-opacity:0.08"/>\n</g>\n<g class="svg-elem dashed-line" x-show="sceneStep >= 8" x-transition:enter="transition-all duration-1000 ease-in-out" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">\n  <path d="M 560 140 L 296.462 140 L 331.769 8.231 L 560 140" class="ink-stroke" style="stroke:#c0392b;stroke-width:2;fill:none;opacity:0.6"/>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 7 && sceneStep <= 10" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100">\n  <path d="M 242.426 457.574 A 60 60 0 0 1 215.529 442.044" class="ink-stroke" style="stroke:#c0392b;stroke-width:2.5"/>\n  <foreignObject x="120" y="380" width="130" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">∠EAC = 30°</div></foreignObject>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 8 && sceneStep <= 10" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 translate-x-4" x-transition:enter-end="opacity-100 translate-x-0">\n  <foreignObject x="580" y="80" width="180" height="50"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">AE = AC ⇒ △AEC 等腰</div></foreignObject>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 9 && sceneStep <= 10" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100">\n  <path d="M 528.180 171.820 A 45 45 0 0 1 521.029 117.500" class="ink-stroke" style="stroke:#c0392b;stroke-width:2.5"/>\n  <path d="M 370.740 30.731 A 45 45 0 0 1 320.122 51.698" class="ink-stroke" style="stroke:#c0392b;stroke-width:2.5"/>\n  <foreignObject x="570" y="200" width="150" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">∠AEC = ∠ACE = 75°</div></foreignObject>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 10 && sceneStep <= 10" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100">\n  <path d="M 346.462 140 A 50 50 0 0 1 359.403 91.704" class="ink-stroke" style="stroke:#c0392b;stroke-width:2.5"/>\n  <foreignObject x="360" y="90" width="170" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">∠CFE = ∠CEF = 75°</div></foreignObject>\n</g>\n<g class="svg-elem" x-show="sceneStep >= 11" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 translate-y-6 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100">\n  <foreignObject x="560" y="480" width="220" height="110"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">CF = a(√3−1)<br>CE² = a²(16−8√3)<br>∴ CE = CF ✓</div></foreignObject>\n  <circle cx="380" cy="300" r="70" class="ink-stroke" style="stroke:#c0392b;stroke-width:2;fill:none;opacity:0.25"/>\n  <text x="345" y="310" class="label" style="fill:#c0392b;font-size:28px">得证</text>\n</g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "绘制正方形",
        "description": "建立正方形ABCD，标出四个顶点，奠定全等证明的基础图形。",
        "bubbleText": "正方形ABCD登场，四条边相等、四角为直角。",
        "bubblePos": {
            "x": 220,
            "y": 540
        }
    },
    {
        "title": "画出对角线AC",
        "description": "连接顶点A与C，得到对角线AC，其长度是边长的√2倍。",
        "bubbleText": "AC是正方形的对角线，长度记作d。",
        "bubblePos": {
            "x": 390,
            "y": 310
        }
    },
    {
        "title": "过D作AC的平行线",
        "description": "根据DE // AC，从D出发沿与AC相同方向画一条虚线轨迹，E必在此线上。",
        "bubbleText": "虚线DE与AC平行，E就在这条线上。",
        "bubblePos": {
            "x": 300,
            "y": 80
        }
    },
    {
        "title": "截取AE = AC",
        "description": "以A为圆心、AC为半径画弧，与平行线交于点E，保证AE与AC等长。",
        "bubbleText": "圆规一画，AE与AC等长。",
        "bubblePos": {
            "x": 380,
            "y": 400
        }
    },
    {
        "title": "连接AE并确定交点F",
        "description": "连接A、E，线段AE与CD相交于点F。",
        "bubbleText": "AE穿过CD，交点F出现。",
        "bubblePos": {
            "x": 300,
            "y": 80
        }
    },
    {
        "title": "聚焦目标CE与CF",
        "description": "把CE和CF用朱砂红高亮，明确待证结论：CE = CF。",
        "bubbleText": "红色标出CE、CF，要证CE = CF。",
        "bubblePos": {
            "x": 420,
            "y": 160
        }
    },
    {
        "title": "求出∠EAC = 30°",
        "description": "利用AE = AC与DE // AC的严格约束，可得cos∠EAC = √3⁄2，因此∠EAC = 30°。",
        "bubbleText": "由等长与平行，算出夹角30°。",
        "bubblePos": {
            "x": 150,
            "y": 380
        }
    },
    {
        "title": "识别等腰三角形AEC",
        "description": "因为AE = AC，△AEC是等腰三角形，顶角∠EAC = 30°。",
        "bubbleText": "△AEC两腰相等，底角待定。",
        "bubblePos": {
            "x": 620,
            "y": 100
        }
    },
    {
        "title": "计算底角75°",
        "description": "等腰三角形底角 = (180° − 30°)/2 = 75°，所以∠AEC = ∠ACE = 75°。",
        "bubbleText": "底角都是75°。",
        "bubblePos": {
            "x": 620,
            "y": 220
        }
    },
    {
        "title": "求出∠CFE = 75°",
        "description": "AB // CD，AE为截线，∠CFE与∠FAB对应；∠FAB = 45° + 30° = 75°。",
        "bubbleText": "∠CFE也是75°。",
        "bubblePos": {
            "x": 380,
            "y": 100
        }
    },
    {
        "title": "得出CE = CF",
        "description": "在△CEF中，∠CEF = ∠CFE = 75°，故△CEF为等腰三角形，CE = CF。",
        "bubbleText": "两底角相等，腰长相等。",
        "bubblePos": {
            "x": 380,
            "y": 100
        }
    },
    {
        "title": "验证答案",
        "description": "用坐标法复核：设边长为a，则CF = a(√3−1)，CE² = a²(16−8√3)，两者相等，结论成立。",
        "bubbleText": "代数复核通过，证明无误。",
        "bubblePos": {
            "x": 600,
            "y": 520
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
