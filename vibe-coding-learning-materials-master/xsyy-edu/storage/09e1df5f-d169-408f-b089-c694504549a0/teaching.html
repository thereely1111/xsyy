<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火车过桥问题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">火车过桥问题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('计算火车从车头上桥到车尾离桥所需时间')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='bridgeGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#7a7a7a'/><stop offset='100%' stop-color='#4a4a4a'/></linearGradient><linearGradient id='trainGrad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#d95548'/><stop offset='100%' stop-color='#c23a30'/></linearGradient><linearGradient id='riceGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#f7f3e9'/><stop offset='100%' stop-color='#e8e0d1'/></linearGradient><filter id='dropShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='3' stdDeviation='2' flood-color='#000000' flood-opacity='0.25'/></filter><filter id='cinnabarGlow' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur in='SourceGraphic' stdDeviation='3' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><marker id='arrowRed' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#c23a30'/></marker></defs><style>.svg-elem { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); } .smooth { transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1); } .fade-enter-start { opacity: 0; transform: translateY(20px); } .fade-enter-end { opacity: 1; transform: translateY(0); } .fade-leave-start { opacity: 1; transform: translateY(0); } .fade-leave-end { opacity: 0; transform: translateY(-10px); } .scale-enter-start { opacity: 0; transform: scale(0.5) rotate(-8deg); } .scale-enter-end { opacity: 1; transform: scale(1) rotate(0); } .scale-leave-start { opacity: 1; transform: scale(1); } .scale-leave-end { opacity: 0; transform: scale(0.5); } .math-formula { font-family: 'Noto Serif SC', 'STSong', serif; font-size: 20px; color: #4a4a4a; text-align: center; padding: 10px; background: rgba(247,243,233,0.9); border-radius: 8px; border: 1px solid #c23a30; } .verify-text { font-family: 'Noto Serif SC', serif; font-size: 18px; color: #f7f3e9; text-align: center; padding: 8px; background: #4a4a4a; border-radius: 6px; } .dashed-line { stroke-dasharray: 8 6; animation: dashFlow 1s linear infinite; } @keyframes trainBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } } @keyframes markerPulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.25); opacity: 1; } } @keyframes textShimmer { 0%,100% { opacity: 0.85; } 50% { opacity: 1; text-shadow: 0 0 8px rgba(194,58,48,0.6); } } @keyframes dashFlow { to { stroke-dashoffset: -14; } } .train-bob { animation: trainBob 3s ease-in-out infinite; } .marker-pulse { animation: markerPulse 1.4s ease-in-out infinite; transform-origin: center; } .shimmer-text { animation: textShimmer 2s ease-in-out infinite; }</style><g id='scene-root' width='800' height='600' font-family='Noto Serif SC,STSong,serif'><g class='svg-elem' x-show='sceneStep >= 0'><path d='M0,520 Q200,512 400,516 T800,520 L800,600 L0,600 Z' fill='url(#riceGrad)'/></g><g class='svg-elem' x-show='sceneStep >= 0'><rect x='80' y='438' width='450' height='14' rx='3' fill='url(#bridgeGrad)' filter='url(#dropShadow)'/><g fill='#5b5b5b'><rect x='95' y='432' width='4' height='20'/><rect x='135' y='432' width='4' height='20'/><rect x='175' y='432' width='4' height='20'/><rect x='215' y='432' width='4' height='20'/><rect x='255' y='432' width='4' height='20'/><rect x='295' y='432' width='4' height='20'/><rect x='335' y='432' width='4' height='20'/><rect x='375' y='432' width='4' height='20'/><rect x='415' y='432' width='4' height='20'/><rect x='455' y='432' width='4' height='20'/><rect x='495' y='432' width='4' height='20'/></g><path d='M100,452 L120,452 L110,520 L90,520 Z' fill='#6b6b6b'/><path d='M470,452 L490,452 L500,520 L480,520 Z' fill='#6b6b6b'/><text x='305' y='425' font-size='16' fill='#4a4a4a' text-anchor='middle'>大桥</text></g><g class='svg-elem train-bob' x-show='sceneStep >= 0'><rect x='100' y='400' width='350' height='38' rx='5' fill='url(#trainGrad)' filter='url(#dropShadow)'/><rect x='120' y='408' width='36' height='16' rx='2' fill='#f7f3e9' opacity='0.9'/><rect x='170' y='408' width='36' height='16' rx='2' fill='#f7f3e9' opacity='0.9'/><rect x='220' y='408' width='36' height='16' rx='2' fill='#f7f3e9' opacity='0.9'/><rect x='350' y='385' width='12' height='15' fill='#4a4a4a'/><circle cx='360' cy='378' r='5' fill='#7a7a7a' opacity='0.7'/><circle cx='372' cy='368' r='7' fill='#7a7a7a' opacity='0.5'/><circle cx='388' cy='356' r='9' fill='#7a7a7a' opacity='0.3'/><g fill='#4a4a4a'><circle cx='130' cy='442' r='10'/><circle cx='190' cy='442' r='10'/><circle cx='250' cy='442' r='10'/><circle cx='310' cy='442' r='10'/><circle cx='370' cy='442' r='10'/><circle cx='430' cy='442' r='10'/></g><text x='275' y='425' font-size='14' fill='#f7f3e9' text-anchor='middle'>350米列车</text></g><g class='svg-elem' x-show='sceneStep >= 1'><line x1='450' y1='360' x2='450' y2='470' stroke='#c23a30' stroke-width='2' stroke-dasharray='4 3'/><circle cx='450' cy='355' r='5' fill='#c23a30' class='marker-pulse'/><text x='450' y='348' font-size='16' fill='#c23a30' text-anchor='middle'>车头</text><line x1='100' y1='360' x2='100' y2='470' stroke='#c23a30' stroke-width='2' stroke-dasharray='4 3'/><circle cx='100' cy='355' r='5' fill='#c23a30' class='marker-pulse'/><text x='100' y='348' font-size='16' fill='#c23a30' text-anchor='middle'>车尾</text></g><path class='svg-elem dashed-line' d='M80,365 L530,365' stroke='#c23a30' stroke-width='2' fill='none' marker-end='url(#arrowRed)' x-show='sceneStep >= 1'/><g class='svg-elem' x-show='sceneStep >= 2' x-transition:enter='smooth' x-transition:enter-start='fade-enter-start' x-transition:enter-end='fade-enter-end' x-transition:leave='smooth' x-transition:leave-start='fade-leave-start' x-transition:leave-end='fade-leave-end'><rect x='0' y='60' width='800' height='36' rx='4' fill='#f7f3e9' stroke='#4a4a4a' stroke-width='1' opacity='0.9'/><rect x='0' y='60' width='450' height='36' fill='#4a4a4a' opacity='0.18'/><rect x='450' y='60' width='350' height='36' fill='#c23a30' opacity='0.18'/><line x1='0' y1='94' x2='0' y2='102' stroke='#4a4a4a' stroke-width='2'/><text x='0' y='116' font-size='12' fill='#4a4a4a' text-anchor='middle'>0</text><line x1='450' y1='94' x2='450' y2='102' stroke='#c23a30' stroke-width='2'/><text x='450' y='116' font-size='12' fill='#c23a30' text-anchor='middle'>450</text><line x1='800' y1='94' x2='800' y2='102' stroke='#4a4a4a' stroke-width='2'/><text x='800' y='116' font-size='12' fill='#4a4a4a' text-anchor='middle'>800</text><text x='225' y='52' font-size='14' fill='#4a4a4a' text-anchor='middle'>桥长 450米</text><text x='625' y='52' font-size='14' fill='#c23a30' text-anchor='middle'>车长 350米</text><path class='svg-elem dashed-line' d='M0,78 L800,78' stroke='#c23a30' stroke-width='1.5' fill='none'/></g><foreignObject x='220' y='150' width='360' height='70' class='svg-elem' x-show='sceneStep >= 3' x-transition:enter='smooth' x-transition:enter-start='fade-enter-start' x-transition:enter-end='fade-enter-end' x-transition:leave='smooth' x-transition:leave-start='fade-leave-start' x-transition:leave-end='fade-leave-end'><div class='math-formula' xmlns='http://www.w3.org/1999/xhtml'>总路程 = 450 + 350 = 800（米）</div></foreignObject><foreignObject x='220' y='230' width='360' height='70' class='svg-elem' x-show='sceneStep >= 4' x-transition:enter='smooth' x-transition:enter-start='fade-enter-start' x-transition:enter-end='fade-enter-end' x-transition:leave='smooth' x-transition:leave-start='fade-leave-start' x-transition:leave-end='fade-leave-end'><div class='math-formula' xmlns='http://www.w3.org/1999/xhtml'>时间 = 800 ÷ 16 = 50（秒）</div></foreignObject><g class='svg-elem' x-show='sceneStep >= 4' x-transition:enter='smooth' x-transition:enter-start='scale-enter-start' x-transition:enter-end='scale-enter-end' x-transition:leave='smooth' x-transition:leave-start='scale-leave-start' x-transition:leave-end='scale-leave-end'><rect x='620' y='260' width='80' height='80' rx='8' fill='#c23a30' filter='url(#cinnabarGlow)' transform='rotate(45,660,300)'/><text x='660' y='308' font-size='22' fill='#f7f3e9' text-anchor='middle' class='shimmer-text'>50秒</text></g><foreignObject x='420' y='530' width='360' height='60' class='svg-elem' x-show='sceneStep >= 5' x-transition:enter='smooth' x-transition:enter-start='fade-enter-start' x-transition:enter-end='fade-enter-end' x-transition:leave='smooth' x-transition:leave-start='fade-leave-start' x-transition:leave-end='fade-leave-end'><div class='verify-text' xmlns='http://www.w3.org/1999/xhtml'>验算：50 × 16 = 800（米） = 450 + 350，答案正确</div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "情境引入：火车驶向大桥",
        "description": "一列长350米的火车以16米/秒的速度，即将通过一座长450米的大桥。我们先建立直观的火车与桥的场景。",
        "bubbleText": "火车要过桥啦！",
        "bubblePos": {
            "x": 400,
            "y": 80
        }
    },
    {
        "title": "明确关键：车头上桥到车尾离桥",
        "description": "“火车通过大桥”指的是从火车头上桥开始，到火车尾完全离开大桥为止。这两个端点是解题的关键。",
        "bubbleText": "盯住车头和车尾两个关键点。",
        "bubblePos": {
            "x": 420,
            "y": 260
        }
    },
    {
        "title": "拆解数量：总路程 = 桥长 + 车长",
        "description": "火车完全过桥时，车头不仅要走完450米的桥长，还要再多走一个350米的车身长，因此总路程是两段之和。",
        "bubbleText": "两段路程要相加！",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "列式计算：先求总路程",
        "description": "总路程 = 桥长 + 车长 = 450 + 350 = 800（米）。先算出火车一共需要行驶多少米。",
        "bubbleText": "先算一共要走多少米。",
        "bubblePos": {
            "x": 400,
            "y": 180
        }
    },
    {
        "title": "求解时间：路程 ÷ 速度",
        "description": "已知速度为16米/秒，时间 = 总路程 ÷ 速度 = 800 ÷ 16 = 50（秒）。",
        "bubbleText": "再用总路程除以速度。",
        "bubblePos": {
            "x": 400,
            "y": 200
        }
    },
    {
        "title": "验证答案：50秒能否走800米",
        "description": "验算：50 × 16 = 800（米），正好等于桥长450米加车长350米，说明答案正确。",
        "bubbleText": "验算通过，答案是50秒。",
        "bubblePos": {
            "x": 400,
            "y": 520
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
