<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环形跑道追及相遇 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">环形跑道追及相遇</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('先由同向追及次数求周长，再算反向多次相遇时间')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs>\n  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">\n    <path d="M0,0 L0,6 L9,3 z" fill="#c23531"/>\n  </marker>\n  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">\n    <path d="M0,0 L0,6 L9,3 z" fill="#5a5a5a"/>\n  </marker>\n  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">\n    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2b2b2b" flood-opacity="0.25"/>\n  </filter>\n  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">\n    <feGaussianBlur stdDeviation="2.5" result="blur"/>\n    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>\n  </filter>\n  <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">\n    <stop offset="0%" stop-color="#f2ede3"/>\n    <stop offset="100%" stop-color="#ddd4c2"/>\n  </linearGradient>\n  <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="1">\n    <stop offset="0%" stop-color="#fbf8f1"/>\n    <stop offset="100%" stop-color="#ece5d6"/>\n  </linearGradient>\n</defs>\n<style>\n  .svg-elem { transition: all 0.8s cubic-bezier(0.4,0,0.2,1); transform-box: fill-box; }\n  .ink { fill:#4a4a4a; }\n  .cinnabar { fill:#c23531; }\n  .rice { fill:#f7f2e8; }\n  .ink-stroke { stroke:#5a5a5a; }\n  .formula-card { background:rgba(247,242,232,0.96); border:2px solid #9a9a9a; border-radius:12px; padding:12px 16px; font-family:"Noto Serif SC","Songti SC",serif; color:#4a4a4a; font-size:17px; line-height:1.6; box-shadow:0 6px 18px rgba(0,0,0,0.15); text-align:center; }\n  .formula-card .num { color:#c23531; font-weight:700; font-size:1.1em; }\n  .runner-label { font-family:"Noto Serif SC",serif; font-size:13px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; }\n  .track-text { font-family:"Noto Serif SC",serif; font-size:15px; fill:#4a4a4a; text-anchor:middle; }\n  .dashed-line { fill:none; stroke:#c23531; stroke-width:3; stroke-linecap:round; stroke-dasharray:14,8; animation:flow 1.4s linear infinite; }\n  .float { animation:float 2.6s ease-in-out infinite; }\n  .heartbeat { animation:heartbeat 1.2s ease-in-out infinite; transform-origin:center; }\n  .shimmer { animation:shimmer 1.8s ease-in-out infinite; }\n  .fadedown { opacity:0; transform:translateY(18px); }\n  .fadein { opacity:0; }\n  .visiblenormal { opacity:1; transform:translateY(0); }\n  .zoomstart { opacity:0; transform:scale(0.85); }\n  .zoomend { opacity:1; transform:scale(1); }\n  @keyframes flow { to { stroke-dashoffset:-44; } }\n  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }\n  @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }\n  @keyframes shimmer { 0%,100%{opacity:.55} 50%{opacity:1} }\n</style>\n<g id="track-scene">\n  <circle cx="400" cy="300" r="227" fill="url(#lakeGrad)" class="svg-elem" filter="url(#shadow)"/>\n  <circle cx="400" cy="300" r="278" fill="none" stroke="url(#trackGrad)" stroke-width="42" class="svg-elem"/>\n  <circle cx="400" cy="300" r="299" fill="none" stroke="#7a7a7a" stroke-width="2" class="svg-elem"/>\n  <circle cx="400" cy="300" r="257" fill="none" stroke="#7a7a7a" stroke-width="2" class="svg-elem"/>\n  <line x1="400" y1="43" x2="400" y2="1" stroke="#4a4a4a" stroke-width="3" class="svg-elem"/>\n  <path d="M400 1 L390 14 L410 14 Z" fill="#c23531" class="svg-elem"/>\n  <text x="400" y="32" class="track-text">出发点</text>\n  <g class="svg-elem heartbeat" style="transform-origin:400px 22px">\n    <circle cx="400" cy="22" r="16" fill="#c23531" filter="url(#shadow)"/>\n    <text x="400" y="22" class="runner-label">甲</text>\n  </g>\n  <g class="svg-elem float" style="transform-origin:400px 50px">\n    <circle cx="400" cy="50" r="16" fill="#5a5a5a" filter="url(#shadow)"/>\n    <text x="400" y="50" class="runner-label">乙</text>\n  </g>\n  <g x-show="sceneStep >=0 &amp;&amp; sceneStep <=3" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="fadedown" x-transition:enter-end="visiblenormal" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="visiblenormal" x-transition:leave-end="fadedown">\n    <path d="M 640 170 A 285 285 0 0 1 640 430" fill="none" stroke="#c23531" stroke-width="4" marker-end="url(#arrowRed)" class="svg-elem"/>\n    <path d="M 635 175 A 280 280 0 0 1 635 425" fill="none" stroke="#5a5a5a" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrowGray)" class="svg-elem"/>\n    <text x="690" y="300" class="track-text" style="font-size:16px;fill:#c23531;">同向出发</text>\n  </g>\n  <g x-show="sceneStep >=1 &amp;&amp; sceneStep <=3" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="fadein" x-transition:enter-end="visiblenormal" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="visiblenormal" x-transition:leave-end="fadein">\n    <circle cx="400" cy="300" r="207" fill="none" class="dashed-line svg-elem shimmer"/>\n    <text x="400" y="90" class="track-text" style="fill:#c23531;font-weight:700;">① 450m</text>\n    <text x="597" y="236" class="track-text" style="fill:#c23531;font-weight:700;">② 900m</text>\n    <text x="522" y="468" class="track-text" style="fill:#c23531;font-weight:700;">③ 1350m</text>\n    <text x="278" y="468" class="track-text" style="fill:#c23531;font-weight:700;">④ 1800m</text>\n    <text x="203" y="236" class="track-text" style="fill:#c23531;font-weight:700;">⑤ 2250m</text>\n    <text x="400" y="300" class="track-text" style="font-size:14px;fill:#7a7a7a;">每追一次多跑一圈</text>\n  </g>\n  <foreignObject x="500" y="80" width="270" height="120" x-show="sceneStep ==2" x-transition:enter="transition-all duration-700 ease-out" x-transition:enter-start="zoomstart" x-transition:enter-end="zoomend" x-transition:leave="transition-all duration-500 ease-in" x-transition:leave-start="zoomend" x-transition:leave-end="zoomstart">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula-card">\n      速度差 <span class="num">250−200=50</span> 米/分<br/>\n      45 分钟多跑 <span class="num">50×45=2250</span> 米\n    </div>\n  </foreignObject>\n  <foreignObject x="280" y="420" width="240" height="70" x-show="sceneStep >=3" x-transition:enter="transition-all duration-800 ease-out" x-transition:enter-start="fadedown" x-transition:enter-end="visiblenormal" x-transition:leave="transition-all duration-600 ease-in" x-transition:leave-start="visiblenormal" x-transition:leave-end="fadedown">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula-card">\n      周长 = 2250÷5 = <span class="num">450</span> 米\n    </div>\n  </foreignObject>\n  <path d="M 500 130 Q 460 115 420 100" fill="none" stroke="#c23531" stroke-width="2" stroke-dasharray="6,4" class="dashed-line svg-elem" x-show="sceneStep ==2" style="opacity:.7"/>\n  <g x-show="sceneStep >=4" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="fadein" x-transition:enter-end="visiblenormal" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="visiblenormal" x-transition:leave-end="fadein">\n    <path d="M 640 170 A 285 285 0 0 1 640 430" fill="none" stroke="#c23531" stroke-width="4" marker-end="url(#arrowRed)" class="svg-elem"/>\n    <path d="M 160 170 A 285 285 0 0 0 160 430" fill="none" stroke="#5a5a5a" stroke-width="4" marker-end="url(#arrowGray)" class="svg-elem"/>\n    <text x="110" y="300" class="track-text" style="font-size:16px;fill:#5a5a5a;">反向出发</text>\n    <text x="400" y="75" class="track-text" style="font-size:16px;fill:#c23531;">速度和 250+200=450 米/分</text>\n  </g>\n  <g x-show="sceneStep >=5 &amp;&amp; sceneStep <=6" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="zoomstart" x-transition:enter-end="zoomend" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="zoomend" x-transition:leave-end="zoomstart">\n    <circle cx="400" cy="300" r="187" fill="none" class="dashed-line svg-elem shimmer"/>\n    <circle cx="400" cy="300" r="207" fill="none" class="dashed-line svg-elem shimmer" style="animation-delay:.2s"/>\n    <circle cx="400" cy="300" r="227" fill="none" class="dashed-line svg-elem shimmer" style="animation-delay:.4s"/>\n    <text x="400" y="110" class="track-text" style="fill:#c23531;font-weight:700;">第1圈相遇</text>\n    <text x="400" y="90" class="track-text" style="fill:#c23531;font-weight:700;">第2圈相遇</text>\n    <text x="400" y="70" class="track-text" style="fill:#c23531;font-weight:700;">第3圈相遇</text>\n  </g>\n  <foreignObject x="250" y="460" width="300" height="80" x-show="sceneStep ==6" x-transition:enter="transition-all duration-800 ease-out" x-transition:enter-start="zoomstart" x-transition:enter-end="zoomend" x-transition:leave="transition-all duration-500 ease-in" x-transition:leave-start="zoomend" x-transition:leave-end="zoomstart">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula-card">\n      第3次相遇时间 = <span class="num">450×3÷450=3</span> 分钟\n    </div>\n  </foreignObject>\n  <g x-show="sceneStep ==6" x-transition:enter="transition-all duration-900 ease-out" x-transition:enter-start="zoomstart" x-transition:enter-end="zoomend" x-transition:leave="transition-all duration-500 ease-in" x-transition:leave-start="zoomend" x-transition:leave-end="zoomstart">\n    <circle cx="400" cy="300" r="48" fill="#c23531" filter="url(#glow)" class="svg-elem heartbeat"/>\n    <text x="400" y="305" class="runner-label" style="font-size:20px;">3 分钟</text>\n  </g>\n  <foreignObject x="240" y="480" width="320" height="110" x-show="sceneStep ==7" x-transition:enter="transition-all duration-800 ease-out" x-transition:enter-start="fadedown" x-transition:enter-end="visiblenormal" x-transition:leave="transition-all duration-500 ease-in" x-transition:leave-start="visiblenormal" x-transition:leave-end="fadedown">\n    <div xmlns="http://www.w3.org/1999/xhtml" class="formula-card">\n      验证：周长 <span class="num">450</span> 米<br/>\n      3 次相遇共跑 <span class="num">3×450=1350</span> 米<br/>\n      速度和 <span class="num">450</span> 米/分，时间 <span class="num">3</span> 分钟 ✓\n    </div>\n  </foreignObject>\n  <g x-show="sceneStep ==7" x-transition:enter="transition-all duration-900 ease-out" x-transition:enter-start="zoomstart" x-transition:enter-end="zoomend" x-transition:leave="transition-all duration-500 ease-in" x-transition:leave-start="zoomend" x-transition:leave-end="zoomstart">\n    <circle cx="400" cy="300" r="44" fill="none" stroke="#c23531" stroke-width="3" class="svg-elem heartbeat"/>\n    <text x="400" y="305" class="track-text" style="font-size:20px;fill:#c23531;font-weight:700;">答案：3 分钟</text>\n  </g>\n</g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题意引入",
        "description": "甲、乙两名运动员同时同地同向出发，甲每分钟跑250米，乙每分钟跑200米，经过45分钟甲第5次追上乙。先看清环形跑道、出发点与两名运动员的位置。",
        "bubbleText": "同地同向出发，45分钟第5次追上",
        "bubblePos": {
            "x": 400,
            "y": 40
        }
    },
    {
        "title": "追及规律",
        "description": "在环形跑道上同向而行，甲每追上乙一次，就比乙多跑整整一圈。第5次追上，说明甲比乙多跑了5圈。",

                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
