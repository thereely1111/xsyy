<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加权平均数计算 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">加权平均数计算</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('根据加权平均数关系求男生平均分')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='redWash' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='#d65a5a'/><stop offset='100%' stop-color='#b83a3a'/></linearGradient><linearGradient id='inkWash' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#5a5a5a'/><stop offset='100%' stop-color='#2f2f2f'/></linearGradient><linearGradient id='paperWash' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='#fffdf5'/><stop offset='100%' stop-color='#f3ecd9'/></linearGradient><filter id='softShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='4' stdDeviation='3' flood-color='#000000' flood-opacity='0.18'/></filter><filter id='redGlow' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='4' result='blur'/><feFlood flood-color='#e45c5c' flood-opacity='0.6'/><feComposite in2='blur' operator='in'/><feMerge><feMergeNode/><feMergeNode in='SourceGraphic'/></feMerge></filter><marker id='arrowRed' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#b83a3a'/></marker><symbol id='girlAvatar' viewBox='0 0 40 40'><circle cx='20' cy='20' r='14' fill='url(#redWash)'/><circle cx='14' cy='16' r='2.5' fill='#f9f4e9'/><circle cx='26' cy='16' r='2.5' fill='#f9f4e9'/><path d='M 14 26 Q 20 31 26 26' stroke='#f9f4e9' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='20' cy='6' r='5' fill='#b83a3a'/></symbol><symbol id='boyAvatar' viewBox='0 0 40 40'><circle cx='20' cy='20' r='14' fill='url(#inkWash)'/><circle cx='14' cy='16' r='2.5' fill='#f9f4e9'/><circle cx='26' cy='16' r='2.5' fill='#f9f4e9'/><path d='M 14 26 Q 20 31 26 26' stroke='#f9f4e9' stroke-width='2' fill='none' stroke-linecap='round'/><rect x='10' y='2' width='20' height='8' rx='3' fill='#3f3f3f'/></symbol></defs><style>.ink-text{fill:#3f3f3f;font-family:serif;font-weight:700;text-anchor:middle;}.red-text{fill:#b83a3a;font-family:serif;font-weight:700;text-anchor:middle;}.svg-elem{transition:all 0.8s cubic-bezier(0.4,0,0.2,1);}.axis{stroke:#3f3f3f;stroke-width:2;stroke-linecap:round;}.dashed-line{fill:none;stroke:#b83a3a;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;opacity:0.85;animation:dashFlow 1.2s linear infinite;}.fade-up-enter{transition:all 1s cubic-bezier(0.34,1.56,0.64,1);}.fade-up-enter-from{opacity:0;transform:translateY(25px) scale(0.9);}.fade-up-enter-to{opacity:1;transform:translateY(0) scale(1);}.fade-up-leave{transition:all 0.7s ease-in;}.fade-up-leave-from{opacity:1;}.fade-up-leave-to{opacity:0;transform:translateY(15px) scale(0.92);}@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}@keyframes heartbeat{0%,100%{transform:scale(1);}25%{transform:scale(1.06);}50%{transform:scale(1);}75%{transform:scale(1.04);}}@keyframes dashFlow{to{stroke-dashoffset:-14;}}@keyframes shimmer{0%{opacity:0.7;}50%{opacity:1;}100%{opacity:0.7;}}.float-anim{animation:float 3s ease-in-out infinite;}.pulse-anim{animation:heartbeat 1.6s ease-in-out infinite;}.shimmer-anim{animation:shimmer 2s ease-in-out infinite;}</style><path d='M 120 60 Q 200 25 280 60 T 440 60 T 600 60' fill='none' stroke='#c9beb0' stroke-width='2' stroke-linecap='round' opacity='0.55' class='svg-elem shimmer-anim' x-show='sceneStep >= 0'/><path d='M 180 85 Q 260 60 340 85 T 500 85' fill='none' stroke='#c9beb0' stroke-width='1.5' stroke-linecap='round' opacity='0.4' class='svg-elem' x-show='sceneStep >= 0'/><text x='400' y='55' class='ink-text' font-size='28' filter='url(#softShadow)' x-show='sceneStep >= 0'>运动会得分统计</text><g transform='translate(525,35)' x-show='sceneStep >= 0'><rect x='0' y='0' width='34' height='34' rx='4' fill='#b83a3a' class='pulse-anim' filter='url(#softShadow)'/><text x='17' y='24' fill='#f9f4e9' font-size='17' font-family='serif' font-weight='700' text-anchor='middle'>算</text></g><g x-show='sceneStep >= 2' class='svg-elem'><line x1='400' y1='180' x2='400' y2='520' class='axis'/><line x1='390' y1='180' x2='410' y2='180' class='axis'/><text x='430' y='185' class='ink-text' font-size='14' text-anchor='start'>14分 · 女生平均</text><line x1='390' y1='253' x2='410' y2='253' class='axis' stroke-dasharray='4 4'/><text x='430' y='258' class='red-text' font-size='14' text-anchor='start'>11分 · 全体平均</text><line x1='390' y1='399' x2='410' y2='399' class='axis'/><text x='430' y='404' class='ink-text' font-size='14' text-anchor='start'>5分 · 男生平均</text><line x1='390' y1='520' x2='410' y2='520' class='axis'/><text x='430' y='525' class='ink-text' font-size='14' text-anchor='start'>0分</text></g><line class='dashed-line svg-elem' x1='260' y1='253' x2='540' y2='253' x-show='sceneStep >= 2' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'/><g transform='translate(130,243)' x-show='sceneStep >= 0' class='svg-elem'><text x='101' y='-20' class='red-text' font-size='17'>24名女生 · 平均14分</text><use href='#girlAvatar' x='0' y='0' width='32' height='32'/><use href='#girlAvatar' x='34' y='0' width='32' height='32'/><use href='#girlAvatar' x='68' y='0' width='32' height='32'/><use href='#girlAvatar' x='102' y='0' width='32' height='32'/><use href='#girlAvatar' x='136' y='0' width='32' height='32'/><use href='#girlAvatar' x='170' y='0' width='32' height='32'/><use href='#girlAvatar' x='0' y='34' width='32' height='32'/><use href='#girlAvatar' x='34' y='34' width='32' height='32'/><use href='#girlAvatar' x='68' y='34' width='32' height='32'/><use href='#girlAvatar' x='102' y='34' width='32' height='32'/><use href='#girlAvatar' x='136' y='34' width='32' height='32'/><use href='#girlAvatar' x='170' y='34' width='32' height='32'/><use href='#girlAvatar' x='0' y='68' width='32' height='32'/><use href='#girlAvatar' x='34' y='68' width='32' height='32'/><use href='#girlAvatar' x='68' y='68' width='32' height='32'/><use href='#girlAvatar' x='102' y='68' width='32' height='32'/><use href='#girlAvatar' x='136' y='68' width='32' height='32'/><use href='#girlAvatar' x='170' y='68' width='32' height='32'/><use href='#girlAvatar' x='0' y='102' width='32' height='32'/><use href='#girlAvatar' x='34' y='102' width='32' height='32'/><use href='#girlAvatar' x='68' y='102' width='32' height='32'/><use href='#girlAvatar' x='102' y='102' width='32' height='32'/><use href='#girlAvatar' x='136' y='102' width='32' height='32'/><use href='#girlAvatar' x='170' y='102' width='32' height='32'/></g><g transform='translate(555,345)' x-show='sceneStep >= 0' class='svg-elem'><text x='70' y='-18' class='ink-text' font-size='17'>12名男生</text><use href='#boyAvatar' x='0' y='0' width='32' height='32'/><use href='#boyAvatar' x='36' y='0' width='32' height='32'/><use href='#boyAvatar' x='72' y='0' width='32' height='32'/><use href='#boyAvatar' x='108' y='0' width='32' height='32'/><use href='#boyAvatar' x='0' y='36' width='32' height='32'/><use href='#boyAvatar' x='36' y='36' width='32' height='32'/><use href='#boyAvatar' x='72' y='36' width='32' height='32'/><use href='#boyAvatar' x='108' y='36' width='32' height='32'/><use href='#boyAvatar' x='0' y='72' width='32' height='32'/><use href='#boyAvatar' x='36' y='72' width='32' height='32'/><use href='#boyAvatar' x='72' y='72' width='32' height='32'/><use href='#boyAvatar' x='108' y='72' width='32' height='32'/><text x='70' y='130' class='ink-text' font-size='16' x-show='sceneStep <= 3'>平均？分</text></g><path class='dashed-line svg-elem' d='M 220 245 C 340 200, 340 399, 620 399' x-show='sceneStep >= 3' marker-end='url(#arrowRed)' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'/><ellipse cx='220' cy='245' rx='28' ry='12' fill='#e45c5c' opacity='0.35' filter='url(#redGlow)' class='float-anim' x-show='sceneStep >= 3' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'/><g transform='translate(560,365)' x-show='sceneStep >= 4' class='svg-elem pulse-anim' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><rect x='0' y='0' width='160' height='56' rx='10' fill='url(#redWash)' filter='url(#softShadow)'/><text x='80' y='34' fill='#f9f4e9' font-size='20' font-family='serif' font-weight='700' text-anchor='middle'>男生平均 5分</text></g><foreignObject x='40' y='110' width='220' height='80' x-show='sceneStep === 1' class='svg-elem' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f9f4e9;border-left:4px solid #b83a3a;border-radius:6px;box-shadow:0 4px 12px rgba(63,63,63,0.12);padding:10px;font-family:serif;color:#3f3f3f;font-size:16px;line-height:1.5;text-align:center;'>女生总得分<br/>24 × 14 = 336（分）</div></foreignObject><foreignObject x='290' y='90' width='220' height='80' x-show='sceneStep === 2' class='svg-elem' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f9f4e9;border-left:4px solid #b83a3a;border-radius:6px;box-shadow:0 4px 12px rgba(63,63,63,0.12);padding:10px;font-family:serif;color:#3f3f3f;font-size:16px;line-height:1.5;text-align:center;'>全体总得分<br/>(24+12) × 11 = 396（分）</div></foreignObject><foreignObject x='280' y='90' width='240' height='95' x-show='sceneStep === 3' class='svg-elem' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f9f4e9;border-left:4px solid #b83a3a;border-radius:6px;box-shadow:0 4px 12px rgba(63,63,63,0.12);padding:10px;font-family:serif;color:#3f3f3f;font-size:16px;line-height:1.5;text-align:center;'>移多补少<br/>24 × (14−11) = 72（分）<br/>补给12名男生</div></foreignObject><foreignObject x='560' y='110' width='220' height='95' x-show='sceneStep === 4' class='svg-elem' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f9f4e9;border-left:4px solid #b83a3a;border-radius:6px;box-shadow:0 4px 12px rgba(63,63,63,0.12);padding:10px;font-family:serif;color:#3f3f3f;font-size:16px;line-height:1.5;text-align:center;'>男生总得分<br/>396 − 336 = 60（分）<br/>60 ÷ 12 = 5（分）</div></foreignObject><foreignObject x='230' y='500' width='340' height='70' x-show='sceneStep >= 5' class='svg-elem' x-transition:enter='fade-up-enter' x-transition:enter-start='fade-up-enter-from' x-transition:enter-end='fade-up-enter-to' x-transition:leave='fade-up-leave' x-transition:leave-start='fade-up-leave-from' x-transition:leave-end='fade-up-leave-to'><div xmlns='http://www.w3.org/1999/xhtml' style='background:#f9f4e9;border-left:4px solid #b83a3a;border-radius:6px;box-shadow:0 4px 12px rgba(63,63,63,0.12);padding:10px;font-family:serif;color:#3f3f3f;font-size:16px;line-height:1.5;text-align:center;'>验证：(24×14+12×5)÷(24+12)=396÷36=11（分）✓</div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题识量",
        "description": "画面呈现四年级二班参赛情况：24名女生、12名男生，女生平均分14分，全体参赛学生平均分11分，需要求男生的平均得分。",
        "bubbleText": "先看清楚题目给出的数量和两个平均分。",
        "bubblePos": {
            "x": 400,
            "y": 100
        }
    },
    {
        "title": "计算女生总得分",
        "description": "24名女生，每人平均14分，女生总得分等于人数乘以平均分：24×14=336分。",
        "bubbleText": "用女生人数乘女生平均分，得到女生总得分。",
        "bubblePos": {
            "x": 150,
            "y": 140
        }
    },
    {
        "title": "计算全体总得分",
        "description": "参赛总人数为24+12=36人，全体平均分为11分，全体总得分等于36×11=396分。",
        "bubbleText": "用总人数乘全体平均分，得到所有人的总得分。",
        "bubblePos": {
            "x": 400,
            "y": 130
        }
    },
    {
        "title": "移多补少",
        "description": "女生平均分14分比全体平均分11分高3分，24名女生一共多出24×3=72分；这72分正好补给男生，使全体平均分达到11分。",
        "bubbleText": "女生多出的分数，会补给平均分较低的男生。",
        "bubblePos": {
            "x": 400,
            "y": 160
        }
    },
    {
        "title": "求男生平均分",
        "description": "男生总得分等于全体总得分减去女生总得分：396−336=60分；再把60分平均分给12名男生，60÷12=5分。",
        "bubbleText": "先求男生总得分，再除以男生人数。",
        "bubblePos": {
            "x": 650,
            "y": 140
        }
    },
    {
        "title": "验证答案",
        "description": "代入验证：(24×14+12×5)÷(24+12)=396÷36=11分，与题目给出的全体平均分完全一致，答案正确。",
        "bubbleText": "把结果代回题目检验，看全体平均分是否等于11分。",
        "bubblePos": {
            "x": 400,
            "y": 540
        }
    },
    {
        "title": "数轴对应",
        "description": "在得分数轴上，女生平均14分位于上方，全体平均11分居中，男生平均5分位于下方，三者的高低关系直观体现了“移多补少”的加权平均思想。",
        "bubbleText": "数轴上也能看出：男生平均低于全体平均。",
        "bubblePos": {
            "x": 650,
            "y": 430
        }
    },
    {
        "title": "得出结论",
        "description": "因此，四年级二班参加运动会的男生平均得分是5分。",
        "bubbleText": "最终答案：男生的平均得分是5分。",
        "bubblePos": {
            "x": 640,
            "y": 360
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
