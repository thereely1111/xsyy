<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形拼接与旋转 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">图形拼接与旋转</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('4个图形总面积为13格，目标图形面积仅12格，面积不相等，因此无论怎么旋转都不能拼成。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- === Step 1: 认识题目 - 展示所有图形和目标 (sceneStep >= 1) === -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- 左侧标题 -->
                                <foreignObject x="30" y="15" width="300" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Noto Serif SC',serif;font-size:16px;font-weight:bold;color:#44403c;">4个小图形：</div>
                                </foreignObject>

                                <!-- 图形① 红色 T-like: 竖3格+右中1格 -->
                                <polygon points="50,60 85,60 85,95 120,95 120,130 85,130 85,165 50,165" fill="#dc2626" fill-opacity="0.85" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="52" y="168" width="80" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#991b1b;font-weight:bold;">①</div>
                                </foreignObject>

                                <!-- 图形② 绿色 竖2格 -->
                                <polygon points="190,60 225,60 225,130 190,130" fill="#16a34a" fill-opacity="0.85" stroke="#166534" stroke-width="1.5"/>
                                <foreignObject x="192" y="133" width="50" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#166534;font-weight:bold;">②</div>
                                </foreignObject>

                                <!-- 图形③ 紫色 横3格 -->
                                <polygon points="50,240 155,240 155,275 50,275" fill="#7c3aed" fill-opacity="0.85" stroke="#5b21b6" stroke-width="1.5"/>
                                <foreignObject x="52" y="278" width="50" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#5b21b6;font-weight:bold;">③</div>
                                </foreignObject>

                                <!-- 图形④ 黄色 L形 -->
                                <polygon points="190,230 260,230 260,265 225,265 225,335 190,335" fill="#d97706" fill-opacity="0.85" stroke="#92400e" stroke-width="1.5"/>
                                <foreignObject x="192" y="338" width="50" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#92400e;font-weight:bold;">④</div>
                                </foreignObject>

                                <!-- 箭头指向目标 -->
                                <line x1="310" y1="180" x2="420" y2="180" stroke="#a8a29e" stroke-width="2" marker-end="url(#arrow)"/>
                                <foreignObject x="320" y="155" width="100" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#78716c;text-align:center;">拼成？</div>
                                </foreignObject>

                                <!-- 右侧标题 -->
                                <foreignObject x="460" y="15" width="300" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Noto Serif SC',serif;font-size:16px;font-weight:bold;color:#44403c;">目标大图形：</div>
                                </foreignObject>

                                <!-- 目标图形轮廓 (12格不规则形状) -->
                                <polygon points="500,60 570,60 570,130 640,130 640,165 605,165 605,200 570,200 570,235 535,235 535,200 500,200" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
                            </g>

                            <!-- === Step 2: 数图形①② (sceneStep >= 2) === -->
                            <g x-show="sceneStep >= 2" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- ①高亮框 -->
                                <rect x="45" y="55" width="80" height="115" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,3" rx="4"/>
                                <!-- ①格子数标注 -->
                                <foreignObject x="125" y="85" width="90" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#dc2626;font-weight:bold;">= 4格</div>
                                </foreignObject>
                                <!-- ①内部格线 -->
                                <line x1="50" y1="95" x2="85" y2="95" stroke="#991b1b" stroke-width="0.8" stroke-opacity="0.6"/>
                                <line x1="50" y1="130" x2="85" y2="130" stroke="#991b1b" stroke-width="0.8" stroke-opacity="0.6"/>
                                <line x1="85" y1="95" x2="85" y2="130" stroke="#991b1b" stroke-width="0.8" stroke-opacity="0.6"/>

                                <!-- ②高亮框 -->
                                <rect x="185" y="55" width="45" height="80" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,3" rx="4"/>
                                <!-- ②格子数标注 -->
                                <foreignObject x="235" y="80" width="90" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#16a34a;font-weight:bold;">= 2格</div>
                                </foreignObject>
                                <!-- ②内部格线 -->
                                <line x1="190" y1="95" x2="225" y2="95" stroke="#166534" stroke-width="0.8" stroke-opacity="0.6"/>
                            </g>

                            <!-- === Step 3: 数图形③④ (sceneStep >= 3) === -->
                            <g x-show="sceneStep >= 3" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- ③高亮框 -->
                                <rect x="45" y="235" width="115" height="45" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,3" rx="4"/>
                                <!-- ③格子数标注 -->
                                <foreignObject x="165" y="242" width="90" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#7c3aed;font-weight:bold;">= 3格</div>
                                </foreignObject>
                                <!-- ③内部格线 -->
                                <line x1="85" y1="240" x2="85" y2="275" stroke="#5b21b6" stroke-width="0.8" stroke-opacity="0.6"/>
                                <line x1="120" y1="240" x2="120" y2="275" stroke="#5b21b6" stroke-width="0.8" stroke-opacity="0.6"/>

                                <!-- ④高亮框 -->
                                <rect x="185" y="225" width="80" height="115" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,3" rx="4"/>
                                <!-- ④格子数标注 -->
                                <foreignObject x="270" y="265" width="90" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#d97706;font-weight:bold;">= 4格</div>
                                </foreignObject>
                                <!-- ④内部格线 -->
                                <line x1="190" y1="265" x2="260" y2="265" stroke="#92400e" stroke-width="0.8" stroke-opacity="0.6"/>
                                <line x1="190" y1="300" x2="225" y2="300" stroke="#92400e" stroke-width="0.8" stroke-opacity="0.6"/>
                                <line x1="225" y1="230" x2="225" y2="265" stroke="#92400e" stroke-width="0.8" stroke-opacity="0.6"/>
                            </g>

                            <!-- === Step 4: 计算总面积 (sceneStep >= 4) === -->
                            <g x-show="sceneStep >= 4" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- 面积计算框 -->
                                <rect x="40" y="390" width="310" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
                                <foreignObject x="55" y="398" width="280" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#44403c;font-weight:bold;">总面积计算：</div>
                                </foreignObject>
                                <foreignObject x="55" y="430" width="280" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#dc2626;font-weight:bold;" x-html="renderMath('$4 + 2 + 3 + 4 = 13$ 格')"></div>
                                </foreignObject>
                                <!-- 虚线轨迹：从各图形汇聚到计算框 -->
                                <path d="M85,170 C85,300 120,350 150,390" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.5"/>
                                <path d="M207,135 C207,280 180,340 180,390" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.5"/>
                            </g>

                            <!-- === Step 5: 数目标图形面积 (sceneStep >= 5) === -->
                            <g x-show="sceneStep >= 5" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- 目标图形内部格线 -->
                                <!-- 水平线 -->
                                <line x1="500" y1="95" x2="570" y2="95" stroke="#57534e" stroke-width="0.8"/>
                                <line x1="500" y1="130" x2="640" y2="130" stroke="#57534e" stroke-width="0.8"/>
                                <line x1="500" y1="165" x2="605" y2="165" stroke="#57534e" stroke-width="0.8"/>
                                <line x1="535" y1="200" x2="570" y2="200" stroke="#57534e" stroke-width="0.8"/>
                                <!-- 垂直线 -->
                                <line x1="535" y1="60" x2="535" y2="235" stroke="#57534e" stroke-width="0.8"/>
                                <line x1="570" y1="60" x2="570" y2="235" stroke="#57534e" stroke-width="0.8"/>
                                <line x1="605" y1="130" x2="605" y2="165" stroke="#57534e" stroke-width="0.8"/>

                                <!-- 目标面积标注 -->
                                <rect x="460" y="260" width="230" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
                                <foreignObject x="475" y="268" width="200" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#44403c;font-weight:bold;">目标图形面积：</div>
                                </foreignObject>
                                <foreignObject x="475" y="296" width="200" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#16a34a;font-weight:bold;" x-html="renderMath('$2+2+4+3+1 = 12$ 格')"></div>
                                </foreignObject>

                                <!-- 逐行计数标注 -->
                                <foreignObject x="645" y="63" width="50" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#78716c;">2格</div>
                                </foreignObject>
                                <foreignObject x="645" y="98" width="50" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#78716c;">2格</div>
                                </foreignObject>
                                <foreignObject x="645" y="133" width="50" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#78716c;">4格</div>
                                </foreignObject>
                                <foreignObject x="610" y="168" width="50" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#78716c;">3格</div>
                                </foreignObject>
                                <foreignObject x="575" y="203" width="50" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#78716c;">1格</div>
                                </foreignObject>
                            </g>

                            <!-- === Step 6: 比较面积 (sceneStep >= 6) === -->
                            <g x-show="sceneStep >= 6" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- 比较框 -->
                                <rect x="250" y="490" width="300" height="70" rx="12" fill="#fef2f2" stroke="#8a1c1c" stroke-width="2"/>
                                <foreignObject x="270" y="500" width="260" height="55">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px;color:#8a1c1c;font-weight:bold;text-align:center;line-height:2;" x-html="renderMath('$13 \\neq 12$，面积不相等！')"></div>
                                </foreignObject>
                                <!-- 虚线连接：13到比较框 -->
                                <path d="M195,470 C220,485 240,490 260,500" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.6"/>
                                <!-- 虚线连接：12到比较框 -->
                                <path d="M570,330 C560,420 540,470 530,490" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.6"/>
                                <!-- 不等号强调 -->
                                <circle cx="400" cy="480" r="15" fill="none" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="4,2"/>
                                <foreignObject x="390" y="468" width="25" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#8a1c1c;font-weight:bold;text-align:center;">≠</div>
                                </foreignObject>
                            </g>

                            <!-- === Step 7: 得出结论 (sceneStep >= 7) === -->
                            <g x-show="sceneStep >= 7" x-transition:enter="transition ease-out duration-700" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                                <!-- 结论框 -->
                                <rect x="200" y="370" width="400" height="90" rx="14" fill="#8a1c1c" fill-opacity="0.95" stroke="#450a0a" stroke-width="2"/>
                                <foreignObject x="220" y="380" width="360" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px;color:#ffffff;font-weight:bold;text-align:center;font-family:'Noto Serif SC',serif;">答案：B. 不能</div>
                                </foreignObject>
                                <foreignObject x="220" y="418" width="360" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#fecaca;text-align:center;">面积13格 &gt; 12格，多出1格，无论怎么旋转都拼不成！</div>
                                </foreignObject>
                                <!-- 对目标图形打叉 -->
                                <line x1="505" y1="65" x2="635" y2="230" stroke="#dc2626" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
                                <line x1="635" y1="65" x2="505" y2="230" stroke="#dc2626" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [{"title":"认识题目","description":"观察左边的4个小图形（①红色4格、②绿色2格、③紫色3格、④黄色4格）和右边的目标大图形。题目要求：全部使用，只能旋转，不能翻转。","bubbleText":"我们先来看看这道题。左边有4个彩色小图形，右边是一个不规则的大图形。题目问能不能把4个小图形拼成右边那个大图形。注意哦，只能转方向，不能翻面！","bubblePos":{"x":30,"y":30}},{"title":"数图形①②的面积","description":"图形①是T形，占 $4$ 个小格；图形②是竖条，占 $2$ 个小格。","bubbleText":"解题关键来了！我们先不急着拼，先数一数每个图形占多少个小格子。图形①像个T字，数一数：1、2、3、4，一共4格。图形②是个小竖条，1、2，只有2格。","bubblePos":{"x":30,"y":50}},{"title":"数图形③④的面积","description":"图形③是横条，占 $3$ 个小格；图形④是L形，占 $4$ 个小格。","bubbleText":"继续数！图形③是个横着的长条，1、2、3，共3格。图形④是个L形，1、2、3、4，共4格。好，四个图形的格数都数清楚了。","bubblePos":{"x":30,"y":220}},{"title":"计算总面积","description":"四个图形总面积：$4 + 2 + 3 + 4 = 13$（格）。","bubbleText":"现在把四个图形的格数加起来：4加2加3加4，等于13格。也就是说，如果真能拼成，那目标图形也必须刚好是13格才行。","bubblePos":{"x":40,"y":380}},{"title":"数目标图形的面积","description":"目标图形逐行计数：$2 + 2 + 4 + 3 + 1 = 12$（格）。","bubbleText":"我们来数右边的大图形。从上往下一行行数：第一行2格，第二行2格，第三行4格，第四行3格，第五行1格。加起来：2+2+4+3+1=12格。","bubblePos":{"x":450,"y":250}},{"title":"比较面积","description":"小图形总面积 $13$ 格 $\\neq$ 目标图形面积 $12$ 格，面积不匹配。","bubbleText":"关键对比来了！小图形一共13格，大图形只有12格。13不等于12，多出了1格！这就好比你有13块饼干，但盒子只能装12块，怎么摆都多一块。","bubblePos":{"x":250,"y":420}},{"title":"得出结论","description":"因为 $13 \\neq 12$，面积不相等，所以无论怎么旋转都**不能**拼成。答案选 **B**。","bubbleText":"所以答案是B，不能！记住这个妙招：遇到拼接题，先数面积。面积对不上，就不用费劲去拼了，直接判断不能。这就是面积守恒的道理。","bubblePos":{"x":220,"y":300}}],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
