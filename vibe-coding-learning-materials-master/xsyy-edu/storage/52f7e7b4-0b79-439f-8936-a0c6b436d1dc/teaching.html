<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆周长与面积计算 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">圆周长与面积计算</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('已知半径，利用圆周率求圆周长与圆面积')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='paperGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#fffdf5'/><stop offset='100%' stop-color='#ede9dc'/></linearGradient><linearGradient id='redGrad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#d64b41'/><stop offset='100%' stop-color='#a12d24'/></linearGradient><filter id='inkShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='3' dy='5' stdDeviation='4' flood-color='#2b2b2b' flood-opacity='0.22'/></filter><filter id='cinnabarGlow' x='-40%' y='-40%' width='180%' height='180%'><feGaussianBlur stdDeviation='5' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><marker id='arrowRed' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#a12d24'/></marker></defs><style>.svg-elem { transition: all 800ms cubic-bezier(0.34,1.56,0.64,1); } .ink-text { fill:#2b2b2b; font-family:'KaiTi','STKaiti',serif; } .red-text { fill:#a12d24; font-family:'KaiTi','STKaiti',serif; } .dashed-line { fill:none; stroke:url(#redGrad); stroke-width:2.5; stroke-dasharray:10 6; marker-end:url(#arrowRed); filter:url(#cinnabarGlow); } .shimmer-active { animation: shimmer 1.2s linear infinite; } .formula-box { background:rgba(255,253,245,0.96); border-left:5px solid #c23a30; border-radius:10px; padding:12px 16px; color:#2b2b2b; font-family:'KaiTi','STKaiti',serif; font-size:20px; box-shadow:3px 5px 12px rgba(43,43,43,0.18); line-height:1.6; } .hint-box { background:rgba(255,253,245,0.9); border-radius:8px; padding:10px 14px; color:#2b2b2b; font-family:'KaiTi','STKaiti',serif; font-size:20px; display:inline-block; } @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} } @keyframes heartbeat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.08)} 28%{transform:scale(1)} 42%{transform:scale(1.05)} 70%{transform:scale(1)} } @keyframes shimmer { 0%{stroke-dashoffset:32} 100%{stroke-dashoffset:0} } @keyframes sealStamp { 0%{transform:scale(2.2); opacity:0} 45%{transform:scale(0.92); opacity:1} 65%{transform:scale(1.06)} 100%{transform:scale(1); opacity:1} } .floatAnim { animation: float 3s ease-in-out infinite; } .heartbeat { animation: heartbeat 1.2s ease-in-out infinite; transform-origin:center; } .stampAnim { animation: sealStamp 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards; transform-origin:30px 30px; } .slideUpEnter { transition: all 900ms cubic-bezier(0.34,1.56,0.64,1); } .slideUpEnterStart { opacity:0; transform:translateY(45px) scale(0.9); } .slideUpEnterEnd { opacity:1; transform:translateY(0) scale(1); } .slideUpLeave { transition: all 600ms ease-in; } .slideUpLeaveStart { opacity:1; transform:scale(1); } .slideUpLeaveEnd { opacity:0; transform:translateY(-25px) scale(0.85); } .zoomInEnter { transition: all 850ms cubic-bezier(0.34,1.56,0.64,1); } .zoomInEnterStart { opacity:0; transform:scale(0.45) rotate(-6deg); } .zoomInEnterEnd { opacity:1; transform:scale(1) rotate(0deg); } .zoomInLeave { transition: all 550ms ease-in; } .zoomInLeaveStart { opacity:1; transform:scale(1); } .zoomInLeaveEnd { opacity:0; transform:scale(0.75); } .fadeSlideEnter { transition: all 800ms cubic-bezier(0.34,1.56,0.64,1); } .fadeSlideEnterStart { opacity:0; transform:translateX(-40px); } .fadeSlideEnterEnd { opacity:1; transform:translateX(0); } .fadeSlideLeave { transition: all 500ms ease-in; } .fadeSlideLeaveStart { opacity:1; transform:translateX(0); } .fadeSlideLeaveEnd { opacity:0; transform:translateX(40px); }</style><g class='svg-elem' x-show='sceneStep >= 0' x-transition:enter='fadeSlideEnter' x-transition:enter-start='fadeSlideEnterStart' x-transition:enter-end='fadeSlideEnterEnd' x-transition:leave='fadeSlideLeave' x-transition:leave-start='fadeSlideLeaveStart' x-transition:leave-end='fadeSlideLeaveEnd'><foreignObject x='250' y='45' width='300' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='hint-box floatAnim'>已知：圆的半径 r = 5 厘米</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 0' x-transition:enter='zoomInEnter' x-transition:enter-start='zoomInEnterStart' x-transition:enter-end='zoomInEnterEnd' x-transition:leave='zoomInLeave' x-transition:leave-start='zoomInLeaveStart' x-transition:leave-end='zoomInLeaveEnd'><circle cx='400' cy='300' r='150' fill='url(#paperGrad)' stroke='#2b2b2b' stroke-width='3' filter='url(#inkShadow)'/><circle cx='400' cy='300' r='4' fill='#a12d24'/><text x='392' y='295' class='ink-text' font-size='18'>O</text></g><g class='svg-elem' x-show='sceneStep >= 1' x-transition:enter='slideUpEnter' x-transition:enter-start='slideUpEnterStart' x-transition:enter-end='slideUpEnterEnd' x-transition:leave='slideUpLeave' x-transition:leave-start='slideUpLeaveStart' x-transition:leave-end='slideUpLeaveEnd'><line x1='400' y1='300' x2='550' y2='300' stroke='#a12d24' stroke-width='4' stroke-linecap='round' filter='url(#cinnabarGlow)' :class='{heartbeat: sceneStep===1 || sceneStep===3 || sceneStep===5}' style='transform-origin:475px 300px'/><circle cx='550' cy='300' r='5' fill='#a12d24'/><text x='465' y='285' class='red-text' font-size='20' font-weight='bold'>r = 5 cm</text></g><g class='svg-elem' x-show='sceneStep === 2' x-transition:enter='slideUpEnter' x-transition:enter-start='slideUpEnterStart' x-transition:enter-end='slideUpEnterEnd' x-transition:leave='slideUpLeave' x-transition:leave-start='slideUpLeaveStart' x-transition:leave-end='slideUpLeaveEnd'><foreignObject x='560' y='140' width='230' height='80'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{floatAnim: sceneStep===2}'>圆的周长公式：<br/>C = 2πr</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 3' x-transition:enter='zoomInEnter' x-transition:enter-start='zoomInEnterStart' x-transition:enter-end='zoomInEnterEnd' x-transition:leave='zoomInLeave' x-transition:leave-start='zoomInLeaveStart' x-transition:leave-end='zoomInLeaveEnd'><foreignObject x='560' y='140' width='230' height='100'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{heartbeat: sceneStep===3}'>代入计算：<br/>C = 2×3.14×5<br/>= 31.4 cm</div></foreignObject></g><path class='dashed-line shimmer-active svg-elem' d='M 555 300 Q 620 250 620 180' x-show='sceneStep >= 3 && sceneStep <= 4' x-transition:enter='fadeSlideEnter' x-transition:enter-start='fadeSlideEnterStart' x-transition:enter-end='fadeSlideEnterEnd' x-transition:leave='fadeSlideLeave' x-transition:leave-start='fadeSlideLeaveStart' x-transition:leave-end='fadeSlideLeaveEnd'/><g class='svg-elem' x-show='sceneStep === 4' x-transition:enter='slideUpEnter' x-transition:enter-start='slideUpEnterStart' x-transition:enter-end='slideUpEnterEnd' x-transition:leave='slideUpLeave' x-transition:leave-start='slideUpLeaveStart' x-transition:leave-end='slideUpLeaveEnd'><foreignObject x='560' y='360' width='230' height='80'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{floatAnim: sceneStep===4}'>圆的面积公式：<br/>S = πr²</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 5' x-transition:enter='zoomInEnter' x-transition:enter-start='zoomInEnterStart' x-transition:enter-end='zoomInEnterEnd' x-transition:leave='zoomInLeave' x-transition:leave-start='zoomInLeaveStart' x-transition:leave-end='zoomInLeaveEnd'><foreignObject x='560' y='360' width='230' height='100'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{heartbeat: sceneStep===5}'>代入计算：<br/>S = 3.14×5²<br/>= 78.5 cm²</div></foreignObject></g><path class='dashed-line shimmer-active svg-elem' d='M 555 300 Q 620 340 620 390' x-show='sceneStep >= 5' x-transition:enter='fadeSlideEnter' x-transition:enter-start='fadeSlideEnterStart' x-transition:enter-end='fadeSlideEnterEnd' x-transition:leave='fadeSlideLeave' x-transition:leave-start='fadeSlideLeaveStart' x-transition:leave-end='fadeSlideLeaveEnd'/><g class='svg-elem' x-show='sceneStep >= 6' x-transition:enter='zoomInEnter' x-transition:enter-start='zoomInEnterStart' x-transition:enter-end='zoomInEnterEnd' x-transition:leave='zoomInLeave' x-transition:leave-start='zoomInLeaveStart' x-transition:leave-end='zoomInLeaveEnd'><foreignObject x='250' y='470' width='300' height='90'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{heartbeat: sceneStep===6}'><div style='display:flex;justify-content:space-between;'><span style='color:#a12d24'>周长</span><span>31.4 cm</span></div><div style='display:flex;justify-content:space-between;'><span style='color:#a12d24'>面积</span><span>78.5 cm²</span></div><div style='font-size:16px;color:#666;margin-top:4px;'>单位不同，不可直接比较</div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 7' x-transition:enter='fadeSlideEnter' x-transition:enter-start='fadeSlideEnterStart' x-transition:enter-end='fadeSlideEnterEnd' x-transition:leave='fadeSlideLeave' x-transition:leave-start='fadeSlideLeaveStart' x-transition:leave-end='fadeSlideLeaveEnd'><foreignObject x='40' y='470' width='320' height='110'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' :class='{heartbeat: sceneStep===7}'>答案验证：<br/>31.4 ÷ (2×3.14) = 5 ✓<br/>78.5 ÷ 3.14 = 25，√25 = 5 ✓</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 7' x-transition:enter='zoomInEnter' x-transition:enter-start='zoomInEnterStart' x-transition:enter-end='zoomInEnterEnd' x-transition:leave='zoomInLeave' x-transition:leave-start='zoomInLeaveStart' x-transition:leave-end='zoomInLeaveEnd'><g transform='translate(720,520)' :class='{stampAnim: sceneStep===7}'><rect x='0' y='0' width='60' height='60' rx='8' fill='url(#redGrad)' filter='url(#cinnabarGlow)'/><text x='30' y='40' text-anchor='middle' fill='#fffdf5' font-family='KaiTi,serif' font-size='32'>验</text></g></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题意与已知",
        "description": "题目告诉我们一个圆的半径是 5 厘米，π 取 3.14。我们先把圆和圆心画出来，明确已知条件。",
        "bubbleText": "半径 5 cm 是解题的钥匙。",
        "bubblePos": {
            "x": 400,
            "y": 80
        }
    },
    {
        "title": "半径标注",
        "description": "从圆心 O 到圆周作半径，长度严格对应 5 厘米。这条半径将同时用于周长和面积的计算。",
        "bubbleText": "半径 r = 5 cm，记牢这个数值。",
        "bubblePos": {
            "x": 520,
            "y": 280
        }
    },
    {
        "title": "周长公式",
        "description": "圆的周长公式是 C = 2πr，它表示绕圆一周的长度，单位是厘米。",
        "bubbleText": "周长是线的长度，用长度单位。",
        "bubblePos": {
            "x": 680,
            "y": 190
        }
    },
    {
        "title": "代入求周长",
        "description": "把 r = 5、π = 3.14 代入公式：C = 2×3.14×5 = 31.4 厘米。",
        "bubbleText": "计算结果：周长为 31.4 cm。",
        "bubblePos": {
            "x": 680,
            "y": 190
        }
    },
    {
        "title": "面积公式",
        "description": "圆的面积公式是 S = πr²，它表示圆所围成的平面大小，单位是平方厘米。",
        "bubbleText": "面积是面的大小，用面积单位。",
        "bubblePos": {
            "x": 680,
            "y": 410
        }
    },
    {
        "title": "代入求面积",
        "description": "把 r = 5、π = 3.14 代入：S = 3.14×5² = 78.5 平方厘米。",
        "bubbleText": "计算结果：面积为 78.5 cm²。",
        "bubblePos": {
            "x": 680,
            "y": 410
        }
    },
    {
        "title": "结果对比",
        "description": "周长 31.4 cm 是长度，面积 78.5 cm² 是平面大小，两者单位不同、意义不同，不能直接比较。",
        "bubbleText": "注意单位不同，意义也不同。",
        "bubblePos": {
            "x": 400,
            "y": 520
        }
    },
    {
        "title": "验证与结论",
        "description": "用结果反推半径：31.4÷(2×3.14)=5，且 78.5÷3.14=25，√25=5，都等于原半径，说明答案正确。",
        "bubbleText": "验证通过，答案正确！",
        "bubblePos": {
            "x": 200,
            "y": 520
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
