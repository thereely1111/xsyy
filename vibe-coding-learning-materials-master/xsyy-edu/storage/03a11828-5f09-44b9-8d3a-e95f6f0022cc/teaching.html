<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环形跑道追及相遇 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">环形跑道追及相遇</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('按同向超越与反向碰面的时间求两人速度')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='paper-shadow' x='-50%' y='-50%' width='200%' height='200%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#4a4a4a' flood-opacity='0.25'/></filter><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='2' result='coloredBlur'/><feMerge><feMergeNode in='coloredBlur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><linearGradient id='trackGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#f4f1ea'/><stop offset='100%' stop-color='#e8e4da'/></linearGradient><radialGradient id='centerGrad' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='#fdfcf8'/><stop offset='100%' stop-color='#e6e2d8'/></radialGradient><marker id='arrow' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 L2,3 z' fill='#c23a30'/></marker></defs><style>.ink{fill:#4a4a4a;}.ink-stroke{stroke:#4a4a4a;}.cinnabar{fill:#c23a30;}.cinnabar-stroke{stroke:#c23a30;}.beige{fill:#f4f1ea;}.track{fill:url(#trackGrad);stroke:#4a4a4a;stroke-width:3;filter:url(#paper-shadow);}.inner-field{fill:url(#centerGrad);stroke:#c23a30;stroke-width:2;opacity:0.7;}.dashed-line{fill:none;stroke:#c23a30;stroke-width:3;stroke-dasharray:8,6;marker-end:url(#arrow);filter:url(#glow);animation:flow 1.2s linear infinite;}.svg-elem{transition:all 0.7s cubic-bezier(0.4,0,0.2,1);}.tx-start{opacity:0;transform:translateY(25px) scale(0.92);}.tx-end{opacity:1;transform:translateY(0) scale(1);}.tx-leave-start{opacity:1;transform:scale(1);}.tx-leave-end{opacity:0;transform:scale(0.9) translateY(-15px);}@keyframes flow{to{stroke-dashoffset:-28;}}@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}@keyframes heartbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}@keyframes seal-shine{0%,60%{opacity:0.55;}50%{opacity:1;}}.float-anim{animation:float 3s ease-in-out infinite;}.beat-anim{animation:heartbeat 1.2s ease-in-out infinite;}.shine-anim{animation:seal-shine 2.5s ease-in-out infinite;}.panel{background:rgba(244,241,234,0.96);border:2px solid #c23a30;border-radius:10px;padding:12px 16px;color:#4a4a4a;font-family:'KaiTi','STKaiti',serif;font-size:17px;line-height:1.6;box-shadow:0 6px 18px rgba(74,74,74,0.18);}.math{font-family:'Times New Roman',serif;letter-spacing:0.5px;}</style><g id='scene-root' class='svg-elem'><g id='decor-clouds' opacity='0.18' class='ink'><path d='M60,90 Q80,60 110,80 T160,80 T190,100 T160,130 T110,130 T60,90' fill='#e6e2d8'/><path d='M640,480 Q670,450 710,470 T770,470 T800,500 T760,530 T700,530 T640,480' fill='#e6e2d8'/></g><g id='title-step1' x-show='sceneStep==0' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><text x='400' y='60' text-anchor='middle' font-size='28' fill='#c23a30' font-family='KaiTi,STKaiti,serif' class='float-anim'>环形跑道追及相遇</text><text x='400' y='95' text-anchor='middle' font-size='16' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>300 米环形跑道 · 同时同地起跑</text></g><g id='label-same' x-show='sceneStep>=1 &amp;&amp; sceneStep<=2' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><text x='400' y='60' text-anchor='middle' font-size='26' fill='#c23a30' font-family='KaiTi,STKaiti,serif' class='float-anim'>同向追及</text></g><g id='label-opp' x-show='sceneStep>=3 &amp;&amp; sceneStep<=4' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><text x='400' y='60' text-anchor='middle' font-size='26' fill='#c23a30' font-family='KaiTi,STKaiti,serif' class='float-anim'>反向相遇</text></g><circle cx='400' cy='320' r='110' class='track'/><circle cx='400' cy='320' r='80' class='inner-field'/><circle cx='400' cy='320' r='52' fill='#f4f1ea' stroke='#c23a30' stroke-width='2' opacity='0.6' class='shine-anim'/><text x='400' y='330' text-anchor='middle' font-size='32' fill='#c23a30' font-family='KaiTi,STKaiti,serif' opacity='0.9'>跑道</text><g id='distance-markers' class='ink'><path d='M495.5,314 L495.5,326' stroke='#4a4a4a' stroke-width='2'/><text x='508' y='324' font-size='14' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>0m</text><path d='M394,224.5 L406,224.5' stroke='#4a4a4a' stroke-width='2'/><text x='390' y='220' text-anchor='end' font-size='14' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>75m</text><path d='M304.5,314 L304.5,326' stroke='#4a4a4a' stroke-width='2'/><text x='300' y='340' text-anchor='end' font-size='14' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>150m</text><path d='M394,415.5 L406,415.5' stroke='#4a4a4a' stroke-width='2'/><text x='390' y='432' text-anchor='end' font-size='14' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>225m</text><circle cx='495.5' cy='320' r='5' fill='#c23a30'/><text x='518' y='315' font-size='15' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>起点</text></g><path id='extra-lap' class='dashed-line svg-elem' x-show='sceneStep>=1 &amp;&amp; sceneStep<=2' d='M525,320 A125,125 0 1 1 525,320.01'/><path id='opp-arc-a' class='dashed-line svg-elem' x-show='sceneStep>=3 &amp;&amp; sceneStep<=4' d='M495.5,320 A95.5,95.5 0 0 0 322.74,376.13'/><path id='opp-arc-b' class='dashed-line svg-elem' x-show='sceneStep>=3 &amp;&amp; sceneStep<=4' d='M495.5,320 A95.5,95.5 0 0 1 322.74,376.13'/><g id='runners-start' class='svg-elem' x-show='sceneStep>=0 &amp;&amp; sceneStep<=1' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><g transform='translate(491.5,320)'><circle r='15' fill='#c23a30' class='beat-anim'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>艾</text></g><g transform='translate(499.5,320)'><circle r='15' fill='#4a4a4a'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>薇</text></g></g><g id='runners-catch' class='svg-elem' x-show='sceneStep==2' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><g transform='translate(491.5,320)'><circle r='22' fill='none' stroke='#c23a30' stroke-width='2' class='beat-anim'/><circle r='15' fill='#c23a30'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>艾</text></g><g transform='translate(499.5,320)'><circle r='15' fill='#4a4a4a'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>薇</text></g><text x='520' y='300' font-size='15' fill='#c23a30' font-family='KaiTi,STKaiti,serif'>艾迪多跑一圈 300 米</text></g><g id='runners-meet' class='svg-elem' x-show='sceneStep>=3 &amp;&amp; sceneStep<=4' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><g transform='translate(318.74,376.13)'><circle r='15' fill='#c23a30' class='beat-anim'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>艾</text></g><g transform='translate(326.74,376.13)'><circle r='15' fill='#4a4a4a'/><text x='0' y='5' text-anchor='middle' font-size='14' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>薇</text></g><text x='250' y='390' font-size='15' fill='#c23a30' font-family='KaiTi,STKaiti,serif'>两人路程和为一圈 300 米</text></g><foreignObject x='260' y='70' width='280' height='190' class='svg-elem' x-show='sceneStep>=5 &amp;&amp; sceneStep<=8' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><div xmlns='http://www.w3.org/1999/xhtml' class='panel math'><div>同向：<span style='color:#c23a30;'>v<sub>艾</sub> − v<sub>薇</sub></span> = 300 ÷ 150 = 2</div><div>反向：<span style='color:#c23a30;'>v<sub>艾</sub> + v<sub>薇</sub></span> = 300 ÷ 30 = 10</div><div x-show='sceneStep>=6' style='margin-top:8px;color:#c23a30;font-weight:bold;'>相加：2v<sub>艾</sub> = 12</div><div x-show='sceneStep>=7' style='margin-top:4px;color:#c23a30;font-weight:bold;'>v<sub>艾</sub> = 6 m/s</div><div x-show='sceneStep>=8' style='margin-top:4px;color:#4a4a4a;font-weight:bold;'>v<sub>薇</sub> = 4 m/s</div></div></foreignObject><foreignObject x='220' y='70' width='360' height='180' class='svg-elem' x-show='sceneStep==9' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><div xmlns='http://www.w3.org/1999/xhtml' class='panel'><div style='font-size:20px;color:#c23a30;text-align:center;margin-bottom:8px;'>答案验证</div><div style='font-size:16px;line-height:1.7;'>同向：6 − 4 = 2 m/s，150 s 多跑 300 m ✓<br/>反向：6 + 4 = 10 m/s，30 s 共跑 300 m ✓</div></div></foreignObject><g id='badge-aidi' class='svg-elem beat-anim' x-show='sceneStep>=6'><rect x='55' y='75' width='120' height='40' rx='8' fill='#c23a30' filter='url(#paper-shadow)'/><text x='115' y='101' text-anchor='middle' font-size='16' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>艾迪 6 m/s</text></g><g id='badge-weier' class='svg-elem beat-anim' x-show='sceneStep>=8'><rect x='625' y='75' width='120' height='40' rx='8' fill='#4a4a4a' filter='url(#paper-shadow)'/><text x='685' y='101' text-anchor='middle' font-size='16' fill='#f4f1ea' font-family='KaiTi,STKaiti,serif'>薇儿 4 m/s</text></g><g id='checkmark' class='svg-elem' x-show='sceneStep==9' x-transition:enter='svg-elem' x-transition:enter-start='tx-start' x-transition:enter-end='tx-end' x-transition:leave='svg-elem' x-transition:leave-start='tx-leave-start' x-transition:leave-end='tx-leave-end'><circle cx='400' cy='520' r='28' fill='none' stroke='#c23a30' stroke-width='3' class='beat-anim'/><path d='M385,520 L395,530 L415,510' fill='none' stroke='#c23a30' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><text x='400' y='570' text-anchor='middle' font-size='18' fill='#4a4a4a' font-family='KaiTi,STKaiti,serif'>答案正确</text></g></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题意速览",
        "description": "环形跑道全长 300 米，艾迪和薇儿同时同地起跑。随后分别讨论同向追上与反向相遇两种情形。",
        "bubbleText": "一圈 300 米，同时同地出发。",
        "bubblePos": {
            "x": 400,
            "y": 70
        }
    },
    {
        "title": "同向而行",
        "description": "两人同向起跑，艾迪速度更快，逐渐追上薇儿。经过 2 分 30 秒，即 150 秒，艾迪恰好多跑整整一圈。",
        "bubbleText": "同向：2 分 30 秒 = 150 秒追上。",

        }
    },
    {
        "title": "追及关系",
        "description": "追上时艾迪比薇儿多跑的路程就是跑道一圈 300 米。由此得到速度差：v艾 − v薇 = 300 ÷ 150 = 2 米/秒。",
        "bubbleText": "路程差 = 300 米，速度差 = 2 m/s。",
        "bubblePos": {
            "x": 120,
            "y": 160
        }
    },
    {
        "title": "背向而行",
        "description": "若两人背向起跑，他们相向而行，经过半分钟即 30 秒相遇。",
        "bubbleText": "反向：半分钟 = 30 秒相遇。",
        "bubblePos": {
            "x": 520,
            "y": 180
        }
    },
    {
        "title": "相遇关系",
        "description": "相遇时两人跑过的路程之和正好也是一圈 300 米。于是速度和：v艾 + v薇 = 300 ÷ 30 = 10 米/秒。",
        "bubbleText": "路程和 = 300 米，速度和 = 10 m/s。",
        "bubblePos": {
            "x": 280,
            "y": 430
        }
    },
    {
        "title": "列出方程组",
        "description": "把两种数量关系统一成方程组，准备联立求解。",
        "bubbleText": "得到两个方程：差 2，和 10。",
        "bubblePos": {
            "x": 400,
            "y": 110
        }
    },
    {
        "title": "消元求解",
        "description": "将两式相加，消去薇儿的速度，得到 2 v艾 = 12，从而可以先求出艾迪的速度。",
        "bubbleText": "两式相加，先求艾迪。",
        "bubblePos": {
            "x": 400,
            "y": 110
        }
    },
    {
        "title": "艾迪的速度",
        "description": "由 2 v艾 = 12 可得 v艾 = 6 米/秒。",
        "bubbleText": "艾迪速度为 6 米/秒。",

    {

        "description": "把艾迪的速度代入速度和式：6 + v薇 = 10，解得 v薇 = 4 米/秒。",
        "bubbleText": "薇儿速度为 4 米/秒。",
        "bubblePos": {

    },
    {
        "title": "验证答案",
        "description": "同向时速度差 2 米/秒，150 秒相差 300 米；反向时速度和 10 米/秒，30 秒共跑 300 米，均符合题意。",
        "bubbleText": "代入验证，两个条件都成立。",

],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
