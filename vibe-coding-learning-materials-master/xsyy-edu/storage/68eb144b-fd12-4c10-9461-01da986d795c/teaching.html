<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金钱逻辑推理应用题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">金钱逻辑推理应用题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('判断多次钱款往来中谁最终吃亏')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='cinnabarGrad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#b83a2b'/><stop offset='100%' stop-color='#e86b5c'/></linearGradient><linearGradient id='inkGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#8a8a8a'/><stop offset='100%' stop-color='#4a4a4a'/></linearGradient><filter id='paperShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='4' stdDeviation='3' flood-color='#2b2b2b' flood-opacity='0.25'/></filter><filter id='softGlow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='4' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter></defs><style>.svg-elem { transition: all 0.7s cubic-bezier(0.4,0,0.2,1); } .dashed-line { fill:none; stroke:#b83a2b; stroke-width:2; stroke-dasharray:6,4; opacity:0.75; } .money { filter:url(#paperShadow); } .ink-text { font-family:KaiTi,serif; fill:#3a3a3a; } @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} } @keyframes heartbeat { 0%,100%{transform:scale(1);} 25%{transform:scale(1.06);} 50%{transform:scale(1);} 75%{transform:scale(1.04);} } @keyframes shimmer { 0%{stroke-dashoffset:0;} 100%{stroke-dashoffset:24;} } .animate-float { animation:float 3s ease-in-out infinite; } .animate-heartbeat { animation:heartbeat 1.2s ease-in-out infinite; } .animate-shimmer { animation:shimmer 1.5s linear infinite; } .highlight { filter:url(#softGlow); } .fade-scale-start { opacity:0; transform:scale(0.6); } .fade-scale-end { opacity:0; transform:scale(0.6); } .slide-left-start { opacity:0; transform:translateX(-60px); } .slide-right-start { opacity:0; transform:translateX(60px); }</style><path d='M0,120 Q200,40 400,100 T800,80 L800,0 L0,0 Z' fill='#e8e4d9' opacity='0.6' class='svg-elem'/><path d='M0,520 Q300,480 500,540 T800,500 L800,600 L0,600 Z' fill='#e8e4d9' opacity='0.5' class='svg-elem'/><g class='svg-elem animate-float' opacity='0.25'><path d='M700,90 Q720,70 740,90 T780,90' fill='none' stroke='#4a4a4a' stroke-width='3' stroke-linecap='round'/><path d='M720,120 Q740,100 760,120 T800,120' fill='none' stroke='#4a4a4a' stroke-width='2' stroke-linecap='round'/></g><g transform='translate(120,300)' id='wang' class='svg-elem'><ellipse cx='0' cy='110' rx='45' ry='14' fill='#2b2b2b' opacity='0.15'/><path d='M-30,50 Q-35,110 -25,140 L25,140 Q35,110 30,50 Z' fill='#f5f0e8' stroke='#4a4a4a' stroke-width='2'/><path d='M-30,50 Q0,30 30,50 L30,90 Q0,110 -30,90 Z' fill='#b83a2b' opacity='0.85'/><circle cx='0' cy='25' r='28' fill='#f5f0e8' stroke='#4a4a4a' stroke-width='2'/><text x='0' y='35' text-anchor='middle' font-size='28'>🙂</text><text x='0' y='170' text-anchor='middle' class='ink-text' font-size='18'>小王</text></g><g transform='translate(620,280)' id='cashier' class='svg-elem'><ellipse cx='0' cy='130' rx='55' ry='16' fill='#2b2b2b' opacity='0.15'/><path d='M-35,60 Q-40,130 -28,170 L28,170 Q40,130 35,60 Z' fill='#f5f0e8' stroke='#4a4a4a' stroke-width='2'/><path d='M-35,60 Q0,40 35,60 L35,100 Q0,120 -35,100 Z' fill='#4a4a4a' opacity='0.85'/><circle cx='0' cy='35' r='30' fill='#f5f0e8' stroke='#4a4a4a' stroke-width='2'/><text x='0' y='46' text-anchor='middle' font-size='30'>👨‍💼</text><text x='0' y='200' text-anchor='middle' class='ink-text' font-size='18'>网管</text></g><g transform='translate(520,380)' class='svg-elem'><rect x='0' y='0' width='200' height='90' rx='8' fill='url(#inkGrad)' filter='url(#paperShadow)'/><rect x='15' y='15' width='60' height='40' rx='3' fill='#2b2b2b' opacity='0.7'/><rect x='20' y='20' width='50' height='30' fill='#d4cfc3'/><text x='45' y='40' text-anchor='middle' class='ink-text' font-size='14'>收银</text></g><g transform='translate(60,440)' class='svg-elem'><path d='M0,0 h60 a8,8 0 0 1 8,8 v30 a8,8 0 0 1 -8,8 h-60 a8,8 0 0 1 -8,-8 v-30 a8,8 0 0 1 8,-8 z' fill='#b83a2b' opacity='0.85'/><text x='30' y='28' text-anchor='middle' fill='#f5f0e8' font-size='14'>钱包</text></g><g transform='translate(680,440)' class='svg-elem'><rect x='0' y='0' width='70' height='50' rx='4' fill='#4a4a4a' opacity='0.8'/><text x='35' y='32' text-anchor='middle' fill='#f5f0e8' font-size='16'>收银盒</text></g><g transform='translate(360,260)' class='svg-elem animate-heartbeat' x-show='sceneStep>=0'><rect x='0' y='0' width='80' height='50' rx='5' fill='#f5f0e8' stroke='#b83a2b' stroke-width='2' filter='url(#paperShadow)'/><text x='40' y='22' text-anchor='middle' class='ink-text' font-size='14' fill='#b83a2b'>会员卡</text><text x='40' y='40' text-anchor='middle' class='ink-text' font-size='14'>20元</text></g><g transform='translate(720,480)' class='svg-elem'><rect x='0' y='0' width='48' height='48' rx='4' fill='#b83a2b' opacity='0.9'/><text x='24' y='32' text-anchor='middle' class='ink-text' fill='#f5f0e8' font-size='22'>理</text></g><path class='dashed-line svg-elem animate-shimmer' d='M180,400 C300,340 500,340 640,400' x-show='sceneStep>=1 && sceneStep<=2' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'/><path class='dashed-line svg-elem animate-shimmer' d='M640,420 C500,480 300,480 180,420' x-show='sceneStep>=2 && sceneStep<=3' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'/><path class='dashed-line svg-elem animate-shimmer' d='M180,440 C300,380 500,380 640,440' x-show='sceneStep>=5 && sceneStep<=6' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'/><path class='dashed-line svg-elem animate-shimmer' d='M640,460 C500,520 300,520 180,460' x-show='sceneStep>=6 && sceneStep<=7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'/><g transform='translate(160,360)' class='svg-elem money animate-heartbeat' x-show='sceneStep==1' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-scale-start' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='fade-scale-end'><rect x='0' y='0' width='90' height='45' rx='4' fill='url(#cinnabarGrad)'/><text x='45' y='30' text-anchor='middle' fill='#f5f0e8' font-size='22' font-weight='bold'>50元</text></g><g transform='translate(600,360)' class='svg-elem money' x-show='sceneStep>=2 && sceneStep<=5'><rect x='0' y='0' width='90' height='45' rx='4' fill='url(#cinnabarGrad)'/><text x='45' y='30' text-anchor='middle' fill='#f5f0e8' font-size='22' font-weight='bold'>50元</text></g><g transform='translate(360,350)' class='svg-elem money animate-heartbeat' x-show='sceneStep>=6 && sceneStep<=7' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='slide-right-start' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='fade-scale-end'><rect x='0' y='0' width='90' height='45' rx='4' fill='url(#cinnabarGrad)'/><text x='45' y='30' text-anchor='middle' fill='#f5f0e8' font-size='22' font-weight='bold'>50元</text></g><g transform='translate(360,490)' class='svg-elem money' x-show='sceneStep>=8'><rect x='0' y='0' width='90' height='45' rx='4' fill='url(#cinnabarGrad)'/><text x='45' y='30' text-anchor='middle' fill='#f5f0e8' font-size='22' font-weight='bold'>50元</text></g><g transform='translate(110,360)' class='svg-elem money' x-show='sceneStep>=2'><rect x='0' y='0' width='70' height='36' rx='4' fill='#8a8a8a'/><text x='35' y='24' text-anchor='middle' fill='#f5f0e8' font-size='18'>30元</text></g><g transform='translate(80,420)' class='svg-elem money animate-heartbeat' x-show='sceneStep==4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='fade-scale-start' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='fade-scale-end'><rect x='0' y='0' width='80' height='40' rx='4' fill='#6e6e6e'/><text x='40' y='27' text-anchor='middle' fill='#f5f0e8' font-size='20'>20元</text></g><g transform='translate(360,360)' class='svg-elem money animate-heartbeat' x-show='sceneStep==5' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='slide-left-start' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='slide-right-start'><rect x='0' y='0' width='80' height='40' rx='4' fill='#6e6e6e'/><text x='40' y='27' text-anchor='middle' fill='#f5f0e8' font-size='20'>20元</text></g><g transform='translate(620,410)' class='svg-elem money' x-show='sceneStep>=6'><rect x='0' y='0' width='80' height='40' rx='4' fill='#6e6e6e'/><text x='40' y='27' text-anchor='middle' fill='#f5f0e8' font-size='20'>20元</text></g><foreignObject x='280' y='80' width='240' height='90' class='svg-elem' x-show='sceneStep==3' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(245,240,232,0.95); border:1px solid #b83a2b; border-radius:8px; padding:10px; font-family:KaiTi,serif; color:#3a3a3a; text-align:center;'><div style='font-size:16px;'>第一步净额</div><div style='font-size:18px; margin-top:6px;'>小王：−50 + 30 = −20</div><div style='font-size:18px;'>网管：+50 − 30 = +20</div></div></foreignObject><foreignObject x='280' y='80' width='240' height='90' class='svg-elem' x-show='sceneStep==7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(245,240,232,0.95); border:1px solid #b83a2b; border-radius:8px; padding:10px; font-family:KaiTi,serif; color:#3a3a3a; text-align:center;'><div style='font-size:16px;'>第二步净额</div><div style='font-size:18px; margin-top:6px;'>小王：−20 + 50 = +30</div><div style='font-size:18px;'>网管：+20 − 50 = −30</div></div></foreignObject><foreignObject x='260' y='70' width='280' height='110' class='svg-elem' x-show='sceneStep==8' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(245,240,232,0.95); border:1px solid #b83a2b; border-radius:8px; padding:10px; font-family:KaiTi,serif; color:#3a3a3a; text-align:center;'><div style='font-size:16px;'>两笔合计</div><div style='font-size:18px; margin-top:6px;'>小王现金：−50 + 30 − 20 + 50 = +10</div><div style='font-size:18px;'>网管现金：+50 − 30 + 20 − 50 = −10</div></div></foreignObject><foreignObject x='240' y='60' width='320' height='140' class='svg-elem' x-show='sceneStep==9' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-end='opacity-0'><div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(245,240,232,0.95); border:1px solid #b83a2b; border-radius:8px; padding:12px; font-family:KaiTi,serif; color:#3a3a3a; text-align:center;'><div style='font-size:20px; color:#b83a2b; font-weight:bold;'>答案验证</div><div style='margin-top:8px;'>网管现金净流出 10 元</div><div>小王现金净流入 10 元</div><div style='margin-top:8px; color:#b83a2b; font-size:18px; font-weight:bold;'>结论：网管亏了 10 元</div><div style='font-size:14px; margin-top:4px;'>（若计会员卡 20 元价值，网吧总损失为 30 元）</div></div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "开卡需求",
        "description": "小王想办一张20元的会员卡，但钱包里没有20元零钱。",
        "bubbleText": "开卡要20元，可我没零钱呀……",
        "bubblePos": {
            "x": 220,
            "y": 240
        }
    },
    {
        "title": "先给50元",
        "description": "小王把一张50元递给网管，请他先找零。",
        "bubbleText": "先给您50元，麻烦您找零。",
        "bubblePos": {
            "x": 220,
            "y": 240
        }
    },
    {
        "title": "网管找零30元",
        "description": "网管收下50元，从小钞中找回30元给小王。",
        "bubbleText": "收您50元，找您30元。",
        "bubblePos": {
            "x": 580,
            "y": 240
        }
    },
    {
        "title": "第一次结算",
        "description": "小王实际支付20元，网管手中也净得20元。",
        "bubbleText": "现在相当于我已经付了20元网费。",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "找到20元零钱",
        "description": "小王在口袋里又翻出了一张20元零钱。",
        "bubbleText": "咦，我又有20元零钱了！",
        "bubblePos": {
            "x": 180,
            "y": 420
        }
    },
    {
        "title": "递上20元",
        "description": "小王把找到的20元递给网管，请他退还先前那张50元。",
        "bubbleText": "给您20元，请把刚才的50元还我。",
        "bubblePos": {
            "x": 400,
            "y": 360
        }
    },
    {
        "title": "退还50元",
        "description": "网管收下20元，把先前的50元还给了小王。",
        "bubbleText": "好的，收您20元，50元还您。",
        "bubblePos": {
            "x": 580,
            "y": 240
        }
    },
    {
        "title": "第二次结算",
        "description": "这一步小王现金增加30元，网管现金减少30元。",
        "bubbleText": "这一步我净得30元，网管净出30元。",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "总账核算",
        "description": "把两笔交易合并：小王净流入10元，网管净流出10元。",
        "bubbleText": "−50+30−20+50=+10，网管亏了10元。",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "答案验证",
        "description": "核对最终现金流：网管收到70元、付出80元，净亏10元；小王反之净赚10元。",
        "bubbleText": "结论：网管亏了10元现金。",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
