<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找伪币最少称量次数 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">找伪币最少称量次数</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('10枚金币中有1枚较轻的伪币，天平每次称量有3种结果，由于$3^2=9$不够而$3^3=27$足够，所以至少称3次才能保证找出伪币。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- Step 1: 10 coins display -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-500">
                                <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#44403c" font-family="'Noto Serif SC', serif">10枚金币（其中1枚伪币较轻）</text>
                                <circle cx="115" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="115" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">1</text>
                                <circle cx="175" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="175" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">2</text>
                                <circle cx="235" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="235" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">3</text>
                                <circle cx="295" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="295" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">4</text>
                                <circle cx="355" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="355" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">5</text>
                                <circle cx="415" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="415" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">6</text>
                                <circle cx="475" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="475" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">7</text>
                                <circle cx="535" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="535" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">8</text>
                                <circle cx="595" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="595" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">9</text>
                                <circle cx="655" cy="80" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                                <text x="655" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">10</text>
                                <text x="400" y="125" text-anchor="middle" font-size="13" fill="#78716c" font-family="'Noto Sans SC', sans-serif">外观完全相同，只有一枚比真币轻</text>
                            </g>

                            <!-- Step 2: Balance scale with 3 outcomes -->
                            <g x-show="sceneStep >= 2" x-transition:enter="transition ease-out duration-500">
                                <polygon points="400,320 380,370 420,370" fill="#78716c" stroke="#57534e" stroke-width="1.5"/>
                                <rect x="360" y="370" width="80" height="10" rx="3" fill="#57534e"/>
                                <line x1="260" y1="320" x2="540" y2="320" stroke="#44403c" stroke-width="5" stroke-linecap="round"/>
                                <line x1="280" y1="320" x2="280" y2="350" stroke="#78716c" stroke-width="2"/>
                                <line x1="520" y1="320" x2="520" y2="350" stroke="#78716c" stroke-width="2"/>
                                <path d="M240,350 Q280,365 320,350" fill="none" stroke="#a8a29e" stroke-width="3"/>
                                <ellipse cx="280" cy="352" rx="42" ry="8" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>
                                <path d="M480,350 Q520,365 560,350" fill="none" stroke="#a8a29e" stroke-width="3"/>
                                <ellipse cx="520" cy="352" rx="42" ry="8" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>
                                <text x="180" y="290" text-anchor="middle" font-size="13" fill="#8a1c1c" font-weight="bold">左轻</text>
                                <text x="400" y="275" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">平衡</text>
                                <text x="620" y="290" text-anchor="middle" font-size="13" fill="#8a1c1c" font-weight="bold">右轻</text>
                                <line x1="200" y1="295" x2="250" y2="315" stroke="#8a1c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <line x1="400" y1="280" x2="400" y2="312" stroke="#166534" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <line x1="600" y1="295" x2="550" y2="315" stroke="#8a1c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <text x="400" y="400" text-anchor="middle" font-size="13" fill="#78716c" font-family="'Noto Sans SC', sans-serif">每次称量只有这 3 种结果</text>
                            </g>

                            <!-- Step 3: Information formula -->
                            <g x-show="sceneStep >= 3">
                                <rect x="560" y="140" width="220" height="80" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3"/>
                                <foreignObject x="570" y="148" width="200" height="65">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#44403c; line-height:1.6; font-family:'Noto Sans SC',sans-serif;">
                                        <div>每次 3 种结果</div>
                                        <div x-html="renderMath('$k$次最多区分 $3^k$ 种情况')"></div>
                                    </div>
                                </foreignObject>
                            </g>

                            <!-- Step 4: 2 weighings not enough -->
                            <g x-show="sceneStep >= 4">
                                <rect x="30" y="145" width="200" height="75" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
                                <foreignObject x="40" y="152" width="180" height="62">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#991b1b; line-height:1.7; font-family:'Noto Sans SC',sans-serif;">
                                        <div x-html="renderMath('$3^2 = 9 &lt; 10$')"></div>
                                        <div style="font-weight:bold;">2次不够！</div>
                                    </div>
                                </foreignObject>
                                <rect x="45" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="65" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="85" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="105" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="125" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="145" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="165" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="185" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <rect x="205" y="228" width="16" height="16" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
                                <text x="130" y="262" text-anchor="middle" font-size="11" fill="#dc2626">最多覆盖9种，不够10枚</text>
                            </g>

                            <!-- Step 5: First weighing strategy 3 vs 3 -->
                            <g x-show="sceneStep >= 5">
                                <!-- Dashed trajectories showing coins moving to pans -->
                                <path d="M115,102 C115,180 200,280 265,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <path d="M175,102 C175,190 220,290 275,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <path d="M235,102 C235,200 250,300 285,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <path d="M295,102 C350,200 450,300 505,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <path d="M355,102 C400,200 470,300 515,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <path d="M415,102 C450,200 490,300 530,335" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6,4"/>
                                <!-- Coins on left pan -->
                                <circle cx="260" cy="338" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="260" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">1</text>
                                <circle cx="280" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="280" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">2</text>
                                <circle cx="300" cy="338" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="300" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">3</text>
                                <!-- Coins on right pan -->
                                <circle cx="500" cy="338" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="500" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">4</text>
                                <circle cx="520" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="520" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">5</text>
                                <circle cx="540" cy="338" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="540" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">6</text>
                                <!-- 4 coins aside -->
                                <circle cx="640" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="640" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">7</text>
                                <circle cx="670" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="670" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">8</text>
                                <circle cx="700" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="700" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">9</text>
                                <circle cx="730" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
                                <text x="730" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">10</text>
                                <!-- Group labels -->
                                <text x="280" y="395" text-anchor="middle" font-size="12" fill="#44403c" font-weight="bold">左盘 3 枚</text>
                                <text x="520" y="395" text-anchor="middle" font-size="12" fill="#44403c" font-weight="bold">右盘 3 枚</text>
                                <text x="685" y="365" text-anchor="middle" font-size="12" fill="#44403c" font-weight="bold">旁边 4 枚</text>
                                <!-- Highlight brackets -->
                                <rect x="238" y="310" width="85" height="50" rx="6" fill="none" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="5,3"/>
                                <rect x="478" y="310" width="85" height="50" rx="6" fill="none" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="5,3"/>
                                <text x="400" y="430" text-anchor="middle" font-size="13" fill="#8a1c1c" font-weight="bold">第1次称量：3 对 3</text>
                            </g>

                            <!-- Step 6: Branch analysis -->
                            <g x-show="sceneStep >= 6">
                                <line x1="300" y1="445" x2="200" y2="485" stroke="#166534" stroke-width="2" marker-end="url(#arrow)"/>
                                <line x1="500" y1="445" x2="600" y2="485" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>
                                <!-- Balance branch -->
                                <rect x="80" y="490" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
                                <text x="200" y="512" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">平衡：伪币在旁边4枚中</text>
                                <foreignObject x="90" y="518" width="220" height="36">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; color:#166534; font-family:'Noto Sans SC',sans-serif;" x-html="renderMath('再称2次即可（$3^2=9\\geq4$）')"></div>
                                </foreignObject>
                                <!-- Unbalanced branch -->
                                <rect x="480" y="490" width="250" height="70" rx="8" fill="#fef2f2" stroke="#8a1c1c" stroke-width="1.5"/>
                                <text x="605" y="512" text-anchor="middle" font-size="12" fill="#8a1c1c" font-weight="bold">不平衡：伪币在轻的3枚中</text>
                                <foreignObject x="490" y="518" width="230" height="36">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; color:#8a1c1c; font-family:'Noto Sans SC',sans-serif;" x-html="renderMath('再称1次即可（$3^1=3\\geq3$）')"></div>
                                </foreignObject>
                            </g>

                            <!-- Step 7: Conclusion -->
                            <g x-show="sceneStep >= 7" x-transition:enter="transition ease-out duration-700">
                                <rect x="270" y="572" width="260" height="48" rx="12" fill="#8a1c1c" stroke="#581c1c" stroke-width="2"/>
                                <text x="400" y="602" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold" font-family="'Noto Serif SC', serif">答案：至少称 3 次</text>
                                <foreignObject x="555" y="575" width="220" height="42">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#44403c; font-family:'Noto Sans SC',sans-serif;" x-html="renderMath('验证：$3^3=27\\geq10$')"></div>
                                </foreignObject>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
  {
    "title": "认识题目条件",
    "description": "10枚金币外观完全相同，其中1枚是伪币（比真币轻）。用托盘天平称量，求保证找出伪币的最少次数。",
    "bubbleText": "我们先看清楚题目：10枚长得一样的金币，混进了1枚轻的假币。我们只有一架天平，要保证找到它，最少称几次？",
    "bubblePos": {"x": 50, "y": 20}
  },
  {
    "title": "天平每次称量有3种结果",
    "description": "天平称量一次，结果只有3种：左轻、右轻、平衡。这是解题的关键突破口。",
    "bubbleText": "天平不是秤！它只告诉你哪边轻，或者一样重。所以每称一次，只有3种可能的结果：左边轻、右边轻、一样重。",
    "bubblePos": {"x": 450, "y": 140}
  },
  {
    "title": "k次称量最多区分$3^k$种情况",
    "description": "每次3种结果，$k$次称量最多能区分$3^k$种不同情况。要从10枚中找1枚，需要区分10种可能。",
    "bubbleText": "关键来了！每称一次有3种结果，称$k$次最多能区分$3^k$种情况。我们要从10枚里找1枚，就是要区分10种可能。",
    "bubblePos": {"x": 420, "y": 50}
  },
  {
    "title": "2次称量不够",
    "description": "$3^2=9<10$，2次称量最多区分9种情况，不够覆盖10枚金币，所以2次不能保证找到。",
    "bubbleText": "算一算：称2次最多区分$3^2=9$种情况，可我们有10枚币要区分，9小于10，不够！所以2次肯定不行。",
    "bubblePos": {"x": 50, "y": 280}
  },
  {
    "title": "第一次称量策略：3对3",
    "description": "将10枚分为3组：左盘3枚、右盘3枚、旁边4枚。第一次称量比较左盘和右盘。",
    "bubbleText": "怎么称最聪明？把10枚分成3堆：天平左边放3枚，右边放3枚，旁边留4枚。先称左边和右边！",
    "bubblePos": {"x": 50, "y": 140}
  },
  {
    "title": "分支分析：两种情况",
    "description": "若平衡：伪币在旁边4枚中，再称2次可找出（$3^2=9\\geq4$）。若不平衡：伪币在轻的3枚中，再称1次即可（$3^1=3\\geq3$）。",
    "bubbleText": "如果天平平衡，假币在剩下4枚里，再称2次就够（因为$3^2=9$大于4）。如果不平衡，假币在翘起的3枚里，再称1次就行！",
    "bubblePos": {"x": 50, "y": 300}
  },
  {
    "title": "结论：至少称3次",
    "description": "最坏情况需要$1+2=3$次。而$3^3=27\\geq10$，3次称量足够覆盖所有情况。答案：$\\boxed{3}$次。",
    "bubbleText": "最坏的情况：第一次称完平衡了，假币在4枚里，还要再称2次。总共$1+2=3$次！答案就是3次。",
    "bubblePos": {"x": 250, "y": 30}
  }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
