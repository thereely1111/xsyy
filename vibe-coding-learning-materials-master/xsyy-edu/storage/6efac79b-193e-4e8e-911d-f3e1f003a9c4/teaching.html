<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直角三角形判定 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">直角三角形判定</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('判断所给三组边长哪组满足勾股定理')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7f2e8"/><stop offset="100%" stop-color="#e8e0cf"/></linearGradient><linearGradient id="cinnabarGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d65c52"/><stop offset="100%" stop-color="#b83a2b"/></linearGradient><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2b2b2b" flood-opacity="0.25"/></filter><filter id="inkGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b83a2b"/></marker></defs><style>.svg-elem{transition:all 0.7s cubic-bezier(0.25,0.1,0.25,1);}.ink-text{font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;fill:#3d3d3d;}.red-text{fill:#b83a2b;font-weight:bold;}.option-rect{fill:url(#paperGrad);stroke:#7a7a7a;stroke-width:1.5;filter:url(#softShadow);}.option-rect.active{stroke:#b83a2b;stroke-width:3;filter:url(#inkGlow);}.dashed-line{fill:none;stroke:#b83a2b;stroke-width:2;stroke-dasharray:8 6;opacity:0.85;}@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}@keyframes heartbeat{0%,100%{transform:scale(1);}25%{transform:scale(1.08);}50%{transform:scale(1);}75%{transform:scale(1.05);}}@keyframes shimmer{0%{opacity:0.6;}50%{opacity:1;}100%{opacity:0.6;}}@keyframes flow{from{stroke-dashoffset:28;}to{stroke-dashoffset:0;}}.float-anim{animation:floatY 3s ease-in-out infinite;}.heartbeat-anim{animation:heartbeat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}.shimmer-anim{animation:shimmer 2s ease-in-out infinite;}.flow-anim{animation:flow 1.2s linear infinite;}</style><g class="svg-elem float-anim" x-show="sceneStep >= 0" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 -translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"><rect x="40" y="30" width="470" height="90" rx="8" fill="url(#paperGrad)" stroke="#7a7a7a" stroke-width="1.5" filter="url(#softShadow)"/><foreignObject x="55" y="42" width="440" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:KaiTi,STKaiti,Microsoft YaHei,serif;color:#3d3d3d;font-size:18px;line-height:1.5;padding:4px;">以下列长度的三条线段为边，能组成直角三角形的是（&nbsp;&nbsp;）</div></foreignObject></g><g class="svg-elem" x-show="sceneStep >= 0" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 translate-x-4" x-transition:enter-end="opacity-100 translate-x-0"><g transform="translate(560,120)"><rect class="option-rect" x="0" y="0" width="180" height="70" rx="6" :class="sceneStep == 2 ? 'active' : ''"/><text x="90" y="42" text-anchor="middle" class="ink-text" style="font-size:20px;">A. 1, 2, 3</text><g x-show="sceneStep == 2" class="svg-elem"><line x1="150" y1="10" x2="170" y2="60" stroke="#b83a2b" stroke-width="3"/><line x1="170" y1="10" x2="150" y2="60" stroke="#b83a2b" stroke-width="3"/></g></g><g transform="translate(560,210)"><rect class="option-rect" x="0" y="0" width="180" height="70" rx="6" :class="sceneStep == 3 ? 'active' : ''"/><text x="90" y="42" text-anchor="middle" class="ink-text" style="font-size:20px;">B. 3, 3, 4</text><g x-show="sceneStep == 3" class="svg-elem"><line x1="150" y1="10" x2="170" y2="60" stroke="#b83a2b" stroke-width="3"/><line x1="170" y1="10" x2="150" y2="60" stroke="#b83a2b" stroke-width="3"/></g></g><g transform="translate(560,300)"><rect class="option-rect" x="0" y="0" width="180" height="70" rx="6" :class="sceneStep >= 4 ? 'active' : ''"/><text x="90" y="42" text-anchor="middle" class="ink-text" style="font-size:20px;">C. 1, √3, 2</text><g x-show="sceneStep >= 5" class="svg-elem heartbeat-anim" x-transition:enter="transition-all ease-out duration-500" x-transition:enter-start="scale-0 opacity-0" x-transition:enter-end="scale-100 opacity-100" style="transform-box:fill-box;transform-origin:center;"><circle cx="160" cy="35" r="22" fill="#b83a2b" opacity="0.9"/><text x="160" y="41" text-anchor="middle" fill="#f7f2e8" style="font-size:14px;font-family:KaiTi,serif;">正确</text></g></g><g transform="translate(560,390)"><rect class="option-rect" x="0" y="0" width="180" height="70" rx="6" :class="sceneStep == 6 ? 'active' : ''"/><text x="90" y="42" text-anchor="middle" class="ink-text" style="font-size:20px;">D. 4, 4, 4</text><g x-show="sceneStep == 6" class="svg-elem"><line x1="150" y1="10" x2="170" y2="60" stroke="#b83a2b" stroke-width="3"/><line x1="170" y1="10" x2="150" y2="60" stroke="#b83a2b" stroke-width="3"/></g></g></g><g class="svg-elem shimmer-anim" x-show="sceneStep >= 1" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"><rect x="40" y="150" width="300" height="70" rx="8" fill="url(#paperGrad)" stroke="#b83a2b" stroke-width="2" filter="url(#softShadow)"/><foreignObject x="55" y="160" width="270" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:KaiTi,serif;color:#b83a2b;font-size:22px;text-align:center;padding:6px;">判定法则：a² + b² = c²</div></foreignObject></g><g class="svg-elem" x-show="sceneStep >= 4" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"><rect x="40" y="235" width="300" height="55" rx="8" fill="url(#paperGrad)" stroke="#b83a2b" stroke-width="1.5" filter="url(#softShadow)"/><foreignObject x="55" y="245" width="270" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:KaiTi,serif;color:#b83a2b;font-size:18px;text-align:center;padding:4px;">1² + (√3)² = 1 + 3 = 4 = 2²</div></foreignObject></g><g class="svg-elem" x-show="sceneStep >= 4" x-transition:enter="transition-all ease-out duration-1000" x-transition:enter-start="opacity-0 translate-y-8 scale-90" x-transition:enter-end="opacity-100 translate-y-0 scale-100"><polygon points="200,480 373.205,480 200,380" fill="#f7f2e8" stroke="#4a4a4a" stroke-width="3" filter="url(#softShadow)"/><polyline points="220,480 220,460 200,460" fill="none" stroke="#b83a2b" stroke-width="2"/><text x="175" y="425" text-anchor="end" class="ink-text" style="font-size:18px;">1</text><text x="290" y="505" text-anchor="middle" class="ink-text" style="font-size:18px;">√3</text><text x="295" y="420" text-anchor="start" class="ink-text" style="font-size:18px;">2</text><text x="210" y="400" class="ink-text" style="font-size:14px;">90°</text><line x1="200" y1="430" x2="210" y2="430" stroke="#7a7a7a" stroke-width="1.5"/><line x1="290" y1="480" x2="290" y2="470" stroke="#7a7a7a" stroke-width="1.5"/></g><path class="dashed-line flow-anim svg-elem" x-show="sceneStep == 4 || sceneStep == 5" d="M560 335 Q480 380 300 430" fill="none" marker-end="url(#arrowRed)"/><path class="dashed-line flow-anim svg-elem" x-show="sceneStep == 5" d="M250 380 Q180 300 160 220" fill="none" marker-end="url(#arrowRed)"/><g class="svg-elem" x-show="sceneStep == 6" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100"><polygon points="300,520 360,520 330,468.038" fill="#f7f2e8" stroke="#4a4a4a" stroke-width="2"/><text x="330" y="545" text-anchor="middle" class="ink-text" style="font-size:16px;">等边三角形，内角 60°</text><text x="330" y="490" text-anchor="middle" class="red-text" style="font-size:18px;">×</text></g><g class="svg-elem" x-show="sceneStep >= 7" x-transition:enter="transition-all ease-out duration-700" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"><foreignObject x="40" y="540" width="500" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:KaiTi,serif;color:#b83a2b;font-size:22px;font-weight:bold;padding:6px;">答案：C. 1, √3, 2</div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "题目引入",
        "description": "题目给出四组线段长度，要求判断哪一组能组成直角三角形。",
        "bubbleText": "先看清题目和四个选项",
        "bubblePos": {
            "x": 250,
            "y": 80
        }
    },
    {
        "title": "直角三角形判定法则",
        "description": "直角三角形满足勾股定理：两条较短边的平方和等于最长边的平方。",
        "bubbleText": "记住判定法则 a² + b² = c²",
        "bubblePos": {
            "x": 180,
            "y": 185
        }
    },
    {
        "title": "排除选项 A",
        "description": "1, 2, 3 中 1+2=3，三条线段只能排成一条直线，连三角形都构不成；且 1²+2²=5≠3²。",
        "bubbleText": "选项 A 不能组成三角形",
        "bubblePos": {
            "x": 650,
            "y": 155
        }
    },
    {
        "title": "排除选项 B",
        "description": "3, 3, 4 中两条短边都是 3，3²+3²=18，而 4²=16，不满足勾股定理。",
        "bubbleText": "选项 B 不是直角三角形",
        "bubblePos": {
            "x": 650,
            "y": 245
        }
    },
    {
        "title": "验证选项 C",
        "description": "1, √3, 2 中，1²+(√3)²=1+3=4=2²，满足勾股定理；同时 1+√3>2，能构成三角形。",
        "bubbleText": "选项 C 满足勾股定理",
        "bubblePos": {
            "x": 280,
            "y": 400
        }
    },
    {
        "title": "图形验证 C",
        "description": "按 1:√3:2 画出直角三角形，两条直角边分别为 1 和 √3，斜边为 2，直角清晰可见。",
        "bubbleText": "精确作图确认直角",
        "bubblePos": {
            "x": 280,
            "y": 360
        }
    },
    {
        "title": "排除选项 D",
        "description": "4, 4, 4 组成等边三角形，三个内角都是 60°，没有直角。",
        "bubbleText": "选项 D 没有直角",
        "bubblePos": {
            "x": 650,
            "y": 425
        }
    },
    {
        "title": "得出答案",
        "description": "只有 C 同时满足三角形三边关系和勾股定理，因此能组成直角三角形。",
        "bubbleText": "正确答案是 C",
        "bubblePos": {
            "x": 250,
            "y": 565
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
