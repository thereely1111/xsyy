<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比例尺行程相遇问题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">比例尺行程相遇问题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('先把图上距离换算成实际距离，再求相遇时间')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='paperGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#f7f3e8'/><stop offset='100%' stop-color='#e9e0cc'/></linearGradient><linearGradient id='redGrad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#c23a30'/><stop offset='100%' stop-color='#e85d50'/></linearGradient><filter id='dropShadow' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur in='SourceAlpha' stdDeviation='3'/><feOffset dx='2' dy='3' result='offsetblur'/><feComponentTransfer><feFuncA type='linear' slope='0.28'/></feComponentTransfer><feMerge><feMergeNode in='offsetblur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><filter id='softGlow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='5' result='coloredBlur'/><feMerge><feMergeNode in='coloredBlur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><marker id='arrowRed' markerWidth='10' markerHeight='10' refX='5' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#c23a30'/></marker><g id='loco'><path d='M0,12 Q0,8 6,8 L54,8 Q60,8 60,12 L60,28 Q60,32 54,32 L6,32 Q0,32 0,28 Z' fill='currentColor' filter='url(#dropShadow)'/><rect x='42' y='4' width='16' height='14' rx='3' fill='#f7f3e8' opacity='0.9'/><circle cx='14' cy='34' r='6' fill='#4a4a4a'/><circle cx='46' cy='34' r='6' fill='#4a4a4a'/><rect x='58' y='18' width='10' height='12' rx='2' fill='currentColor'/></g></defs><style>.svg-elem { transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); } .enter-start { opacity: 0; transform: translateY(18px) scale(0.94); } .enter-end { opacity: 1; transform: translateY(0) scale(1); } .dashed-line { stroke: #c23a30; stroke-width: 2.5; stroke-dasharray: 10 7; fill: none; animation: flowDash 1.3s linear infinite; } @keyframes flowDash { to { stroke-dashoffset: -34; } } @keyframes floatMap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @keyframes pulseRed { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.85; } } .map-float { animation: floatMap 4s ease-in-out infinite; } .meet-pulse { animation: pulseRed 1.4s ease-in-out infinite; transform-origin: center; } .track { stroke: #4a4a4a; stroke-width: 5; fill: none; stroke-linecap: round; } .map-track { stroke: #a89f91; stroke-width: 3; fill: none; stroke-linecap: round; } .city { fill: #4a4a4a; font-size: 17px; font-weight: bold; font-family: 'KaiTi','STKaiti',serif; } .num-label { fill: #c23a30; font-size: 15px; font-weight: bold; font-family: 'KaiTi','STKaiti',serif; } .speed-label { fill: #f7f3e8; font-size: 13px; font-weight: bold; font-family: 'KaiTi','STKaiti',serif; } .speed-pill { fill: url(#redGrad); filter: url(#dropShadow); } .formula-box { background: #f7f3e8; border: 2px solid #c23a30; border-radius: 10px; padding: 10px 14px; color: #4a4a4a; font-family: 'KaiTi','STKaiti',serif; font-size: 16px; line-height: 1.55; box-shadow: 0 5px 14px rgba(74,74,74,0.18); }</style><g class='svg-elem map-float' x-show='sceneStep >=0 &amp;&amp; sceneStep <=7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><rect x='60' y='60' width='680' height='140' rx='14' fill='url(#paperGrad)' filter='url(#dropShadow)' stroke='#4a4a4a' stroke-width='2'/><circle cx='60' cy='130' r='18' fill='#e9e0cc' stroke='#4a4a4a' stroke-width='2'/><circle cx='740' cy='130' r='18' fill='#e9e0cc' stroke='#4a4a4a' stroke-width='2'/><text x='400' y='95' text-anchor='middle' fill='#4a4a4a' font-size='19' font-weight='bold' font-family='KaiTi,STKaiti,serif'>地图：比例尺 1∶6 000 000</text><line x1='120' y1='150' x2='680' y2='150' class='map-track'/><circle cx='120' cy='150' r='7' fill='#c23a30'/><text x='120' y='180' text-anchor='middle' class='city'>甲</text><circle cx='680' cy='150' r='7' fill='#c23a30'/><text x='680' y='180' text-anchor='middle' class='city'>乙</text><line x1='120' y1='136' x2='680' y2='136' stroke='#c23a30' stroke-width='2' marker-end='url(#arrowRed)' marker-start='url(#arrowRed)'/><text x='400' y='128' text-anchor='middle' class='num-label'>图上距离 9 cm</text></g><g class='svg-elem' x-show='sceneStep >=1' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><rect x='600' y='78' width='120' height='38' rx='8' fill='#f7f3e8' stroke='#c23a30' stroke-width='1.5' filter='url(#dropShadow)'/><text x='660' y='103' text-anchor='middle' fill='#4a4a4a' font-size='14' font-family='KaiTi,STKaiti,serif'>1 cm = 60 km</text></g><path d='M400,205 L400,355' class='dashed-line svg-elem' x-show='sceneStep >=2 &amp;&amp; sceneStep <=4' x-transition:enter='transition-all duration-1000 ease-in-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'/><g class='svg-elem' x-show='sceneStep >=2' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><foreignObject x='430' y='235' width='250' height='70' xmlns='http://www.w3.org/1999/xhtml'><div class='formula-box' style='font-size:15px;'>9 × 6 000 000 = 54 000 000 cm = 540 km</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >=3' x-transition:enter='transition-all duration-800 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><text x='400' y='345' text-anchor='middle' fill='#4a4a4a' font-size='16' font-weight='bold' font-family='KaiTi,STKaiti,serif'>实际铁路全长 540 km</text><line x1='80' y1='360' x2='720' y2='360' class='track'/><g fill='#a89f91'><rect x='100' y='356' width='20' height='8' rx='2'/><rect x='180' y='356' width='20' height='8' rx='2'/><rect x='260' y='356' width='20' height='8' rx='2'/><rect x='340' y='356' width='20' height='8' rx='2'/><rect x='420' y='356' width='20' height='8' rx='2'/><rect x='500' y='356' width='20' height='8' rx='2'/><rect x='580' y='356' width='20' height='8' rx='2'/><rect x='660' y='356' width='20' height='8' rx='2'/></g><text x='90' y='390' text-anchor='middle' class='city'>甲站</text><text x='710' y='390' text-anchor='middle' class='city'>乙站</text></g><g class='svg-elem' x-show='sceneStep >=3 &amp;&amp; sceneStep <=4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-500 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><g transform='translate(80,326)' style='color:#c23a30'><use href='#loco'/></g><g transform='translate(720,326) scale(-1,1)' style='color:#7a7a7a'><use href='#loco'/></g></g><g class='svg-elem' x-show='sceneStep >=4' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><rect x='50' y='410' width='120' height='34' rx='17' class='speed-pill'/><text x='110' y='432' text-anchor='middle' class='speed-label'>甲车 57 km/h</text><rect x='630' y='410' width='120' height='34' rx='17' class='speed-pill'/><text x='690' y='432' text-anchor='middle' class='speed-label'>乙车 43 km/h</text><path d='M170,427 L630,427' class='dashed-line'/><text x='400' y='465' text-anchor='middle' class='num-label' font-size='16'>速度和：57 + 43 = 100 km/h</text></g><g class='svg-elem' x-show='sceneStep >=5' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><foreignObject x='150' y='480' width='260' height='90' xmlns='http://www.w3.org/1999/xhtml'><div class='formula-box' style='text-align:center;'><div style='font-size:14px;'>相遇时间 = 路程 ÷ 速度和</div><div style='font-size:17px; margin-top:4px;'>540 ÷ 100 = <strong>5.4 小时</strong></div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >=5 &amp;&amp; sceneStep <=7' x-transition:enter='transition-all duration-900 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><circle cx='400' cy='360' r='14' fill='url(#redGrad)' class='meet-pulse' filter='url(#softGlow)'/><text x='400' y='335' text-anchor='middle' class='num-label' font-size='15'>相遇点</text><g transform='translate(300,326)' style='color:#c23a30'><use href='#loco'/></g><g transform='translate(500,326) scale(-1,1)' style='color:#7a7a7a'><use href='#loco'/></g></g><g class='svg-elem' x-show='sceneStep >=6' x-transition:enter='transition-all duration-800 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><foreignObject x='450' y='480' width='300' height='90' xmlns='http://www.w3.org/1999/xhtml'><div class='formula-box' style='font-size:14px;'><div>验证：5.4 × 100 = 540 km ✓</div><div>540 km = 54 000 000 cm</div><div>54 000 000 ÷ 6 000 000 = 9 cm ✓</div></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >=7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='transition-all duration-400 ease-in' x-transition:leave-start='enter-end' x-transition:leave-end='enter-start'><foreignObject x='230' y='35' width='340' height='50' xmlns='http://www.w3.org/1999/xhtml'><div class='formula-box' style='text-align:center; background:#c23a30; color:#f7f3e8; border:none; font-size:17px; font-weight:bold;'>答：5.4 小时（5 时 24 分）后相遇</div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题识图",
        "description": "先看清题目给出的地图比例尺与图上距离，建立地图模型。",
        "bubbleText": "这是一幅比例尺为1∶6000000的地图，量得甲、乙两地图上距离9厘米。",
        "bubblePos": {
            "x": 400,
            "y": 30
        }
    },
    {
        "title": "理解比例尺",
        "description": "比例尺表示图上1厘米对应实际多少厘米，再换算成千米。",
        "bubbleText": "图上1厘米对应实际6000000厘米，也就是60千米。",
        "bubblePos": {
            "x": 660,
            "y": 70
        }
    },
    {
        "title": "换算实际距离",
        "description": "用图上距离乘比例尺分母得到实际厘米数，再化单位。",
        "bubbleText": "9×6000000=54000000厘米=540千米，甲乙两地实际相距540千米。",
        "bubblePos": {
            "x": 660,
            "y": 260
        }
    },
    {
        "title": "构建行程模型",

                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
