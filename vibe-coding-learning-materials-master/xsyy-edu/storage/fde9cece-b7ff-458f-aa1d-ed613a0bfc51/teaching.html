<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残缺乘法竖式推理 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">残缺乘法竖式推理</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('根据残缺竖式中已知的 $1$、首位 $2$ 和积的末位 $2$，逐步推理出每个方框里的数字，最终算出结果是 $1012$。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- 场景1：展示残缺竖式原题 -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-500">
                                <foreignObject x="180" y="20" width="440" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Noto Serif SC',serif;font-size:21px;font-weight:bold;color:#44403c;text-align:center;">残缺的乘法竖式</div>
                                </foreignObject>
                                <!-- 被乘数 □1 -->
                                <rect x="352" y="90" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="380" y="134" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <text x="450" y="134" text-anchor="middle" font-size="34" fill="#1f2937" font-family="'Noto Serif SC',serif">1</text>
                                <!-- 乘数 □□ -->
                                <text x="280" y="214" text-anchor="middle" font-size="30" fill="#78716c" font-family="'Noto Serif SC',serif">×</text>
                                <rect x="352" y="170" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="380" y="214" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <rect x="422" y="170" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="450" y="214" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <!-- 第一条横线 -->
                                <line x1="255" y1="248" x2="505" y2="248" stroke="#44403c" stroke-width="2.5"/>
                                <!-- 第一个部分积 2□ -->
                                <text x="380" y="304" text-anchor="middle" font-size="34" fill="#1f2937" font-family="'Noto Serif SC',serif">2</text>
                                <rect x="422" y="260" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="450" y="304" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <!-- 第二个部分积 □□（左移一位） -->
                                <rect x="282" y="340" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="310" y="384" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <rect x="352" y="340" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="380" y="384" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <!-- 第二条横线 -->
                                <line x1="255" y1="418" x2="505" y2="418" stroke="#44403c" stroke-width="2.5"/>
                                <!-- 最终积 □□□2 -->
                                <rect x="212" y="430" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="240" y="474" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <rect x="282" y="430" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="310" y="474" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <rect x="352" y="430" width="56" height="64" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
                                <text x="380" y="474" text-anchor="middle" font-size="30" fill="#a8a29e" font-family="'Noto Serif SC',serif">□</text>
                                <text x="450" y="474" text-anchor="middle" font-size="34" fill="#1f2937" font-family="'Noto Serif SC',serif">2</text>
                            </g>

                            <!-- 场景2：圈出个位列的已知线索 1 和 2 -->
                            <g x-show="sceneStep >= 2" x-transition:enter="transition ease-out duration-500">
                                <rect x="414" y="82" width="72" height="422" rx="14" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5"/>
                                <foreignObject x="520" y="120" width="250" height="70">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#991b1b;line-height:1.55;font-family:'Noto Sans SC',sans-serif;">先看最右边的个位这一列：上面写着 $1$，第一部分积的开头是 $2$。</div>
                                </foreignObject>
                            </g>

                            <!-- 场景3：推出乘数个位 = 2，第一部分积 = 22 -->
                            <g x-show="sceneStep >= 3" x-transition:enter="transition ease-out duration-500">
                                <path d="M 486 300 C 545 300, 560 235, 528 178" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
                                <rect x="422" y="170" width="56" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
                                <text x="450" y="214" text-anchor="middle" font-size="34" fill="#991b1b" font-weight="bold" font-family="'Noto Serif SC',serif">2</text>
                                <rect x="422" y="260" width="56" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
                                <text x="450" y="304" text-anchor="middle" font-size="34" fill="#991b1b" font-weight="bold" font-family="'Noto Serif SC',serif">2</text>
                                <foreignObject x="520" y="200" width="260" height="90">
                                    <div xmlns="http://www.w3.org/1999/xhtml" x-html="renderMath('$1\\times2=2$，所以乘数的个位是 $2$，第一部分积就是 $11\\times2=22$。')" style="font-size:14px;color:#991b1b;line-height:1.55;font-family:'Noto Sans SC',sans-serif;"></div>
                                </foreignObject>
                            </g>

                            <!-- 场景4：推出被乘数 = 11 -->
                            <g x-show="sceneStep >= 4" x-transition:enter="transition ease-out duration-500">
                                <rect x="352" y="90" width="56" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
                                <text x="380" y="134" text-anchor="middle" font-size="34" fill="#1e40af" font-weight="bold" font-family="'Noto Serif SC',serif">1</text>
                                <foreignObject x="520" y="300" width="260" height="90">
                                    <div xmlns="http://www.w3.org/1999/xhtml" x-html="renderMath('十位 $\\square\\times2$ 要进位出 $2$，只有 $1\\times2=2$，所以被乘数是 $11$。')" style="font-size:14px;color:#1e40af;line-height:1.55;font-family:'Noto Sans SC',sans-serif;"></div>
                                </foreignObject>
                            </g>

                            <!-- 场景5：推出乘数十位 = 9，第二部分积 = 99 -->
                            <g x-show="sceneStep >= 5" x-transition:enter="transition ease-out duration-500">
                                <rect x="282" y="340" width="56" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
                                <text x="310" y="384" text-anchor="middle" font-size="34" fill="#166534" font-weight="bold" font-family="'Noto Serif SC',serif">9</text>
                                <rect x="352" y="340" width="56" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
                                <text x="380" y="384" text-anchor="middle" font-size="34" fill="#166534" font-weight="bold" font-family="'Noto Serif SC',serif">9</text>
                                <rect x="352" y="170" width="56" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
                                <text x="380" y="214" text-anchor="middle" font-size="34" fill="#166534" font-weight="bold" font-family="'Noto Serif SC',serif">9</text>
                                <foreignObject x="60" y="330" width="210" height="110">
                                    <div xmlns="http://www.w3.org/1999/xhtml" x-html="renderMath('积是四位数，只有 $11\\times9=99$ 再进位才够，所以乘数十位是 $9$。')" style="font-size:14px;color:#166534;line-height:1.55;font-family:'Noto Sans SC',sans-serif;"></div>
                                </foreignObject>
                            </g>

                            <!-- 场景6：把两个部分积相加 -->
                            <g x-show="sceneStep >= 6" x-transition:enter="transition ease-out duration-500">
                                <path d="M 500 372 C 590 372, 620 452, 528 458" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
                                <foreignObject x="540" y="392" width="240" height="80">
                                    <div xmlns="http://www.w3.org/1999/xhtml" x-html="renderMath('上下相加：$22+990=1012$。')" style="font-size:15px;font-weight:bold;color:#6d28d9;line-height:1.55;font-family:'Noto Sans SC',sans-serif;"></div>
                                </foreignObject>
                            </g>

                            <!-- 场景7：揭晓最终结果 1012 -->
                            <g x-show="sceneStep >= 7" x-transition:enter="transition ease-out duration-500">
                                <rect x="212" y="430" width="56" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
                                <text x="240" y="474" text-anchor="middle" font-size="34" fill="#854d0e" font-weight="bold" font-family="'Noto Serif SC',serif">1</text>
                                <rect x="282" y="430" width="56" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
                                <text x="310" y="474" text-anchor="middle" font-size="34" fill="#854d0e" font-weight="bold" font-family="'Noto Serif SC',serif">0</text>
                                <rect x="352" y="430" width="56" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
                                <text x="380" y="474" text-anchor="middle" font-size="34" fill="#854d0e" font-weight="bold" font-family="'Noto Serif SC',serif">1</text>
                                <rect x="150" y="520" width="500" height="58" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
                                <foreignObject x="150" y="524" width="500" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" x-html="renderMath('这个算式的结果是 $\\boldsymbol{1012}$')" style="font-size:21px;font-weight:bold;color:#991b1b;text-align:center;line-height:50px;font-family:'Noto Sans SC',sans-serif;"></div>
                                </foreignObject>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
                    {
                        "title": "看清题目结构",
                        "description": "这是一个两位数乘两位数的竖式：被乘数是 $\\square1$，乘数是 $\\square\\square$；第一部分积是 $2\\square$，第二部分积是 $\\square\\square$（左移一位），最终的积是 $\\square\\square\\square2$。",
                        "bubbleText": "别被一堆方框吓到！我们只要盯着已经露出来的数字：被乘数个位的 $1$、第一部分积开头的 $2$，还有最后积的个位 $2$，顺藤摸瓜就能把方框一个个填出来。",
                        "bubblePos": { "x": 500, "y": 40 }
                    },
                    {
                        "title": "锁定个位这一列",
                        "description": "先看最右边的个位列：被乘数个位是 $1$，乘数的个位记作 $c$，第一部分积由 $\\square1\\times c$ 得到，且它是一个二十几的数 $2\\square$。",
                        "bubbleText": "做数字谜有个窍门：从最右边的个位算起。个位上 $1$ 乘以任何数都等于那个数本身，所以乘数的个位是几，第一部分积的个位就是几。",
                        "bubblePos": { "x": 500, "y": 60 }
                    },
                    {
                        "title": "推出乘数个位与第一部分积",
                        "description": "第一部分积是 $2\\square$，即 $20$ 到 $29$。因为 $11\\times2=22$ 正好落在这个范围，所以乘数的个位 $c=2$，第一部分积就是 $22$。",
                        "bubbleText": "第一部分积是二十几。被乘数个位是 $1$，$1\\times2=2$，正好凑成 $22$，所以乘数的个位一定是 $2$，第一部分积也就填成 $22$ 啦。",
                        "bubblePos": { "x": 500, "y": 210 }
                    },
                    {
                        "title": "推出被乘数 = 11",
                        "description": "第一部分积的十位是 $2$，它来自被乘数十位 $\\square\\times2$ 的结果，只有 $1\\times2=2$ 满足，所以被乘数的十位是 $1$，被乘数就是 $11$。",
                        "bubbleText": "第一部分积 $22$ 的十位那个 $2$ 是怎么来的？是被乘数十位上的数乘 $2$ 得到的。哪个数乘 $2$ 等于 $2$？只有 $1$！所以被乘数就是 $11$。",
                        "bubblePos": { "x": 500, "y": 300 }
                    },
                    {
                        "title": "推出乘数十位与第二部分积",
                        "description": "设乘数十位为 $d$，则第二部分积为 $11\\times d$。要使最终的积成为四位数，需要 $d=9$，此时 $11\\times9=99$，所以乘数是 $92$，第二部分积是 $99$。",
                        "bubbleText": "最后的积是四位数，说明第二部分积要足够大。$11$ 乘几能撑起四位数呢？试一试，$11\\times9=99$ 进位后刚好够，所以乘数的十位是 $9$，第二部分积填 $99$。",
                        "bubblePos": { "x": 40, "y": 200 }
                    },
                    {
                        "title": "把两个部分积相加",
                        "description": "按竖式对齐相加：第一部分积 $22$ 加上第二部分积 $99$ 左移一位得到的 $990$，即 $22+990=1012$。",
                        "bubbleText": "最后就是加法啦！记住第二部分积要往左挪一位，相当于 $99\\times10=990$。上下相加：$22+990=1012$。",
                        "bubblePos": { "x": 480, "y": 300 }
                    },
                    {
                        "title": "得出最终结果",
                        "description": "完整算式为 $11\\times92=1012$，所以这个残缺乘法竖式的结果是 $1012$。",
                        "bubbleText": "大功告成！把方框全部填好：$11\\times92=1012$。这个算式的结果就是 $1012$，你学会这种顺藤摸瓜的推理了吗？",
                        "bubblePos": { "x": 250, "y": 60 }
                    }
                ],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
