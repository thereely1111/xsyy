<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程追及应用题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">行程追及应用题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('小智步行5千米\/时先走4小时，小慧骑车15千米\/时追赶，追上时恰好到达森林公园，求学校到公园的距离。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- 基础场景：道路、学校、森林公园（始终可见） -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-500">
                                <!-- 道路 -->
                                <rect x="60" y="345" width="680" height="12" rx="6" fill="#d6d3d1" />
                                <line x1="60" y1="351" x2="740" y2="351" stroke="#a8a29e" stroke-width="1" stroke-dasharray="12,8" />

                                <!-- 学校建筑 -->
                                <rect x="55" y="290" width="60" height="55" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
                                <polygon points="55,290 85,265 115,290" fill="#dc2626" stroke="#991b1b" stroke-width="1" />
                                <rect x="75" y="315" width="16" height="30" fill="#92400e" />
                                <text x="85" y="375" text-anchor="middle" font-size="13" fill="#44403c" font-weight="bold">学校</text>

                                <!-- 森林公园 -->
                                <circle cx="710" cy="300" r="22" fill="#16a34a" opacity="0.8" />
                                <circle cx="730" cy="310" r="18" fill="#15803d" opacity="0.8" />
                                <circle cx="695" cy="312" r="16" fill="#22c55e" opacity="0.7" />
                                <rect x="707" y="318" width="6" height="27" fill="#78350f" />
                                <rect x="725" y="322" width="5" height="23" fill="#78350f" />
                                <text x="712" y="375" text-anchor="middle" font-size="13" fill="#44403c" font-weight="bold">森林公园</text>

                                <!-- 总距离标注 -->
                                <line x1="85" y1="395" x2="712" y2="395" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)" />
                                <text x="400" y="415" text-anchor="middle" font-size="13" fill="#57534e">学校到森林公园的距离 = ?</text>
                            </g>

                            <!-- 第1步：小智出发步行 -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-700">
                                <!-- 小智（步行者）-->
                                <circle cx="130" cy="310" r="12" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" />
                                <line x1="130" y1="322" x2="130" y2="342" stroke="#92400e" stroke-width="2.5" />
                                <line x1="130" y1="328" x2="120" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="130" y1="328" x2="140" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="130" y1="342" x2="122" y2="355" stroke="#92400e" stroke-width="2" />
                                <line x1="130" y1="342" x2="138" y2="355" stroke="#92400e" stroke-width="2" />
                                <text x="130" y="290" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">小智</text>
                                <!-- 速度标注 -->
                                <foreignObject x="80" y="248" width="130" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#b45309;font-weight:bold;text-align:center;" x-html="renderMath('步行 $5$ 千米/时')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第2步：4小时后小智走了20千米，小慧出发 -->
                            <g x-show="sceneStep >= 2" x-transition:enter="transition ease-out duration-700">
                                <!-- 小智4小时后的位置 -->
                                <circle cx="330" cy="310" r="12" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" />
                                <line x1="330" y1="322" x2="330" y2="342" stroke="#92400e" stroke-width="2.5" />
                                <line x1="330" y1="328" x2="320" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="330" y1="328" x2="340" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="330" y1="342" x2="322" y2="355" stroke="#92400e" stroke-width="2" />
                                <line x1="330" y1="342" x2="338" y2="355" stroke="#92400e" stroke-width="2" />
                                <text x="330" y="290" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">小智(4h后)</text>

                                <!-- 小智走过的轨迹（虚线） -->
                                <line x1="130" y1="351" x2="330" y2="351" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,5" opacity="0.7" />

                                <!-- 20千米标注 -->
                                <line x1="130" y1="385" x2="330" y2="385" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
                                <foreignObject x="170" y="388" width="130" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#d97706;font-weight:bold;text-align:center;" x-html="renderMath('$5\\times4=20$ 千米')"></div>
                                </foreignObject>

                                <!-- 小慧出发 -->
                                <circle cx="100" cy="310" r="12" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5" />
                                <line x1="100" y1="322" x2="100" y2="340" stroke="#1e40af" stroke-width="2.5" />
                                <line x1="100" y1="328" x2="90" y2="336" stroke="#1e40af" stroke-width="2" />
                                <line x1="100" y1="328" x2="110" y2="336" stroke="#1e40af" stroke-width="2" />
                                <circle cx="92" cy="348" r="7" fill="none" stroke="#1e40af" stroke-width="2" />
                                <circle cx="112" cy="348" r="7" fill="none" stroke="#1e40af" stroke-width="2" />
                                <text x="100" y="290" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">小慧</text>
                                <foreignObject x="45" y="248" width="140" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#1e40af;font-weight:bold;text-align:center;" x-html="renderMath('骑车 $15$ 千米/时')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第3步：设未知数t -->
                            <g x-show="sceneStep >= 3" x-transition:enter="transition ease-out duration-700">
                                <!-- 时间标注 -->
                                <foreignObject x="230" y="175" width="340" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#7c3aed;font-weight:bold;text-align:center;background:#f5f3ff;border:1px solid #c4b5fd;border-radius:8px;padding:6px 12px;" x-html="renderMath('设小慧出发后 $t$ 小时追上小智')"></div>
                                </foreignObject>

                                <!-- 小慧行驶距离标注 -->
                                <line x1="100" y1="435" x2="712" y2="435" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
                                <foreignObject x="320" y="440" width="180" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#2563eb;font-weight:bold;text-align:center;" x-html="renderMath('小慧走: $15t$ 千米')"></div>
                                </foreignObject>

                                <!-- 小智行驶距离标注 -->
                                <line x1="100" y1="475" x2="712" y2="475" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
                                <foreignObject x="290" y="480" width="230" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#d97706;font-weight:bold;text-align:center;" x-html="renderMath('小智走: $5(t+4)$ 千米')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第4步：列方程 -->
                            <g x-show="sceneStep >= 4" x-transition:enter="transition ease-out duration-700">
                                <foreignObject x="190" y="115" width="420" height="55">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#dc2626;font-weight:bold;text-align:center;background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;padding:8px 16px;" x-html="renderMath('追上时路程相等: $15t = 5(t+4)$')"></div>
                                </foreignObject>

                                <!-- 等号连接示意 -->
                                <line x1="400" y1="435" x2="400" y2="475" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
                                <text x="415" y="460" font-size="16" fill="#dc2626" font-weight="bold">=</text>
                            </g>

                            <!-- 第5步：解方程过程 -->
                            <g x-show="sceneStep >= 5" x-transition:enter="transition ease-out duration-700">
                                <foreignObject x="230" y="510" width="340" height="85">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#1f2937;text-align:center;background:#f9fafb;border:1px solid #d1d5db;border-radius:10px;padding:8px 14px;line-height:1.9;" x-html="renderMath('$15t = 5t + 20$<br/>$10t = 20$<br/>$t = 2$ (小时)')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第6步：求距离，两人到达公园 -->
                            <g x-show="sceneStep >= 6" x-transition:enter="transition ease-out duration-700">
                                <!-- 小慧到达公园位置 -->
                                <circle cx="690" cy="310" r="12" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5" />
                                <line x1="690" y1="322" x2="690" y2="340" stroke="#1e40af" stroke-width="2.5" />
                                <line x1="690" y1="328" x2="680" y2="336" stroke="#1e40af" stroke-width="2" />
                                <line x1="690" y1="328" x2="700" y2="336" stroke="#1e40af" stroke-width="2" />
                                <circle cx="682" cy="348" r="7" fill="none" stroke="#1e40af" stroke-width="2" />
                                <circle cx="702" cy="348" r="7" fill="none" stroke="#1e40af" stroke-width="2" />

                                <!-- 小智也到达公园 -->
                                <circle cx="660" cy="310" r="12" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" />
                                <line x1="660" y1="322" x2="660" y2="342" stroke="#92400e" stroke-width="2.5" />
                                <line x1="660" y1="328" x2="650" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="660" y1="328" x2="670" y2="338" stroke="#92400e" stroke-width="2" />
                                <line x1="660" y1="342" x2="652" y2="355" stroke="#92400e" stroke-width="2" />
                                <line x1="660" y1="342" x2="668" y2="355" stroke="#92400e" stroke-width="2" />

                                <!-- 相遇标注 -->
                                <text x="675" y="285" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">相遇!</text>

                                <!-- 小慧轨迹（虚线） -->
                                <line x1="100" y1="351" x2="690" y2="351" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,6" opacity="0.6" />

                                <!-- 最终答案 -->
                                <foreignObject x="250" y="530" width="300" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#16a34a;font-weight:bold;text-align:center;background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:8px 16px;" x-html="renderMath('距离 $= 15 \\times 2 = 30$ 千米')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第7步：验证 -->
                            <g x-show="sceneStep >= 7" x-transition:enter="transition ease-out duration-700">
                                <foreignObject x="170" y="55" width="460" height="55">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#166534;text-align:center;background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:8px 12px;line-height:1.7;" x-html="renderMath('验证: 小智 $5\\times6=30$ 千米，小慧 $15\\times2=30$ 千米，相等!')"></div>
                                </foreignObject>

                                <!-- 6小时标注 -->
                                <foreignObject x="290" y="225" width="220" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#92400e;font-weight:bold;text-align:center;" x-html="renderMath('小智共走 $4+2=6$ 小时')"></div>
                                </foreignObject>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [{"title":"读懂题意，找出关键信息","description":"小智步行速度 $5$ 千米\/时，小慧骑车速度 $15$ 千米\/时。小慧比小智晚出发 $4$ 小时。追上时恰好到达森林公园。","bubbleText":"同学们，这道题讲的是两个人从学校去森林公园。小智走得慢但先出发，小慧骑得快但晚走4小时。我们要找到她们相遇的地方——正好就是森林公园！","bubblePos":{"x":150,"y":140}},{"title":"分析小慧出发时的差距","description":"小慧出发时，小智已走 $4$ 小时，领先距离为 $5 \\times 4 = 20$ 千米。","bubbleText":"小智先走了4个小时，每小时走5千米，所以小慧还没动的时候，小智已经走出去 $5\\times4=20$ 千米了。这就是小慧要追的距离！","bubblePos":{"x":180,"y":160}},{"title":"设未知数 t","description":"设小慧出发后经过 $t$ 小时追上小智。则小智共走了 $(t+4)$ 小时。","bubbleText":"我们设小慧出发后过了 $t$ 小时追上小智。那小智一共走了多久呢？他比小慧多走了4小时，所以小智走了 $(t+4)$ 小时。","bubblePos":{"x":250,"y":130}},{"title":"列方程：路程相等","description":"追上时两人从学校出发走的路程相同：$15t = 5(t+4)$","bubbleText":"追上的意思是什么？就是两个人从学校算起走的路程一样远！小慧走 $15t$，小智走 $5(t+4)$，它们相等，方程就列出来了。","bubblePos":{"x":220,"y":100}},{"title":"解方程求 t","description":"$15t = 5t + 20$，移项得 $10t = 20$，所以 $t = 2$ 小时。","bubbleText":"解方程很简单：先把右边展开变成 $5t+20$，然后把 $5t$ 移到左边，$15t-5t=10t$，$10t=20$，两边除以10，$t=2$。小慧骑了2小时就追上了！","bubblePos":{"x":240,"y":180}},{"title":"计算学校到公园的距离","description":"距离 $= 15 \\times 2 = 30$ 千米（或 $5 \\times 6 = 30$ 千米）。","bubbleText":"题目问学校到森林公园多远。用小慧算：她骑了2小时，每小时15千米，$15\\times2=30$ 千米。这就是答案！","bubblePos":{"x":260,"y":150}},{"title":"验证答案","description":"小智：$5 \\times (2+4) = 5 \\times 6 = 30$ 千米；小慧：$15 \\times 2 = 30$ 千米。两人路程相等，答案正确。","bubbleText":"最后验证一下：小智走了6小时，$5\\times6=30$千米；小慧走了2小时，$15\\times2=30$千米。两个人都是30千米，完全对上了！答案就是30千米。","bubblePos":{"x":200,"y":100}}],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
