<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比例尺相遇问题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">比例尺相遇问题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('由地图比例关系求实际距离，再算两车相遇时间')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#2e2e2e" flood-opacity="0.25"/></filter><filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7f3e8"/><stop offset="100%" stop-color="#ece5d3"/></linearGradient><linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c94b43"/><stop offset="100%" stop-color="#9e2b25"/></linearGradient><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b93a32"/></marker></defs><style>.svg-elem { transition: all 0.8s cubic-bezier(0.34,1.56,0.64,1); transform-box: fill-box; transform-origin: center; } .ink { fill: #4a4a4a; } .ink-stroke { stroke: #4a4a4a; } .cinnabar { fill: #b93a32; } .cinnabar-stroke { stroke: #b93a32; } .rice { fill: #f7f3e8; } .scroll-border { fill: none; stroke: #8c8c8c; stroke-width: 1.5; opacity: 0.45; } .dashed-line { fill:none; stroke:#b93a32; stroke-width:2.5; stroke-dasharray:10 8; stroke-linecap:round; } .dash-flow { animation: flowLine 1.2s linear infinite; } @keyframes flowLine { to { stroke-dashoffset: -36; } } @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } } .float-anim { animation: floatY 3s ease-in-out infinite; } .breathe-anim { animation: breathe 2s ease-in-out infinite; } .train-a-start { transform: translateX(0); transition: transform 1s cubic-bezier(0.34,1.56,0.64,1); } .train-a-end { transform: translateX(200px); transition: transform 1s cubic-bezier(0.34,1.56,0.64,1); } .train-b-start { transform: translateX(0); transition: transform 1s cubic-bezier(0.34,1.56,0.64,1); } .train-b-end { transform: translateX(-200px); transition: transform 1s cubic-bezier(0.34,1.56,0.64,1); } .transition-all { transition-property: all; } .duration-1000 { transition-duration: 1000ms; } .duration-700 { transition-duration: 700ms; } .ease-out { transition-timing-function: cubic-bezier(0,0,0.2,1); } .ease-in { transition-timing-function: cubic-bezier(0.4,0,1,1); } .opacity-0 { opacity: 0; } .opacity-100 { opacity: 1; } .scale-90 { transform: scale(0.9); transform-box: fill-box; transform-origin: center; } .scale-100 { transform: scale(1); } .translate-y-4 { transform: translateY(16px); } .translate-y-0 { transform: translateY(0); } text { font-family: "KaiTi","STKaiti","Microsoft YaHei",serif; } .formula-box { background: rgba(247,243,232,0.96); border: 1.5px solid #b93a32; border-radius: 8px; padding: 10px 16px; color: #4a4a4a; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }</style><g class="svg-elem" x-show="sceneStep >= 0" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-90"><rect x="80" y="120" width="640" height="320" rx="12" fill="url(#paperGrad)" filter="url(#paperShadow)"/><rect x="95" y="135" width="610" height="290" rx="8" class="scroll-border"/><text x="400" y="170" text-anchor="middle" font-size="24" fill="#4a4a4a" font-weight="bold">比例尺相遇问题</text><line x1="200" y1="260" x2="600" y2="260" class="dashed-line dash-flow" x-show="sceneStep >= 0"/><g transform="translate(200,260)" class="breathe-anim"><circle r="14" fill="#f7f3e8" stroke="#b93a32" stroke-width="2.5"/><text y="-22" text-anchor="middle" font-size="20" fill="#4a4a4a">甲地</text></g><g transform="translate(600,260)" class="breathe-anim"><circle r="14" fill="#f7f3e8" stroke="#b93a32" stroke-width="2.5"/><text y="-22" text-anchor="middle" font-size="20" fill="#4a4a4a">乙地</text></g><g x-show="sceneStep >= 0"><line x1="200" y1="290" x2="600" y2="290" stroke="#8c8c8c" stroke-width="1"/><line x1="200" y1="285" x2="200" y2="295" stroke="#8c8c8c" stroke-width="1"/><line x1="600" y1="285" x2="600" y2="295" stroke="#8c8c8c" stroke-width="1"/><text x="400" y="310" text-anchor="middle" font-size="18" fill="#4a4a4a">图上距离 9 厘米</text></g></g><g class="svg-elem" x-show="sceneStep >= 1 &amp;&amp; sceneStep &lt;= 4"><line x1="220" y1="370" x2="340" y2="370" stroke="#4a4a4a" stroke-width="3"/><line x1="220" y1="365" x2="220" y2="375" stroke="#4a4a4a" stroke-width="2"/><line x1="340" y1="365" x2="340" y2="375" stroke="#4a4a4a" stroke-width="2"/><text x="280" y="395" text-anchor="middle" font-size="16" fill="#4a4a4a">图上 1 厘米</text><foreignObject x="360" y="350" width="260" height="60" class="svg-elem"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:16px;">实际 6000000 厘米 = 60 千米</div></foreignObject></g><path d="M 340 370 C 420 370, 420 300, 480 300" fill="none" stroke="#b93a32" stroke-width="2" class="dashed-line dash-flow svg-elem" marker-end="url(#arrowRed)" x-show="sceneStep >= 2"/><foreignObject x="300" y="190" width="260" height="60" class="svg-elem" x-show="sceneStep >= 3" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition-all duration-700 ease-in" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-4"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">实际距离：9 × 60 = 540（千米）</div></foreignObject><g class="svg-elem" x-show="sceneStep >= 3"><text x="400" y="245" text-anchor="middle" font-size="16" fill="#b93a32" class="breathe-anim">甲乙实际相距 540 千米</text></g><g class="svg-elem" x-show="sceneStep >= 4" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition-all duration-700 ease-in"><line x1="150" y1="470" x2="650" y2="470" class="dashed-line dash-flow"/><g x-show="sceneStep >= 7"><line x1="400" y1="450" x2="400" y2="490" stroke="#b93a32" stroke-width="2"/><text x="400" y="445" text-anchor="middle" font-size="16" fill="#b93a32">相遇点</text></g><g class="svg-elem" :class="sceneStep >= 7 ? 'train-a-end' : 'train-a-start'" transform="translate(170,455)"><text font-size="32" x="-16" y="12">🚂</text></g><g class="svg-elem" :class="sceneStep >= 7 ? 'train-b-end' : 'train-b-start'" transform="translate(630,455)"><text font-size="32" x="-16" y="12">🚆</text></g></g><g class="svg-elem" x-show="sceneStep >= 5"><foreignObject x="120" y="500" width="160" height="40" class="svg-elem"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:15px;">甲车 57 千米/时</div></foreignObject><foreignObject x="520" y="500" width="160" height="40" class="svg-elem"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:15px;">乙车 43 千米/时</div></foreignObject></g><foreignObject x="300" y="525" width="260" height="40" class="svg-elem" x-show="sceneStep >= 6"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:17px;">速度和：57 + 43 = 100（千米/时）</div></foreignObject><foreignObject x="300" y="560" width="260" height="40" class="svg-elem" x-show="sceneStep >= 7"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:17px; background:#b93a32; color:#f7f3e8;">时间：540 ÷ 100 = 5.4（小时）</div></foreignObject><g class="svg-elem" x-show="sceneStep >= 8" x-transition:enter="transition-all duration-1000 ease-out" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition-all duration-700 ease-in"><foreignObject x="230" y="140" width="340" height="130" class="svg-elem"><div xmlns="http://www.w3.org/1999/xhtml" class="formula-box" style="font-size:16px; line-height:1.8; text-align:left;">验证：<br/>甲车行驶：57 × 5.4 = 307.8 千米<br/>乙车行驶：43 × 5.4 = 232.2 千米<br/>合计：307.8 + 232.2 = 540 千米 ✓</div></foreignObject><g transform="translate(620,180)" class="float-anim"><circle r="22" fill="none" stroke="#b93a32" stroke-width="3"/><text y="7" text-anchor="middle" font-size="24" fill="#b93a32">✓</text></g></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题识图",
        "description": "在比例尺1:6000000的地图上，量得甲、乙两地之间的图上距离是9厘米。",
        "bubbleText": "这是一道把比例尺与相遇问题结合起来的应用题。",
        "bubblePos": {
            "x": 420,
            "y": 80
        }
    },
    {
        "title": "理解比例尺",
        "description": "比例尺1:6000000表示图上1厘米对应实际6000000厘米。",
        "bubbleText": "比例尺告诉我们“图上1厘米”代表“实际多长”。",
        "bubblePos": {
            "x": 300,
            "y": 360
        }
    },
    {
        "title": "单位换算",
        "description": "因为1千米=100000厘米，所以6000000厘米=60千米，即图上1厘米代表实际60千米。",
        "bubbleText": "先把厘米换算成千米：6000000厘米 = 60千米。",
        "bubblePos": {
            "x": 500,
            "y": 340
        }
    },
    {
        "title": "求实际距离",
        "description": "图上9厘米对应的实际距离为9×60=540千米，所以甲、乙两地实际相距540千米。",
        "bubbleText": "实际距离 = 图上距离 × 每厘米代表的实际距离。",
        "bubblePos": {
            "x": 400,
            "y": 210
        }
    },
    {
        "title": "建立相遇模型",
        "description": "两列火车同时从甲、乙两地相对开出，相当于在一条长540千米的线路上相向而行。",
        "bubbleText": "把两地之间的实际距离看成总路程。",
        "bubblePos": {
            "x": 400,
            "y": 430
        }
    },
    {
        "title": "明确两车速度",
        "description": "甲车每小时行57千米，乙车每小时行43千米，两车同时出发。",
        "bubbleText": "两车的速度是题目给出的关键条件。",
        "bubblePos": {
            "x": 400,
            "y": 490
        }
    },
    {
        "title": "计算速度和",
        "description": "两车相对行驶，每小时共同缩短的距离为57+43=100千米，即速度和为100千米/时。",
        "bubbleText": "速度和 = 甲车速度 + 乙车速度。",
        "bubblePos": {
            "x": 400,
            "y": 530
        }
    },
    {
        "title": "求相遇时间",
        "description": "相遇时间 = 总路程 ÷ 速度和 = 540 ÷ 100 = 5.4小时。",
        "bubbleText": "5.4小时，也就是5小时24分钟后两车相遇。",
        "bubblePos": {
            "x": 400,
            "y": 570
        }
    },
    {
        "title": "验证答案",
        "description": "甲车行驶57×5.4=307.8千米，乙车行驶43×5.4=232.2千米，合计307.8+232.2=540千米，正好等于实际距离。",
        "bubbleText": "验证通过，答案正确！",
        "bubblePos": {
            "x": 450,
            "y": 200
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
