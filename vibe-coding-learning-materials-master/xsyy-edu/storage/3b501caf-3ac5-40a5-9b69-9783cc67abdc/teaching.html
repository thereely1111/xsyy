<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二元一次方程组 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">二元一次方程组</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('根据总量与倍数差五吨列方程组求两仓存粮')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='roofRed' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#d85c55'/><stop offset='100%' stop-color='#a83229'/></linearGradient><linearGradient id='wallRed' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#f5f0e8'/><stop offset='100%' stop-color='#e6dfd3'/></linearGradient><linearGradient id='roofGray' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#6e6e6e'/><stop offset='100%' stop-color='#3d3d3d'/></linearGradient><linearGradient id='wallGray' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#d9d4cc'/><stop offset='100%' stop-color='#b0aba3'/></linearGradient><filter id='dropShadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='2' dy='4' stdDeviation='3' flood-color='#2c2c2c' flood-opacity='0.25'/></filter><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='2.5' result='coloredBlur'/><feMerge><feMergeNode in='coloredBlur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><style>.svg-elem { transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); } .warehouse { filter: url(#dropShadow); } .dashed-line { fill: none; stroke: #c23a30; stroke-width: 2; stroke-dasharray: 8 6; stroke-linecap: round; opacity: 0.85; animation: dashFlow 1.2s linear infinite; } .ink-text { fill: #2c2c2c; font-family: 'Noto Serif SC', serif; } .cinnabar { fill: #c23a30; } .rice-box { background: #f5f0e8; border-left: 4px solid #c23a30; padding: 8px 12px; border-radius: 4px; box-shadow: 0 2px 6px rgba(44,44,44,0.15); font-family: 'Noto Serif SC', serif; color: #2c2c2c; font-size: 18px; line-height: 1.5; } .answer-box { background: #c23a30; color: #f5f0e8; padding: 10px 16px; border-radius: 6px; font-family: 'Noto Serif SC', serif; font-size: 20px; box-shadow: 0 4px 10px rgba(44,44,44,0.25); } @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } } @keyframes dashFlow { to { stroke-dashoffset: -28; } } .float-anim { animation: floatY 3s ease-in-out infinite; } .beat-anim { animation: heartbeat 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }</style><line x1='60' y1='520' x2='740' y2='520' stroke='#b0aba3' stroke-width='2' stroke-linecap='round' class='svg-elem'/><g class='warehouse svg-elem' x-show='sceneStep &gt;= 1'><polygon points='170,460 260,460 215,410' fill='url(#roofGray)'/><rect x='180' y='460' width='80' height='60' rx='4' fill='url(#wallGray)'/><path d='M 195 500 Q 220 480 245 500 Z' fill='#3d3d3d' opacity='0.15'/><text x='220' y='498' text-anchor='middle' class='ink-text' font-size='24' font-weight='700'>乙</text><rect x='200' y='475' width='40' height='30' rx='2' fill='none' stroke='#8c8c8c' stroke-width='1.5'/></g><g class='warehouse svg-elem' x-show='sceneStep &gt;= 1'><polygon points='550,400 690,400 620,330' fill='url(#roofRed)'/><rect x='560' y='400' width='120' height='120' rx='6' fill='url(#wallRed)'/><path d='M 580 480 Q 620 440 660 480 Z' fill='#c23a30' opacity='0.15'/><text x='620' y='470' text-anchor='middle' class='cinnabar' font-size='32' font-weight='700'>甲</text><rect x='590' y='430' width='60' height='60' rx='3' fill='none' stroke='#c23a30' stroke-width='2'/></g><foreignObject x='300' y='25' width='200' height='50' class='svg-elem float-anim' x-show='sceneStep &gt;= 1'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center;'>两仓平均存粮 32.5 吨</div></foreignObject><foreignObject x='320' y='75' width='160' height='50' class='svg-elem' x-show='sceneStep &gt;= 2' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4 scale-95' x-transition:enter-end='opacity-100 translate-y-0 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center; color:#c23a30; font-weight:700;'>总量 = 65 吨</div></foreignObject><path d='M 400 70 C 400 110, 360 150, 360 175' class='dashed-line svg-elem' x-show='sceneStep &gt;= 2' x-transition:enter='transition-opacity duration-1000 ease-in-out' x-transition:enter-start='opacity-0' x-transition:enter-end='opacity-100'/><foreignObject x='50' y='120' width='230' height='90' class='svg-elem beat-anim' x-show='sceneStep &gt;= 3 &amp;&amp; sceneStep &lt;= 9' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 transform -translate-x-4 scale-95' x-transition:enter-end='opacity-100 transform translate-x-0 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 transform -translate-x-4 scale-90'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box'>甲仓 = 乙仓的 4 倍 − 5 吨</div></foreignObject><path d='M 280 165 C 290 165, 295 175, 300 180' class='dashed-line svg-elem' x-show='sceneStep &gt;= 4' x-transition:enter='transition-opacity duration-1000 ease-in-out' x-transition:enter-start='opacity-0' x-transition:enter-end='opacity-100'/><path d='M 260 490 C 400 540, 560 540, 560 490' class='dashed-line svg-elem' x-show='sceneStep &gt;= 1' x-transition:enter='transition-opacity duration-1000 ease-in-out' x-transition:enter-start='opacity-0' x-transition:enter-end='opacity-100'/><foreignObject x='300' y='180' width='220' height='100' class='svg-elem' x-show='sceneStep &gt;= 4' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 translate-y-6 scale-90' x-transition:enter-end='opacity-100 translate-y-0 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center;'>x + y = 65<br/>x = 4y − 5</div></foreignObject><foreignObject x='300' y='260' width='220' height='50' class='svg-elem' x-show='sceneStep &gt;= 5' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 translate-y-4' x-transition:enter-end='opacity-100 translate-y-0'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center; color:#c23a30;'>(4y − 5) + y = 65</div></foreignObject><foreignObject x='320' y='330' width='160' height='70' class='svg-elem beat-anim' x-show='sceneStep &gt;= 6' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 scale-75' x-transition:enter-end='opacity-100 scale-100'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center;'>5y = 70<br/>y = 14</div></foreignObject><foreignObject x='160' y='360' width='110' height='45' class='svg-elem beat-anim' x-show='sceneStep &gt;= 7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 -translate-y-4 scale-90' x-transition:enter-end='opacity-100 translate-y-0 scale-100'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center; font-weight:700;'>乙 = 14 吨</div></foreignObject><foreignObject x='570' y='280' width='110' height='45' class='svg-elem beat-anim' x-show='sceneStep &gt;= 7' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 -translate-y-4 scale-90' x-transition:enter-end='opacity-100 translate-y-0 scale-100'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center; font-weight:700; color:#c23a30;'>甲 = 51 吨</div></foreignObject><foreignObject x='320' y='410' width='160' height='45' class='svg-elem' x-show='sceneStep &gt;= 8' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 scale-90' x-transition:enter-end='opacity-100 scale-100'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center;'>51 + 14 = 65 ✓</div></foreignObject><foreignObject x='320' y='460' width='180' height='45' class='svg-elem' x-show='sceneStep &gt;= 9' x-transition:enter='transition-all duration-700 ease-out' x-transition:enter-start='opacity-0 scale-90' x-transition:enter-end='opacity-100 scale-100'><div xmlns='http://www.w3.org/1999/xhtml' class='rice-box' style='text-align:center;'>4×14 − 5 = 51 ✓</div></foreignObject><foreignObject x='230' y='540' width='340' height='55' class='svg-elem' x-show='sceneStep &gt;= 10' x-transition:enter='transition-all duration-1000 ease-out' x-transition:enter-start='opacity-0 transform -translate-y-6 scale-90' x-transition:enter-end='opacity-100 transform translate-y-0 scale-100' x-transition:leave='transition-all duration-700 ease-in' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-80'><div xmlns='http://www.w3.org/1999/xhtml' class='answer-box' style='text-align:center;'>答案：甲 51 吨，乙 14 吨</div></foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题理解",
        "description": "题目给出甲、乙两个仓库的平均存粮为 32.5 吨，这是整道题的已知起点。",
        "bubbleText": "平均存粮 32.5 吨意味着什么？",
        "bubblePos": {
            "x": 120,
            "y": 80
        }
    },
    {
        "title": "计算总量",
        "description": "两个仓库的平均存粮乘 2，得到甲、乙两仓的粮食总量：32.5 × 2 = 65 吨。",
        "bubbleText": "总量是 65 吨",
        "bubblePos": {
            "x": 400,
            "y": 70
        }
    },
    {
        "title": "梳理关系",
        "description": "甲仓存粮比乙仓的 4 倍少 5 吨，即甲 = 4 × 乙 − 5。",
        "bubbleText": "甲 = 4×乙 − 5",
        "bubblePos": {
            "x": 650,
            "y": 140
        }
    },
    {
        "title": "列方程组",
        "description": "设甲仓为 x 吨，乙仓为 y 吨，根据总量与倍数关系列出二元一次方程组。",
        "bubbleText": "二元一次方程组",
        "bubblePos": {
            "x": 400,
            "y": 200
        }
    },
    {
        "title": "代入消元",
        "description": "把 x = 4y − 5 代入 x + y = 65，消去 x，得到只含 y 的方程。",
        "bubbleText": "合并同类项",
        "bubblePos": {
            "x": 500,
            "y": 280
        }
    },
    {
        "title": "求解乙仓",
        "description": "化简得 5y − 5 = 65，移项后 5y = 70，解得 y = 14，即乙仓存粮 14 吨。",
        "bubbleText": "乙仓 = 14 吨",
        "bubblePos": {
            "x": 280,
            "y": 360
        }
    },
    {
        "title": "求解甲仓",
        "description": "将 y = 14 代回 x = 4y − 5，算出 x = 4×14 − 5 = 51，即甲仓存粮 51 吨。",
        "bubbleText": "甲仓 = 51 吨",
        "bubblePos": {
            "x": 650,
            "y": 290
        }
    },
    {
        "title": "验证总量",
        "description": "检验两仓之和：51 + 14 = 65，与第 2 步求出的总量一致。",
        "bubbleText": "和为 65 吨",
        "bubblePos": {
            "x": 400,
            "y": 420
        }
    },
    {
        "title": "验证倍数关系",
        "description": "检验倍数关系：4×14 − 5 = 51，与甲仓存粮一致，两个条件都满足。",
        "bubbleText": "关系成立",
        "bubblePos": {
            "x": 400,
            "y": 470
        }
    },
    {
        "title": "得出答案",
        "description": "经过列方程组、代入求解和双重验证，最终得到甲仓存粮 51 吨，乙仓存粮 14 吨。",
        "bubbleText": "甲 51 吨，乙 14 吨",
        "bubblePos": {
            "x": 400,
            "y": 555
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
