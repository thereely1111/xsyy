<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解分式方程 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">解分式方程</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('通过去分母将分式方程转化为整式方程求解')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><linearGradient id='paperGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#faf7f0'/><stop offset='100%' stop-color='#efe9dc'/></linearGradient><linearGradient id='redGrad' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#b83b3b'/><stop offset='100%' stop-color='#8f2a2a'/></linearGradient><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#2a2a2a' flood-opacity='0.25'/></filter><filter id='glow' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='4' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter></defs><style>.svg-elem { transition: all 0.8s cubic-bezier(0.4,0,0.2,1); } .t-base { transition-property: all; } .t-700 { transition-duration: 700ms; } .t-1000 { transition-duration: 1000ms; } .ease-out-b { transition-timing-function: cubic-bezier(0.16,1,0.3,1); } .ease-in-out-b { transition-timing-function: cubic-bezier(0.4,0,0.2,1); } .enter-start { opacity: 0; transform: translateY(24px) scale(0.92); } .enter-end { opacity: 1; transform: translateY(0) scale(1); } .leave-start { opacity: 1; transform: translateY(0) scale(1); } .leave-end { opacity: 0; transform: translateY(-16px) scale(0.92); } .dashed-line { fill: none; stroke: #8c7b70; stroke-width: 2; stroke-dasharray: 10 8; stroke-linecap: round; animation: flow 2s linear infinite; } @keyframes flow { to { stroke-dashoffset: -40; } } @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } } @keyframes heartbeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.06); } 50% { transform: scale(1); } 75% { transform: scale(1.04); } } .float { animation: float 3s ease-in-out infinite; } .heartbeat { animation: heartbeat 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; } .formula-box { display: inline-block; padding: 8px 14px; background: rgba(250,247,240,0.92); border-radius: 10px; border: 1px solid #d6cfc2; box-shadow: 0 2px 6px rgba(0,0,0,0.06); font-family: KaiTi,STKaiti,serif; color: #3a3a3a; } .label { font-family: KaiTi,STKaiti,serif; fill: #6b5e55; font-size: 16px; }</style><g class='svg-elem'><path d='M 110 90 Q 95 300 110 510 L 690 510 Q 705 300 690 90 Z' fill='url(#paperGrad)' filter='url(#shadow)'/><rect x='100' y='78' width='600' height='14' rx='7' fill='#5c4b41' opacity='0.85'/><rect x='100' y='508' width='600' height='14' rx='7' fill='#5c4b41' opacity='0.85'/></g><foreignObject x='250' y='105' width='300' height='50' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' style='text-align:center; padding:6px; color:#4a4a4a; font-family:KaiTi,STKaiti,serif; font-size:26px; font-weight:bold;'>解分式方程</div></foreignObject><g class='svg-elem heartbeat' x-show='sceneStep >= 0 &amp;&amp; sceneStep <= 6' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><rect x='560' y='110' width='130' height='44' rx='8' fill='#fffaf2' stroke='#b83b3b' stroke-width='1.5' filter='url(#glow)'/><foreignObject x='560' y='110' width='130' height='44'><div xmlns='http://www.w3.org/1999/xhtml' style='display:flex;align-items:center;justify-content:center;height:100%;color:#b83b3b;font-family:KaiTi,serif;font-size:18px;'>x ≠ 1,2,6,7</div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 0 &amp;&amp; sceneStep <= 1' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='120' y='170' width='560' height='70'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:22px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML' display='block'><mstyle displaystyle='true' font-size='22px'><mfrac><mrow><mi>x</mi></mrow><mrow><mi>x</mi><mo>−</mo><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>x</mi><mo>−</mo><mn>9</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>7</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>x</mi><mo>−</mo><mn>8</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>6</mn></mrow></mfrac></mstyle></math></div></foreignObject></g><g class='svg-elem float' x-show='sceneStep >= 1 &amp;&amp; sceneStep <= 3' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='130' y='250' width='220' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:18px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML'><mfrac><mrow><mi>x</mi></mrow><mrow><mi>x</mi><mo>−</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>2</mn></mrow></mfrac></math></div></foreignObject><foreignObject x='130' y='330' width='220' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:18px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML'><mfrac><mrow><mi>x</mi><mo>−</mo><mn>9</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>7</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>7</mn></mrow></mfrac></math></div></foreignObject><foreignObject x='430' y='250' width='220' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:18px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML'><mfrac><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>1</mn></mrow></mfrac></math></div></foreignObject><foreignObject x='430' y='330' width='220' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:18px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML'><mfrac><mrow><mi>x</mi><mo>−</mo><mn>8</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>6</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>x</mi><mo>−</mo><mn>6</mn></mrow></mfrac></math></div></foreignObject></g><g class='svg-elem' x-show='sceneStep == 1' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><path class='dashed-line' d='M 400 235 Q 330 250 240 280'/><path class='dashed-line' d='M 400 235 Q 330 320 240 360'/><path class='dashed-line' d='M 400 235 Q 470 250 540 280'/><path class='dashed-line' d='M 400 235 Q 470 320 540 360'/></g><g class='svg-elem' x-show='sceneStep >= 2 &amp;&amp; sceneStep <= 4' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='150' y='260' width='260' height='70'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:20px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML' display='block'><mstyle displaystyle='true' font-size='20px'><mn>2</mn><mo>−</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>2</mn><mo>)</mo></mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>7</mn><mo>)</mo></mrow></mrow></mfrac></mstyle></math></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 3 &amp;&amp; sceneStep <= 4' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='430' y='260' width='260' height='70'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:20px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML' display='block'><mstyle displaystyle='true' font-size='20px'><mn>2</mn><mo>−</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>6</mn><mo>)</mo></mrow></mrow></mfrac></mstyle></math></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 2 &amp;&amp; sceneStep <= 3' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><path class='dashed-line' d='M 240 280 Q 260 290 280 295'/><path class='dashed-line' d='M 240 360 Q 260 330 280 295'/><path class='dashed-line' d='M 540 280 Q 550 290 560 295'/><path class='dashed-line' d='M 540 360 Q 550 330 560 295'/></g><g class='svg-elem' x-show='sceneStep == 4' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='220' y='360' width='360' height='70'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:22px; text-align:center;'><math xmlns='http://www.w3.org/1998/Math/MathML' display='block'><mstyle displaystyle='true' font-size='22px'><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>2</mn><mo>)</mo></mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>7</mn><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mrow><mo>(</mo><mi>x</mi><mo>−</mo><mn>6</mn><mo>)</mo></mrow></mstyle></math></div></foreignObject></g><g class='svg-elem' x-show='sceneStep == 4' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><path class='dashed-line' d='M 280 330 Q 340 345 400 395'/><path class='dashed-line' d='M 560 330 Q 480 345 400 395'/></g><g class='svg-elem' x-show='sceneStep == 5' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><foreignObject x='180' y='360' width='440' height='60'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:22px; text-align:center;'><span style='text-decoration:line-through;color:#999'>x²</span> − 9x + 14 = <span style='text-decoration:line-through;color:#999'>x²</span> − 7x + 6</div></foreignObject><foreignObject x='250' y='430' width='300' height='40'><div xmlns='http://www.w3.org/1999/xhtml' style='text-align:center;color:#8f2a2a;font-family:KaiTi,serif;font-size:20px;'>→ −9x + 14 = −7x + 6</div></foreignObject></g><g class='svg-elem heartbeat' x-show='sceneStep >= 6 &amp;&amp; sceneStep <= 7' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><rect x='360' y='410' width='80' height='80' rx='12' fill='url(#redGrad)' filter='url(#glow)'/><foreignObject x='360' y='410' width='80' height='80'><div xmlns='http://www.w3.org/1999/xhtml' style='display:flex;align-items:center;justify-content:center;height:100%;color:#fffaf2;font-family:KaiTi,serif;font-size:28px;font-weight:bold;'>x=4</div></foreignObject></g><g class='svg-elem' x-show='sceneStep == 7' x-transition:enter='t-base t-1000 ease-out-b' x-transition:enter-start='enter-start' x-transition:enter-end='enter-end' x-transition:leave='t-base t-700 ease-in-out-b' x-transition:leave-start='leave-start' x-transition:leave-end='leave-end'><path class='dashed-line' d='M 400 490 L 400 500'/><foreignObject x='160' y='500' width='480' height='80'><div xmlns='http://www.w3.org/1999/xhtml' class='formula-box' style='font-size:17px; text-align:center;'><div>左边 = 4/(4−2) + (4−9)/(4−7) = 2 + 5/3 = 11/3</div><div>右边 = (4+1)/(4−1) + (4−8)/(4−6) = 5/3 + 2 = 11/3</div><div style='color:#8f2a2a;margin-top:4px;'>左边 = 右边，x = 4 是原方程的解</div></div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "整理方程与定义域",
        "description": "观察原方程，注意分母不能为零，写出限制条件。",
        "bubbleText": "分母为零会使分式无意义，先把禁区标出来。",
        "bubblePos": {
            "x": 620,
            "y": 130
        }
    },
    {
        "title": "拆分分式",
        "description": "将每个分式拆成整式与简单分式之和，方便后续抵消。",
        "bubbleText": "看，每个分子都可以凑成分母的形式！",
        "bubblePos": {
            "x": 500,
            "y": 100
        }
    },
    {
        "title": "化简左边",
        "description": "合并整数部分与分式部分，得到左端最简形式。",
        "bubbleText": "左边两个1相加得2，分式合并后只剩一个分数。",
        "bubblePos": {
            "x": 200,
            "y": 160
        }
    },
    {
        "title": "化简右边",
        "description": "同理化简右边，发现结构与左边惊人相似。",
        "bubbleText": "右边也化出2，只是分母乘积不同。",
        "bubblePos": {
            "x": 600,
            "y": 160
        }
    },
    {
        "title": "约去常数",
        "description": "两边同时减去2，再约去公因子，得到分母乘积相等。",
        "bubbleText": "常数2互相抵消，−10也可以约掉。",
        "bubblePos": {
            "x": 400,
            "y": 260
        }
    },
    {
        "title": "展开并移项",
        "description": "展开两边二次式，消去x²，解一元一次方程。",
        "bubbleText": "x²项神奇地消掉了，剩下一次方程。",
        "bubblePos": {
            "x": 250,
            "y": 360
        }
    },
    {
        "title": "求得方程的解",
        "description": "解得x=4，并检查不在禁区中。",
        "bubbleText": "解是x=4，它在定义域内吗？",
        "bubblePos": {
            "x": 550,
            "y": 360
        }
    },
    {
        "title": "代入验证",
        "description": "把x=4代入原方程，确认左右两边相等。",
        "bubbleText": "左边=右边，验证通过，答案正确！",
        "bubblePos": {
            "x": 400,
            "y": 450
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
