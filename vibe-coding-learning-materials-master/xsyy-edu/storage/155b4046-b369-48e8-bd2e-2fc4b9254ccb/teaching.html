<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二元应用题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">二元应用题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('由客车总数和大小车总载客人数差求小巴辆数')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='3' dy='4' stdDeviation='4' flood-color='#3A3A3A' flood-opacity='0.25'/></filter><filter id='glow' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='3' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter><linearGradient id='bodyGrad' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='#F7F3E8'/><stop offset='100%' stop-color='#E8E0D0'/></linearGradient><linearGradient id='redGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#D85C52'/><stop offset='100%' stop-color='#C23A30'/></linearGradient><g id='bigBus'><rect x='0' y='0' width='70' height='44' rx='8' fill='url(#bodyGrad)' stroke='#5A5A5A' stroke-width='2' filter='url(#shadow)'/><text x='35' y='28' text-anchor='middle' font-size='22'>🚌</text><circle cx='16' cy='40' r='5' fill='#3A3A3A'/><circle cx='54' cy='40' r='5' fill='#3A3A3A'/></g><g id='smallBus'><rect x='0' y='0' width='52' height='36' rx='6' fill='url(#bodyGrad)' stroke='#5A5A5A' stroke-width='2' filter='url(#shadow)'/><text x='26' y='23' text-anchor='middle' font-size='18'>🚐</text><circle cx='12' cy='32' r='4' fill='#3A3A3A'/><circle cx='40' cy='32' r='4' fill='#3A3A3A'/></g></defs><style>.svg-elem{transition:all 0.8s cubic-bezier(0.4,0,0.2,1);}.in-enter{transition:all 0.9s cubic-bezier(0.22,1,0.36,1);}.in-start{opacity:0;transform:translateY(25px) scale(0.92);}.in-end{opacity:1;transform:translateY(0) scale(1);}.out-start{opacity:1;transform:scale(1);}.out-end{opacity:0;transform:scale(0.9) translateY(-15px);}.fade-enter{transition:opacity 0.7s cubic-bezier(0.4,0,0.2,1);}.fade-start{opacity:0;}.fade-end{opacity:1;}@keyframes floatBus{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}@keyframes pulseRed{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}@keyframes dashFlow{to{stroke-dashoffset:-40;}}.bus{animation:floatBus 3s ease-in-out infinite;}.hl{animation:pulseRed 1.3s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}.dashed-line{fill:none;stroke:#C23A30;stroke-width:2;stroke-dasharray:10 8;stroke-linecap:round;animation:dashFlow 1.2s linear infinite;}.equation-box{font-family:'KaiTi','STKaiti',serif;font-size:17px;color:#3A3A3A;line-height:1.55;}.big-num{font-size:21px;font-weight:bold;color:#C23A30;}</style><g class='svg-elem' x-show='sceneStep >= 0' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><text x='400' y='55' text-anchor='middle' font-size='30' fill='#3A3A3A' font-family='STKaiti,serif' filter='url(#shadow)'>学校春游 · 客车安排</text></g><g class='svg-elem' x-show='sceneStep >= 1' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><text x='400' y='95' text-anchor='middle' font-size='20' fill='#5A5A5A' font-family='STKaiti,serif'>全部坐满，共 10 辆客车</text></g><g class='svg-elem' x-show='sceneStep >= 2' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><text x='400' y='330' text-anchor='middle' font-size='24' fill='#C23A30' font-family='STKaiti,serif' class='hl'>共 10 辆</text></g><g class='svg-elem' x-show='sceneStep >= 1' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><text x='190' y='345' text-anchor='middle' font-size='22' fill='#3A3A3A' font-family='STKaiti,serif'>大客车</text><g transform='translate(70,360)'><use href='#bigBus' class='bus'/></g><g transform='translate(160,360)'><use href='#bigBus' class='bus'/></g><g transform='translate(250,360)'><use href='#bigBus' class='bus'/></g><g transform='translate(70,440)'><use href='#bigBus' class='bus'/></g><g transform='translate(160,440)'><use href='#bigBus' class='bus'/></g><g transform='translate(250,440)'><use href='#bigBus' class='bus'/></g></g><g class='svg-elem' x-show='sceneStep >= 1' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><text x='610' y='385' text-anchor='middle' font-size='22' fill='#3A3A3A' font-family='STKaiti,serif'>小客车</text><g transform='translate(480,400)'><use href='#smallBus' class='bus'/></g><g transform='translate(565,400)'><use href='#smallBus' class='bus'/></g><g transform='translate(650,400)'><use href='#smallBus' class='bus'/></g><g transform='translate(735,400)'><use href='#smallBus' class='bus'/></g></g><g class='svg-elem' x-show='sceneStep >= 3' x-transition:enter='fade-enter' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='fade-enter' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'><text x='105' y='416' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text><text x='195' y='416' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text><text x='285' y='416' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text><text x='105' y='496' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text><text x='195' y='496' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text><text x='285' y='496' text-anchor='middle' font-size='15' fill='#C23A30' class='hl'>60人</text></g><g class='svg-elem' x-show='sceneStep >= 3' x-transition:enter='fade-enter' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='fade-enter' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'><text x='506' y='450' text-anchor='middle' font-size='14' fill='#C23A30' class='hl'>20人</text><text x='591' y='450' text-anchor='middle' font-size='14' fill='#C23A30' class='hl'>20人</text><text x='676' y='450' text-anchor='middle' font-size='14' fill='#C23A30' class='hl'>20人</text><text x='761' y='450' text-anchor='middle' font-size='14' fill='#C23A30' class='hl'>20人</text></g><path class='dashed-line svg-elem' x-show='sceneStep >= 3' x-transition:enter='fade-enter' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='fade-enter' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start' d='M190,420 C240,340 250,260 260,200'/><path class='dashed-line svg-elem' x-show='sceneStep >= 3' x-transition:enter='fade-enter' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='fade-enter' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start' d='M610,420 C560,340 550,260 540,200'/><g class='svg-elem' x-show='sceneStep >= 3' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><foreignObject x='260' y='110' width='280' height='180' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' class='equation-box' style='width:100%;height:100%;background:rgba(247,243,232,0.95);border:2px solid #C23A30;border-radius:12px;padding:14px;box-shadow:3px 4px 10px rgba(58,58,58,0.15);box-sizing:border-box;'><p style='margin:0;'>设小客车 <span class='big-num'>x</span> 辆，大客车 <span class='big-num'>y</span> 辆</p><p style='margin:0;'>① x + y = 10</p><p style='margin:0;' x-show='sceneStep >= 4'>② 60y − 20x = 280</p><p style='margin:0;color:#C23A30;' x-show='sceneStep >= 5'>解得：y = 6，x = 4</p></div></foreignObject></g><g class='svg-elem' x-show='sceneStep >= 4' x-transition:enter='fade-enter' x-transition:enter-start='fade-start' x-transition:enter-end='fade-end' x-transition:leave='fade-enter' x-transition:leave-start='fade-end' x-transition:leave-end='fade-start'><line x1='300' y1='450' x2='500' y2='450' stroke='#C23A30' stroke-width='2'/><polygon points='300,450 290,445 290,455' fill='#C23A30'/><polygon points='500,450 510,445 510,455' fill='#C23A30'/><text x='400' y='440' text-anchor='middle' font-size='18' fill='#C23A30' class='hl'>大客车比小客车多坐 280 人</text></g><g class='svg-elem' x-show='sceneStep >= 6' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><rect x='310' y='510' width='180' height='48' rx='24' fill='url(#redGrad)' filter='url(#shadow)'/><text x='400' y='542' text-anchor='middle' font-size='22' fill='#F7F3E8' font-family='STKaiti,serif'>小客车有 4 辆</text></g><g class='svg-elem' x-show='sceneStep >= 7' x-transition:enter='in-enter' x-transition:enter-start='in-start' x-transition:enter-end='in-end' x-transition:leave='in-enter' x-transition:leave-start='out-start' x-transition:leave-end='out-end'><foreignObject x='260' y='300' width='280' height='120' class='svg-elem'><div xmlns='http://www.w3.org/1999/xhtml' class='equation-box' style='width:100%;height:100%;background:rgba(247,243,232,0.95);border:2px solid #5A5A5A;border-radius:12px;padding:10px;box-shadow:3px 4px 10px rgba(58,58,58,0.15);box-sizing:border-box;'><p style='margin:0;'>验算：6 + 4 = 10 ✓</p><p style='margin:0;'>大客车：60 × 6 = 360 人</p><p style='margin:0;'>小客车：20 × 4 = 80 人</p><p style='margin:0;color:#C23A30;font-weight:bold;'>相差：360 − 80 = 280 人 ✓</p></div></foreignObject></g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "读题审题",
        "description": "学校春游一共派出10辆客车，全部坐满。大客车每辆坐60人，小客车每辆坐20人，并且大客车比小客车多坐了280人。我们需要求小客车的数量。",
        "bubbleText": "一共有10辆客车，全部坐满！",
        "bubblePos": {
            "x": 400,
            "y": 80
        }
    },
    {
        "title": "设定未知数",
        "description": "设小客车有x辆，大客车有y辆。两个未知量，正好可以用二元一次方程组来求解。",
        "bubbleText": "设小客车x辆，大客车y辆。",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "找数量关系：总辆数",
        "description": "大客车和小客车加起来正好是10辆，所以得到第一个方程：x + y = 10。",
        "bubbleText": "x + y = 10",
        "bubblePos": {
            "x": 400,
            "y": 120
        }
    },
    {
        "title": "找数量关系：载客量",
        "description": "每辆大客车坐60人，每辆小客车坐20人。大客车总载客量是60y，小客车总载客量是20x。",
        "bubbleText": "大客车坐60y人，小客车坐20x人。",
        "bubblePos": {
            "x": 520,
            "y": 160
        }
    },
    {
        "title": "找数量关系：人数差",
        "description": "题目说大客车比小客车多坐280人，于是得到第二个方程：60y − 20x = 280。",
        "bubbleText": "60y − 20x = 280",
        "bubblePos": {
            "x": 400,
            "y": 300
        }
    },
    {
        "title": "联立求解",
        "description": "把两个方程联立：x + y = 10与60y − 20x = 280。由第一式得x = 10 − y，代入第二式：60y − 20(10 − y) = 280，化简得80y − 200 = 280，所以y = 6，进而x = 4。",
        "bubbleText": "解得 y = 6，x = 4",
        "bubblePos": {
            "x": 520,
            "y": 220
        }
    },
    {
        "title": "写出答案",
        "description": "小客车的数量就是x = 4辆。",
        "bubbleText": "小客车有4辆",
        "bubblePos": {
            "x": 400,
            "y": 500
        }
    },
    {
        "title": "验证答案",
        "description": "验证：6辆大客车加4辆小客车共10辆；大客车载客60×6=360人，小客车载客20×4=80人，差为360−80=280人，完全符合题意。所以答案正确。",
        "bubbleText": "验算通过，答案正确！",

],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
