<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字排列极值问题 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">数字排列极值问题</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('用数字 $1、2、3、4、5、6$ 各一次组成两个三位数，分别求它们的和与差的最大值和最小值。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <!-- 背景黑板 -->
                            <rect x="10" y="10" width="780" height="580" rx="18" fill="#fbf9f4" stroke="#d6d3d1" stroke-width="2"/>
                            <rect x="10" y="10" width="780" height="52" rx="18" fill="#f5f5f4"/>
                            <text x="400" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1c1917" font-family="'Noto Serif SC', serif">数字排列极值问题</text>

                            <!-- 数字池（贯穿全程） -->
                            <g x-show="sceneStep >= 0">
                                <text x="400" y="94" text-anchor="middle" font-size="15" fill="#78716c" font-family="'Noto Sans SC', sans-serif">可用数字（每个只能用一次）</text>
                                <g font-family="'Noto Serif SC', serif" font-size="26" font-weight="bold" text-anchor="middle">
                                    <circle cx="175" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="175" y="144" fill="#1c1917">1</text>
                                    <circle cx="250" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="250" y="144" fill="#1c1917">2</text>
                                    <circle cx="325" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="325" y="144" fill="#1c1917">3</text>
                                    <circle cx="400" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="400" y="144" fill="#1c1917">4</text>
                                    <circle cx="475" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="475" y="144" fill="#1c1917">5</text>
                                    <circle cx="550" cy="135" r="24" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/><text x="550" y="144" fill="#1c1917">6</text>
                                </g>
                            </g>

                            <!-- 第1步：和最大，高亮百位 6 和 5 -->
                            <g x-show="sceneStep >= 1">
                                <text x="400" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">① 和最大：百位放最大的 6 和 5</text>
                                <circle cx="475" cy="135" r="29" fill="none" stroke="#8a1c1c" stroke-width="3"/>
                                <circle cx="550" cy="135" r="29" fill="none" stroke="#8a1c1c" stroke-width="3"/>
                                <path d="M475,166 C 420,205 320,225 268,258" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <path d="M550,166 C 560,205 560,225 552,258" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <rect x="180" y="262" width="180" height="64" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <rect x="370" y="262" width="180" height="64" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <line x1="240" y1="262" x2="240" y2="326" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="300" y1="262" x2="300" y2="326" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="430" y1="262" x2="430" y2="326" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="490" y1="262" x2="490" y2="326" stroke="#e7e5e4" stroke-width="1"/>
                                <text x="210" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">百位</text>
                                <text x="270" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">十位</text>
                                <text x="330" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">个位</text>
                                <text x="400" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">百位</text>
                                <text x="460" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">十位</text>
                                <text x="520" y="256" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="'Noto Sans SC', sans-serif">个位</text>
                                <rect x="182" y="264" width="56" height="60" rx="6" fill="#fee2e2"/>
                                <rect x="372" y="264" width="56" height="60" rx="6" fill="#fee2e2"/>
                                <g font-family="'Noto Serif SC', serif" font-size="34" font-weight="bold" text-anchor="middle">
                                    <text x="210" y="306" fill="#8a1c1c">6</text>
                                    <text x="400" y="306" fill="#8a1c1c">5</text>
                                </g>
                            </g>

                            <!-- 第2步：和最大结果 642 + 531 = 1173 -->
                            <g x-show="sceneStep >= 2"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <g font-family="'Noto Serif SC', serif" font-size="34" font-weight="bold" text-anchor="middle">
                                    <text x="270" y="306" fill="#1c1917">4</text>
                                    <text x="330" y="306" fill="#1c1917">2</text>
                                    <text x="460" y="306" fill="#1c1917">3</text>
                                    <text x="520" y="306" fill="#1c1917">1</text>
                                </g>
                                <text x="365" y="306" text-anchor="middle" font-size="30" font-weight="bold" fill="#44403c" font-family="'Noto Serif SC', serif">+</text>
                                <foreignObject x="200" y="336" width="400" height="48">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:22px;color:#8a1c1c;font-weight:bold;" x-html="renderMath('$642 + 531 = 1173$')"></div>
                                </foreignObject>
                                <rect x="230" y="342" width="340" height="38" rx="8" fill="none" stroke="#8a1c1c" stroke-width="2"/>
                            </g>

                            <!-- 第3步：和最小，高亮百位 1 和 2 -->
                            <g x-show="sceneStep >= 3">
                                <text x="400" y="416" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="'Noto Serif SC', serif">② 和最小：百位放最小的 1 和 2</text>
                                <circle cx="175" cy="135" r="29" fill="none" stroke="#1d4ed8" stroke-width="3"/>
                                <circle cx="250" cy="135" r="29" fill="none" stroke="#1d4ed8" stroke-width="3"/>
                                <path d="M175,166 C 165,300 175,360 205,432" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <path d="M250,166 C 300,300 350,360 388,432" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <rect x="180" y="436" width="180" height="64" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <rect x="370" y="436" width="180" height="64" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <line x1="240" y1="436" x2="240" y2="500" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="300" y1="436" x2="300" y2="500" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="430" y1="436" x2="430" y2="500" stroke="#e7e5e4" stroke-width="1"/>
                                <line x1="490" y1="436" x2="490" y2="500" stroke="#e7e5e4" stroke-width="1"/>
                                <rect x="182" y="438" width="56" height="60" rx="6" fill="#dbeafe"/>
                                <rect x="372" y="438" width="56" height="60" rx="6" fill="#dbeafe"/>
                                <g font-family="'Noto Serif SC', serif" font-size="34" font-weight="bold" text-anchor="middle">
                                    <text x="210" y="480" fill="#1d4ed8">1</text>
                                    <text x="400" y="480" fill="#1d4ed8">2</text>
                                </g>
                            </g>

                            <!-- 第4步：和最小结果 135 + 246 = 381 -->
                            <g x-show="sceneStep >= 4"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <g font-family="'Noto Serif SC', serif" font-size="34" font-weight="bold" text-anchor="middle">
                                    <text x="270" y="480" fill="#1c1917">3</text>
                                    <text x="330" y="480" fill="#1c1917">5</text>
                                    <text x="460" y="480" fill="#1c1917">4</text>
                                    <text x="520" y="480" fill="#1c1917">6</text>
                                </g>
                                <text x="365" y="480" text-anchor="middle" font-size="30" font-weight="bold" fill="#44403c" font-family="'Noto Serif SC', serif">+</text>
                                <foreignObject x="200" y="510" width="400" height="48">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:22px;color:#1d4ed8;font-weight:bold;" x-html="renderMath('$135 + 246 = 381$')"></div>
                                </foreignObject>
                                <rect x="230" y="516" width="340" height="38" rx="8" fill="none" stroke="#1d4ed8" stroke-width="2"/>
                            </g>

                            <!-- 第5步：差最大，高亮被减数与减数百位 -->
                            <g x-show="sceneStep >= 5">
                                <text x="655" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309" font-family="'Noto Serif SC', serif">③ 差最大</text>
                                <text x="655" y="216" text-anchor="middle" font-size="12" fill="#a16207" font-family="'Noto Sans SC', sans-serif">被减数百位最大6</text>
                                <text x="655" y="232" text-anchor="middle" font-size="12" fill="#a16207" font-family="'Noto Sans SC', sans-serif">减数百位最小1</text>
                                <circle cx="550" cy="135" r="29" fill="none" stroke="#b45309" stroke-width="3"/>
                                <circle cx="175" cy="135" r="29" fill="none" stroke="#b45309" stroke-width="3"/>
                                <path d="M550,166 C 620,190 645,220 652,258" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <path d="M175,166 C 350,210 560,235 648,318" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
                                <rect x="580" y="262" width="150" height="50" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <rect x="580" y="322" width="150" height="50" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
                                <rect x="582" y="264" width="46" height="46" rx="6" fill="#fef3c7"/>
                                <rect x="582" y="324" width="46" height="46" rx="6" fill="#fef3c7"/>
                                <text x="565" y="294" text-anchor="middle" font-size="20" fill="#44403c" font-family="'Noto Sans SC', sans-serif">−</text>
                                <g font-family="'Noto Serif SC', serif" font-size="28" font-weight="bold" text-anchor="middle">
                                    <text x="605" y="296" fill="#b45309">6</text>
                                    <text x="605" y="356" fill="#b45309">1</text>
                                </g>
                            </g>

                            <!-- 第6步：差最大结果 642 - 135 = 507 -->
                            <g x-show="sceneStep >= 6"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <g font-family="'Noto Serif SC', serif" font-size="28" font-weight="bold" text-anchor="middle">
                                    <text x="655" y="296" fill="#1c1917">4</text>
                                    <text x="705" y="296" fill="#1c1917">2</text>
                                    <text x="655" y="356" fill="#1c1917">3</text>
                                    <text x="705" y="356" fill="#1c1917">5</text>
                                </g>
                                <line x1="580" y1="380" x2="730" y2="380" stroke="#44403c" stroke-width="2"/>
                                <foreignObject x="560" y="386" width="200" height="44">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:20px;color:#b45309;font-weight:bold;" x-html="renderMath('$642 - 135 = 507$')"></div>
                                </foreignObject>
                            </g>

                            <!-- 第7步：差最小，两数尽量接近 -->
                            <g x-show="sceneStep >= 7">
                                <text x="655" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857" font-family="'Noto Serif SC', serif">④ 差最小</text>
                                <text x="655" y="476" text-anchor="middle" font-size="12" fill="#059669" font-family="'Noto Sans SC', sans-serif">两数尽量接近</text>
                                <text x="655" y="492" text-anchor="middle" font-size="12" fill="#059669" font-family="'Noto Sans SC', sans-serif">百位差仅为 1</text>
                                <rect x="580" y="500" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
                                <rect x="580" y="546" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
                                <text x="565" y="528" text-anchor="middle" font-size="20" fill="#44403c" font-family="'Noto Sans SC', sans-serif">−</text>
                                <g font-family="'Noto Serif SC', serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#047857">
                                    <text x="605" y="528">4</text><text x="655" y="528">1</text><text x="705" y="528">3</text>
                                    <text x="605" y="574">2</text><text x="655" y="574">5</text><text x="705" y="574">6</text>
                                </g>
                            </g>

                            <!-- 第8步：差最小结果与总结 413 - 256 = 157 -->
                            <g x-show="sceneStep >= 8"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <foreignObject x="545" y="404" width="220" height="44">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:18px;color:#047857;font-weight:bold;" x-html="renderMath('$413 - 256 = 157$')"></div>
                                </foreignObject>
                                <rect x="20" y="558" width="510" height="34" rx="8" fill="#fef2f2" stroke="#8a1c1c" stroke-width="1.5"/>
                                <foreignObject x="24" y="560" width="502" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:14px;color:#8a1c1c;font-weight:bold;line-height:30px;" x-html="renderMath('总结：和最大 $1173$，和最小 $381$；差最大 $507$，差最小 $157$')"></div>
                                </foreignObject>
                            </g>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
  {
    "title": "认识题目与数字池",
    "description": "把数字 $1、2、3、4、5、6$ 各用一次，组成两个三位数。目标：求和的最大、最小，以及差的最大、最小。",
    "bubbleText": "我们有 6 个数字，每个只能用一次，要拼成两个三位数。三位数的大小，关键看百位——百位越大，整个数越大。记住这一点，下面全靠它！",
    "bubblePos": { "x": 470, "y": 80 }
  },
  {
    "title": "和最大：先定百位",
    "description": "要使和最大，百位应放最大的两个数字 $6$ 和 $5$，这样百位相加最大。",
    "bubbleText": "想让两个数的和最大，就把最大的数字往最高位（百位）塞。百位放 $6$ 和 $5$，光百位就贡献了 $600+500=1100$，这是和最大的根基。",
    "bubblePos": { "x": 470, "y": 200 }
  },
  {
    "title": "和最大：得出 1173",
    "description": "百位定为 $6、5$ 后，十位放次大的 $4、3$，个位放 $2、1$，得 $642 + 531 = 1173$。",
    "bubbleText": "百位定好后，剩下的 $4、3、2、1$ 也从大到小往十位、个位放。大的数尽量靠前，和就最大：$642 + 531 = 1173$。",
    "bubblePos": { "x": 470, "y": 300 }
  },
  {
    "title": "和最小：先定百位",
    "description": "要使和最小，百位应放最小的两个数字 $1$ 和 $2$，这样百位相加最小。",
    "bubbleText": "反过来，想让和最小，就把最小的数字往百位塞。百位放 $1$ 和 $2$，百位只贡献 $100+200=300$，和自然就小了。",
    "bubblePos": { "x": 470, "y": 380 }
  },
  {
    "title": "和最小：得出 381",
    "description": "百位定为 $1、2$ 后，十位放次小的 $3、4$，个位放 $5、6$，得 $135 + 246 = 381$。",
    "bubbleText": "剩下的 $3、4、5、6$ 也从小到大往后面放，让高位尽量小。最终和最小为：$135 + 246 = 381$。",
    "bubblePos": { "x": 470, "y": 470 }
  },
  {
    "title": "差最大：拉开百位差距",
    "description": "要使差最大，被减数百位尽量大（$6$），减数百位尽量小（$1$），让两数相差最远。",
    "bubbleText": "差最大，就是让两个数离得越远越好。被减数百位放最大的 $6$，减数百位放最小的 $1$，一下子拉开了 $500$ 的差距。",
    "bubblePos": { "x": 400, "y": 200 }
  },
  {
    "title": "差最大：得出 507",
    "description": "被减数尽量大取 $642$，减数尽量小取 $135$，差最大为 $642 - 135 = 507$。",
    "bubbleText": "被减数要尽量大：$6、4、2$ 从大到小排成 $642$；减数要尽量小：$1、3、5$ 从小到大排成 $135$。差最大 $= 642 - 135 = 507$。",
    "bubblePos": { "x": 400, "y": 300 }
  },
  {
    "title": "差最小：两数尽量接近",
    "description": "要使差最小，两个数应尽量接近：百位差最小（差 $1$），再调整十位、个位，得 $413 - 256 = 157$。",
    "bubbleText": "差最小，就是让两个数挨得越近越好。百位只能差 $1$，再让大数的后两位尽量小、小数的后两位尽量大，最终 $413 - 256 = 157$ 最小。",
    "bubblePos": { "x": 400, "y": 420 }
  }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
