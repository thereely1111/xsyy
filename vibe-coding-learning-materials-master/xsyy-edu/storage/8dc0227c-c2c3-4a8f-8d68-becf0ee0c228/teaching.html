<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛胜负排列组合 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">比赛胜负排列组合</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('甲乙乒乓球比赛先胜三场者胜，第一场甲胜且最终乙胜，分类讨论得共 $1+3=4$ 种不同情况')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- Step 1: Match rules - ping pong table -->
                            <g x-show="sceneStep >= 1" x-transition:enter="transition ease-out duration-500">
                                <!-- Table -->
                                <rect x="250" y="40" width="300" height="160" rx="6" fill="#1a6b4a" stroke="#0f4a33" stroke-width="3"/>
                                <line x1="400" y1="40" x2="400" y2="200" stroke="#ffffff" stroke-width="2"/>
                                <line x1="250" y1="120" x2="550" y2="120" stroke="#ffffff" stroke-width="1" stroke-dasharray="6,4"/>
                                <!-- Net -->
                                <rect x="396" y="100" width="8" height="40" fill="#57534e" rx="2"/>
                                <line x1="396" y1="100" x2="404" y2="100" stroke="#78716c" stroke-width="2"/>
                                <!-- Paddles -->
                                <ellipse cx="290" cy="120" rx="18" ry="22" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
                                <rect x="286" y="140" width="8" height="20" rx="3" fill="#92400e"/>
                                <ellipse cx="510" cy="120" rx="18" ry="22" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
                                <rect x="506" y="140" width="8" height="20" rx="3" fill="#92400e"/>
                                <!-- Ball -->
                                <circle cx="400" cy="80" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
                                <!-- Rule text -->
                                <foreignObject x="220" y="210" width="360" height="50">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:17px; font-weight:bold; color:#1f2937; font-family:'Noto Serif SC',serif;">
                                        规则：谁先胜三场，谁就获胜
                                    </div>
                                </foreignObject>
                                <!-- Labels -->
                                <foreignObject x="255" y="165" width="70" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:14px; font-weight:bold; color:#dc2626;">甲</div>
                                </foreignObject>
                                <foreignObject x="475" y="165" width="70" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:14px; font-weight:bold; color:#2563eb;">乙</div>
                                </foreignObject>
                            </g>

                            <!-- Step 2: Game 1 result - A wins -->
                            <g x-show="sceneStep >= 2" x-transition:enter="transition ease-out duration-500">
                                <!-- Scoreboard -->
                                <rect x="80" y="280" width="640" height="70" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
                                <foreignObject x="90" y="285" width="620" height="60">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; align-items:center; justify-content:center; gap:20px; height:100%; font-family:'Noto Sans SC',sans-serif;">
                                        <span style="font-size:15px; color:#1f2937; font-weight:bold;">已知条件：</span>
                                        <span style="font-size:15px; color:#dc2626; font-weight:bold;">第一场 → 甲胜</span>
                                        <span style="font-size:15px; color:#57534e;">|</span>
                                        <span style="font-size:15px; color:#2563eb; font-weight:bold;">最终 → 乙获胜</span>
                                    </div>
                                </foreignObject>
                                <!-- Game 1 circle -->
                                <circle cx="200" cy="390" r="22" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
                                <foreignObject x="182" y="378" width="36" height="28">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:14px; font-weight:bold; color:#ffffff; line-height:28px;">甲</div>
                                </foreignObject>
                                <foreignObject x="160" y="415" width="80" height="25">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:12px; color:#78716c;">第1场</div>
                                </foreignObject>
                                <!-- Dashed trajectory from table to circle -->
                                <path d="M 320 200 Q 260 300 200 368" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
                            </g>

                            <!-- Step 3: Constraint analysis -->
                            <g x-show="sceneStep >= 3" x-transition:enter="transition ease-out duration-500">
                                <rect x="320" y="370" width="400" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
                                <foreignObject x="330" y="375" width="380" height="70">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; color:#1f2937; font-family:'Noto Sans SC',sans-serif; line-height:1.8; padding:4px;">
                                        <div style="font-weight:bold; color:#8a1c1c;">关键约束：</div>
                                        <div>甲已有1胜，最多再胜1场（否则甲先到3胜）</div>
                                        <div>最后一场必须是乙胜（乙的第3胜结束比赛）</div>
                                    </div>
                                </foreignObject>
                                <!-- Arrow pointing to constraint -->
                                <line x1="222" y1="390" x2="318" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
                            </g>

                            <!-- Step 4: Case 1 - B wins 3 straight -->
                            <g x-show="sceneStep >= 4" x-transition:enter="transition ease-out duration-500">
                                <foreignObject x="80" y="460" width="200" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; font-weight:bold; color:#8a1c1c; font-family:'Noto Sans SC',sans-serif;">情况一：乙连胜三场</div>
                                </foreignObject>
                                <!-- Sequence: A B B B -->
                                <circle cx="120" cy="510" r="18" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
                                <foreignObject x="105" y="500" width="30" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:12px; font-weight:bold; color:#fff; line-height:22px;">甲</div>
                                </foreignObject>
                                <circle cx="170" cy="510" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
                                <foreignObject x="155" y="500" width="30" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:12px; font-weight:bold; color:#fff; line-height:22px;">乙</div>
                                </foreignObject>
                                <circle cx="220" cy="510" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
                                <foreignObject x="205" y="500" width="30" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:12px; font-weight:bold; color:#fff; line-height:22px;">乙</div>
                                </foreignObject>
                                <circle cx="270" cy="510" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
                                <foreignObject x="255" y="500" width="30" height="22">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:12px; font-weight:bold; color:#fff; line-height:22px;">乙</div>
                                </foreignObject>
                                <!-- Count label -->
                                <foreignObject x="300" y="498" width="100" height="28">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; font-weight:bold; color:#1f2937; font-family:'Noto Sans SC',sans-serif; line-height:28px;">共 1 种</div>
                                </foreignObject>
                                <!-- Connecting arrows -->
                                <line x1="138" y1="510" x2="152" y2="510" stroke="#78716c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <line x1="188" y1="510" x2="202" y2="510" stroke="#78716c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <line x1="238" y1="510" x2="252" y2="510" stroke="#78716c" stroke-width="1.5" marker-end="url(#arrow)"/>
                            </g>

                            <!-- Step 5: Case 2 - A wins 1 more -->
                            <g x-show="sceneStep >= 5" x-transition:enter="transition ease-out duration-500">
                                <foreignObject x="420" y="460" width="320" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; font-weight:bold; color:#8a1c1c; font-family:'Noto Sans SC',sans-serif;">情况二：甲再胜1场，乙胜3场</div>
                                </foreignObject>
                                <!-- Sequence 1: A A B B B -->
                                <circle cx="450" cy="505" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="438" y="496" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="490" cy="505" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="478" y="496" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="530" cy="505" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="518" y="496" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="570" cy="505" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="558" y="496" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="610" cy="505" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
                                <foreignObject x="598" y="496" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>

                                <!-- Sequence 2: A B A B B -->
                                <circle cx="450" cy="545" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="438" y="536" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="490" cy="545" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="478" y="536" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="530" cy="545" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="518" y="536" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="570" cy="545" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="558" y="536" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="610" cy="545" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
                                <foreignObject x="598" y="536" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>

                                <!-- Sequence 3: A B B A B -->
                                <circle cx="450" cy="585" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="438" y="576" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="490" cy="585" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="478" y="576" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="530" cy="585" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
                                <foreignObject x="518" y="576" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>
                                <circle cx="570" cy="585" r="15" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
                                <foreignObject x="558" y="576" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">甲</div>
                                </foreignObject>
                                <circle cx="610" cy="585" r="15" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
                                <foreignObject x="598" y="576" width="24" height="20">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:11px; font-weight:bold; color:#fff; line-height:20px;">乙</div>
                                </foreignObject>

                                <!-- Formula -->
                                <foreignObject x="640" y="530" width="140" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; color:#1f2937; font-family:'Noto Sans SC',sans-serif;" id="case2Formula"></div>
                                </foreignObject>
                            </g>

                            <!-- Step 6: Final answer -->
                            <g x-show="sceneStep >= 6" x-transition:enter="transition ease-out duration-500">
                                <rect x="250" y="260" width="300" height="60" rx="12" fill="#8a1c1c" stroke="#5c1010" stroke-width="2"/>
                                <foreignObject x="260" y="268" width="280" height="45">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:20px; font-weight:bold; color:#ffffff; font-family:'Noto Serif SC',serif; line-height:45px;">
                                        共 1 + 3 = 4 种
                                    </div>
                                </foreignObject>
                                <!-- Decorative seal -->
                                <rect x="560" y="265" width="50" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2.5"/>
                                <foreignObject x="565" y="272" width="40" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center; font-size:16px; font-weight:bold; color:#dc2626; font-family:'Noto Serif SC',serif; line-height:40px;">解</div>
                                </foreignObject>
                            </g>

                            <!-- Dashed trajectory for case analysis flow -->
                            <g x-show="sceneStep >= 4">
                                <path d="M 200 432 L 200 460" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
                            </g>
                            <g x-show="sceneStep >= 5">
                                <path d="M 400 450 Q 430 470 440 490" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
  {
    "title": "审题：理解比赛规则",
    "description": "甲乙进行乒乓球比赛，规定谁先胜三场谁就获胜。已知第一场甲胜，而最终乙获胜。求共有多少种不同的比赛情况。",
    "bubbleText": "我们先把题目搞清楚：两个人打比赛，谁先赢够3场谁就是冠军。现在告诉我们第一场是甲赢的，但最后冠军是乙。我们要找出所有可能的比赛过程有多少种。",
    "bubblePos": {"x": 250, "y": 30}
  },
  {
    "title": "确定已知条件",
    "description": "第一场甲胜（甲已有1胜），最终乙获胜（乙先达到3胜）。需要找出中间所有可能的胜负序列。",
    "bubbleText": "把已知条件标出来：第一场甲赢了，所以甲已经有1场胜利了。最终乙赢了整场比赛，说明乙先凑够了3场胜利。接下来我们要分析剩下的比赛有几种走法。",
    "bubblePos": {"x": 100, "y": 260}
  },
  {
    "title": "分析关键约束",
    "description": "甲已有1胜，若甲再胜2场则甲先到3胜（与乙胜矛盾），故甲在剩余比赛中最多再胜1场。最后一场必为乙胜（乙的第3胜终结比赛）。",
    "bubbleText": "这一步最关键！甲已经赢了1场，如果甲再赢2场，那甲就有3场了，冠军就是甲了——但题目说乙是冠军，所以甲在后面的比赛里最多只能再赢1场。另外，比赛是在乙赢第3场时结束的，所以最后一场一定是乙赢。",
    "bubblePos": {"x": 330, "y": 340}
  },
  {
    "title": "情况一：乙连胜三场",
    "description": "甲不再胜任何一场，乙连续胜3场结束比赛。序列为：甲、乙、乙、乙。共 $1$ 种。",
    "bubbleText": "第一种情况最简单：第一场甲赢之后，乙一口气连赢3场，直接拿下比赛。整个过程就是「甲乙乙乙」，只有这一种走法，所以是1种。",
    "bubblePos": {"x": 80, "y": 440}
  },
  {
    "title": "情况二：甲再胜1场",
    "description": "甲再胜1场、乙胜3场，共打5场。最后一场（第5场）必须是乙胜。前4场中第1场固定为甲，第2~4场中选1场为甲胜：$C_3^1 = 3$ 种。",
    "bubbleText": "第二种情况：甲在后面又赢了1场，乙赢了3场，一共打了5场。第5场必须是乙赢（因为是乙的第3胜结束比赛）。第1场固定是甲赢。那第2、3、4场里面，甲赢1场、乙赢2场。从3个位置里选1个给甲，就是 $C_3^1 = 3$ 种。",
    "bubblePos": {"x": 420, "y": 430}
  },
  {
    "title": "汇总得出答案",
    "description": "两种情况相加：情况一 $1$ 种 + 情况二 $3$ 种 = $4$ 种。共有 $4$ 种不同的比赛情况。",
    "bubbleText": "最后把两种情况加起来：乙连胜的1种，加上甲再赢一场的3种，总共就是 $1 + 3 = 4$ 种。这就是所有可能的比赛进程！",
    "bubblePos": {"x": 260, "y": 220}
  }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
