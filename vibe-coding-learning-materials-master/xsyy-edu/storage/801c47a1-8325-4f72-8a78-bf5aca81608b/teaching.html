<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逻辑推理网格填涂 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">逻辑推理网格填涂</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('根据行列数字提示，先找满行满列确定黑格，再用排除法推出空格，最终完成字母H图案的填涂。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- ===== 基础网格（始终可见） ===== -->
                            <g x-show="sceneStep >= 1">
                                <!-- 网格外框 -->
                                <rect x="250" y="180" width="320" height="320" fill="none" stroke="#57534e" stroke-width="2.5"/>
                                <!-- 竖线 -->
                                <line x1="314" y1="180" x2="314" y2="500" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="378" y1="180" x2="378" y2="500" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="442" y1="180" x2="442" y2="500" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="506" y1="180" x2="506" y2="500" stroke="#a8a29e" stroke-width="1"/>
                                <!-- 横线 -->
                                <line x1="250" y1="244" x2="570" y2="244" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="250" y1="308" x2="570" y2="308" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="250" y1="372" x2="570" y2="372" stroke="#a8a29e" stroke-width="1"/>
                                <line x1="250" y1="436" x2="570" y2="436" stroke="#a8a29e" stroke-width="1"/>

                                <!-- 列提示数字（上方） -->
                                <text x="282" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">5</text>
                                <text x="346" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1</text>
                                <text x="410" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1</text>
                                <text x="474" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1</text>
                                <text x="538" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">5</text>

                                <!-- 行提示数字（左侧） -->
                                <text x="228" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1 1</text>
                                <text x="228" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1 1</text>
                                <text x="228" y="346" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">5</text>
                                <text x="228" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1 1</text>
                                <text x="228" y="474" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1c1c" font-family="'Noto Serif SC', serif">1 1</text>
                            </g>

                            <!-- ===== 第1步：高亮规则说明 ===== -->
                            <g x-show="sceneStep >= 1"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 高亮行提示区域 -->
                                <rect x="195" y="190" width="55" height="296" rx="6" fill="rgba(138,28,28,0.08)" stroke="#8a1c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
                                <!-- 高亮列提示区域 -->
                                <rect x="255" y="145" width="310" height="32" rx="6" fill="rgba(138,28,28,0.08)" stroke="#8a1c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
                                <!-- 说明箭头：行 -->
                                <line x1="180" y1="340" x2="195" y2="340" stroke="#8a1c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <!-- 说明箭头：列 -->
                                <line x1="410" y1="130" x2="410" y2="145" stroke="#8a1c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
                                <!-- 轨迹虚线：从行提示指向网格 -->
                                <path d="M 240 340 C 245 340, 248 340, 252 340" fill="none" stroke="#8a1c1c" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
                            </g>

                            <!-- ===== 第2步：涂黑第3行 ===== -->
                            <g x-show="sceneStep >= 2"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 第3行高亮背景 -->
                                <rect x="250" y="308" width="320" height="64" fill="rgba(138,28,28,0.06)"/>
                                <!-- 第3行5个黑格 -->
                                <rect x="252" y="310" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="316" y="310" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="380" y="310" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="444" y="310" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="508" y="310" width="60" height="60" rx="3" fill="#1c1917"/>
                                <!-- 行提示高亮圈 -->
                                <circle cx="228" cy="340" r="16" fill="none" stroke="#dc2626" stroke-width="2"/>
                            </g>

                            <!-- ===== 第3步：涂黑第1列和第5列 ===== -->
                            <g x-show="sceneStep >= 3"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 第1列高亮背景 -->
                                <rect x="250" y="180" width="64" height="320" fill="rgba(138,28,28,0.06)"/>
                                <!-- 第5列高亮背景 -->
                                <rect x="506" y="180" width="64" height="320" fill="rgba(138,28,28,0.06)"/>
                                <!-- 第1列黑格（行1,2,4,5） -->
                                <rect x="252" y="182" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="252" y="246" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="252" y="374" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="252" y="438" width="60" height="60" rx="3" fill="#1c1917"/>
                                <!-- 第5列黑格（行1,2,4,5） -->
                                <rect x="508" y="182" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="508" y="246" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="508" y="374" width="60" height="60" rx="3" fill="#1c1917"/>
                                <rect x="508" y="438" width="60" height="60" rx="3" fill="#1c1917"/>
                                <!-- 列提示高亮圈 -->
                                <circle cx="282" cy="162" r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
                                <circle cx="538" cy="162" r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
                            </g>

                            <!-- ===== 第4步：推理第2,3,4列已满足 ===== -->
                            <g x-show="sceneStep >= 4"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 第2,3,4列高亮 -->
                                <rect x="314" y="180" width="192" height="320" fill="rgba(22,163,74,0.07)" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
                                <!-- 第3行中第2,3,4列的黑格标记对勾 -->
                                <text x="346" y="348" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="410" y="348" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="474" y="348" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="bold">✓</text>
                                <!-- 列提示满足标记 -->
                                <text x="346" y="148" text-anchor="middle" font-size="13" fill="#16a34a">✓</text>
                                <text x="410" y="148" text-anchor="middle" font-size="13" fill="#16a34a">✓</text>
                                <text x="474" y="148" text-anchor="middle" font-size="13" fill="#16a34a">✓</text>
                            </g>

                            <!-- ===== 第5步：排除法标记空格 ===== -->
                            <g x-show="sceneStep >= 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 第1行空格 -->
                                <text x="346" y="220" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="410" y="220" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="474" y="220" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <!-- 第2行空格 -->
                                <text x="346" y="284" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="410" y="284" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="474" y="284" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <!-- 第4行空格 -->
                                <text x="346" y="412" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="410" y="412" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="474" y="412" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <!-- 第5行空格 -->
                                <text x="346" y="476" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="410" y="476" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <text x="474" y="476" text-anchor="middle" font-size="20" fill="#9ca3af">×</text>
                                <!-- 轨迹虚线：排除扫描路径 -->
                                <path d="M 346 195 L 346 230 M 410 195 L 410 230 M 474 195 L 474 230" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
                            </g>

                            <!-- ===== 第6步：验证行约束 ===== -->
                            <g x-show="sceneStep >= 6"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 每行右侧验证对勾 -->
                                <text x="585" y="218" text-anchor="start" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="585" y="282" text-anchor="start" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="585" y="346" text-anchor="start" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="585" y="410" text-anchor="start" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="585" y="474" text-anchor="start" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <!-- 验证扫描轨迹虚线 -->
                                <path d="M 575 200 L 575 490" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
                            </g>

                            <!-- ===== 第7步：验证列约束并完成 ===== -->
                            <g x-show="sceneStep >= 7"
                               x-transition:enter="transition ease-out duration-700"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- 每列下方验证对勾 -->
                                <text x="282" y="522" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="346" y="522" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="410" y="522" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="474" y="522" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <text x="538" y="522" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">✓</text>
                                <!-- 字母H轮廓高亮 -->
                                <path d="M 258 186 L 258 494 M 562 186 L 562 494 M 258 314 L 562 314 M 258 368 L 562 368" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.7"/>
                                <!-- 完成标记 -->
                                <text x="410" y="560" text-anchor="middle" font-size="22" fill="#8a1c1c" font-weight="bold" font-family="'Noto Serif SC', serif">完成！图案为字母 H</text>
                                <!-- 验证扫描轨迹虚线（水平） -->
                                <path d="M 260 510 L 560 510" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [{"title":"认识数织规则","description":"数织游戏中，每行左边的数字表示该行连续黑格的数量，每列上方的数字表示该列连续黑格的数量。本题中，行提示为 $[1,1]$、$[1,1]$、$[5]$、$[1,1]$、$[1,1]$，列提示为 $[5]$、$[1]$、$[1]$、$[1]$、$[5]$。","bubbleText":"小朋友，看到这些数字别害怕！左边的数字告诉你这一行有几格要涂黑，上面的数字告诉你这一列有几格要涂黑。数字是几，就要涂几格哦！","bubblePos":{"x":420,"y":50}},{"title":"找最确定的行——第3行","description":"第3行的提示数字是 $5$，而一行总共只有 $5$ 格，所以第3行的5格全部涂黑。这是最确定的突破口！","bubbleText":"找突破口！第3行要涂5格，一行刚好就5格，那还用想吗？全部涂黑！遇到数字等于格子总数的，直接全涂！","bubblePos":{"x":420,"y":250}},{"title":"找最确定的列——第1列和第5列","description":"第1列和第5列的提示数字都是 $5$，一列共5格，因此这两列也全部涂黑。","bubbleText":"同样的道理！第1列和第5列的数字也是5，一列就5格，所以这两列也要全部涂黑。先把最确定的搞定！","bubblePos":{"x":50,"y":250}},{"title":"利用已知推未知","description":"第2、3、4列的提示数字都是 $1$，表示每列只需涂1格。而第3行已经涂黑，恰好为这3列各提供了1个黑格，所以这3列不需要再涂其他格了。","bubbleText":"关键推理来了！第2、3、4列只要1个黑格，而第3行已经帮它们涂好了。所以这3列的任务已经完成，不用再涂别的啦！","bubblePos":{"x":420,"y":150}},{"title":"排除法标记空格","description":"既然第2、3、4列不需要更多黑格，那么这些列中除第3行外的所有格子都是空白的，用 $\\times$ 标记。","bubbleText":"反过来想：第2、3、4列已经够了，那这些列里其他格子就不能涂黑了。我们画上小叉叉，表示这里不涂，这样就不会搞混了！","bubblePos":{"x":420,"y":350}},{"title":"验证行约束","description":"逐行检查：第1行黑格在第1、5列，提示 $[1,1]$ ✓；第2行同理 ✓；第3行全黑，提示 $[5]$ ✓；第4、5行同理 ✓。所有行都满足！","bubbleText":"做完要检查！一行一行看：第1行涂了第1格和第5格，刚好是1和1，对了！每行都检查一遍，全部正确！","bubblePos":{"x":50,"y":100}},{"title":"验证列约束并完成","description":"逐列检查：第1列全黑 $[5]$ ✓；第5列全黑 $[5]$ ✓；第2、3、4列各只有第3行1个黑格 $[1]$ ✓。拼图完成，图案为字母 H！","bubbleText":"最后检查每一列：第1列5个全黑，对！第2列只有1个黑格，也对！全部验证通过，我们成功画出了字母H的形状！你学会了吗？","bubblePos":{"x":420,"y":450}}],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
