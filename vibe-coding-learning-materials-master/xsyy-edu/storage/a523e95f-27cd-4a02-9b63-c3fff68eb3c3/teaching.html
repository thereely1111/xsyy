<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形分割与重组 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">图形分割与重组</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('判断十字形图形能否分成4个相同部分并拼成正方形，通过面积计算与分割验证得出答案为A（能）。')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->

                            <!-- Step 1: Original cross shape -->
                            <g x-show="sceneStep >= 1">
                                <text x="220" y="180" text-anchor="middle" font-size="16" fill="#57534e" font-family="'Noto Serif SC', serif">原图（十字形）</text>
                                <!-- Row 0: cols 2,3 -->
                                <rect x="170" y="200" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="220" y="200" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <!-- Row 1: cols 0-5 -->
                                <rect x="70" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="120" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="170" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="220" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="270" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="320" y="250" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <!-- Row 2: cols 0-5 -->
                                <rect x="70" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="120" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="170" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="220" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="270" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="320" y="300" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <!-- Row 3: cols 2,3 -->
                                <rect x="170" y="350" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                                <rect x="220" y="350" width="50" height="50" fill="#faf7f2" stroke="#78716c" stroke-width="1.2"/>
                            </g>

                            <!-- Step 2: Area counting -->
                            <g x-show="sceneStep >= 2">
                                <text x="220" y="440" text-anchor="middle" font-size="14" fill="#8a1c1c" font-family="'Noto Serif SC', serif" font-weight="bold">共 16 个小方格</text>
                                <!-- Target square hint (dashed outline) -->
                                <rect x="500" y="210" width="200" height="200" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="8 5"/>
                                <text x="600" y="195" text-anchor="middle" font-size="14" fill="#57534e" font-family="'Noto Serif SC', serif">目标正方形</text>
                                <foreignObject x="520" y="290" width="160" height="40">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; color:#57534e; text-align:center;" x-html="renderMath('$4 \\times 4 = 16$')"></div>
                                </foreignObject>
                                <!-- Numbers in cells for counting -->
                                <text x="195" y="230" text-anchor="middle" font-size="12" fill="#a8a29e">1</text>
                                <text x="245" y="230" text-anchor="middle" font-size="12" fill="#a8a29e">2</text>
                                <text x="95" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">3</text>
                                <text x="145" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">4</text>
                                <text x="195" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">5</text>
                                <text x="245" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">6</text>
                                <text x="295" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">7</text>
                                <text x="345" y="280" text-anchor="middle" font-size="12" fill="#a8a29e">8</text>
                                <text x="95" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">9</text>
                                <text x="145" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">10</text>
                                <text x="195" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">11</text>
                                <text x="245" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">12</text>
                                <text x="295" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">13</text>
                                <text x="345" y="330" text-anchor="middle" font-size="12" fill="#a8a29e">14</text>
                                <text x="195" y="380" text-anchor="middle" font-size="12" fill="#a8a29e">15</text>
                                <text x="245" y="380" text-anchor="middle" font-size="12" fill="#a8a29e">16</text>
                            </g>

                            <!-- Step 3: Colored division into 4 pieces -->
                            <g x-show="sceneStep >= 3"
                               x-transition:enter="transition ease-out duration-700"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <!-- Piece 1 (Red): top-left L -->
                                <rect x="170" y="200" width="50" height="50" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="2"/>
                                <rect x="70" y="250" width="50" height="50" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="2"/>
                                <rect x="120" y="250" width="50" height="50" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="2"/>
                                <rect x="170" y="250" width="50" height="50" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="2"/>
                                <!-- Piece 2 (Blue): top-right L -->
                                <rect x="220" y="200" width="50" height="50" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="2"/>
                                <rect x="220" y="250" width="50" height="50" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="2"/>
                                <rect x="270" y="250" width="50" height="50" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="2"/>
                                <rect x="320" y="250" width="50" height="50" fill="#2563eb" fill-opacity="0.28" stroke="#2563eb" stroke-width="2"/>
                                <!-- Piece 3 (Green): bottom-left L -->
                                <rect x="70" y="300" width="50" height="50" fill="#16a34a" fill-opacity="0.28" stroke="#16a34a" stroke-width="2"/>
                                <rect x="120" y="300" width="50" height="50" fill="#16a34a" fill-opacity="0.28" stroke="#16a34a" stroke-width="2"/>
                                <rect x="170" y="300" width="50" height="50" fill="#16a34a" fill-opacity="0.28" stroke="#16a34a" stroke-width="2"/>
                                <rect x="170" y="350" width="50" height="50" fill="#16a34a" fill-opacity="0.28" stroke="#16a34a" stroke-width="2"/>
                                <!-- Piece 4 (Amber): bottom-right L -->
                                <rect x="220" y="300" width="50" height="50" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="2"/>
                                <rect x="270" y="300" width="50" height="50" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="2"/>
                                <rect x="320" y="300" width="50" height="50" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="2"/>
                                <rect x="220" y="350" width="50" height="50" fill="#d97706" fill-opacity="0.28" stroke="#d97706" stroke-width="2"/>
                            </g>

                            <!-- Step 4: Verification labels -->
                            <g x-show="sceneStep >= 4">
                                <text x="130" y="242" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">L形</text>
                                <text x="290" y="242" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">L形</text>
                                <text x="130" y="345" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold">L形</text>
                                <text x="290" y="345" text-anchor="middle" font-size="13" fill="#d97706" font-weight="bold">L形</text>
                                <!-- Congruence symbol -->
                                <foreignObject x="140" y="450" width="180" height="35">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; color:#44403c; text-align:center;" x-html="renderMath('四块完全相同 $\\cong$')"></div>
                                </foreignObject>
                                <!-- Checkmarks -->
                                <text x="155" y="268" text-anchor="middle" font-size="16" fill="#dc2626">✓</text>
                                <text x="305" y="268" text-anchor="middle" font-size="16" fill="#2563eb">✓</text>
                                <text x="155" y="368" text-anchor="middle" font-size="16" fill="#16a34a">✓</text>
                                <text x="305" y="368" text-anchor="middle" font-size="16" fill="#d97706">✓</text>
                            </g>

                            <!-- Step 5: Movement trajectories (dashed paths) -->
                            <g x-show="sceneStep >= 5"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <path d="M 158,255 C 280,210 420,210 540,235" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" opacity="0.7"/>
                                <path d="M 290,255 C 390,235 520,245 640,270" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" opacity="0.7"/>
                                <path d="M 158,340 C 280,345 400,335 525,320" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" opacity="0.7"/>
                                <path d="M 290,340 C 400,355 510,360 600,360" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" opacity="0.7"/>
                                <text x="400" y="190" text-anchor="middle" font-size="13" fill="#78716c" font-family="'Noto Serif SC', serif">旋转平移 →</text>
                            </g>

                            <!-- Step 6: Assembled 4x4 square -->
                            <g x-show="sceneStep >= 6"
                               x-transition:enter="transition ease-out duration-700"
                               x-transition:enter-start="opacity-0 scale-95"
                               x-transition:enter-end="opacity-100 scale-100">
                                <text x="600" y="180" text-anchor="middle" font-size="15" fill="#57534e" font-family="'Noto Serif SC', serif" font-weight="bold">拼成的正方形</text>
                                <!-- Piece A (Red) in square: top-left L -->
                                <rect x="500" y="210" width="50" height="50" fill="#dc2626" fill-opacity="0.32" stroke="#dc2626" stroke-width="1.8"/>
                                <rect x="550" y="210" width="50" height="50" fill="#dc2626" fill-opacity="0.32" stroke="#dc2626" stroke-width="1.8"/>
                                <rect x="600" y="210" width="50" height="50" fill="#dc2626" fill-opacity="0.32" stroke="#dc2626" stroke-width="1.8"/>
                                <rect x="500" y="260" width="50" height="50" fill="#dc2626" fill-opacity="0.32" stroke="#dc2626" stroke-width="1.8"/>
                                <!-- Piece B (Blue) in square: right L -->
                                <rect x="650" y="210" width="50" height="50" fill="#2563eb" fill-opacity="0.32" stroke="#2563eb" stroke-width="1.8"/>
                                <rect x="600" y="260" width="50" height="50" fill="#2563eb" fill-opacity="0.32" stroke="#2563eb" stroke-width="1.8"/>
                                <rect x="650" y="260" width="50" height="50" fill="#2563eb" fill-opacity="0.32" stroke="#2563eb" stroke-width="1.8"/>
                                <rect x="650" y="310" width="50" height="50" fill="#2563eb" fill-opacity="0.32" stroke="#2563eb" stroke-width="1.8"/>
                                <!-- Piece C (Green) in square: left-bottom L -->
                                <rect x="550" y="260" width="50" height="50" fill="#16a34a" fill-opacity="0.32" stroke="#16a34a" stroke-width="1.8"/>
                                <rect x="500" y="310" width="50" height="50" fill="#16a34a" fill-opacity="0.32" stroke="#16a34a" stroke-width="1.8"/>
                                <rect x="550" y="310" width="50" height="50" fill="#16a34a" fill-opacity="0.32" stroke="#16a34a" stroke-width="1.8"/>
                                <rect x="500" y="360" width="50" height="50" fill="#16a34a" fill-opacity="0.32" stroke="#16a34a" stroke-width="1.8"/>
                                <!-- Piece D (Amber) in square: bottom-right L -->
                                <rect x="600" y="310" width="50" height="50" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.8"/>
                                <rect x="550" y="360" width="50" height="50" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.8"/>
                                <rect x="600" y="360" width="50" height="50" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.8"/>
                                <rect x="650" y="360" width="50" height="50" fill="#d97706" fill-opacity="0.32" stroke="#d97706" stroke-width="1.8"/>
                                <!-- Square border -->
                                <rect x="500" y="210" width="200" height="200" fill="none" stroke="#1c1917" stroke-width="2.5"/>
                                <!-- Side label -->
                                <foreignObject x="705" y="290" width="60" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#44403c;" x-html="renderMath('$4$')"></div>
                                </foreignObject>
                                <foreignObject x="575" y="415" width="60" height="30">
                                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#44403c;" x-html="renderMath('$4$')"></div>
                                </foreignObject>
                            </g>

                            <!-- Step 7: Answer badge -->
                            <g x-show="sceneStep >= 7"
                               x-transition:enter="transition ease-out duration-500"
                               x-transition:enter-start="opacity-0"
                               x-transition:enter-end="opacity-100">
                                <rect x="310" y="490" width="180" height="50" rx="25" ry="25" fill="#8a1c1c" opacity="0.92"/>
                                <text x="400" y="521" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Noto Serif SC', serif" font-weight="bold">答案：A. 能 ✓</text>
                                <!-- Decorative seal corners -->
                                <rect x="320" y="498" width="12" height="12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
                                <rect x="468" y="498" width="12" height="12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
                            </g>

                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [{"title":"认识原图","description":"观察题目中的图形：它由 $16$ 个小正方形组成，呈十字形排列。我们要判断能否将它分成 $4$ 个完全相同的部分，再拼成一个正方形。","bubbleText":"看这个十字形的图形，它是由小方格组成的。我们先数一数，一共有多少个小方格？横着看中间有 $6$ 个，上下各突出 $2$ 个，一共 $6+6+2+2=16$ 个小方格。","bubblePos":{"x":380,"y":130}},{"title":"计算面积","description":"总面积为 $16$ 个小方格。若能拼成正方形，边长应为 $\\sqrt{16}=4$，即 $4\\times4$ 的正方形。每块面积 $=16\\div4=4$。","bubbleText":"如果能拼成正方形，那正方形的面积就是 $16$，边长就是 $4$。也就是说，我们要拼出一个 $4\\times4$ 的大正方形！每一小块的面积是 $16\\div4=4$ 个小方格。","bubblePos":{"x":380,"y":180}},{"title":"动手分割","description":"沿对称轴附近将十字形切成 $4$ 块 L 形图形，每块恰好由 $4$ 个小方格组成。","bubbleText":"现在我们来切一切！沿着图形的对称中心，把它分成 $4$ 块。你看，每一块都是一个小 L 形，刚好由 $4$ 个小方格组成，形状、大小完全一样！","bubblePos":{"x":60,"y":400}},{"title":"验证相同","description":"四块图形均为 L 形四连方（$4$ 格），通过旋转可完全重合，确认形状大小相同。","bubbleText":"我们来验证：红色、蓝色、绿色、橙色这 $4$ 块，每块都是 $4$ 个小方格组成的 L 形。转一转就能完全重叠，说明它们形状、大小完全相同！","bubblePos":{"x":60,"y":130}},{"title":"开始拼图","description":"将四块 L 形图形分别旋转、平移，沿着虚线轨迹移动到右侧正方形区域。","bubbleText":"接下来像玩拼图一样，把 $4$ 块 L 形分别旋转一下，移到右边。看虚线——这就是每块搬家的路线！","bubblePos":{"x":280,"y":440}},{"title":"拼成正方形","description":"四块 L 形恰好拼成 $4\\times4$ 的正方形，无重叠、无空隙，验证成功。","bubbleText":"完美！$4$ 块 L 形像风车一样转着拼在一起，刚好形成一个 $4\\times4$ 的正方形，没有重叠也没有缝隙！","bubblePos":{"x":430,"y":430}},{"title":"得出答案","description":"结论：该图形可以分成 $4$ 个形状大小相同的图形并拼成正方形，答案选 $A$。","bubbleText":"所以答案是 A. 能！记住这个思路：先算面积确定正方形边长，再尝试分割和拼合。面积不变是关键！","bubblePos":{"x":280,"y":100}}],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
