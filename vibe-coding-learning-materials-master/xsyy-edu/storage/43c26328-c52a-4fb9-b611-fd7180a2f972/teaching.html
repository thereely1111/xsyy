<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形剪拼重组与面积 - 互动教学</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap');

        :root {
            --paper: #fdfbf7;
            --ink-1: #1f2937;
            --ink-2: #44403c;
            --vermillion: #8a1c1c;
            --vermillion-soft: #fee2e2;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(1200px 500px at 15% -5%, rgba(120, 113, 108, 0.08), transparent 60%),
                radial-gradient(900px 420px at 90% 110%, rgba(127, 29, 29, 0.06), transparent 60%);
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes inkFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ink-fade-in {
            animation: inkFadeIn 520ms ease-out both;
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bubble-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(28, 25, 23, 0.09);
        }

        .teacher-bubble-text {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 500;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateZ(0);
        }

        .katex { font-size: 1.06em; }
        .katex-display { margin: 0.35em 0; }

        .fs-ai-btn {
            display: flex !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-stone-800"
      x-data="appData()"
      x-init="initApp()">

    <div class="bg-noise"></div>

    <header class="relative z-20 flex-none py-3 px-5 md:px-6 bg-stone-100/50 border-y border-stone-300 flex items-center justify-between shadow-sm ink-fade-in">
        <div class="flex items-center gap-3 shrink-0">
            <h1 class="text-2xl md:text-3xl font-serif font-bold text-stone-900 tracking-wider">图形剪拼重组与面积</h1>
        </div>
        <div class="hidden md:flex flex-1 justify-end pl-4">
            <div class="max-w-[68%] text-right text-stone-600 text-sm md:text-base leading-relaxed">
                <span class="inline-block px-2 py-0.5 rounded bg-red-50 text-red-900 text-xs tracking-wide mr-2 align-middle">题意概括</span>
                <span class="align-middle" x-html="renderMath('等积变换，原图切两次拼合成正四边形，求长度')"></span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative z-10 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">

        <div class="relative w-full md:w-[70%] h-[45vh] md:h-full flex-none transition-all duration-500 ease-in-out flex flex-col p-2 md:p-4">

            <div class="relative w-full h-full bg-white/50 border border-stone-200 rounded-2xl shadow-[inset_0_2px_6px_rgba(0,0,0,0.02)] overflow-hidden flex items-center justify-center ink-fade-in">

                <svg id="stageSvg" viewBox="0 0 800 600" class="w-full h-full" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#a8a29e" />
                        </marker>
                    </defs>

                    <g>
                        <g id="dynamicSceneRoot" :transform="`translate(${sceneOffsetX} ${sceneOffsetY})`">
                            <!-- DYNAMIC_SCENE_START -->
                            <defs>\n  <filter id='inkShadow' x='-20%' y='-20%' width='140%' height='140%'>\n    <feDropShadow dx='3' dy='4' stdDeviation='3' flood-color='#2d2d2d' flood-opacity='0.25'/>\n  </filter>\n  <filter id='cinnabarGlow' x='-30%' y='-30%' width='160%' height='160%'>\n    <feGaussianBlur in='SourceGraphic' stdDeviation='2.5' result='blur'/>\n    <feMerge>\n      <feMergeNode in='blur'/>\n      <feMergeNode in='SourceGraphic'/>\n    </feMerge>\n  </filter>\n  <marker id='arrowDim' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto-start-reverse' markerUnits='strokeWidth'>\n    <path d='M0,0 L0,6 L9,3 z' fill='#c23a30'/>\n  </marker>\n  <linearGradient id='paperGrad' x1='0' y1='0' x2='1' y2='1'>\n    <stop offset='0' stop-color='#f5f0e6'/>\n    <stop offset='1' stop-color='#e8e0d2'/>\n  </linearGradient>\n  <linearGradient id='inkGrad' x1='0' y1='0' x2='0' y2='1'>\n    <stop offset='0' stop-color='#6b6b6b'/>\n    <stop offset='1' stop-color='#4a4a4a'/>\n  </linearGradient>\n  <linearGradient id='redGrad' x1='0' y1='0' x2='1' y2='1'>\n    <stop offset='0' stop-color='#d8554a'/>\n    <stop offset='1' stop-color='#c23a30'/>\n  </linearGradient>\n</defs>\n<style>\n  .svg-elem { transition: all 0.8s cubic-bezier(0.4,0,0.2,1); }\n  .grid-cell { fill: url(#paperGrad); stroke: #7a7a7a; stroke-width: 1.2; }\n  .piece-ink { fill: url(#inkGrad); stroke: #4a4a4a; stroke-width: 1.5; filter: url(#inkShadow); }\n  .piece-red { fill: url(#redGrad); stroke: #c23a30; stroke-width: 1.5; filter: url(#inkShadow); }\n  .cut-line { stroke: #c23a30; stroke-width: 3; stroke-dasharray: 8 6; fill: none; filter: url(#cinnabarGlow); }\n  .flow-dashed { stroke: #c23a30; stroke-width: 2.5; stroke-dasharray: 10 8; fill: none; opacity: 0.85; }\n  .label { font-family: KaiTi,STKaiti,serif; font-size: 18px; fill: #4a4a4a; pointer-events: none; }\n  @keyframes floatY { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }\n  @keyframes pulseScale { 0%,100%{ transform: scale(1); opacity:0.85; } 50%{ transform: scale(1.08); opacity:1; } }\n  @keyframes dashFlow { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }\n  .anim-float { animation: floatY 3s ease-in-out infinite; }\n  .anim-pulse { animation: pulseScale 1.6s ease-in-out infinite; transform-origin: center; }\n  .anim-flow { animation: dashFlow 1.2s linear infinite; }\n</style>\n<g class='anim-float svg-elem' x-show='sceneStep &gt;= 1'>\n  <circle cx='700' cy='110' r='32' fill='#f5f0e6' stroke='#c23a30' stroke-width='2' filter='url(#inkShadow)'/>\n  <text x='700' y='122' text-anchor='middle' font-size='30' fill='#4a4a4a'>🖌️</text>\n</g>\n<path class='flow-dashed anim-flow svg-elem' d='M 670 140 Q 580 120 420 170' x-show='sceneStep == 0'/>\n<g class='svg-elem' x-show='sceneStep &gt;= 1 &amp;&amp; sceneStep &lt;= 5' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='opacity-0 scale-95 translate-y-4' x-transition:enter-end='opacity-100 scale-100 translate-y-0' x-transition:leave='transition-all ease-in duration-700' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'>\n  <text class='label' x='230' y='165'>原图</text>\n  <rect class='piece-ink' x='230' y='180' width='50' height='50'/>\n  <rect class='piece-ink' x='230' y='230' width='50' height='50'/>\n  <rect class='piece-ink' x='230' y='280' width='50' height='50'/>\n  <rect class='piece-ink' x='230' y='330' width='50' height='50'/>\n  <rect class='piece-red' x='280' y='280' width='50' height='50'/>\n  <rect class='piece-red' x='330' y='280' width='50' height='50'/>\n  <rect class='piece-red' x='380' y='280' width='50' height='50'/>\n  <rect class='piece-red' x='430' y='280' width='50' height='50'/>\n  <rect class='piece-red' x='280' y='330' width='50' height='50'/>\n  <rect class='piece-red' x='330' y='330' width='50' height='50'/>\n  <rect class='piece-red' x='380' y='330' width='50' height='50'/>\n  <rect class='piece-red' x='430' y='330' width='50' height='50'/>\n  <rect class='piece-ink' x='480' y='180' width='50' height='50'/>\n  <rect class='piece-ink' x='480' y='230' width='50' height='50'/>\n  <rect class='piece-ink' x='480' y='280' width='50' height='50'/>\n  <rect class='piece-ink' x='480' y='330' width='50' height='50'/>\n</g>\n<foreignObject x='320' y='120' width='160' height='70' x-show='sceneStep == 1'>\n  <div xmlns='http://www.w3.org/1999/xhtml' style='background:rgba(245,240,230,0.95);border:1px solid #c23a30;border-radius:8px;padding:10px;text-align:center;'>\n    <span style='font-family:Times New Roman,serif;font-size:20px;color:#4a4a4a;'>S = 16</span>\n  </div>\n</foreignObject>\n<g class='svg-elem' x-show='sceneStep &gt;= 3 &amp;&amp; sceneStep &lt;= 6' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='opacity-0' x-transition:enter-end='opacity-40' x-transition:leave='transition-all ease-in duration-700' x-transition:leave-start='opacity-40' x-transition:leave-end='opacity-0'>\n  <text class='label' x='300' y='190' fill-opacity='0.5'>目标正方形</text>\n  <rect x='300' y='200' width='200' height='200' fill='none' stroke='#7a7a7a' stroke-width='2' stroke-dasharray='8 6'/>\n  <path stroke='#7a7a7a' stroke-width='1' stroke-dasharray='4 4' d='M350 200 V400 M400 200 V400 M450 200 V400 M300 250 H500 M300 300 H500 M300 350 H500'/>\n</g>\n<line class='cut-line anim-pulse svg-elem' x1='280' y1='280' x2='280' y2='380' x-show='sceneStep &gt;= 4'/>\n<line class='cut-line anim-pulse svg-elem' x1='430' y1='280' x2='430' y2='380' x-show='sceneStep &gt;= 5'/>\n<g class='svg-elem' x-show='sceneStep == 5' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='opacity-0 scale-95 translate-y-6' x-transition:enter-end='opacity-100 scale-100 translate-y-0' x-transition:leave='transition-all ease-in duration-700' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'>\n  <g class='svg-elem'>\n    <rect class='piece-ink' x='230' y='180' width='50' height='200'/>\n    <text class='label' x='255' y='285' text-anchor='middle'>左柱</text>\n  </g>\n  <g class='svg-elem' transform='translate(0,45)'>\n    <rect class='piece-red' x='280' y='280' width='200' height='100'/>\n    <text class='label' x='380' y='335' text-anchor='middle'>底块</text>\n  </g>\n  <g class='svg-elem' transform='translate(45,0)'>\n    <rect class='piece-ink' x='480' y='180' width='50' height='200'/>\n    <text class='label' x='505' y='285' text-anchor='middle'>右柱</text>\n  </g>\n</g>\n<path class='flow-dashed anim-flow svg-elem' d='M 380 430 Q 320 400 350 300' x-show='sceneStep == 6'/>\n<g class='svg-elem' x-show='sceneStep &gt;= 7' x-transition:enter='transition-all ease-out duration-1000' x-transition:enter-start='opacity-0 scale-90 translate-x-8' x-transition:enter-end='opacity-100 scale-100 translate-x-0' x-transition:leave='transition-all ease-in duration-700' x-transition:leave-start='opacity-100 scale-100' x-transition:leave-end='opacity-0 scale-90'>\n  <rect class='piece-ink' x='300' y='200' width='50' height='200'/>\n  <rect class='piece-ink' x='350' y='200' width='50' height='200'/>\n  <rect class='piece-red' x='400' y='200' width='100' height='200'/>\n  <path stroke='#7a7a7a' stroke-width='1.5' d='M350 200 V400 M400 200 V400 M450 200 V400 M300 250 H500 M300 300 H500 M300 350 H500'/>\n  <text class='label' x='325' y='310' text-anchor='middle'>左</text>\n  <text class='label' x='375' y='310' text-anchor='middle'>右</text>\n  <text class='label' x='450' y='310' text-anchor='middle'>底</text>\n  <g x-show='sceneStep &gt;= 8'>\n    <line x1='300' y1='415' x2='500' y2='415' stroke='#c23a30' stroke-width='2' marker-start='url(#arrowDim)' marker-end='url(#arrowDim)'/>\n    <text class='label' x='400' y='440' text-anchor='middle'>边长 4</text>\n  </g>\n</g>\n<foreignObject x='300' y='110' width='200' height='100' x-show='sceneStep == 8'>\n  <div xmlns='http://www.w3.org/1999/xhtml' style='background:#f5f0e6;border:2px solid #c23a30;border-radius:10px;padding:12px;text-align:center;'>\n    <div style='font-size:18px;color:#4a4a4a;margin-bottom:6px;'>S<sub>原</sub> = 16 = 4²</div>\n    <div style='font-size:22px;color:#c23a30;font-weight:bold;'>边长 = 4 ✓</div>\n  </div>\n</foreignObject>
                            <!-- DYNAMIC_SCENE_END -->
                        </g>
                    </g>

                    <foreignObject :x="bubbleX"
                                   :y="bubbleY"
                                   width="300" height="200"
                                   class="overflow-visible pointer-events-none">
                        <div class="pointer-events-auto flex flex-col items-start transition-all duration-300 origin-top-left"
                             :class="isBubbleExpanded ? 'w-[280px]' : 'w-auto'">
                            <div class="bubble-backdrop bg-white/60 border border-stone-300 rounded-xl overflow-hidden shadow-lg transition-all duration-300">
                                <div @mousedown.prevent="startBubbleDrag($event)"
                                     @touchstart.prevent="startBubbleDrag($event)"
                                     class="flex justify-between items-center px-3 py-2 bg-stone-100/80 cursor-move border-b border-stone-200/50 hover:bg-stone-200/50 transition-colors select-none"
                                     style="touch-action: none;">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-red-800"></span>
                                        <span class="text-xs font-bold text-stone-600 font-serif">老师说</span>
                                    </div>
                                    <button @click.stop="isBubbleExpanded = !isBubbleExpanded"
                                            class="text-stone-400 hover:text-stone-700 text-lg leading-none font-light">
                                        <span x-text="isBubbleExpanded ? '−' : '+'"></span>
                                    </button>
                                </div>

                                <div x-show="isBubbleExpanded"
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 max-h-0"
                                     x-transition:enter-end="opacity-100 max-h-40"
                                     x-transition:leave="transition ease-in duration-150"
                                     x-transition:leave-start="opacity-100 max-h-40"
                                     x-transition:leave-end="opacity-0 max-h-0"
                                     class="p-3 text-sm text-stone-700 leading-relaxed teacher-bubble-text">
                                     <div x-html="renderMath(steps[currentStep].bubbleText)"></div>
                                </div>
                            </div>

                            <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-stone-300 ml-4 opacity-80"
                                 x-show="isBubbleExpanded"></div>
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="flex justify-center items-center pt-3 pb-1 relative z-30">
                <div class="bg-white/90 backdrop-blur shadow-lg border border-stone-200 rounded-full px-6 py-2 flex gap-4 pointer-events-auto">
                    <button @click="prevStep"
                            :disabled="currentStep === 0"
                            class="px-4 py-1.5 rounded-full border border-stone-300 text-stone-600 hover:bg-stone-50 hover:border-stone-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-sm font-medium">
                        &lt; 回看
                    </button>
                    <button type="button"
                            @click="askAiAssistant"
                            :class="isFullscreen ? 'fs-ai-btn' : ''"
                            class="md:hidden px-3 py-1.5 rounded-full bg-red-800 text-white text-sm font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        AI助教
                    </button>
                    <button @click="nextStep"
                            :disabled="currentStep === steps.length - 1"
                            class="px-6 py-1.5 rounded-full bg-red-800 text-white shadow-md hover:bg-red-700 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm font-bold tracking-wide">
                        下一步 &gt;
                    </button>
                </div>
            </div>
        </div>

        <div class="relative w-full md:w-[30%] md:flex-none min-h-0 flex flex-col bg-[#fdfbf7] border-l border-stone-200 shadow-[-4px_0_12px_rgba(0,0,0,0.02)] z-40 transition-transform duration-500 translate-x-0">

            <div class="p-4 border-b border-stone-200 bg-stone-50/50">
                <h2 class="font-serif text-xl font-bold text-stone-800">完整解法</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar scroll-smooth" id="stepsList">
                <template x-for="(step, index) in steps" :key="index">
                    <div :id="'step-' + index"
                         class="p-3 rounded-lg border-l-4 transition-all duration-300 cursor-pointer"
                         :class="currentStep === index ? 'bg-red-50 border-red-800 shadow-sm' : 'border-transparent text-stone-400 hover:text-stone-600'"
                         @click="setStep(index)">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider opacity-60" x-text="'STEP ' + (index + 1)"></span>
                            <span x-show="currentStep === index" class="text-red-800 text-xs animate-pulse">● 当前讲解</span>
                        </div>
                        <h3 class="font-bold text-sm mb-1"
                            :class="currentStep === index ? 'text-stone-900' : 'text-stone-500'"
                            x-text="step.title"></h3>
                        <div class="text-xs leading-relaxed"
                             :class="currentStep === index ? 'text-stone-800' : 'text-stone-400'"
                             x-html="renderMath(step.description)"></div>
                    </div>
                </template>
                <div class="h-20"></div>
            </div>
        </div>

    </main>

    <script>
        function appData() {
            return {
                currentStep: 0,
                get sceneStep() {
                    return this.currentStep + 1;
                },
                sceneOffsetX: 0,
                sceneOffsetY: 0,
                bubbleX: 210,
                bubbleY: 110,
                isDraggingBubble: false,
                dragOffsetX: 0,
                dragOffsetY: 0,
                _bubbleDragMoveHandler: null,
                _bubbleDragEndHandler: null,
                isBubbleExpanded: true,
                isFullscreen: false,
                steps: [
    {
        "title": "观察原图",
        "description": "先看清格线图形：它像一只开口向上的 U 形桶，左侧一列、右侧一列，底部用 4×2 的矩形相连。",
        "bubbleText": "这个图形是由多少个小方格拼成的？",
        "bubblePos": {
            "x": 680,
            "y": 60
        }
    },
    {
        "title": "计算面积",
        "description": "每个小方格边长为 1，面积为 1。把左柱 4 格、右柱 4 格、底部 8 格加起来，总面积 S = 16。",
        "bubbleText": "4 + 4 + 8 = 16，面积是 16。",
        "bubblePos": {
            "x": 320,
            "y": 90
        }
    },
    {
        "title": "确定目标边长",
        "description": "剪拼只改变形状，不改变面积。要拼成正方形，边长 a 必须满足 a² = 16，因此 a = √16 = 4。",
        "bubbleText": "正方形面积不变，边长是 4。",
        "bubblePos": {
            "x": 680,
            "y": 60
        }
    },
    {
        "title": "第一刀",
        "description": "沿左侧内格线竖直剪一刀，把左柱与底部矩形分开。这一刀只经过底部的两行。",
        "bubbleText": "第一刀在这里，把左柱切下来。",
        "bubblePos": {
            "x": 230,
            "y": 140
        }
    },
    {
        "title": "第二刀",
        "description": "再沿右侧内格线竖直剪一刀，把右柱也分开。现在得到三块：左柱、右柱和底部 4×2 矩形。",
        "bubbleText": "第二刀在这里，三块全部分开。",
        "bubblePos": {
            "x": 480,
            "y": 140
        }
    },
    {
        "title": "三块展示",
        "description": "左柱和右柱都是 1×4 的长条，底部矩形是 4×2。它们都只旋转、不翻转，面积仍是 16。",
        "bubbleText": "两块长条加一块矩形，准备拼合。",
        "bubblePos": {
            "x": 380,
            "y": 460
        }
    },
    {
        "title": "旋转拼合",
        "description": "把底部 4×2 矩形顺时针旋转 90°，变成 2×4 的竖条。再让左柱、右柱竖直并排，三块恰好组成 4×4 正方形。",
        "bubbleText": "旋转底部矩形，三块并排成正方形。",
        "bubblePos": {
            "x": 320,
            "y": 430
        }
    },
    {
        "title": "严丝合缝",
        "description": "拼成的正方形横向 4 格、纵向 4 格，每格边长为 1，所以边长就是 4。",
        "bubbleText": "4 行 4 列，边长为 4。",
        "bubblePos": {
            "x": 400,
            "y": 460
        }
    },
    {
        "title": "答案验证",
        "description": "原图面积 16，拼成正方形面积 4×4 = 16，面积守恒；边长为 4，符合算术平方根。",
        "bubbleText": "答案验证：边长 = 4。",
        "bubblePos": {
            "x": 400,
            "y": 80
        }
    }
],
                initApp() {
                    this._fsPollTimer = setInterval(() => {
                        try {
                            const host = window.parent || window;
                            const container = host.document.getElementById('mainTeachingContainer');
                            this.isFullscreen = !!(container && container.classList.contains('fullscreen'));
                        } catch (e) {
                            this.isFullscreen = false;
                        }
                    }, 400);
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                },
                askAiAssistant() {
                    try {
                        const host = window.parent || window;
                        if (host && typeof host.handleAiAssistClick === 'function') {
                            host.handleAiAssistClick();
                            return;
                        }
                    } catch (e) {
                        // 跨域或父页面不可用时走兜底提示
                    }
                    alert('AI助教功能请在完整页面中使用');
                },
                getCurrentStepBubblePos() {
                    const defaultPos = { x: 210, y: 110 };
                    const step = this.steps?.[this.currentStep];
                    if (!step || !step.bubblePos) {
                        return defaultPos;
                    }
                    const x = Number(step.bubblePos.x);
                    const y = Number(step.bubblePos.y);
                    return {
                        x: Number.isFinite(x) ? x : defaultPos.x,
                        y: Number.isFinite(y) ? y : defaultPos.y,
                    };
                },
                resetBubblePosition() {
                    const pos = this.getCurrentStepBubblePos();
                    this.bubbleX = pos.x + this.sceneOffsetX;
                    this.bubbleY = pos.y + this.sceneOffsetY;
                },
                pointerToSvg(clientX, clientY) {
                    const svg = document.getElementById('stageSvg');
                    if (!svg) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }
                    const rect = svg.getBoundingClientRect();
                    if (!rect.width || !rect.height) {
                        return { x: this.bubbleX, y: this.bubbleY };
                    }

                    const viewBox = svg.viewBox && svg.viewBox.baseVal
                        ? svg.viewBox.baseVal
                        : { x: 0, y: 0, width: 800, height: 600 };

                    const scaleX = viewBox.width / rect.width;
                    const scaleY = viewBox.height / rect.height;

                    return {
                        x: (clientX - rect.left) * scaleX + viewBox.x,
                        y: (clientY - rect.top) * scaleY + viewBox.y,
                    };
                },
                getEventPoint(event) {
                    if (event.touches && event.touches.length > 0) {
                        return this.pointerToSvg(event.touches[0].clientX, event.touches[0].clientY);
                    }
                    if (event.changedTouches && event.changedTouches.length > 0) {
                        return this.pointerToSvg(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
                    }
                    return this.pointerToSvg(event.clientX, event.clientY);
                },
                startBubbleDrag(event) {
                    const point = this.getEventPoint(event);
                    this.isDraggingBubble = true;
                    this.dragOffsetX = point.x - this.bubbleX;
                    this.dragOffsetY = point.y - this.bubbleY;

                    this._bubbleDragMoveHandler = (e) => this.onBubbleDragMove(e);
                    this._bubbleDragEndHandler = () => this.endBubbleDrag();

                    window.addEventListener('mousemove', this._bubbleDragMoveHandler);
                    window.addEventListener('mouseup', this._bubbleDragEndHandler);
                    window.addEventListener('touchmove', this._bubbleDragMoveHandler, { passive: false });
                    window.addEventListener('touchend', this._bubbleDragEndHandler);
                },
                onBubbleDragMove(event) {
                    if (!this.isDraggingBubble) {
                        return;
                    }
                    if (event.cancelable) {
                        event.preventDefault();
                    }

                    const point = this.getEventPoint(event);
                    const nextX = point.x - this.dragOffsetX;
                    const nextY = point.y - this.dragOffsetY;

                    this.bubbleX = Math.max(0, Math.min(500, nextX));
                    this.bubbleY = Math.max(0, Math.min(400, nextY));
                },
                endBubbleDrag() {
                    this.isDraggingBubble = false;
                    if (this._bubbleDragMoveHandler) {
                        window.removeEventListener('mousemove', this._bubbleDragMoveHandler);
                        window.removeEventListener('touchmove', this._bubbleDragMoveHandler);
                    }
                    if (this._bubbleDragEndHandler) {
                        window.removeEventListener('mouseup', this._bubbleDragEndHandler);
                        window.removeEventListener('touchend', this._bubbleDragEndHandler);
                    }
                    this._bubbleDragMoveHandler = null;
                    this._bubbleDragEndHandler = null;
                },
                centerDynamicScene() {
                    const sceneEl = document.getElementById('dynamicSceneRoot');
                    if (!sceneEl || typeof sceneEl.getBBox !== 'function') {
                        return;
                    }

                    // 完整画布居中（800x600 视口）
                    const boxX = 0;
                    const boxY = 0;
                    const boxW = 800;
                    const boxH = 600;

                    try {
                        const bbox = sceneEl.getBBox();
                        if (!bbox || bbox.width <= 0 || bbox.height <= 0) {
                            this.sceneOffsetX = 0;
                            this.sceneOffsetY = 0;
                            return;
                        }

                        const targetCx = boxX + boxW / 2;
                        const targetCy = boxY + boxH / 2;
                        const sceneCx = bbox.x + bbox.width / 2;
                        const sceneCy = bbox.y + bbox.height / 2;

                        this.sceneOffsetX = Math.round((targetCx - sceneCx) * 10) / 10;
                        this.sceneOffsetY = Math.round((targetCy - sceneCy) * 10) / 10;
                    } catch (e) {
                        this.sceneOffsetX = 0;
                        this.sceneOffsetY = 0;
                    }

                    if (!this.isDraggingBubble) {
                        this.resetBubblePosition();
                    }
                },
                renderMath(text) {
                    const raw = (text ?? '').toString();
                    if (!raw.trim()) {
                        return '';
                    }

                    const renderExpr = (expr, displayMode = false) => {
                        try {
                            return katex.renderToString(expr, {
                                throwOnError: false,
                                strict: 'ignore',
                                displayMode,
                            });
                        } catch (e) {
                            return expr;
                        }
                    };

                    const hasDelimitedMath = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])/.test(raw);
                    if (hasDelimitedMath) {
                        let output = raw;
                        output = output.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\[([\s\S]+?)\\\]/g, (_, expr) => renderExpr(expr, true));
                        output = output.replace(/\\\(([\s\S]+?)\\\)/g, (_, expr) => renderExpr(expr, false));
                        output = output.replace(/\$([^$\n]+)\$/g, (_, expr) => renderExpr(expr, false));
                        return output.replace(/\n/g, '<br>');
                    }

                    const looksLikeFormula = /\\(frac|sqrt|times|div|cdot|left|right|angle|pi|theta|sin|cos|tan|sum|int|alpha|beta|gamma)/.test(raw)
                        || /^[\s0-9a-zA-Z+\-*/=^_(){}\[\]\\.,:<>|%]+$/.test(raw);

                    if (looksLikeFormula) {
                        return renderExpr(raw, false);
                    }

                    return raw.replace(/\n/g, '<br>');
                },
                nextStep() {
                    if (this.currentStep < this.steps.length - 1) {
                        this.currentStep++;
                        this.handleStepChange();
                    }
                },
                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.handleStepChange();
                    }
                },
                setStep(index) {
                    this.currentStep = index;
                    this.handleStepChange();
                },
                handleStepChange() {
                    this.isBubbleExpanded = true;
                    this.endBubbleDrag();
                    this.$nextTick(() => {
                        this.centerDynamicScene();
                        this.resetBubblePosition();
                    });
                    this.$nextTick(() => {
                        const el = document.getElementById('step-' + this.currentStep);
                        const container = document.getElementById('stepsList');
                        if (el && container) {
                            if (container.scrollHeight > container.clientHeight + 1) {
                                const elRect = el.getBoundingClientRect();
                                const containerRect = container.getBoundingClientRect();
                                const targetScroll = container.scrollTop + (elRect.top - containerRect.top) - (container.clientHeight / 2) + (elRect.height / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            } else {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }
                        }
                    });
                }
            }
        }
    </script>
