# 测试环境 xsyy.conf —— 与生产环境（nginx-公网/conf.d/xsyy.conf）对齐（2026-08-31 方案A）
# 差异仅两点：① 监听 808（生产 80）；② 无 server_name（生产为 192.168.1.154）
# 保证测试行为与生产一致，避免"测试通过、上线翻车"。
server {
    listen 808;

    # 返回相对 Location，避免 nginx 默认拼成 http://$host:808/ 绝对地址
    absolute_redirect off;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               image/svg+xml application/x-font-ttf font/opentype;

    # 静态文件目录（前端文件位置）
    root /var/www/xsyy;
    index index.html;

    # ========== 语义化路由：新 URL 结构 ==========
    
    # API 请求转发到后端（uvicorn 在 8000 端口）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 优化超时和缓冲
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }

    # 标签识别智能体 API（一体化架构：转发到后端 uvicorn 8000）
    # 2026-08-31：智能体本体在 xsyy 后端 tag_agent/，/tag-agent/* 必须转发，
    # 否则 404 被 SPA 兜底返回 HTML → 前端报 "Unexpected token '<'"
    location /tag-agent/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 教学详情页：/teachings/{id} → video.html?task_id={id}
    location ~ ^/teachings/([a-f0-9\-]+)$ {
        rewrite ^/teachings/([a-f0-9\-]+)$ /video.html?task_id=$1 last;
    }
    
    # 用户中心：/user → user_interface.html
    location = /user {
        rewrite ^/user$ /user_interface.html last;
    }
    
    # 上传页面：/upload → insert_pic.html
    location = /upload {
        rewrite ^/upload$ /insert_pic.html last;
    }
    
    # 示例页面：/sample → sample_teaching.html
    location = /sample {
        rewrite ^/sample$ /sample_teaching.html last;
    }
    
    # ========== 旧 URL 重定向 ==========
    
    # index.html → / (首页)
    location = /index.html {
        return 301 /;
    }
    
    # ========== 默认路由处理 ==========
    # 根路径直接返回 index.html
    location = / {
        try_files /index.html =404;
    }
    
    # 其他路径支持隐藏 .html 后缀
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 图片优先由 Nginx 直出（webp/png），不存在则回源后端
    location ~ ^/api/teachings/([a-f0-9\-]+)/preview$ {
        root /root/xsyy/storage;
        try_files /$1/preview.webp /$1/preview.png @preview_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    location @preview_backend {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端文档页面也转发
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # JS 文件：使用长期缓存
    location ~* \.js$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        add_header Vary "Accept-Encoding";
    }

    # 其他静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        add_header Vary "Accept-Encoding";
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
